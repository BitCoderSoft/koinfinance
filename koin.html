var ponteiroFino = window.matchMedia && window.matchMedia('(hover: hover)').matches;

// abre/fecha menus suspensos: clique no botão, passar o mouse (com
// pequena folga pra não fechar no caminho até o menu), Esc e clique fora
function fecharMenus(excecao) {
    document.querySelectorAll('[data-grupo].aberto').forEach(function (g) {
        if (g === excecao) return;
        g.classList.remove('aberto');
        var b = g.querySelector('[data-grupo-botao]');
        if (b) b.setAttribute('aria-expanded', 'false');
    });
}

function abrirMenu(grupo) {
    fecharMenus(grupo);
    grupo.classList.add('aberto');
    grupo.querySelector('[data-grupo-botao]').setAttribute('aria-expanded', 'true');
}

document.addEventListener('click', function (ev) {
    var botao = ev.target.closest('[data-grupo-botao]');
    if (botao) {
        var g = botao.closest('[data-grupo]');
        // com mouse, passar por cima já abriu: o clique só confirma (se
        // alternasse, o clique logo depois do hover fecharia o menu).
        // No toque, o clique alterna.
        if (ponteiroFino || !g.classList.contains('aberto')) abrirMenu(g);
        else fecharMenus();
        return;
    }
    if (!ev.target.closest('.menu-suspenso')) fecharMenus();
});

document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') fecharMenus();
});

if (ponteiroFino) {
    var timerFechar = null;
    document.addEventListener('mouseover', function (ev) {
        var g = ev.target.closest && ev.target.closest('[data-grupo]');
        if (g) {
            clearTimeout(timerFechar);
            if (!g.classList.contains('aberto')) abrirMenu(g);
        }
    });
    document.addEventListener('mouseout', function (ev) {
        var g = ev.target.closest && ev.target.closest('[data-grupo]');
        if (!g) return;
        if (ev.relatedTarget && g.contains(ev.relatedTarget)) return;
        clearTimeout(timerFechar);
        timerFechar = setTimeout(function () { fecharMenus(); }, 180);
    });
}

function desenhar() {
    var app = document.getElementById('app');
    if (!app.querySelector('.casca')) {
        app.innerHTML = cascaHTML();
        atualizarSeletoresMoeda();
    }
    var resolvida = resolverRota(rotaAtual);
    if (!resolvida) { rotaAtual = ROTA_INICIAL; resolvida = resolverRota(rotaAtual); }
    var r = ROTAS[resolvida.base];
    r.param = resolvida.param;

    estado.limparPagina();   // ouvintes da página anterior saem
    fecharMenus();
    fecharMenuMobile();      // [ETAPA 5]
    fecharBuscaMobile();
    if (resolvida.base !== '/mercado') desconectarAoVivo();   // [ETAPA 1] socket só no mercado
    sairDaMoeda();                                            // [ETAPA 2] gráfico, socket e timers da moeda
    sairDoPortfolio();                                        // [ETAPA 4] idem, do portfólio

    var rotaMenu = resolvida.base === '/moeda' ? '/mercado' : resolvida.base;
    document.querySelectorAll('[data-nav]').forEach(function (a) {
        var ativo = a.getAttribute('data-nav') === rotaMenu;
        a.classList.toggle('ativo', ativo);
        if (ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    // o botão do grupo acende quando a página atual está dentro dele
    document.querySelectorAll('[data-grupo-rotas]').forEach(function (b) {
        b.classList.toggle('ativo', b.getAttribute('data-grupo-rotas').split(' ').indexOf(rotaMenu) !== -1);
    });
    document.title = r.titulo + ' · ' + APP.nome;

    var miolo = document.getElementById('miolo');
    miolo.innerHTML = r.render(r);
    preencherValores(miolo);
    if (typeof r.montar === 'function') r.montar(miolo);
    atualizarSeletoresMoeda();   // [ETAPA 5.1] o seletor da página (Ajustes) também nasce sincronizado
    window.scrollTo(0, 0);
}

// DE ONDE VEM CADA DADO
//   CoinGecko /coins/markets (1 chamada, 100 moedas, já em reais):
//     ranking, nome, logo, preço, variação 1h/24h/7d, volume, valor de
//     mercado e o minigráfico de 7 dias. EXIGE chave (sem ela a API devolve
//     403). Usa a chave Demo embutida (CG_CHAVE_PADRAO).
//     [ETAPA 1.1] No máximo 1 chamada por dia (ver CG_CHAVE_PADRAO).
//     A chave vai como parâmetro na URL e não no cabeçalho: cabeçalho
//     customizado obriga o navegador a uma checagem prévia (CORS) que já
//     nos barrou na bolsai, no Dash Finance.
//   Binance WebSocket (tempo real, a cada ~1s):
//     preço e variação 24h das moedas que a Binance negocia contra USDT,
//     convertidos pra reais pelo USDTBRL do mesmo canal.
//
// CASAR COINGECKO COM BINANCE: pelo símbolo (btc -> BTCUSDT). Símbolo não é
// único no mundo cripto (duas moedas diferentes podem usar o mesmo), então
// só liga o "ao vivo" se o preço da Binance estiver a até 10% do preço da
// CoinGecko na largada. Mesma ideia que resolveu o caso do ENA.
//
// SEM COINGECKO (limite, fora do ar, bloqueio): cai pro modo simplificado,
// com uma lista fixa das principais moedas e dados só da Binance. Sem
// valor de mercado, logo e minigráfico, mas com preço ao vivo.
//
// ATUALIZAÇÃO NO LUGAR: a tabela é montada uma vez (e de novo só ao trocar
// aba, busca ou ordem). O WebSocket mexe só nas células de preço e 24h
// da linha certa, com pisca e número deslizando.

var COINGECKO = 'https://api.coingecko.com/api/v3';
var BINANCE_WS = 'wss://data-stream.binance.vision/stream?streams=';

// [ETAPA 1.1] REGRA DA COINGECKO: no máximo 1 chamada por dia.
// O app vive dos dados da Binance (preço, variação 24h e volume ao vivo).
// A CoinGecko só entra pro que a Binance não entrega (ranking, logo, valor
// de mercado, variação 1h/7d e minigráfico), e só na primeira abertura do
// dia. Nas demais, usa o pacote guardado. Se a chamada falhar, espera
// CG_ESPERA_FALHA antes de tentar de novo, pra não martelar a API.
// Chave Demo do autor embutida. O usuário não informa chave própria.
var CG_CHAVE_PADRAO = 'CG-1HzJE9XM9LdMbZAEzFZbohoH';
var CG_ESPERA_FALHA = 30 * 60 * 1000;
var CG_PACOTE_VERSAO = 2;      // sobe quando o pacote ganha campos novos

// dia local no formato AAAA-MM-DD ("primeira chamada do dia" segue o relógio de quem usa)
function diaDeHoje(quando) {
    var d = quando ? new Date(quando) : new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
var DIVERGENCIA_MAX = 0.10;

// [ETAPA 2] REGRA: o preço que aparece nos painéis muda no máximo a cada 5s.
// O WebSocket da Binance segue mandando ~1 tick por segundo, mas o app só
// guarda o último de cada moeda e aplica na tela neste intervalo. Vale pra
// tabela do Mercado e pra página da moeda (o pulso do BTC no topo segue a
// cada 30s, por consulta própria).
var PRECO_INTERVALO_MS = 5000;
var PRECO_PRIMEIRO_MS = 800;    // 1º lote sai rápido: o preço do pacote diário pode estar velho

// guarda o último valor de cada chave e entrega em lote a cada `ms`
function criarAmortecedor(aplicar) {
    var pendentes = {};
    var primeiro = null;
    var intervalo = null;
    var iniciado = false;
    function fluxo() {
        var lote = pendentes;
        pendentes = {};
        Object.keys(lote).forEach(function (k) { aplicar(k, lote[k]); });
    }
    return {
        guardar: function (chave, valor) {
            pendentes[chave] = valor;
            // o relógio de 5s só começa quando chega o 1º tick
            if (iniciado) return;
            iniciado = true;
            primeiro = setTimeout(function () {
                fluxo();
                intervalo = setInterval(fluxo, PRECO_INTERVALO_MS);
            }, PRECO_PRIMEIRO_MS);
        },
        parar: function () { clearTimeout(primeiro); clearInterval(intervalo); pendentes = {}; },
    };
}

function normalizarCoinGecko(c) {
    return {

        var7d: c.price_change_percentage_7d_in_currency,

    };

function buscarMercadoCoinGecko() {
    var cache = armazem.json('MERCADO', null);
    var completo = cache && cache.modo === 'completo';

    // [ETAPA 1.1] já chamou hoje? então não chama de novo.
    // [ETAPA 2] pacote de antes da Etapa 2 não tem as estatísticas: renova uma vez.
    if (completo && cache.v === CG_PACOTE_VERSAO && diaDeHoje(cache.em) === diaDeHoje()) {
        return Promise.resolve(cache);
    }

    // [ETAPA 1.1] última tentativa falhou há pouco? usa o que tem
    var falha = Number(armazem.get('MERCADO_FALHA')) || 0;
    if (falha && Date.now() - falha < CG_ESPERA_FALHA) {
        if (completo) {
            cache.velho = true;
            return Promise.resolve(cache);
        }
        return Promise.reject(new Error('em espera'));
    }

    var url = COINGECKO + '/coins/markets?vs_currency=brl&order=market_cap_desc&per_page=100&page=1' +
        '&sparkline=true&price_change_percentage=1h,24h,7d';
    url += '&x_cg_demo_api_key=' + encodeURIComponent(CG_CHAVE_PADRAO);

    return fetch(url)
        .then(function (r) {
            if (r.status === 429) throw new Error('limite');
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
        })
        .then(function (dados) {
            var pacote = { em: Date.now(), v: CG_PACOTE_VERSAO, modo: 'completo', lista: dados.map(normalizarCoinGecko) };
            try {
                armazem.set('MERCADO', JSON.stringify(pacote));
                armazem.remove('MERCADO_FALHA');
            } catch (e) { /* cache é opcional */ }
            return pacote;
        })
        .catch(function (erro) {
            try { armazem.set('MERCADO_FALHA', String(Date.now())); } catch (e) {}
            // cache de outro dia ainda serve melhor que o modo simplificado
            if (completo) {
                cache.velho = true;
                return cache;
            }
            throw erro;
        });
}

function buscarMercadoReserva() {
    var simbolos = LISTA_RESERVA.filter(function (m) { return m[0] !== 'USDT'; })
        .map(function (m) { return m[0] + 'USDT'; }).concat(['USDTBRL']);
    var url = BINANCE + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(simbolos));
    return fetch(url)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (dados) {
            var por = {};
            dados.forEach(function (d) { por[d.symbol] = d; });
            var taxa = por.USDTBRL ? Number(por.USDTBRL.lastPrice) : null;
            if (!taxa) throw new Error('sem USDTBRL');
            var lista = [];
            LISTA_RESERVA.forEach(function (m, i) {
                var d = m[0] === 'USDT' ? por.USDTBRL : por[m[0] + 'USDT'];
                if (!d) return;
                var preco = m[0] === 'USDT' ? Number(d.lastPrice) : Number(d.lastPrice) * taxa;
                lista.push({
                    id: m[0].toLowerCase(), simbolo: m[0], nome: m[1], logo: null, rank: i + 1,
                    preco: preco, var1h: null, var24h: Number(d.priceChangePercent), var7d: null,
                    volume: Number(d.quoteVolume) * (m[0] === 'USDT' ? 1 : taxa), valorMercado: null,
                    sparkline: null, aoVivo: false,
                });
            });
            return { em: Date.now(), modo: 'simplificado', lista: lista };
        });
}

function carregarMercado() {
    return buscarMercadoCoinGecko()
        .catch(function () { return buscarMercadoReserva(); })
        .then(function (pacote) {
            mercado.lista = pacote.lista;
            mercado.modo = pacote.modo;
            mercado.atualizadoEm = pacote.em;
            mercado.velho = !!pacote.velho;
            mercado.porId = {};
            mercado.lista.forEach(function (m) { mercado.porId[m.id] = m; });
            return pacote;
        });
}

// preços de todos os pares da Binance (1 chamada, cache de 1h)
function obterPrecosBinance() {
    var cache = armazem.json('BINANCE_PRECOS', null);
    if (cache && Date.now() - cache.em < 60 * 60 * 1000) return Promise.resolve(cache.precos);
    return fetch(BINANCE + '/api/v3/ticker/price')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var precos = {};
            lista.forEach(function (p) { precos[p.symbol] = Number(p.price); });
            try { armazem.set('BINANCE_PRECOS', JSON.stringify({ em: Date.now(), precos: precos })); } catch (e) {}
            return precos;
        });
}

// par da Binance que corresponde à moeda da CoinGecko, ou null.
// Mesmo símbolo pode ser moeda diferente (caso do ENA), então compara o
// preço. [ETAPA 2] Com a CoinGecko 1x por dia, o preço do pacote pode ter
// horas: a tolerância sobe conforme a idade (10% até 1h; 40% depois).
// Símbolo repetido de verdade costuma diferir por ordens de grandeza.
function parBinanceDe(m, precos) {
    if (m.simbolo === 'USDT') return precos.USDTBRL ? 'USDTBRL' : null;
    var par = m.simbolo + 'USDT';
    var taxa = precos.USDTBRL;
    if (!precos[par] || !taxa) return null;
    var idade = mercado.atualizadoEm ? Date.now() - mercado.atualizadoEm : 0;
    var tolerancia = idade > 60 * 60 * 1000 ? 0.40 : DIVERGENCIA_MAX;
    if (m.preco > 0 && Math.abs(precos[par] * taxa / m.preco - 1) > tolerancia) return null;
    return par;
}

function conectarAoVivo() {
    desconectarAoVivo();
    // quais moedas têm par USDT na Binance? (lista de preços, 1h de cache)
    var pronto = obterPrecosBinance();

    pronto.then(function (precos) {
        var taxa = precos.USDTBRL;
        if (!taxa) throw new Error('sem USDTBRL');
        mercado.usdtbrl = taxa;
        mercado.wsMapa = {};
        mercado.lista.forEach(function (m) {
            if (m.simbolo === 'USDT') { mercado.wsMapa.USDTBRL_MOEDA = m.id; m.aoVivo = true; return; }
            var par = parBinanceDe(m, precos);
            if (!par) return;
            mercado.wsMapa[par] = m.id;
            m.aoVivo = true;
        });
        var streams = Object.keys(mercado.wsMapa).filter(function (k) { return k !== 'USDTBRL_MOEDA'; })
            .map(function (k) { return k.toLowerCase() + '@miniTicker'; });
        streams.push('usdtbrl@miniTicker');
        abrirSocket(streams);
        marcarLinhasAoVivo();
    }).catch(function () {
        estado.definir('conexao', 'off');
    });
}

function abrirSocket(streams) {
    estado.definir('conexao', 'conectando');
    var ws;
    try {
        ws = new WebSocket(BINANCE_WS + streams.join('/'));
    } catch (e) {
        estado.definir('conexao', 'off');
        return;
    }
    mercado.ws = ws;
    // [ETAPA 2] ticks vão pro amortecedor; a tela muda a cada PRECO_INTERVALO_MS
    if (!mercado.amortecedor) {
        mercado.amortecedor = criarAmortecedor(function (simbolo, t) { aplicarTick(simbolo, t.c, t.o); });
    }
    ws.onopen = function () {
        mercado.wsTentativas = 0;
        estado.definir('conexao', 'ao-vivo');
    };
    ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        var d = msg && msg.data;
        if (!d || !d.s) return;
        receberTick(d.s, Number(d.c), Number(d.o));
    };
    ws.onclose = function () {
        if (mercado.ws !== ws) return;          // fechado de propósito
        mercado.ws = null;
        estado.definir('conexao', 'off');
        // reconecta com espera crescente (2s, 4s, 8s... até 60s)
        var espera = Math.min(60000, 2000 * Math.pow(2, mercado.wsTentativas++));
        mercado.timerReconexao = setTimeout(function () {
            if (rotaAtual === '/mercado') abrirSocket(streams);
        }, espera);
    };
    ws.onerror = function () { /* onclose cuida */ };
}

function desconectarAoVivo() {
    clearTimeout(mercado.timerReconexao);
    if (mercado.amortecedor) {
        mercado.amortecedor.parar();
        mercado.amortecedor = null;
    }
    if (mercado.ws) {
        var ws = mercado.ws;
        mercado.ws = null;
        try { ws.close(); } catch (e) {}
    }
}

function receberTick(simbolo, fechamento, abertura) {
    // a taxa de conversão entra na hora (não mexe na tela); o resto espera o lote
    if (simbolo === 'USDTBRL') mercado.usdtbrl = fechamento;
    if (mercado.amortecedor) mercado.amortecedor.guardar(simbolo, { c: fechamento, o: abertura });
}

function aplicarTick(simbolo, fechamento, abertura) {
    var id, preco;
    if (simbolo === 'USDTBRL') {
        id = mercado.wsMapa.USDTBRL_MOEDA;
        preco = fechamento;
    } else {
        id = mercado.wsMapa[simbolo];
        if (!id || !mercado.usdtbrl) return;
        preco = fechamento * mercado.usdtbrl;
    }
    var m = id && mercado.porId[id];
    if (!m || !(preco > 0)) return;

    var anterior = m.preco;
    m.preco = preco;
    if (abertura > 0) m.var24h = (fechamento / abertura - 1) * 100;

    var linha = document.querySelector('[data-moeda-id="' + id + '"]');
    if (!linha) return;
    var celPreco = linha.querySelector('[data-cel="preco"]');
    var celVar = linha.querySelector('[data-cel="var24h"]');
    if (celPreco && Math.abs(preco - anterior) / anterior > 1e-7) {
        celPreco.setAttribute('data-brl', preco);
        piscar(celPreco, preco > anterior);
        animarNumero(celPreco, anterior, preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
    }
    if (celVar) celVar.innerHTML = varHTML(m.var24h);
}

function marcarLinhasAoVivo() {
    mercado.lista.forEach(function (m) {
        var linha = document.querySelector('[data-moeda-id="' + m.id + '"]');
        if (linha) linha.classList.toggle('ao-vivo', m.aoVivo);
    });
}

function sparklineSVG(pontos, pct) {
    if (!pontos || pontos.length < 2) return '<span class="sem-dado">—</span>';
    // 168 pontos (1 por hora) viram ~42: o traço fica limpo e leve
    var passo = Math.max(1, Math.floor(pontos.length / 42));
    var amostra = pontos.filter(function (_, i) { return i % passo === 0; });
    amostra.push(pontos[pontos.length - 1]);
    var min = Math.min.apply(null, amostra), max = Math.max.apply(null, amostra);
    var w = 120, h = 36, faixa = max - min || 1;
    var d = amostra.map(function (v, i) {
        var x = (i / (amostra.length - 1)) * w;
        var y = h - 3 - ((v - min) / faixa) * (h - 6);
        return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
    var cor = pct == null ? 'var(--texto-3)' : pct >= 0 ? 'var(--alta)' : 'var(--queda)';
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/></svg>';
}

function moedasFiltradas() {
    var lista = mercado.lista.slice();
    var fav = favoritos();
    if (mercado.aba === 'favoritas') lista = lista.filter(function (m) { return fav.indexOf(m.id) !== -1; });
    if (mercado.busca) {
        var q = mercado.busca.toLowerCase();
        lista = lista.filter(function (m) { return m.nome.toLowerCase().indexOf(q) !== -1 || m.simbolo.toLowerCase().indexOf(q) !== -1; });
    }
    if (mercado.aba === 'altas') {
        lista = lista.filter(function (m) { return m.var24h > 0; }).sort(function (a, b) { return b.var24h - a.var24h; });
        return lista;
    }
    if (mercado.aba === 'quedas') {
        lista = lista.filter(function (m) { return m.var24h < 0; }).sort(function (a, b) { return a.var24h - b.var24h; });
        return lista;
    }
    var o = mercado.ordem;
    lista.sort(function (a, b) {
        var va = a[o.campo], vb = b[o.campo];
        if (va == null) return 1;
        if (vb == null) return -1;
        return o.desc ? vb - va : va - vb;
    });
    return lista;
}

document.addEventListener('click', function (ev) {
    var estrela = ev.target.closest('[data-favorito]');
    if (estrela) {
        ev.stopPropagation();
        var marcou = alternarFavorito(estrela.getAttribute('data-favorito'));
        estrela.classList.toggle('marcada', marcou);
        estrela.setAttribute('aria-pressed', marcou);
        if (mercado.aba === 'favoritas') desenharTabela(false);
        return;
    }
    var aba = ev.target.closest('[data-aba]');
    if (aba) {
        mercado.aba = aba.getAttribute('data-aba');
        document.querySelectorAll('[data-aba]').forEach(function (b) {
            b.setAttribute('aria-pressed', b === aba ? 'true' : 'false');
        });
        desenharTabela(false);
        return;
    }
    var ord = ev.target.closest('[data-ordenar]');
    if (ord) {

var LW_URL = 'https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js';
var LW_SRI = 'sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK';

// período -> tamanho da vela e quantas velas buscar (segundos por vela em `seg`)

// fator pra mostrar em reais, dólar ou bitcoin (o gráfico guarda tudo em reais)
function fatorExibicao() {
    var taxas = estado.ler('taxas') || {};
    var m = estado.ler('moeda');
    if (m === 'USD' && taxas.USD) return 1 / taxas.USD;
    if (m === 'BTC' && taxas.BTC) return 1 / taxas.BTC;
    return 1;
}

// valor já convertido -> texto com o símbolo da moeda de exibição
function formatarExibido(v) {
    var m = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    var sinal = v < 0 ? '-' : '';
    v = Math.abs(v);
    if (m === 'BTC' && taxas.BTC) return sinal + '₿ ' + formatarBR(v, v >= 1 ? 4 : 8);
    if (m === 'USD' && taxas.USD) return sinal + 'US$ ' + formatarPreco(v);
    return sinal + 'R$ ' + formatarPreco(v);
}

// [ETAPA 5.1] escala dos gráficos: no celular, valor grande ocupa menos lugar
// (sem centavos acima de 1.000 e "447,5 mil" acima de 100 mil). O valor exato
// segue na leitura do cursor. No computador, o formato completo de sempre.
function formatarEixo(v) {
    var m = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    if (!ehTelaPequena() || (m === 'BTC' && taxas.BTC)) return formatarExibido(v);
    var simbolo = m === 'USD' && taxas.USD ? 'US$ ' : 'R$ ';
    var abs = Math.abs(v);
    var sinal = v < 0 ? '-' : '';
    if (abs >= 1e5) return sinal + simbolo + formatarBR(abs / 1e3, 1) + ' mil';
    if (abs >= 1e3) return sinal + simbolo + formatarBR(abs, 0);
    return formatarExibido(v);
}

function carregarLightweight() {
    if (window.LightweightCharts) return Promise.resolve();
    if (lwPromessa) return lwPromessa;
    lwPromessa = new Promise(function (ok, falha) {

        el.src = LW_URL;
        el.integrity = LW_SRI;
        el.crossOrigin = 'anonymous';
        el.onload = ok;
        el.onerror = function () { lwPromessa = null; falha(new Error('biblioteca do gráfico')); };
        document.head.appendChild(el);
    });
    return lwPromessa;
}

function buscarKlines(simbolo, p) {
    var url = BINANCE + '/api/v3/klines?symbol=' + simbolo + '&interval=' + p.intervalo + '&limit=' + p.limite;

}

// velas em reais: preço em USDT x USDTBRL do mesmo instante
function buscarSerie(par, periodo) {
    var chave = par + '|' + periodo;
    var c = graficoCache[chave];
    if (c && Date.now() - c.em < GRAFICO_CACHE_MS) return Promise.resolve(c.dados);

    var p = PERIODOS[periodo];
    var pedidos = [buscarKlines(par, p)];
    if (par !== 'USDTBRL') pedidos.push(buscarKlines('USDTBRL', p));
    return Promise.all(pedidos).then(function (res) {
        var taxaEm = {};
        if (res[1]) res[1].forEach(function (k) { taxaEm[k[0]] = Number(k[4]); });
        var ultima = res[1] && res[1].length ? Number(res[1][0][4]) : 1;
        var desvio = new Date().getTimezoneOffset() * 60;     // eixo em horário local
        var dados = res[0].map(function (k) {
            var tx = 1;
            if (res[1]) {
                if (taxaEm[k[0]]) ultima = taxaEm[k[0]];
                tx = ultima;
            }
            return {
                time: Math.floor(k[0] / 1000) - desvio,
                open: Number(k[1]) * tx,
                high: Number(k[2]) * tx,
                low: Number(k[3]) * tx,
                close: Number(k[4]) * tx,
            };
        });
        graficoCache[chave] = { em: Date.now(), dados: dados };
        return dados;
    });
}

// ---------- gráfico ----------
function corCss(nome) {

function criarGrafico() {

        var quando = new Date(param.time * 1000).toLocaleString('pt-BR', {

        });

                '</strong> · m <strong>' + formatarExibido(d.low) + '</strong> · F <strong>' + formatarExibido(d.close) + '</strong>';

}

function paraSerie(v) {
    var f = fatorExibicao();
    if (moedaPg.tipo === 'linha') return { time: v.time, value: v.close * f };
    return { time: v.time, open: v.open * f, high: v.high * f, low: v.low * f, close: v.close * f };
}

// (re)desenha a série com os dados atuais: troca de tipo, período ou moeda
function desenharSerie(ajustar) {
    var pg = moedaPg;

    var LW = window.LightweightCharts;
    if (pg.serie) { pg.chart.removeSeries(pg.serie); pg.serie = null; }
    var formato = { type: 'custom', formatter: formatarEixo, minMove: 1e-10 };
    var alta = corCss('--alta'), queda = corCss('--queda');
    if (pg.tipo === 'linha') {
        var subiu = pg.dados.length < 2 || pg.dados[pg.dados.length - 1].close >= pg.dados[0].close;
        pg.serie = pg.chart.addLineSeries({ color: subiu ? alta : queda, lineWidth: 2, priceFormat: formato, lastValueVisible: true, priceLineVisible: true });
    } else {
        pg.serie = pg.chart.addCandlestickSeries({
            upColor: alta, downColor: queda, borderUpColor: alta, borderDownColor: queda, wickUpColor: alta, wickDownColor: queda,
            priceFormat: formato,
        });
    }
    pg.serie.setData(pg.dados.map(paraSerie));
    if (ajustar) pg.chart.timeScale().fitContent();
}

    }
    var token = ++moedaPgToken;
    mostrarMensagemGrafico('Carregando gráfico…');
    buscarSerie(pg.par, pg.periodo).then(function (dados) {
        if (token !== moedaPgToken || moedaPg !== pg) return;
        pg.dados = dados.map(function (v) { return Object.assign({}, v); });   // cópia: o ao vivo mexe na última vela
        mostrarMensagemGrafico('');
        desenharSerie(true);
    }).catch(function () {
        if (token !== moedaPgToken || moedaPg !== pg) return;
        mostrarMensagemGrafico('Não consegui carregar o gráfico agora. Troque o período pra tentar de novo.');
    });
}

// ---------- ao vivo (com amortecedor de 5s) ----------
function abrirSocketMoeda() {
    var pg = moedaPg;
    if (!pg || !pg.par) { estado.definir('conexao', 'off'); return; }
    estado.definir('conexao', 'conectando');
    var streams = pg.par === 'USDTBRL' ? ['usdtbrl@miniTicker'] : [pg.par.toLowerCase() + '@miniTicker', 'usdtbrl@miniTicker'];
    var ws;
    try { ws = new WebSocket(BINANCE_WS + streams.join('/')); } catch (e) { estado.definir('conexao', 'off'); return; }
    pg.ws = ws;
    if (!pg.amortecedor) {
        pg.amortecedor = criarAmortecedor(function (chave, t) { aplicarPrecoMoeda(chave, t.c, t.o); });
    }
    ws.onopen = function () { pg.tentativas = 0; estado.definir('conexao', 'ao-vivo'); };
    ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        var d = msg && msg.data;
        if (!d || !d.s) return;
        if (d.s === 'USDTBRL') pg.usdtbrl = Number(d.c);
        pg.amortecedor.guardar(d.s, { c: Number(d.c), o: Number(d.o) });
    };
    ws.onclose = function () {
        if (moedaPg !== pg || pg.ws !== ws) return;     // saiu da página de propósito
        pg.ws = null;
        estado.definir('conexao', 'off');
        var espera = Math.min(60000, 2000 * Math.pow(2, pg.tentativas++));
        pg.timerReconexao = setTimeout(function () { if (moedaPg === pg) abrirSocketMoeda(); }, espera);
    };
    ws.onerror = function () { /* onclose cuida */ };
}

function aplicarPrecoMoeda(simbolo, fechamento, abertura) {
    var pg = moedaPg;
    if (!pg || simbolo !== pg.par) return;      // o lote do USDTBRL só serve de taxa
    var preco = simbolo === 'USDTBRL' ? fechamento : fechamento * (pg.usdtbrl || (estado.ler('taxas') || {}).USD || 0);
    if (!(preco > 0)) return;

    var anterior = pg.m.preco;
    pg.m.preco = preco;
    if (abertura > 0) pg.m.var24h = (fechamento / abertura - 1) * 100;

    var el = document.getElementById('moeda-preco');
    if (el && Math.abs(preco - anterior) / anterior > 1e-7) {
        el.setAttribute('data-brl', preco);
        piscar(el, preco > anterior);
        animarNumero(el, anterior, preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
    }
    var v = document.getElementById('moeda-var');
    if (v) v.innerHTML = pctCelula(pg.m.var24h);

    atualizarDistanciaMaxima();
    atualizarPosicaoMoeda();
    recalcularConversor();
    atualizarUltimaVela(preco);
}

// a última vela acompanha o preço; passou do intervalo, abre uma nova
function atualizarUltimaVela(preco) {
    var pg = moedaPg;
    if (!pg || !pg.serie || !pg.dados || !pg.dados.length) return;
    var seg = PERIODOS[pg.periodo].seg;
    var desvio = new Date().getTimezoneOffset() * 60;
    var abertura = Math.floor(Date.now() / 1000 / seg) * seg - desvio;
    var u = pg.dados[pg.dados.length - 1];
    if (abertura > u.time) {
        u = { time: abertura, open: u.close, high: Math.max(u.close, preco), low: Math.min(u.close, preco), close: preco };
        pg.dados.push(u);
    } else {
        u.close = preco;
        if (preco > u.high) u.high = preco;
        if (preco < u.low) u.low = preco;
    }
    pg.serie.update(paraSerie(u));
}

// aceita 1.234,56 e 1234.56; devolve NaN se não for número
function lerNumero(texto) {
    var t = String(texto || '').trim().replace(/\s/g, '');
    if (!t) return NaN;
    if (t.indexOf(',') !== -1) t = t.replace(/\./g, '').replace(',', '.');
    else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
    return /^\d*\.?\d+$|^\d+\.$/.test(t) ? Number(t) : NaN;
}

function textoNumero(n, casas) {
    return formatarBR(n, casas).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
}

function recalcularConversor(origem) {
    var pg = moedaPg;
    var q = document.getElementById('conv-qtd');
    var v = document.getElementById('conv-valor');
    if (!pg || !q || !v) return;
    var precoExibido = pg.m.preco * fatorExibicao();
    origem = origem || pg.convOrigem || 'qtd';
    if (origem === 'qtd') {
        var qtd = lerNumero(q.value);
        v.value = isNaN(qtd) ? '' : textoNumero(qtd * precoExibido, estado.ler('moeda') === 'BTC' && fatorExibicao() !== 1 ? 8 : 2);
    } else {
        var val = lerNumero(v.value);
        q.value = isNaN(val) || !precoExibido ? '' : textoNumero(val / precoExibido, 8);
    }
}

/* =================================================================
   MOTOR E LANÇAMENTOS  [ETAPA 3 · 29/09/2026]
   Portado do Dash Finance ([CRIPTO v2], [CRIPTO v2.1], [MOTOR v2]),
   só a parte de cripto. Diferenças em relação ao original:
     - sem usuário e sem login: um banco só, neste aparelho
     - a moeda é identificada pelo ID DA COINGECKO (não pelo símbolo)
     - lucro realizado (novo): valor recebido na venda menos o custo baixado
   Tudo em REAIS. Valores unitários e taxas são guardados em reais.
   ================================================================= */

// [MOTOR:início] funções puras: recebem a lista de lançamentos e devolvem
// resultado, sem ler nem gravar nada (assim dá pra testar sozinhas).

var QTD_EPSILON = 1e-9;   // tolerância de ponto flutuante em quantidades

var TIPOS = { COMPRA: 'Compra', VENDA: 'Venda', ENTRADA: 'Entrada', SAIDA: 'Saída', CONVERSAO: 'Conversão' };
var TIPOS_ORDEM = ['COMPRA', 'VENDA', 'ENTRADA', 'SAIDA', 'CONVERSAO'];
var TIPOS_COM_PRECO = { COMPRA: true, VENDA: true };
var TIPOS_DE_BAIXA = { VENDA: true, SAIDA: true, CONVERSAO: true };

// PERNAS: cada lançamento vira uma ou duas variações de quantidade por moeda.
//   COMPRA / ENTRADA -> +quantidade
//   VENDA  / SAIDA   -> -quantidade
//   CONVERSAO        -> -quantidade na origem e +quantidadeDestino no destino
function pernasDaTransacao(t) {
    switch (t.tipo) {
        case 'COMPRA':
        case 'ENTRADA':
            return [{ moedaId: t.moedaId, delta: t.quantidade }];
        case 'VENDA':
        case 'SAIDA':
            return [{ moedaId: t.moedaId, delta: -t.quantidade }];
        case 'CONVERSAO':
            return [
                { moedaId: t.moedaId, delta: -t.quantidade },
                { moedaId: t.moedaDestinoId, delta: t.quantidadeDestino },
            ];
    }
    return [];
}

// ORDEM CANÔNICA: data -> prioridade no dia -> criadoEm -> id.
// No mesmo dia o que ENTRA (compra, entrada) vem antes da conversão, que vem
// antes do que SAI (venda, saída). Assim a ordem de digitação dos lançamentos
// do mesmo dia não muda o resultado. Cálculo e validação usam sempre esta.
var PRIORIDADE_NO_DIA = { COMPRA: 0, ENTRADA: 0, CONVERSAO: 1, VENDA: 2, SAIDA: 2 };

function ordenarTransacoes(lista) {
    return lista.slice().sort(function (a, b) {
        if (a.data < b.data) return -1;
        if (a.data > b.data) return 1;
        var pa = PRIORIDADE_NO_DIA[a.tipo] || 0;
        var pb = PRIORIDADE_NO_DIA[b.tipo] || 0;
        if (pa !== pb) return pa - pb;
        if (a.criadoEm !== b.criadoEm) return a.criadoEm - b.criadoEm;
        return a.id - b.id;
    });
}

// O CORAÇÃO DO CÁLCULO DE CUSTO. Recebe os lançamentos JÁ ORDENADOS e devolve:
//   posicoes[moedaId] = { quantidade, custoTotal, qtdComCusto }
//   deltaCusto[idLancamento]  = quanto o lançamento mexeu no custo total
//   realizado[idLancamento]   = lucro realizado (só vendas)
// Regras:
//   COMPRA    soma quantidade e custo (qtd x preço + taxas)
//   ENTRADA   soma SÓ quantidade: custo zero, sempre (mineração, recompensa,
//             airdrop, presente). Não mexe no preço médio de compra
//   VENDA     tira quantidade e o custo proporcional pelo preço médio
//   SAIDA     igual à venda, mas sem devolver reais (taxa de rede, envio, perda)
//   CONVERSAO tira da origem pelo preço médio e ESSE MESMO custo entra no
//             destino. Nenhuma cotação participa; o custo total não muda
// PREÇO MÉDIO DE COMPRA = custoTotal / qtdComCusto. Cada posição sabe quanto
// da sua quantidade TEM custo (qtdComCusto): a entrada gratuita aumenta a
// quantidade mas não derruba o preço médio. Na baixa, a parte com custo e a
// gratuita saem na mesma proporção.
// LUCRO REALIZADO da venda = (qtd x preço - taxas) - custo baixado.
function processarCarteira(ordenadas) {
    var posicoes = {};
    var deltaCusto = {};
    var realizado = {};

    function pos(id) {
        if (!posicoes[id]) posicoes[id] = { quantidade: 0, custoTotal: 0, qtdComCusto: 0 };
        return posicoes[id];
    }

    // tira `q` da posição, custo e parte com custo na mesma fração
    function baixar(p, q) {
        var fracao = p.quantidade > 0 ? Math.min(q / p.quantidade, 1) : 0;
        var custo = p.custoTotal * fracao;
        var comCusto = p.qtdComCusto * fracao;
        p.quantidade -= q;
        p.custoTotal -= custo;
        p.qtdComCusto -= comCusto;
        // resíduo de ponto flutuante: abaixo da tolerância, zera de vez
        if (Math.abs(p.quantidade) < QTD_EPSILON) {
            custo += p.custoTotal;
            comCusto += p.qtdComCusto;
            p.quantidade = 0;
            p.custoTotal = 0;
            p.qtdComCusto = 0;
        }
        return { custo: custo, qtdComCusto: comCusto };
    }

    ordenadas.forEach(function (t) {
        var delta = 0;
        if (t.tipo === 'COMPRA') {
            var p = pos(t.moedaId);
            delta = t.quantidade * t.precoUnitario + (t.taxas || 0);
            p.quantidade += t.quantidade;
            p.custoTotal += delta;
            p.qtdComCusto += t.quantidade;
        } else if (t.tipo === 'ENTRADA') {
            pos(t.moedaId).quantidade += t.quantidade;
        } else if (t.tipo === 'VENDA' || t.tipo === 'SAIDA') {
            var saiu = baixar(pos(t.moedaId), t.quantidade);
            delta = -saiu.custo;
            if (t.tipo === 'VENDA') {
                realizado[t.id] = (t.quantidade * t.precoUnitario - (t.taxas || 0)) - saiu.custo;
            }
        } else if (t.tipo === 'CONVERSAO') {
            var origem = baixar(pos(t.moedaId), t.quantidade);
            var destino = pos(t.moedaDestinoId);
            destino.quantidade += t.quantidadeDestino;
            destino.custoTotal += origem.custo;
            var fracaoComCusto = t.quantidade > 0 ? origem.qtdComCusto / t.quantidade : 0;
            destino.qtdComCusto += t.quantidadeDestino * fracaoComCusto;
        }
        deltaCusto[t.id] = delta;
    });

    return { posicoes: posicoes, deltaCusto: deltaCusto, realizado: realizado };
}

// Primeira perna NEGATIVA da moeda que ficaria sem saldo, ou null.
// `quantidade` é o que a perna tentou tirar; `disponivel`, o que havia.
function primeiroFuroDeSaldo(ordenadas, moedaId) {
    var saldo = 0;
    for (var i = 0; i < ordenadas.length; i++) {
        var pernas = pernasDaTransacao(ordenadas[i]);
        for (var j = 0; j < pernas.length; j++) {
            var perna = pernas[j];
            if (perna.moedaId !== moedaId) continue;
            if (perna.delta < 0 && -perna.delta > saldo + QTD_EPSILON) {
                return { transacao: ordenadas[i], disponivel: Math.max(saldo, 0), quantidade: -perna.delta };
            }
            saldo += perna.delta;
        }
    }
    return null;
}

// VALIDAÇÃO NA LINHA DO TEMPO: simula a carteira COM a alteração e checa se
// alguma baixa, em qualquer data, ficaria sem saldo.
//   alteracao = { editId, novo }  pra salvar (novo = lançamento simulado)
//               { excluirId }     pra excluir
// Moeda ainda não cadastrada usa id fictício ('NOVO' / 'NOVO_DESTINO').
// Checa todas as moedas tocadas pelo lançamento original e pelo novo.
function verificarCronologia(transacoes, alteracao) {
    var idRemovido = alteracao.editId || alteracao.excluirId || null;
    var lista = transacoes.filter(function (t) { return t.id !== idRemovido; });

    var afetadas = [];
    function marcar(t) {
        pernasDaTransacao(t).forEach(function (p) {
            if (afetadas.indexOf(p.moedaId) === -1) afetadas.push(p.moedaId);
        });
    }
    if (idRemovido) {
        var original = transacoes.filter(function (t) { return t.id === idRemovido; })[0];
        if (original) marcar(original);
    }
    if (alteracao.novo) {
        lista.push(alteracao.novo);
        marcar(alteracao.novo);
    }

    var ordenadas = ordenarTransacoes(lista);
    for (var i = 0; i < afetadas.length; i++) {
        var furo = primeiroFuroDeSaldo(ordenadas, afetadas[i]);
        if (furo) {
            furo.moedaId = afetadas[i];
            furo.ehANova = furo.transacao === alteracao.novo;
            return furo;
        }
    }
    return null;
}

// ─── Crypto: AES-GCM + PBKDF2 ────────────────────────────────────
function _strBuf(s) { return new TextEncoder().encode(s); }
function _b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
function _debuf(b64) {
    var s = atob(b64), b = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
    return b.buffer;
}

function _derivarChave(email, salt) {
    return crypto.subtle.importKey('raw', _strBuf(email.toLowerCase().trim()), 'PBKDF2', false, ['deriveKey'])
        .then(function (mat) {
            return crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
                mat, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']
            );
        });
}

function encriptarPIN(pin, email) {
    var salt = crypto.getRandomValues(new Uint8Array(16));
    var iv   = crypto.getRandomValues(new Uint8Array(12));
    return _derivarChave(email, salt).then(function (chave) {
        return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, chave, _strBuf(pin));
    }).then(function (cifrado) {
        return { encriptado: _b64(cifrado), salt: _b64(salt), iv: _b64(iv) };
    });
}

function decriptarPIN(dados, email) {
    return _derivarChave(email, _debuf(dados.salt)).then(function (chave) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: _debuf(dados.iv) }, chave, _debuf(dados.encriptado));
    }).then(function (claro) {
        return new TextDecoder().decode(claro);
    });
}

// ─── OTP: caixas de dígito ────────────────────────────────────────
function ligarOTP(grupoId, hiddenId) {
    var grupo = document.getElementById(grupoId);
    var hidden = document.getElementById(hiddenId);
    if (!grupo || !hidden) return;
    var inputs = grupo.querySelectorAll('.otp-digito');
    function sync() {
        var val = '';
        inputs.forEach(function (d) {
            val += d.value;
            d.classList.toggle('preenchido', d.value.length === 1);
        });
        hidden.value = val;
    }
    inputs.forEach(function (inp, i) {
        inp.addEventListener('input', function () {
            // garante só dígito
            inp.value = inp.value.replace(/\D/g, '').slice(-1);
            sync();
            if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
        });
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !inp.value && i > 0) {
                inputs[i - 1].value = '';
                inputs[i - 1].classList.remove('preenchido');
                inputs[i - 1].focus();
                sync();
            }
            // Ctrl/Cmd+V handled via paste
        });
        inp.addEventListener('paste', function (e) {
            e.preventDefault();
            var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
            inputs.forEach(function (d, j) { d.value = text[j] || ''; });
            sync();
            var last = Math.min(text.length, inputs.length) - 1;
            if (last >= 0) inputs[last].focus();
        });
        // foco no 1º ao clicar em qualquer caixa do grupo
        inp.addEventListener('focus', function () {
            var primeiroVazio = -1;
            inputs.forEach(function (d, j) { if (!d.value && primeiroVazio < 0) primeiroVazio = j; });
            if (primeiroVazio > i) inputs[primeiroVazio].focus();
        });
    });
}

function _mostrarErro(id, msg) {
    var el = document.getElementById(id);

    el.hidden = !msg;
}
function _setarOcupado(btnId, ocupado, textoOriginal) {
    var btn = document.getElementById(btnId);
    if (!btn) return;
    btn.disabled = ocupado;
    btn.textContent = ocupado ? 'Aguarde…' : textoOriginal;
}

function tentarLogin() {
    if (!_usuarioSelecionadoId) return;
    var pin = (document.getElementById('pin-val') || {}).value || '';
    _mostrarErro('pin-erro', '');
    if (pin.length < PIN_DIGITOS) { _mostrarErro('pin-erro', 'Digite os ' + PIN_DIGITOS + ' dígitos do PIN.'); return; }
    var btn = document.querySelector('[data-login-submit]');
    if (btn) { btn.disabled = true; btn.textContent = 'Aguarde…'; }
    var usuario = buscarUsuarioPorId(_usuarioSelecionadoId);
    if (!usuario) { _mostrarErro('pin-erro', 'Perfil não encontrado.'); if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; } return; }
    decriptarPIN(usuario.pinDados, usuario.email).then(function (pinSalvo) {
        if (pinSalvo === pin) {
            iniciarSessao(usuario.id);
            iniciarApp();
        } else {
            _mostrarErro('pin-erro', 'PIN incorreto. Verifique e tente novamente.');
            // limpar caixas
            var grupo = document.getElementById('otp-login');
            if (grupo) grupo.querySelectorAll('.otp-digito').forEach(function (d) { d.value = ''; d.classList.remove('preenchido'); });
            if (document.getElementById('pin-val')) document.getElementById('pin-val').value = '';
            if (grupo) grupo.querySelector('.otp-digito').focus();
            if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
        }
    }).catch(function () {
        _mostrarErro('pin-erro', 'PIN incorreto. Verifique e tente novamente.');
        if (btn) { btn.disabled = false; btn.textContent = 'Entrar'; }
    });
}

function criarPerfil() {
    var nome  = ((document.getElementById('novo-nome') || {}).value || '').trim();
    var email = ((document.getElementById('novo-email') || {}).value || '').toLowerCase().trim();
    var pin   = (document.getElementById('novo-pin') || {}).value || '';
    var conf  = (document.getElementById('novo-pin-conf') || {}).value || '';
    _mostrarErro('erro-nome', '');
    _mostrarErro('erro-email', '');
    _mostrarErro('erro-pin', '');
    _mostrarErro('erro-pin-conf', '');
    _mostrarErro('erro-criar', '');
    var ok = true;
    if (!nome || !/^[A-Za-z0-9]{2,30}$/.test(nome)) {
        _mostrarErro('erro-nome', 'Use apenas letras e números, sem espaços (2 a 30 caracteres).'); ok = false;
    }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        _mostrarErro('erro-email', 'Digite um e-mail válido.'); ok = false;
    }
    var usuarios = lerUsuarios();
    if (ok && usuarios.some(function (u) { return u.nomeUsuario.toLowerCase() === nome.toLowerCase(); })) {
        _mostrarErro('erro-nome', 'Já existe um perfil com esse nome.'); ok = false;
    }
    if (ok && pin.length < PIN_DIGITOS) { _mostrarErro('erro-pin', 'Preencha todos os ' + PIN_DIGITOS + ' dígitos.'); ok = false; }
    if (ok && !/^\d+$/.test(pin)) { _mostrarErro('erro-pin', 'Use apenas dígitos numéricos.'); ok = false; }
    if (ok && conf.length < PIN_DIGITOS) { _mostrarErro('erro-pin-conf', 'Confirme todos os ' + PIN_DIGITOS + ' dígitos.'); ok = false; }
    if (ok && pin !== conf) { _mostrarErro('erro-pin-conf', 'Os PINs não coincidem.'); ok = false; }
    if (!ok) return;
    _setarOcupado('btn-criar-perfil', true, 'Criar perfil');
    // chave derivada só do email; o PIN vai como texto cifrado
    // recuperação = decifrar com email e exibir o PIN
    encriptarPIN(pin, email).then(function (pinDados) {
        var id = 'u' + Date.now();
        var novo = { id: id, nomeUsuario: nome, email: email, pinDados: pinDados, criadoEm: hojeISO() };
        usuarios.push(novo);
        gravarUsuarios(usuarios);
        iniciarSessao(id);
        iniciarApp();
    }).catch(function (e) {
        _mostrarErro('erro-criar', 'Erro ao cifrar o PIN. Tente novamente.');
        _setarOcupado('btn-criar-perfil', false, 'Criar perfil');
    });
}

function recuperarPIN() {
    var email = ((document.getElementById('rec-email') || {}).value || '').toLowerCase().trim();
    _mostrarErro('rec-erro', '');
    var res = document.getElementById('rec-resultado');
    if (res) res.hidden = true;
    if (!email) { _mostrarErro('rec-erro', 'Digite seu e-mail.'); return; }
    var usuario = buscarUsuarioPorEmail(email);
    if (!usuario) { _mostrarErro('rec-erro', 'Nenhum perfil encontrado com este e-mail.'); return; }
    _setarOcupado('btn-recuperar', true, 'Mostrar meu PIN');
    var btn = document.getElementById('btn-recuperar');
    decriptarPIN(usuario.pinDados, email)
        .then(function (pin) {
            if (res) { res.hidden = false; res.innerHTML = '<span>Seu PIN</span><strong>' + escapar(pin) + '</strong>'; }
            if (btn) { btn.disabled = false; btn.textContent = 'Mostrar meu PIN'; }
        })
        .catch(function () {
            _mostrarErro('rec-erro', 'Não foi possível recuperar o PIN com este e-mail.');
            if (btn) { btn.disabled = false; btn.textContent = 'Mostrar meu PIN'; }
        });
}

// lançamentos não depender do pacote diário da CoinGecko (moeda que saiu do
// top 100 continua aparecendo com nome e logo).
// Lançamento: { id, criadoEm, tipo, moedaId, quantidade, precoUnitario,
//   taxas, data, moedaDestinoId?, quantidadeDestino? }  (valores em reais)
function chaveDosBanco() {
    var id = sessaoAtual();
    return id ? 'BANCO_' + id : 'BANCO';
}

function lerBanco() {
    var b = armazem.json(chaveDosBanco(), null);
    if (!b || !Array.isArray(b.transacoes)) b = { moedas: {}, transacoes: [], proximoId: 1 };
    b.moedas = b.moedas || {};
    b.proximoId = b.proximoId || 1;
    return b;
}

function gravarBanco(b) {
    armazem.set(chaveDosBanco(), JSON.stringify(b));
}

function hojeISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatarDataBR(iso) {
    var p = String(iso || '').split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : String(iso || '');
}

// número -> texto de campo em pt-BR, sem milhar e sem zeros sobrando
function numeroParaCampo(n, casas) {
    return Number(n).toFixed(casas || 8).replace(/0+$/, '').replace(/\.$/, '').replace('.', ',');
}

function textoQuantidade(n) {
    return textoNumero(Number(n) || 0, 8);
}

// ---------- catálogo de moedas ----------
// tudo que dá pra escolher: as 100 do pacote diário + o que já foi lançado
function catalogoMoedas() {
    var banco = lerBanco();
    var mapa = {};
    Object.keys(banco.moedas).forEach(function (id) { mapa[id] = banco.moedas[id]; });
    mercado.lista.forEach(function (m) {
        mapa[m.id] = { id: m.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo };
    });
    return Object.keys(mapa).map(function (id) { return mapa[id]; })
        .sort(function (a, b) { return a.nome < b.nome ? -1 : 1; });
}

function infoMoeda(id) {
    var banco = lerBanco();
    if (banco.moedas[id]) return banco.moedas[id];
    var m = mercado.porId[id];
    if (m) return { id: m.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo };
    return { id: id, simbolo: String(id).toUpperCase(), nome: id, logo: null };
}

function rotuloMoeda(m) {
    return m.nome + ' (' + m.simbolo + ')';
}

// aceita o id, "Bitcoin (BTC)", só o símbolo ou só o nome
function resolverMoeda(valor) {
    var t = String(valor || '').trim().toLowerCase();
    if (!t) return null;
    var lista = catalogoMoedas();
    var achada = null;
    lista.forEach(function (m) {
        if (achada) return;
        if (m.id.toLowerCase() === t || rotuloMoeda(m).toLowerCase() === t) achada = m;
    });
    if (achada) return achada;
    var porSimbolo = lista.filter(function (m) { return m.simbolo.toLowerCase() === t; });
    if (porSimbolo.length === 1) return porSimbolo[0];
    var porNome = lista.filter(function (m) { return m.nome.toLowerCase() === t; });
    return porNome.length === 1 ? porNome[0] : null;
}

// saldo de hoje (soma das pernas), sem contar o lançamento em edição
function saldoDaMoeda(banco, moedaId, ignorarId) {
    var q = 0;
    banco.transacoes.forEach(function (t) {
        if (ignorarId && t.id === ignorarId) return;
        pernasDaTransacao(t).forEach(function (p) { if (p.moedaId === moedaId) q += p.delta; });
    });
    return q;
}

function moedasComSaldo(banco, ignorarId) {
    var ids = {};
    banco.transacoes.forEach(function (t) {
        pernasDaTransacao(t).forEach(function (p) { ids[p.moedaId] = true; });
    });
    return Object.keys(ids).filter(function (id) { return saldoDaMoeda(banco, id, ignorarId) > QTD_EPSILON; })
        .map(infoMoeda).sort(function (a, b) { return a.nome < b.nome ? -1 : 1; });
}

function carteiraAtual() {
    return processarCarteira(ordenarTransacoes(lerBanco().transacoes));
}

// ---------- validação e gravação ----------
var VERBO_DA_BAIXA = { VENDA: 'vender', SAIDA: 'retirar', CONVERSAO: 'converter' };
var NOME_DA_BAIXA = { VENDA: 'a venda', SAIDA: 'a saída', CONVERSAO: 'a conversão' };

function descreverFuro(furo) {
    var info = infoMoeda(furo.moedaId);
    return (NOME_DA_BAIXA[furo.transacao.tipo] || 'o lançamento') + ' de ' + textoQuantidade(furo.quantidade) + ' ' + info.simbolo +
        ' em ' + formatarDataBR(furo.transacao.data);
}

// d = campos como texto, do jeito que a pessoa digitou. Devolve { erros, dados }.
function validarLancamento(d, editId) {
    var banco = lerBanco();
    var erros = {};
    var dados = { tipo: d.tipo };
    var tipo = d.tipo;

    if (!TIPOS[tipo]) erros.tipo = 'Escolha a operação.';

    var moeda = resolverMoeda(d.moeda);
    if (!String(d.moeda || '').trim()) erros.moeda = 'Este campo é obrigatório.';
    else if (!moeda) erros.moeda = 'Não achei essa moeda. Escolha uma da lista.';
    dados.moeda = moeda;

    var qtd = lerNumero(d.quantidade);
    if (!String(d.quantidade || '').trim()) erros.quantidade = 'Este campo é obrigatório.';
    else if (isNaN(qtd)) erros.quantidade = 'Número inválido.';
    else if (qtd <= 0) erros.quantidade = 'A quantidade precisa ser maior que zero.';
    dados.quantidade = qtd;

    if (!d.data) erros.data = 'Este campo é obrigatório.';
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(d.data)) erros.data = 'Data inválida.';
    else if (d.data > hojeISO()) erros.data = 'A data não pode ser futura.';
    dados.data = d.data;

    dados.precoUnitario = 0;
    dados.taxas = 0;
    if (TIPOS_COM_PRECO[tipo]) {
        var preco = lerNumero(d.preco);
        if (!String(d.preco || '').trim()) erros.preco = 'Este campo é obrigatório.';
        else if (isNaN(preco)) erros.preco = 'Número inválido.';
        else if (preco <= 0) erros.preco = 'O preço precisa ser maior que zero.';
        dados.precoUnitario = preco;

        if (String(d.taxas || '').trim()) {
            var taxas = lerNumero(d.taxas);
            if (isNaN(taxas)) erros.taxas = 'Número inválido.';
            else if (taxas < 0) erros.taxas = 'As taxas não podem ser negativas.';
            else dados.taxas = taxas;
        }
    }

    var destino = null;
    if (tipo === 'CONVERSAO') {
        destino = resolverMoeda(d.destino);
        if (!String(d.destino || '').trim()) erros.destino = 'Este campo é obrigatório.';
        else if (!destino) erros.destino = 'Não achei essa moeda. Escolha uma da lista.';
        else if (moeda && destino.id === moeda.id) erros.destino = 'O destino precisa ser diferente da origem.';
        dados.destino = destino;

        var qd = lerNumero(d.quantidadeDestino);
        if (!String(d.quantidadeDestino || '').trim()) erros.quantidadeDestino = 'Este campo é obrigatório.';
        else if (isNaN(qd)) erros.quantidadeDestino = 'Número inválido.';
        else if (qd <= 0) erros.quantidadeDestino = 'A quantidade precisa ser maior que zero.';
        dados.quantidadeDestino = qd;
    }

    // linha do tempo: só roda com os campos que ela usa já válidos
    var podeSimular = !erros.tipo && !erros.moeda && !erros.quantidade && !erros.data && !erros.destino && !erros.quantidadeDestino;
    if (podeSimular) {
        var original = editId ? banco.transacoes.filter(function (t) { return t.id === editId; })[0] : null;
        var simulada = {
            id: original ? original.id : Number.MAX_SAFE_INTEGER,
            criadoEm: original ? original.criadoEm : Number.MAX_SAFE_INTEGER,
            tipo: tipo, moedaId: moeda.id, quantidade: qtd, data: d.data,
        };
        if (tipo === 'CONVERSAO') {
            simulada.moedaDestinoId = destino.id;
            simulada.quantidadeDestino = dados.quantidadeDestino;
        }
        var furo = verificarCronologia(banco.transacoes, { editId: editId, novo: simulada });
        if (furo) {
            if (furo.ehANova) {
                erros.quantidade = 'Você não pode ' + (VERBO_DA_BAIXA[tipo] || 'tirar') + ' mais do que possui: ' +
                    textoQuantidade(furo.disponivel) + ' ' + moeda.simbolo + ' disponível em ' + formatarDataBR(d.data) + '.' +
                    (tipo === 'VENDA' ? ' O Koin não trabalha com venda a descoberto.' : '');
            } else {
                erros._geral = 'Essa alteração deixaria sem saldo ' + descreverFuro(furo) + ' (haveria só ' +
                    textoQuantidade(furo.disponivel) + ' disponível nessa data). Ajuste ou exclua esse lançamento antes.';
            }
        }
    }
    return { erros: erros, dados: dados };
}

function salvarLancamento(dados, editId) {
    var banco = lerBanco();
    function cadastrar(m) {
        if (!banco.moedas[m.id]) banco.moedas[m.id] = { id: m.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo || null };
    }
    cadastrar(dados.moeda);

    var registro = {
        tipo: dados.tipo,
        moedaId: dados.moeda.id,
        quantidade: dados.quantidade,
        precoUnitario: TIPOS_COM_PRECO[dados.tipo] ? dados.precoUnitario : 0,
        taxas: TIPOS_COM_PRECO[dados.tipo] ? dados.taxas : 0,
        data: dados.data,
    };
    if (dados.tipo === 'CONVERSAO') {
        cadastrar(dados.destino);
        registro.moedaDestinoId = dados.destino.id;
        registro.quantidadeDestino = dados.quantidadeDestino;
    }

    if (editId) {
        var t = banco.transacoes.filter(function (x) { return x.id === editId; })[0];
        delete t.moedaDestinoId;
        delete t.quantidadeDestino;
        Object.assign(t, registro);   // edição preserva id e criadoEm (mesma posição na ordem)
    } else {
        banco.transacoes.push(Object.assign({ id: banco.proximoId++, criadoEm: Date.now() }, registro));
    }
    gravarBanco(banco);
}

// devolve null se excluiu, ou o texto do motivo se recusou
function excluirLancamento(id) {
    var banco = lerBanco();
    var furo = verificarCronologia(banco.transacoes, { excluirId: id });
    if (furo) {
        return 'Não dá pra excluir: ' + descreverFuro(furo) + ' ficaria sem saldo. Exclua ou ajuste esse lançamento primeiro.';
    }
    banco.transacoes = banco.transacoes.filter(function (t) { return t.id !== id; });
    gravarBanco(banco);
    return null;
}

// ---------- gaveta de lançamento ----------
// Sem <form>: o preview do claude.ai bloqueia o envio nativo. Botões com
// data-*, Enter tratado no keydown. Trocar a operação redesenha o corpo,
// levando o que já foi digitado; o que foi sugerido (data-auto) fica pra trás.
var lanc = null;   // { editId, valores, erros } com a gaveta aberta

function campoLancHTML(id, rotulo, controle, ajuda, erro) {
    return '<div class="campo"><label for="' + id + '">' + rotulo + '</label>' + controle +
        (ajuda !== null && ajuda !== undefined ? '<p class="campo-ajuda" id="' + id + '-ajuda">' + ajuda + '</p>' : '') +
        (erro ? '<p class="campo-erro">' + escapar(erro) + '</p>' : '') + '</div>';
}

function campoMoedaHTML(name, id, valor, comoLista, editId) {
    var atual = resolverMoeda(valor);
    if (comoLista) {
        var itens = moedasComSaldo(lerBanco(), editId);
        var tem = false;
        var opcoes = itens.map(function (m) {
            var sel = atual && atual.id === m.id;
            if (sel) tem = true;
            return '<option value="' + escapar(m.id) + '"' + (sel ? ' selected' : '') + '>' + escapar(rotuloMoeda(m)) +
                ' (saldo ' + textoQuantidade(saldoDaMoeda(lerBanco(), m.id, editId)) + ')</option>';
        }).join('');
        if (atual && !tem) opcoes = '<option value="' + escapar(atual.id) + '" selected>' + escapar(rotuloMoeda(atual)) + '</option>' + opcoes;
        if (!itens.length && !atual) {
            return '<select class="entrada" name="' + name + '" id="' + id + '" disabled><option value="">Nenhuma moeda com saldo</option></select>';
        }
        return '<select class="entrada" name="' + name + '" id="' + id + '"><option value=""' + (atual ? '' : ' selected') + '>Selecione a moeda</option>' + opcoes + '</select>';
    }
    var sugestoes = catalogoMoedas().map(function (m) { return '<option value="' + escapar(rotuloMoeda(m)) + '"></option>'; }).join('');
    return '<input class="entrada" type="text" name="' + name + '" id="' + id + '" list="' + id + '-lista" autocomplete="off" ' +
        'placeholder="Ex.: Bitcoin ou BTC" value="' + escapar(atual ? rotuloMoeda(atual) : (valor || '')) + '">' +
        '<datalist id="' + id + '-lista">' + sugestoes + '</datalist>';
}

function infoMoedaTexto(tipo, valor, editId) {
    var m = resolverMoeda(valor);
    if (!m) {
        if (TIPOS_DE_BAIXA[tipo]) return 'Só aparecem as moedas que você tem hoje.';
        return 'Escolha uma das 100 maiores moedas, pelo nome ou símbolo.';
    }
    var banco = lerBanco();
    var saldo = saldoDaMoeda(banco, m.id, editId);
    if (saldo <= QTD_EPSILON) return 'Sem saldo hoje.';
    var p = processarCarteira(ordenarTransacoes(banco.transacoes.filter(function (t) { return t.id !== editId; }))).posicoes[m.id];
    var txt = 'Você tem ' + textoQuantidade(saldo) + ' ' + m.simbolo + ' hoje';
    if (p && p.qtdComCusto > QTD_EPSILON) txt += ', preço médio de compra R$ ' + formatarPreco(p.custoTotal / p.qtdComCusto);
    else txt += ', custo zero';
    return txt + '.';
}

var NOTA_DA_OPERACAO = {
    ENTRADA: 'Entrada soma a quantidade com custo zero: o valor investido e o preço médio de compra não mudam, e o ganho aparece no lucro. Use para mineração, recompensa, airdrop ou presente.',
    SAIDA: 'Saída tira a quantidade junto com o custo proporcional (pelo preço médio), sem receber reais. Use para taxa de rede, envio a terceiros ou perda.',
    CONVERSAO: 'O custo que sai da moeda de origem passa inteiro para o destino. Nenhuma cotação em reais entra na conta, e o total investido não muda.',
    VENDA: 'O lucro realizado é o valor recebido (quantidade x preço, menos taxas) menos o custo da parte vendida, pelo preço médio.',
};

function corpoLancamentoHTML(v, e, editId) {
    var tipo = TIPOS[v.tipo] ? v.tipo : 'COMPRA';
    var baixa = !!TIPOS_DE_BAIXA[tipo];
    var ehConv = tipo === 'CONVERSAO';

    var botoesTipo = TIPOS_ORDEM.map(function (k) {
        return '<button type="button" data-lanc-tipo="' + k + '" aria-pressed="' + (k === tipo) + '">' + TIPOS[k] + '</button>';
    }).join('');

    var html = (e._geral ? '<div class="campo-erro-caixa">' + escapar(e._geral) + '</div>' : '') +
        '<div class="campo"><label>Operação</label><div class="segmentado segmentado-quebra" role="group" aria-label="Operação">' + botoesTipo + '</div>' +
        (e.tipo ? '<p class="campo-erro">' + escapar(e.tipo) + '</p>' : '') + '</div>';

    html += campoLancHTML('l-moeda', ehConv ? 'Moeda de origem' : 'Moeda',
        campoMoedaHTML('moeda', 'l-moeda', v.moeda, baixa, editId),
        escapar(infoMoedaTexto(tipo, v.moeda, editId)), e.moeda);

    html += campoLancHTML('l-quantidade', ehConv ? 'Quantidade que saiu' : 'Quantidade',
        '<input class="entrada" type="text" inputmode="decimal" name="quantidade" id="l-quantidade" autocomplete="off" placeholder="0" value="' + escapar(v.quantidade || '') + '"' + (v._autoQtd ? ' data-auto="1"' : '') + '>',
        null, e.quantidade);

    if (ehConv) {
        html += campoLancHTML('l-destino', 'Moeda de destino', campoMoedaHTML('destino', 'l-destino', v.destino, false, editId),
            'Pode ser uma moeda que você já tem ou uma nova.', e.destino) +
            campoLancHTML('l-quantidade-destino', 'Quantidade recebida',
                '<input class="entrada" type="text" inputmode="decimal" name="quantidadeDestino" id="l-quantidade-destino" autocomplete="off" placeholder="0" value="' + escapar(v.quantidadeDestino || '') + '">',
                'O que de fato chegou, já descontadas as taxas da conversão.', e.quantidadeDestino);
    }

    if (TIPOS_COM_PRECO[tipo]) {
        html += campoLancHTML('l-preco', 'Preço unitário (R$)',
            '<input class="entrada" type="text" inputmode="decimal" name="preco" id="l-preco" autocomplete="off" placeholder="0,00" value="' + escapar(v.preco || '') + '"' + (v._autoPreco ? ' data-auto="1"' : '') + '>',
            escapar(v._infoPreco || 'Em reais, por unidade da moeda.'), e.preco);
    }

    html += campoLancHTML('l-data', 'Data', '<input class="entrada" type="date" name="data" id="l-data" max="' + hojeISO() + '" value="' + escapar(v.data || hojeISO()) + '">', null, e.data);

    if (TIPOS_COM_PRECO[tipo]) {
        html += campoLancHTML('l-taxas', 'Taxas (R$)',
            '<input class="entrada" type="text" inputmode="decimal" name="taxas" id="l-taxas" autocomplete="off" placeholder="0,00" value="' + escapar(v.taxas || '') + '">',
            'Opcional. Taxas da corretora ou da rede, em reais.', e.taxas);
    }

    if (NOTA_DA_OPERACAO[tipo]) html += '<p class="nota-operacao">' + NOTA_DA_OPERACAO[tipo] + '</p>';
    return html;
}

function gavetaHTML() {
    var editId = lanc.editId;
    return '<div class="gaveta-fundo" data-lanc-fechar></div>' +
        '<div class="gaveta" id="gaveta-painel" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo">' +
        '<div class="gaveta-topo"><h2 id="gaveta-titulo">' + (editId ? 'Editar lançamento' : 'Novo lançamento') + '</h2>' +
        '<button type="button" class="botao-icone" data-lanc-fechar aria-label="Fechar">&times;</button></div>' +
        '<div class="gaveta-corpo" id="gaveta-corpo">' + corpoLancamentoHTML(lanc.valores, lanc.erros, editId) + '</div>' +
        '<div class="gaveta-pe"><button type="button" class="botao botao-neutro" data-lanc-fechar>Cancelar</button>' +
        '<button type="button" class="botao botao-marca" data-lanc-salvar>Salvar lançamento</button></div></div>';
}

function lerCamposLancamento() {
    var v = { tipo: lanc && lanc.valores.tipo };
    document.querySelectorAll('#gaveta [name]').forEach(function (el) { v[el.name] = el.value; });
    return v;
}

// abre a gaveta. opcoes: { editId, moedaId, tipo }
function abrirLancamento(opcoes) {
    opcoes = opcoes || {};
    var valores = { tipo: opcoes.tipo || 'COMPRA', data: hojeISO() };
    if (opcoes.editId) {
        var t = lerBanco().transacoes.filter(function (x) { return x.id === opcoes.editId; })[0];
        if (!t) return;
        valores = {
            tipo: t.tipo, moeda: t.moedaId, quantidade: numeroParaCampo(t.quantidade, 8), data: t.data,
            preco: TIPOS_COM_PRECO[t.tipo] ? numeroParaCampo(t.precoUnitario, 10) : '',
            taxas: t.taxas ? numeroParaCampo(t.taxas, 8) : '',
            destino: t.moedaDestinoId || '',
            quantidadeDestino: t.quantidadeDestino ? numeroParaCampo(t.quantidadeDestino, 8) : '',
        };
    } else if (opcoes.moedaId) {
        valores.moeda = opcoes.moedaId;
    }
    lanc = { editId: opcoes.editId || null, valores: valores, erros: {} };

    var raiz = document.getElementById('gaveta');
    raiz.innerHTML = gavetaHTML();
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () {
        raiz.classList.add('aberta');
        var primeiro = raiz.querySelector('input:not([type=hidden]), select');
        if (primeiro) primeiro.focus();
    });
    if (!opcoes.editId) aplicarAutopreenchimento();

    // sem o pacote diário carregado não há lista de moedas: busca e redesenha
    if (!mercado.lista.length) {
        carregarMercado().then(function () {
            if (lanc) redesenharCorpoLancamento(lerCamposLancamento());
        }).catch(function () {});
    }
}

function fecharLancamento() {
    if (!lanc) return;
    lanc = null;
    var raiz = document.getElementById('gaveta');
    raiz.classList.remove('aberta');
    document.body.style.overflow = '';
    setTimeout(function () { if (!lanc) raiz.innerHTML = ''; }, menosMovimento ? 0 : 240);
}

function redesenharCorpoLancamento(valores, erros) {
    if (!lanc) return;
    lanc.valores = valores;
    lanc.erros = erros || {};
    document.getElementById('gaveta-corpo').innerHTML = corpoLancamentoHTML(lanc.valores, lanc.erros, lanc.editId);
}

// Sugestões só em lançamento novo, nunca em edição. Tudo que é sugerido leva
// data-auto; se a pessoa digitar por cima, vira dela e não é mais sobrescrito.
function aplicarAutopreenchimento() {
    if (!lanc || lanc.editId) return;
    var v = lanc.valores;
    var moeda = resolverMoeda(v.moeda);
    var qtd = document.getElementById('l-quantidade');
    var preco = document.getElementById('l-preco');
    var infoPreco = document.getElementById('l-preco-ajuda');

    // desfaz só o que foi sugerido pela moeda anterior
    [qtd, preco].forEach(function (el) {
        if (el && el.dataset.auto === '1') { el.value = ''; delete el.dataset.auto; }
    });
    if (preco && preco.value === '' && infoPreco) infoPreco.textContent = 'Em reais, por unidade da moeda.';
    if (!moeda) return;

    if (TIPOS_DE_BAIXA[v.tipo] && qtd && qtd.value === '') {
        var saldo = saldoDaMoeda(lerBanco(), moeda.id, null);
        if (saldo > QTD_EPSILON) { qtd.value = numeroParaCampo(saldo, 8); qtd.dataset.auto = '1'; }
    }
    if (preco && preco.value === '') {
        var m = mercado.porId[moeda.id];
        if (m && m.preco > 0) {
            preco.value = numeroParaCampo(m.preco, 10);
            preco.dataset.auto = '1';
            if (infoPreco) infoPreco.textContent = 'Sugerido pelo preço atual. Confira antes de salvar.';
        }
    }
}

function moedaMudou() {
    if (!lanc) return;
    var campo = document.getElementById('l-moeda');
    lanc.valores.moeda = campo ? campo.value : '';
    var info = document.getElementById('l-moeda-ajuda');
    if (info) info.textContent = infoMoedaTexto(lanc.valores.tipo, lanc.valores.moeda, lanc.editId);
    aplicarAutopreenchimento();
}

function salvarPelaGaveta() {
    if (!lanc) return;
    var campos = lerCamposLancamento();
    var r = validarLancamento(campos, lanc.editId);
    if (Object.keys(r.erros).length) {
        redesenharCorpoLancamento(campos, r.erros);
        var primeiro = document.querySelector('#gaveta .campo-erro');
        if (primeiro) primeiro.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
    }
    salvarLancamento(r.dados, lanc.editId);
    var edicao = !!lanc.editId;
    fecharLancamento();
    avisar(edicao ? 'Lançamento salvo.' : 'Lançamento registrado.', 'sucesso');
    desenhar();
}

document.addEventListener('click', function (ev) {
    var novo = ev.target.closest('[data-lanc-novo]');
    if (novo) { abrirLancamento({ moedaId: novo.getAttribute('data-moeda') || null }); return; }

    var ed = ev.target.closest('[data-lanc-editar]');
    if (ed) { abrirLancamento({ editId: Number(ed.getAttribute('data-lanc-editar')) }); return; }

    var ex = ev.target.closest('[data-lanc-excluir]');
    if (ex) {
        if (!window.confirm('Excluir este lançamento?')) return;
        var motivo = excluirLancamento(Number(ex.getAttribute('data-lanc-excluir')));
        if (motivo) { avisar(motivo, 'erro'); return; }
        avisar('Lançamento excluído.', 'sucesso');
        desenhar();
        return;
    }

    if (!lanc) return;
    if (ev.target.closest('[data-lanc-fechar]')) { fecharLancamento(); return; }
    if (ev.target.closest('[data-lanc-salvar]')) { salvarPelaGaveta(); return; }
    var tipo = ev.target.closest('[data-lanc-tipo]');
    if (tipo) {
        var campos = lerCamposLancamento();
        campos.tipo = tipo.getAttribute('data-lanc-tipo');
        // o campo da moeda muda de lista para texto: leva a moeda já resolvida
        var m = resolverMoeda(campos.moeda);
        if (m) campos.moeda = m.id;
        // sugestões da operação anterior não seguem
        ['quantidade', 'preco'].forEach(function (n) {
            var el = document.querySelector('#gaveta [name=' + n + ']');
            if (el && el.dataset.auto === '1') campos[n] = '';
        });
        redesenharCorpoLancamento(campos);
        aplicarAutopreenchimento();
    }
});

document.addEventListener('change', function (ev) {
    if (lanc && ev.target.id === 'l-moeda') moedaMudou();
});

document.addEventListener('input', function (ev) {
    if (!lanc) return;
    if (ev.target.id === 'l-moeda' && ev.target.tagName === 'INPUT') { moedaMudou(); return; }
    // a pessoa digitou por cima de um valor sugerido: agora o campo é dela
    if (ev.target.dataset && ev.target.dataset.auto === '1') {
        delete ev.target.dataset.auto;
        if (ev.target.id === 'l-preco') {
            var info = document.getElementById('l-preco-ajuda');
            if (info) info.textContent = 'Em reais, por unidade da moeda.';
        }
    }
});

document.addEventListener('keydown', function (ev) {
    if (!lanc) return;
    if (ev.key === 'Escape') { fecharLancamento(); return; }
    if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('#gaveta') && ev.target.tagName === 'INPUT') {
        ev.preventDefault();
        salvarPelaGaveta();
    }
});

// ---------- página Lançamentos ----------
function moedaCelulaHTML(id) {
    var m = infoMoeda(id);
    return '<a role="link" tabindex="0" class="celula-moeda" data-rota="/moeda/' + escapar(id) + '">' + logoHTML(m) +
        '<div><strong>' + escapar(m.nome) + '</strong> <span>' + escapar(m.simbolo) + '</span></div></a>';
}

function etiquetaTipoHTML(tipo) {
    return '<span class="etiqueta-tipo t-' + tipo.toLowerCase() + '">' + TIPOS[tipo] + '</span>';
}

// valor total do lançamento em reais, ou null quando não se aplica
function valorTotalDoLancamento(t) {
    if (t.tipo === 'COMPRA') return t.quantidade * t.precoUnitario + (t.taxas || 0);
    if (t.tipo === 'VENDA') return t.quantidade * t.precoUnitario - (t.taxas || 0);
    return null;
}

function linhaLancamentoHTML(t, realizado) {
    var qtd = textoQuantidade(t.quantidade);
    var moedaCel = moedaCelulaHTML(t.moedaId);
    if (t.tipo === 'CONVERSAO') {
        qtd += ' <span class="seta-conv">&rarr;</span> ' + textoQuantidade(t.quantidadeDestino);
        moedaCel += ' <span class="seta-conv">&rarr;</span> ' + moedaCelulaHTML(t.moedaDestinoId);
    }
    var total = valorTotalDoLancamento(t);
    var totalCel = total !== null ? '<span data-brl="' + total + '"></span>' : (t.tipo === 'ENTRADA' ? '<span class="sem-dado">custo zero</span>' : '<span class="sem-dado">—</span>');
    var precoCel = TIPOS_COM_PRECO[t.tipo] ? '<span data-brl="' + t.precoUnitario + '" data-tipo="preco"></span>' : '<span class="sem-dado">—</span>';
    var taxasCel = TIPOS_COM_PRECO[t.tipo] && t.taxas ? '<span data-brl="' + t.taxas + '"></span>' : '<span class="sem-dado">—</span>';
    var real = realizado[t.id];
    var realCel = real === undefined ? '<span class="sem-dado">—</span>' :
        '<span class="var ' + (real >= 0 ? 'alta' : 'queda') + '" data-brl="' + real + '"></span>';

    return '<tr><td>' + formatarDataBR(t.data) + '</td><td>' + etiquetaTipoHTML(t.tipo) + '</td>' +
        '<td class="col-moeda-lanc">' + moedaCel + '</td><td>' + qtd + '</td><td>' + precoCel + '</td><td>' + taxasCel + '</td>' +
        '<td>' + totalCel + '</td><td>' + realCel + '</td>' +
        '<td class="col-acoes"><button type="button" class="botao botao-fantasma botao-pequeno" data-lanc-editar="' + t.id + '">Editar</button>' +
        '<button type="button" class="botao botao-fantasma botao-pequeno" data-lanc-excluir="' + t.id + '">Excluir</button></td></tr>';
}

function paginaLancamentos() {
    var banco = lerBanco();
    var carteira = processarCarteira(ordenarTransacoes(banco.transacoes));
    var lista = ordenarTransacoes(banco.transacoes).reverse();   // mais recente primeiro
    var realizadoTotal = Object.keys(carteira.realizado).reduce(function (s, k) { return s + carteira.realizado[k]; }, 0);
    var temVenda = Object.keys(carteira.realizado).length > 0;

    var corpo;
    if (lista.length) {
        corpo = '<div class="painel painel-tabela"><table class="tabela tabela-lanc"><thead><tr>' +
            '<th>Data</th><th>Operação</th><th>Moeda</th><th>Quantidade</th><th>Preço</th><th>Taxas</th><th>Valor total</th><th>Lucro realizado</th><th></th>' +
            '</tr></thead><tbody>' + lista.map(function (t) { return linhaLancamentoHTML(t, carteira.realizado); }).join('') + '</tbody></table></div>';
    } else {
        corpo = '<div class="painel"><p class="painel-titulo">Nenhum lançamento ainda</p>' +
            '<p class="painel-sub">Registre a sua primeira compra, entrada ou conversão. Ela passa a valer no preço médio e no lucro da moeda.</p>' +
            '<button type="button" class="botao botao-marca" data-lanc-novo>' + icone('mais') + 'Novo lançamento</button></div>';
    }

    return '<div class="pagina">' +
        '<div class="pagina-cabecalho"><div><h1>Lançamentos</h1>' +
        '<p>Compras, vendas, entradas, saídas e conversões. Cada lançamento é conferido na linha do tempo: nenhuma baixa pode ficar sem saldo.</p></div>' +
        '<button type="button" class="botao botao-marca" data-lanc-novo>' + icone('mais') + 'Novo lançamento</button></div>' +
        (lista.length ? '<div class="grade-2 lanc-resumo"><div class="cartao"><p class="indicador-rotulo">Lançamentos</p><p class="indicador-valor">' + lista.length + '</p></div>' +
            '<div class="cartao"><p class="indicador-rotulo">Lucro realizado</p><p class="indicador-valor">' +
            (temVenda ? '<span class="var ' + (realizadoTotal >= 0 ? 'alta' : 'queda') + '" data-brl="' + realizadoTotal + '"></span>' : '<span class="sem-dado sem-dado-legenda">sem vendas ainda</span>') +
            '</p></div></div>' : '') +
        corpo + '</div>';
}

// ---------- moeda: sua posição e seus lançamentos ----------
function posicaoDaMoeda(id) {
    var p = carteiraAtual().posicoes[id];
    return p && p.quantidade > QTD_EPSILON ? p : null;
}

function posicaoMoedaHTML(m) {
    var p = posicaoDaMoeda(m.id);
    var carteira = carteiraAtual();
    var realizado = 0, temVenda = false;
    lerBanco().transacoes.forEach(function (t) {

// [EVOLUCAO:início] função pura, testada em Node.
// EVOLUÇÃO REAL DO PATRIMÔNIO: reconstruída dia a dia, do 1º lançamento até
// hoje. Em cada dia vale (quantidade que se tinha naquele dia) x (preço
// daquele dia), somando as moedas. Não é o custo acumulado (o custo vem
// junto, como segunda linha, pra comparar).
//   precos[moedaId]['AAAA-MM-DD'] = fechamento do dia, em reais
// Preço que falta num dia repete o último conhecido. Moeda sem nenhum preço
// (sem par na Binance, ou antes de listar) entra pelo CUSTO, e é devolvida em
// `aCusto` pra tela avisar.
function diasEntre(deISO, ateISO) {
    var dias = [];
    var d = new Date(deISO + 'T00:00:00Z');
    var fim = new Date(ateISO + 'T00:00:00Z');
    while (d <= fim) {
        dias.push(d.toISOString().slice(0, 10));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    return dias;
}

function reconstruirEvolucao(transacoes, precos, hojeISO) {
    var ordenadas = ordenarTransacoes(transacoes);
    if (!ordenadas.length) return { pontos: [], aCusto: [] };

    var ultimo = {};        // último preço conhecido por moeda
    var aCusto = {};
    var aplicadas = [];
    var proxima = 0;
    var posicoes = {};
    var pontos = [];

    diasEntre(ordenadas[0].data, hojeISO).forEach(function (dia) {
        var mudou = false;
        while (proxima < ordenadas.length && ordenadas[proxima].data <= dia) {
            aplicadas.push(ordenadas[proxima++]);
            mudou = true;
        }
        if (mudou) posicoes = processarCarteira(aplicadas).posicoes;

        Object.keys(precos).forEach(function (id) {
            var v = precos[id][dia];
            if (v !== undefined && v !== null) ultimo[id] = v;
        });

        var valor = 0, custo = 0;
        Object.keys(posicoes).forEach(function (id) {
            var p = posicoes[id];
            if (p.quantidade <= QTD_EPSILON) return;
            custo += p.custoTotal;
            if (ultimo[id] !== undefined) {
                valor += p.quantidade * ultimo[id];
            } else {
                valor += p.custoTotal;
                aCusto[id] = true;
            }
        });
        pontos.push({ time: dia, valor: valor, custo: custo });
    });

    return { pontos: pontos, aCusto: Object.keys(aCusto) };
}
