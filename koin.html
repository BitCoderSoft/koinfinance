<!DOCTYPE html>
<!--
  Koin · gestor de portfólio cripto (nome provisório)
  BitCoderSoft · single-file (HTML + CSS + JS), sem etapa de build

  ==================================================================
  GUIA DE MANUTENÇÃO
  ==================================================================
  Toda mudança leva uma tag no comentário do código ([ETAPA 0], [ETAPA 1]...).
  Busque pela tag pra achar tudo o que uma etapa mexeu.

  Plano (combinado em 29/09/2026):
    0. Fundação      design system, casca, roteador, estado, armazenamento
                     (0.1: navegação no topo com menus suspensos, sem lateral)
    1. Mercado       tabela de moedas, busca, favoritos, preços ao vivo
    2. Moeda         página de detalhe com gráfico interativo
    3. Motor         compra, venda, entrada, saída, conversão + validação
    4. Portfólio     resumo, evolução real, alocação, tabela
    5. Responsivo    celular: menu sanduíche, listas e cartões, telas de app
    6. Identificação perfis por dispositivo, PIN local (Etapa 6.1: email real)
    7. Extras        balanceamento, objetivos, alertas, backup
    8. PWA           manifest, service worker, instalação

  Ordem alterada em 29/09/2026: o responsivo foi adiantado e passou a ser a
  Etapa 5; os extras desceram para a 7 após inserção da Etapa 6 (identificação)
  em 29/09/2026. Etapa adiantada = renumerar em ordem.

  Decisões de base:
    - Tema ESCURO primeiro. O claro já tem os tokens mapeados (comentados
      em :root[data-tema="claro"]), ativa numa etapa futura.
    - Moeda de exibição: Real (padrão), Dólar ou Bitcoin. Todo valor do
      app é guardado e calculado em REAIS; a conversão acontece só na hora
      de mostrar (ver formatarMoeda e o atributo data-brl).
    - Identificação por perfil + PIN (Etapa 6): múltiplos perfis por
      dispositivo, dados separados. Backup em arquivo (Etapa 7).
    - Herança do Dash Finance: armazenamento com fallback pro preview do
      claude.ai, navegação sem href, formulários sem submit nativo,
      formatação pt-BR. Tudo reaproveitado e marcado como [HERANÇA].

  [ETAPA 0 · 29/09/2026] fundação entregue.
  [ETAPA 1 · 29/09/2026] mercado: CoinGecko (100 maiores, 5 min de cache,
                          chave opcional) + Binance WebSocket ao vivo,
                          destaques, abas, ordenação, favoritos, busca.
  [ETAPA 1.1 · 29/09/2026] CoinGecko exige chave (403 sem ela): chave Demo
                          embutida + regra de no máximo 1 chamada por dia.
  [ETAPA 1.2 · 29/09/2026] largura máxima 1240 -> 1400px e colunas fixas na
                          tabela do Mercado (sem rolagem, nome perto do preço).
  [ETAPA 2 · 29/09/2026] página da moeda: gráfico interativo (Lightweight
                          Charts), estatísticas, conversor e regra de 5s
                          na troca do preço nos painéis.
  [ETAPA 2.1 · 29/09/2026] Ajustes sem campo de chave da CoinGecko (só a embutida).
  [ETAPA 3 · 29/09/2026] motor de custo (portado do Dash Finance, só cripto),
                          lançamentos (compra, venda, entrada, saída, conversão),
                          lucro realizado, posição na página da moeda.
  [ETAPA 4 · 29/09/2026] portfólio: saldo, lucros, evolução real do patrimônio,
                          alocação em rosca e tabela. Lançamentos vira submenu.
  [ETAPA 5 · 29/09/2026] responsivo para celular (adiantado): menu sanduíche,
                          Mercado enxuto em linhas, tabelas em lista e cartões,
                          gaveta em tela cheia. Vale abaixo de 768px.
  [ETAPA 4.1 / 5.1 · 29/09/2026] ajustes do relatório de testes no celular: topo fixo,
                          bolinhas nos destaques, gráficos menores no celular,
                          escala do portfólio, sinal negativo, rosca com 1 moeda etc.
  [ETAPA 6 · 29/09/2026] identificação: múltiplos perfis, PIN criptografado com
                          e-mail (AES-GCM, SubtleCrypto), sessão por aba.
-->
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D111C">
<title>Koin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

<style>
/* =================================================================
   TOKENS  [ETAPA 0]
   Tinta azul em vez de preto puro, latão como cor da marca (moeda é
   metal), verde e vermelho só pra alta e queda.
   ================================================================= */
:root {
    --bg: #0D111C;
    --superficie: #131A29;
    --superficie-2: #1A2334;
    --superficie-3: #212C41;
    --borda: #232E44;
    --borda-forte: #2F3C57;

    --texto: #E7ECF5;
    --texto-2: #A3AEC4;
    --texto-3: #6B7791;

    --marca: #E9B949;
    --marca-escura: #B98A24;
    --marca-tinta: #1F1706;
    --marca-suave: rgba(233, 185, 73, 0.12);

    --alta: #22C38E;
    --alta-suave: rgba(34, 195, 142, 0.13);
    --queda: #F2555A;
    --queda-suave: rgba(242, 85, 90, 0.13);
    --info: #6E9BF5;

    --fonte: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --fonte-marca: 'Unbounded', 'Manrope', system-ui, sans-serif;

    /* escala tipográfica (razão ~1,2) */
    --t-xs: 12px;
    --t-sm: 13px;
    --t-md: 15px;
    --t-lg: 18px;
    --t-xl: 22px;
    --t-2xl: 28px;
    --t-3xl: 40px;

    /* raios por hierarquia: controle pequeno, cartão médio, painel grande */
    --r-controle: 8px;
    --r-cartao: 14px;
    --r-painel: 18px;

    --topo: 64px;
    --topo-total: calc(var(--topo) + 1px + env(safe-area-inset-top, 0px));

    --sombra-flutuante: 0 18px 40px rgba(3, 6, 14, 0.55);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* Tema claro: mapeado, AINDA NÃO LIGADO (sem seletor no app).
   Quando entrar, é só descomentar e oferecer o botão em Ajustes.
:root[data-tema="claro"] {
    --bg: #F4F6FA;
    --superficie: #FFFFFF;
    --superficie-2: #F1F4F9;
    --superficie-3: #E7ECF4;
    --borda: #E1E6EF;
    --borda-forte: #CBD3E1;
    --texto: #111827;
    --texto-2: #4B5568;
    --texto-3: #7C879B;
    --marca: #B98A24;
    --marca-tinta: #FFFFFF;
    --alta: #0E9F6E;
    --queda: #DC3B42;
}
*/

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--texto);
    font-family: var(--fonte);
    font-size: var(--t-md);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "lnum" 1;   /* números com largura fixa: preço não dança */
}

h1, h2, h3, h4, p {
    margin: 0;
}

button {
    font-family: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}

a[data-rota] {
    cursor: pointer;
}

:focus-visible {
    outline: 2px solid var(--marca);
    outline-offset: 2px;
}

::selection {
    background: var(--marca-suave);
}


/* =================================================================
   CASCA: navegação no topo  [ETAPA 0.1 · 29/09/2026]
   Pedido do Junior: nada de barra lateral (virou assinatura visual de
   projeto feito com IA). A navegação fica numa barra horizontal, como no
   CoinMarketCap; o que for agrupado abre um menu suspenso com seções e
   uma linha de descrição por item. Crescer = novo grupo, não nova coluna.
   ================================================================= */
.casca {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-top: var(--topo-total);
}

/* [ETAPA 5.1] topo FIXO em todas as telas: nada de sticky, que para de funcionar
   quando algum ancestral tem overflow. O conteúdo desce a altura do topo
   (--topo-total, já com a borda e o notch do celular). */
.topo {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 30;
    background: rgba(13, 17, 28, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borda);
}

/* mesma largura e alinhamento do conteúdo das páginas */
.topo-interno {
    max-width: 1400px;
    margin: 0 auto;
    height: var(--topo);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 28px;
}

.marca {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

/* a moeda da marca: disco de latão com o recorte do K */
.marca-moeda {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
}

.marca-nome {
    font-family: var(--fonte-marca);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.02em;
}

.nav {
    display: flex;
    align-items: stretch;
    align-self: stretch;
    gap: 4px;
}

.nav-link,
.nav-grupo-botao {
    appearance: none;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    color: var(--texto-2);
    font-size: var(--t-sm);
    font-weight: 700;
    cursor: pointer;
    position: relative;
    transition: color 120ms ease;
}

.nav-link:hover,
.nav-grupo-botao:hover,
.nav-grupo.aberto .nav-grupo-botao {
    color: var(--texto);
}

/* item ativo: fio de latão colado na borda de baixo do topo */
.nav-link.ativo,
.nav-grupo-botao.ativo {
    color: var(--texto);
}

.nav-link.ativo::after,
.nav-grupo-botao.ativo::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: var(--marca);
}

.nav-grupo-botao .chevron {
    width: 14px;
    height: 14px;
    transition: transform 160ms ease;
}

.nav-grupo.aberto .chevron {
    transform: rotate(180deg);
}

.nav-grupo {
    position: relative;
    display: flex;
}

/* menu suspenso (estilo CoinMarketCap: seções com título e itens com
   ícone em círculo + nome + uma linha dizendo o que tem ali) */
.menu-suspenso {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 300px;
    padding: 10px;
    background: var(--superficie-2);
    border: 1px solid var(--borda-forte);
    border-radius: var(--r-cartao);
    box-shadow: var(--sombra-flutuante);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity 140ms ease, transform 140ms ease, visibility 140ms;
}

.menu-suspenso.direita {
    left: auto;
    right: 0;
}

.nav-grupo.aberto .menu-suspenso {
    opacity: 1;
    visibility: visible;
    transform: none;
}

.menu-secao + .menu-secao {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--borda);
}

.menu-secao-titulo {
    font-size: var(--t-xs);
    color: var(--texto-3);
    padding: 6px 10px 4px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 10px;
    transition: background-color 120ms ease;
}

.menu-item:hover,
.menu-item:focus-visible {
    background: var(--superficie-3);
}

.menu-item-icone {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--marca-suave);
    color: var(--marca);
}

.menu-item-icone svg {
    width: 17px;
    height: 17px;
}

.menu-item-texto strong {
    display: block;
    font-size: var(--t-sm);
    font-weight: 700;
    color: var(--texto);
}

.menu-item-texto span {
    display: block;
    font-size: var(--t-xs);
    color: var(--texto-2);
    line-height: 1.4;
}

.menu-item.ativo .menu-item-icone {
    background: var(--marca);
    color: var(--marca-tinta);
}

.topo-direita {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

/* botão redondo do menu de conta (engrenagem) */
.botao-icone {
    appearance: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: var(--superficie);
    color: var(--texto-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease;
}

.botao-icone:hover,
.nav-grupo.aberto .botao-icone,
.botao-icone.ativo {
    color: var(--texto);
    border-color: var(--borda-forte);
}

.botao-icone svg {
    width: 18px;
    height: 18px;
}

main#miolo {
    flex: 1;
}

/* rodapé: versão, autoria e o aviso de privacidade */
.rodape {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 28px 28px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-top: 1px solid var(--borda);
    font-size: var(--t-xs);
    color: var(--texto-3);
}

.rodape strong {
    color: var(--texto-2);
    font-weight: 600;
}

/* pulso do mercado: BTC ao vivo no topo */
.pulso {
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--borda);
    border-radius: 999px;
    font-size: var(--t-sm);
    color: var(--texto-2);
}

.pulso[hidden] {
    display: none;
}

.pulso-ponto {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--alta);
    box-shadow: 0 0 0 0 var(--alta-suave);
    animation: pulsar 2.4s ease-out infinite;
}

@keyframes pulsar {
    0%   { box-shadow: 0 0 0 0 rgba(34, 195, 142, 0.45); }
    70%  { box-shadow: 0 0 0 7px rgba(34, 195, 142, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 195, 142, 0); }
}

.pulso strong {
    color: var(--texto);
    font-weight: 700;
}


/* ---------- seletor segmentado (moeda de exibição, abas) ---------- */
.segmentado {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
}

.segmentado button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--texto-2);
    font-size: var(--t-sm);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease;
}

.segmentado button:hover {
    color: var(--texto);
}

.segmentado button[aria-pressed="true"] {
    background: var(--superficie-3);
    color: var(--texto);
}

.segmentado button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}


/* ---------- página ---------- */
.pagina {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 28px 48px;
}

.pagina-cabecalho {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.pagina-cabecalho h1 {
    font-size: var(--t-2xl);
    font-weight: 800;
    letter-spacing: -0.02em;
}

.pagina-cabecalho p {
    color: var(--texto-2);
    margin-top: 4px;
    max-width: 62ch;
}


/* =================================================================
   COMPONENTES
   ================================================================= */
.painel {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: var(--r-painel);
    padding: 22px 24px;
}

.pagina > .painel + .painel {
    margin-top: 16px;
}

.painel-titulo {
    font-size: var(--t-md);
    font-weight: 700;
    margin-bottom: 4px;
}

.painel-sub {
    font-size: var(--t-sm);
    color: var(--texto-2);
    margin-bottom: 16px;
}

.cartao {
    background: var(--superficie-2);
    border-radius: var(--r-cartao);
    padding: 16px 18px;
}

/* botões */
.botao {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    border-radius: var(--r-controle);
    border: 1px solid transparent;
    font-size: var(--t-sm);
    font-weight: 700;
    cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease, transform 80ms ease;
}

.botao:active {
    transform: translateY(1px);
}

.botao-marca {
    background: var(--marca);
    color: var(--marca-tinta);
}

.botao-marca:hover {
    background: #F2C861;
}

.botao-neutro {
    background: var(--superficie-2);
    border-color: var(--borda-forte);
    color: var(--texto);
}

.botao-neutro:hover {
    background: var(--superficie-3);
}

.botao-fantasma {
    background: transparent;
    color: var(--texto-2);
}

.botao-fantasma:hover {
    color: var(--texto);
    background: var(--superficie);
}

.botao svg {
    width: 16px;
    height: 16px;
}

/* variação (alta/queda) */
.var {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-weight: 700;
    font-size: var(--t-sm);
}

.var.alta { color: var(--alta); }
.var.queda { color: var(--queda); }
.var.neutra { color: var(--texto-3); }

.var-pilula {
    padding: 3px 8px;
    border-radius: 6px;
}

.var-pilula.alta { background: var(--alta-suave); }
.var-pilula.queda { background: var(--queda-suave); }

.var svg {
    width: 10px;
    height: 10px;
}

/* campos */
.campo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.campo label {
    font-size: var(--t-sm);
    font-weight: 600;
    color: var(--texto-2);
}

.entrada {
    height: 42px;
    padding: 0 14px;
    background: var(--bg);
    border: 1px solid var(--borda-forte);
    border-radius: var(--r-controle);
    color: var(--texto);
    font-family: inherit;
    font-size: var(--t-md);
    transition: border-color 120ms ease, box-shadow 120ms ease;
}

.entrada::placeholder {
    color: var(--texto-3);
}

.entrada:focus {
    outline: none;
    border-color: var(--marca);
    box-shadow: 0 0 0 3px var(--marca-suave);
}

.busca {
    position: relative;
}

.busca svg {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    color: var(--texto-3);
    pointer-events: none;
}

.busca .entrada {
    padding-left: 38px;
    width: 240px;
    height: 38px;
    background: var(--superficie);
}

/* ícone de moeda (logo real chega na Etapa 1; por ora, iniciais) */
.moeda-icone {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--bg);
    flex-shrink: 0;
}

/* tabela de mercado */
.tabela {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--t-sm);
}

.tabela th {
    text-align: right;
    font-size: var(--t-xs);
    font-weight: 600;
    color: var(--texto-3);
    padding: 10px 14px;
    border-bottom: 1px solid var(--borda);
    white-space: nowrap;
}

.tabela td {
    text-align: right;
    padding: 14px;
    border-bottom: 1px solid var(--borda);
    white-space: nowrap;
}

.tabela th:first-child,
.tabela td:first-child,
.tabela th:nth-child(2),
.tabela td:nth-child(2) {
    text-align: left;
}

.tabela tbody tr {
    transition: background-color 120ms ease;
}

.tabela tbody tr:hover {
    background: var(--superficie-2);
}

.tabela tbody tr:last-child td {
    border-bottom: none;
}

.celula-moeda {
    display: flex;
    align-items: center;
    gap: 10px;
}

.celula-moeda strong {
    font-weight: 700;
}

.celula-moeda span {
    color: var(--texto-3);
    font-size: var(--t-xs);
}

.rank {
    color: var(--texto-3);
    width: 32px;
}

/* PISCA DE PREÇO (estilo Binance): o fundo acende e apaga */
.pisca-alta {
    animation: piscaAlta 900ms var(--ease);
}

.pisca-queda {
    animation: piscaQueda 900ms var(--ease);
}

@keyframes piscaAlta {
    0%   { background-color: rgba(34, 195, 142, 0.28); color: var(--alta); }
    100% { background-color: transparent; }
}

@keyframes piscaQueda {
    0%   { background-color: rgba(242, 85, 90, 0.28); color: var(--queda); }
    100% { background-color: transparent; }
}

.preco-vivo {
    border-radius: 5px;
    padding: 2px 6px;
    margin: -2px -6px;
}

/* esqueleto de carregamento */
.esqueleto {
    display: block;
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--superficie-2) 0%, var(--superficie-3) 45%, var(--superficie-2) 90%);
    background-size: 220% 100%;
    animation: brilho 1.4s linear infinite;
}

@keyframes brilho {
    from { background-position: 120% 0; }
    to   { background-position: -120% 0; }
}

/* saldo em destaque: o único lugar com a fonte da marca */
.saldo {
    font-family: var(--fonte-marca);
    font-weight: 500;
    font-size: var(--t-3xl);
    letter-spacing: -0.03em;
    line-height: 1.1;
}

.saldo-rotulo {
    color: var(--texto-2);
    font-size: var(--t-sm);
    margin-bottom: 8px;
}

/* aviso de etapa futura */
.em-breve {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border: 1px dashed var(--borda-forte);
    border-radius: var(--r-cartao);
    color: var(--texto-2);
    font-size: var(--t-sm);
}

.em-breve strong {
    color: var(--texto);
}

.em-breve svg {
    width: 22px;
    height: 22px;
    color: var(--marca);
    flex-shrink: 0;
}

/* grade de cartões de indicador */
.grade-4 {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

.grade-2 {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}

.indicador-rotulo {
    font-size: var(--t-xs);
    color: var(--texto-2);
}

.indicador-valor {
    font-size: var(--t-lg);
    font-weight: 700;
    margin-top: 6px;
}

/* avisos rápidos (toast) */
.avisos {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 200;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
}

.aviso {
    pointer-events: auto;
    min-width: 260px;
    max-width: 380px;
    padding: 12px 16px;
    border-radius: var(--r-cartao);
    background: var(--superficie-3);
    border: 1px solid var(--borda-forte);
    box-shadow: var(--sombra-flutuante);
    font-size: var(--t-sm);
    animation: avisoEntra 260ms var(--ease);
}

.aviso.sucesso { border-left: 3px solid var(--alta); }
.aviso.erro { border-left: 3px solid var(--queda); }

@keyframes avisoEntra {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
}


/* ---------- página "Sistema" (vitrine do design) ---------- */
.amostras-cor {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
}

.amostra {
    border-radius: var(--r-cartao);
    border: 1px solid var(--borda);
    overflow: hidden;
    font-size: var(--t-xs);
}

.amostra-cor {
    height: 64px;
}

.amostra-info {
    padding: 8px 10px;
    background: var(--superficie);
    color: var(--texto-2);
}

.amostra-info strong {
    display: block;
    color: var(--texto);
    font-size: var(--t-sm);
}

.escala-tipo p + p {
    margin-top: 10px;
}

.linha-botoes {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
}


/* =================================================================
   MERCADO  [ETAPA 1]
   ================================================================= */
.conexao {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: var(--t-sm);
    color: var(--texto-2);
    white-space: nowrap;
}

.conexao-ponto {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--texto-3);
}

.conexao[data-estado="ao-vivo"] .conexao-ponto {
    background: var(--alta);
    animation: pulsar 2.4s ease-out infinite;
}

.conexao[data-estado="conectando"] .conexao-ponto {
    background: var(--marca);
    opacity: 0.8;
}

.voltar {
    display: inline-block;
    margin-bottom: 14px;
    font-size: var(--t-sm);
    font-weight: 600;
    color: var(--texto-2);
}

.voltar:hover { color: var(--texto); }

/* faixa de destaques */
.destaques {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 22px;
}

.destaque {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: var(--r-cartao);
    padding: 16px 16px 10px;
    min-height: 158px;
}

.destaque-titulo {
    font-size: var(--t-sm);
    font-weight: 700;
    margin-bottom: 8px;
}

.destaque-linha {
    display: grid;
    grid-template-columns: 24px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 10px;
    padding: 7px 6px;
    margin: 0 -6px;
    border-radius: 8px;
    font-size: var(--t-sm);
}

.destaque-linha:hover {
    background: var(--superficie-2);
}

.destaque-linha .moeda-logo,
.destaque-linha .moeda-icone {
    width: 22px;
    height: 22px;
    font-size: 8px;
}

.destaque-nome { font-weight: 700; }
.destaque-preco { color: var(--texto-2); }

.destaque-numeros {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 4px;
}

.destaque-numeros div {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: var(--t-sm);
}

.destaque-numeros span { color: var(--texto-2); }
.destaque-numeros strong { font-weight: 700; }

.destaque-aviso {
    font-size: var(--t-sm);
    color: var(--texto-2);
    line-height: 1.55;
}

/* barra acima da tabela: abas e origem dos dados */
.barra-tabela {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

.barra-info {
    font-size: var(--t-xs);
    color: var(--texto-3);
}

.painel-tabela {
    padding: 6px 8px;
    overflow-x: auto;
}

.tabela-mercado th:nth-child(3),
.tabela-mercado td:nth-child(3) {
    text-align: left;
}

.tabela-mercado td {
    padding: 12px 14px;
}

/* [ETAPA 1.2] larguras fixas por coluna: a coluna da moeda fica só com a
   sobra, então o nome não fica longe do preço, e o minigráfico cabe sem
   rolagem. Abaixo de 1080px a tabela rola na horizontal. */
.tabela-mercado {
    table-layout: fixed;
    min-width: 1080px;
}

.tabela-mercado th:nth-child(1) { width: 44px; }
.tabela-mercado th:nth-child(2) { width: 48px; }
.tabela-mercado th:nth-child(4) { width: 150px; }
.tabela-mercado th:nth-child(5) { width: 100px; }
.tabela-mercado th:nth-child(6) { width: 100px; }
.tabela-mercado th:nth-child(7) { width: 100px; }
.tabela-mercado th:nth-child(8) { width: 150px; }
.tabela-mercado th:nth-child(9) { width: 160px; }
.tabela-mercado th:nth-child(10) { width: 150px; }

.tabela-mercado .col-fav {
    width: 36px;
    padding-left: 10px;
    padding-right: 0;
}

.tabela-mercado .rank {
    width: 40px;
}

.celula-moeda {
    cursor: pointer;
}

.celula-moeda:hover strong {
    color: var(--marca);
}

.moeda-logo {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    background: var(--superficie-3);
}

.sem-dado {
    color: var(--texto-3);
}

/* estrela de favorito */
.estrela {
    appearance: none;
    background: none;
    border: none;
    padding: 4px;
    cursor: pointer;
    display: flex;
    color: var(--texto-3);
    transition: color 120ms ease, transform 120ms ease;
}

.estrela svg {
    width: 16px;
    height: 16px;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.6;
    stroke-linejoin: round;
}

.estrela:hover { color: var(--texto-2); }

.estrela.marcada {
    color: var(--marca);
}

.estrela.marcada svg { fill: currentColor; }
.estrela:active { transform: scale(0.88); }

/* cabeçalho ordenável */
.tabela th.ordenavel button {
    appearance: none;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}

.tabela th.ordenavel button:hover,
.tabela th.ordenavel.ativa button {
    color: var(--texto);
}

.seta-ordem {
    font-size: 8px;
    color: var(--marca);
    min-width: 8px;
}

/* minigráfico de 7 dias: se desenha da esquerda pra direita na 1ª carga */
.col-grafico {
    width: 140px;
}

.sparkline {
    width: 120px;
    height: 36px;
    display: block;
    margin-left: auto;
}

.col-grafico.desenhar .sparkline path {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: tracar 900ms var(--ease) forwards;
}

.tabela-mercado tbody tr:nth-child(n+12) .col-grafico.desenhar .sparkline path {
    animation-delay: 150ms;
}

@keyframes tracar {
    to { stroke-dashoffset: 0; }
}

.tabela-vazia {
    text-align: center !important;
    padding: 40px 20px !important;
    color: var(--texto-2);
}

/* moeda sem cotação ao vivo: preço um tom abaixo, sem pisca */
.tabela-mercado tbody tr:not(.ao-vivo) .preco-vivo {
    color: var(--texto-2);
}

@media (max-width: 1000px) {
    .destaques { grid-template-columns: minmax(0, 1fr); }
}


/* movimento reduzido: sem pisca, sem brilho, sem deslize */
@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
    }
}

/* topo apertado: o pulso do BTC sai antes de tudo */
@media (max-width: 1320px) {
    .pulso { display: none !important; }
}


/* =================================================================
   PÁGINA DA MOEDA  [ETAPA 2 · 29/09/2026]
   ================================================================= */
.moeda-topo {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.moeda-topo .moeda-logo {
    width: 48px;
    height: 48px;
}

.moeda-topo .moeda-icone {
    width: 48px;
    height: 48px;
    font-size: var(--t-sm);
}

.moeda-nome h1 {
    font-size: var(--t-2xl);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.2;
}

.moeda-nome h1 span {
    font-size: var(--t-md);
    font-weight: 600;
    color: var(--texto-3);
    margin-left: 6px;
}

.moeda-etiqueta {
    display: inline-block;
    margin-top: 2px;
    padding: 1px 8px;
    border-radius: 6px;
    background: var(--superficie-2);
    color: var(--texto-2);
    font-size: var(--t-xs);
    font-weight: 700;
}

.moeda-preco {
    margin-left: auto;
    text-align: right;
}

.moeda-preco-valor {
    display: inline-block;
    font-size: var(--t-2xl);
    font-weight: 800;
    letter-spacing: -0.02em;
    border-radius: 6px;
    padding: 0 6px;
    margin: 0 -6px;
}

.moeda-preco .var {
    font-size: var(--t-md);
    margin-left: 8px;
}

.grafico-barra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.grafico-area {
    position: relative;
}

.grafico {
    height: 420px;
}

/* leitura do cursor: data e valores da vela sob o mouse */
.grafico-legenda {
    position: absolute;
    top: 8px;
    left: 10px;
    z-index: 2;
    font-size: var(--t-xs);
    color: var(--texto-2);
    pointer-events: none;
}

.grafico-legenda strong {
    color: var(--texto);
    font-weight: 700;
}

.grafico-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    color: var(--texto-2);
    font-size: var(--t-sm);
}

.grafico-msg[hidden] {
    display: none;
}

.estatisticas {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
}

.estatisticas .indicador-valor {
    font-size: var(--t-md);
}

.estatisticas .indicador-nota {
    font-size: var(--t-xs);
    color: var(--texto-3);
    margin-top: 2px;
}

.conversor {
    display: flex;
    align-items: flex-end;
    gap: 12px;
    flex-wrap: wrap;
}

.conversor .campo {
    flex: 1;
    min-width: 200px;
}

.conversor-igual {
    height: 42px;
    display: flex;
    align-items: center;
    color: var(--texto-3);
    font-weight: 700;
}

#moeda-conteudo > .painel + .painel,
#moeda-conteudo > .painel + .moeda-colunas {
    margin-top: 16px;
}

.moeda-colunas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
    margin-top: 16px;
}

.moeda-colunas .painel {
    margin-top: 0 !important;
}


/* =================================================================
   LANÇAMENTOS  [ETAPA 3 · 29/09/2026]
   ================================================================= */
.botao-pequeno {
    height: 30px;
    padding: 0 10px;
    font-size: var(--t-xs);
}

/* etiqueta da operação: latão pra o que entra, cinza pra o que sai, azul pra
   conversão. Verde e vermelho ficam reservados pra alta e queda */
.etiqueta-tipo {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 6px;
    font-size: var(--t-xs);
    font-weight: 700;
}

/* [ETAPA 5.1] o latão é da marca e da ação principal, então a compra não usa
   mais ele: o que entra é cinza cheio, o que sai é só contorno */
.etiqueta-tipo.t-compra,
.etiqueta-tipo.t-entrada {
    background: var(--superficie-3);
    color: var(--texto);
}

.etiqueta-tipo.t-venda,
.etiqueta-tipo.t-saida {
    background: transparent;
    box-shadow: inset 0 0 0 1px var(--borda-forte);
    color: var(--texto-2);
}

.etiqueta-tipo.t-conversao {
    background: rgba(110, 155, 245, 0.14);
    color: var(--info);
}

.seta-conv {
    color: var(--texto-3);
    margin: 0 2px;
}

.lanc-resumo {
    margin-bottom: 16px;
}

.tabela-lanc th:nth-child(-n+3),
.tabela-lanc td:nth-child(-n+3) {
    text-align: left;
}

.tabela-lanc .col-moeda-lanc {
    display: table-cell;
}

.tabela-lanc .col-moeda-lanc .celula-moeda {
    display: inline-flex;
    vertical-align: middle;
}

.tabela-lanc .col-acoes {
    white-space: nowrap;
}

.lanc-lista {
    list-style: none;
    margin: 0 0 12px;
    padding: 0;
}

.lanc-lista li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--borda);
    font-size: var(--t-sm);
}

.lanc-lista li:last-child {
    border-bottom: none;
}

.lanc-data {
    width: 84px;
    color: var(--texto-2);
}

.lanc-qtd {
    flex: 1;
    color: var(--texto-2);
}

.lanc-valor {
    font-weight: 600;
}

.estatisticas-2 {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* gaveta que desliza da direita (lançamento) */
.gaveta-fundo {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(3, 6, 14, 0.6);
    opacity: 0;
    visibility: hidden;
    transition: opacity 200ms ease, visibility 200ms;
}

.gaveta {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    z-index: 61;
    width: min(500px, 100vw);
    display: flex;
    flex-direction: column;
    background: var(--superficie);
    border-left: 1px solid var(--borda-forte);
    box-shadow: var(--sombra-flutuante);
    transform: translateX(100%);
    visibility: hidden;
    transition: transform 240ms var(--ease), visibility 240ms;
}

/* com a gaveta aberta, os avisos saem da frente dos botões dela */
body:has(#gaveta.aberta) .avisos {
    right: calc(min(500px, 100vw) + 20px);
}

#gaveta.aberta .gaveta-fundo {
    opacity: 1;
    visibility: visible;
}

#gaveta.aberta .gaveta {
    transform: none;
    visibility: visible;
}

.gaveta-topo {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--borda);
}

.gaveta-topo h2 {
    font-size: var(--t-lg);
    font-weight: 700;
}

.gaveta-topo .botao-icone {
    font-size: 22px;
    line-height: 1;
}

.gaveta-corpo {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.gaveta-pe {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 24px calc(14px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--borda);
}

.segmentado-quebra {
    flex-wrap: wrap;
}

.campo-ajuda {
    font-size: var(--t-xs);
    color: var(--texto-3);
}

.campo-erro {
    font-size: var(--t-xs);
    color: var(--queda);
}

.campo-erro-caixa {
    padding: 10px 14px;
    border-radius: var(--r-controle);
    border: 1px solid var(--queda);
    background: var(--queda-suave);
    color: var(--queda);
    font-size: var(--t-sm);
}

.nota-operacao {
    padding: 10px 12px;
    border-radius: var(--r-controle);
    background: var(--superficie-2);
    color: var(--texto-2);
    font-size: var(--t-xs);
    line-height: 1.5;
}

@media (prefers-reduced-motion: reduce) {
    .gaveta,
    .gaveta-fundo {
        transition: none;
    }
}


/* =================================================================
   PORTFÓLIO  [ETAPA 4 · 29/09/2026]
   ================================================================= */
.cabecalho-acoes {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

#pf-conteudo > .painel + .painel,
#pf-conteudo > .painel + .pf-nota,
#pf-conteudo > .painel + .painel-tabela,
#pf-conteudo > .pf-topo-grade + .painel {
    margin-top: 16px;
}

/* [ETAPA 6.1] painel superior do portfólio: saldo+cards à esquerda, gráfico à direita */
.pf-topo-grade {
    display: grid;
    grid-template-columns: 5fr 7fr;
    gap: 20px;
    align-items: stretch;
}

/* cards em 2×2 no painel esquerdo (mais estreito) */
.pf-topo-grade .pf-cartoes {
    grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* saldo fica no topo, cards colam no fundo */
.pf-topo-grade .pf-hero {
    display: flex;
    flex-direction: column;
}

.pf-topo-grade .pf-cartoes {
    margin-top: auto;
}

.pf-hero .saldo {
    margin-bottom: 6px;
}

.pf-var {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    min-height: 26px;
    margin-bottom: 20px;
    font-size: var(--t-md);
}

.pf-var-rotulo {
    color: var(--texto-3);
    font-size: var(--t-sm);
}

.pf-cartoes .indicador-valor.ganho {
    color: var(--alta);
}

.pf-cartoes .indicador-valor.perda {
    color: var(--queda);
}

.indicador-nota {
    font-size: var(--t-xs);
    color: var(--texto-3);
    margin-top: 2px;
}

.pf-nota {
    margin: 10px 4px 0;
    font-size: var(--t-xs);
    color: var(--texto-3);
}

.pf-legenda {
    display: flex;
    gap: 18px;
    margin-bottom: 8px;
    font-size: var(--t-sm);
    color: var(--texto-2);
}

.pf-legenda span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.pf-traco {
    display: inline-block;
    width: 18px;
    height: 2px;
    border-radius: 2px;
}

.pf-tracejado {
    background: repeating-linear-gradient(90deg, var(--texto-3) 0 4px, transparent 4px 7px);
}

.grafico-pf {
    height: 340px;
}

.rosca-area {
    display: flex;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
}

.rosca {
    width: 200px;
    height: 200px;
    display: block;
}

.rosca-fatia {
    transition: stroke-dasharray 700ms var(--ease), stroke-dashoffset 700ms var(--ease);
}

.rosca-total {
    fill: var(--texto);
    font-family: var(--fonte-marca);
    font-size: 26px;
    font-weight: 500;
}

.rosca-rotulo {
    fill: var(--texto-3);
    font-size: 11px;
}

#pf-rosca-leg {
    flex: 1;
    min-width: 260px;
}

.rosca-legenda {
    list-style: none;
    margin: 0;
    padding: 0;
    max-width: 460px;
}

.rosca-legenda li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--borda);
    font-size: var(--t-sm);
}

.rosca-legenda li:last-child {
    border-bottom: none;
}

.rosca-cor {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
}

.rosca-nome {
    flex: 1;
    font-weight: 600;
}

.rosca-pct {
    width: 56px;
    text-align: right;
    color: var(--texto-2);
}

.rosca-valor {
    width: 120px;
    text-align: right;
    font-weight: 600;
}

.tabela-portfolio th:first-child,
.tabela-portfolio td:first-child {
    text-align: left;
}

.tabela-portfolio .td-forte {
    font-weight: 700;
}

.lucro-pct {
    display: block;
    font-size: var(--t-xs);
    font-weight: 700;
}

.lucro-pct.alta {
    color: var(--alta);
}

.lucro-pct.queda {
    color: var(--queda);
}

.qtd-sem-custo {
    display: block;
    font-size: var(--t-xs);
    color: var(--alta);
}

/* telas médias: o bloco CELULAR (Etapa 5), no fim do CSS, cuida do celular.
   Aqui só evitamos quebrar abaixo de 1000px. */
@media (max-width: 1000px) {
    .grade-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .pf-topo-grade { grid-template-columns: 1fr; }
    .grade-2 { grid-template-columns: minmax(0, 1fr); }
    .estatisticas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .moeda-colunas { grid-template-columns: minmax(0, 1fr); }
    .busca .entrada { width: 180px; }
}

/* =================================================================
   CELULAR  [ETAPA 5 · 29/09/2026]
   Web larga continua exatamente como estava. Abaixo de 768px (mesmo ponto
   do Dash Finance, [MOBILE v1]):
     - topo: marca, moeda de exibição, busca (ícone) e sanduíche
     - menu abre por cima da tela e fecha no X, no Esc ou ao escolher uma página
     - Mercado enxuto: cada moeda é uma linha (estrela, posição, logo, nome,
       preço e variação 24h); o resto fica na página da moeda
     - destaques viram faixa que rola na horizontal
     - tabelas viram lista ou cartões; lançamento abre em tela cheia
     - campos com 16px (evita o zoom do iPhone) e respiro de safe-area
   Fica no FIM do <style> de propósito: precisa vir depois das regras do
   computador pra ganhar (mesma especificidade).
   ================================================================= */
.botao-busca-mobile,
.botao-menu,
.moeda-chip,
.menu-mobile,
.ord-mobile {
    display: none;
}

@media (max-width: 768px) {
    :root {
        --topo: 56px;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        overflow-x: hidden;
    }

    /* ---------- topo ---------- */
    .topo {
        padding-top: env(safe-area-inset-top);
    }

    .topo-interno {
        padding: 0 16px;
        gap: 10px;
    }

    .marca-nome {
        font-size: 17px;
    }

    .nav,
    .pulso,
    .topo-direita > .nav-grupo {
        display: none !important;
    }

    .topo-direita {
        gap: 8px;
    }

    .botao-busca-mobile,
    .botao-menu,
    .moeda-chip {
        display: flex;
    }

    /* [ETAPA 6.2] largura fixa: "US$" é o rótulo mais longo dos três,
       sem isso o botão pula de tamanho a cada troca de moeda */
    .moeda-chip {
        min-width: 38px;
        font-size: 13px;
        font-weight: 700;
    }

    .topo-direita .segmentado button {
        padding: 6px 9px;
    }

    .busca {
        display: none;
    }

    /* busca abre numa segunda linha, colada embaixo do topo */
    .topo.busca-aberta .busca {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        padding: 10px 16px;
        background: var(--bg);
        border-bottom: 1px solid var(--borda);
    }

    .topo.busca-aberta .busca .entrada {
        width: 100%;
        padding-left: 38px;
    }

    .topo.busca-aberta .busca svg {
        left: 28px;
    }

    /* ---------- menu sanduíche ---------- */
    .menu-mobile {
        display: flex;
        flex-direction: column;
        position: fixed;
        inset: 0;
        z-index: 80;
        background: var(--bg);
        padding-bottom: env(safe-area-inset-bottom);
        opacity: 0;
        visibility: hidden;
        transform: translateY(-12px);
        transition: opacity 180ms ease, transform 180ms ease, visibility 180ms;
    }

    .menu-mobile.aberto {
        opacity: 1;
        visibility: visible;
        transform: none;
    }

    .menu-mobile-topo {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        height: calc(var(--topo) + env(safe-area-inset-top));
        padding: env(safe-area-inset-top) 16px 0;
        border-bottom: 1px solid var(--borda);
    }

    .menu-mobile-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px 16px;
    }

    /* [ETAPA 6] rodapé do menu: avatar + nome + sair */
    .menu-mobile-usuario {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        gap: 10px;
        padding: 14px 16px;
        border-top: 1px solid var(--borda);
    }

    .menu-usuario-bloco {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .menu-usuario-bloco span {
        font-size: 14px;
        font-weight: 600;
        color: var(--texto);
    }

    .menu-mobile .menu-secao + .menu-secao {
        margin-top: 4px;
    }

    .menu-mobile .menu-item {
        padding: 12px 10px;
    }

    .menu-mobile .menu-item-texto strong {
        font-size: var(--t-md);
    }

    /* ---------- páginas ---------- */
    .pagina {
        padding: 16px 16px 32px;
    }

    .pagina-cabecalho {
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 12px;
        margin-bottom: 14px;
    }

    .pagina-cabecalho h1 {
        font-size: var(--t-xl);
    }

    /* a descrição longa fica só no computador */
    .pagina-cabecalho p {
        display: none;
    }

    .painel {
        padding: 16px;
    }

    .entrada,
    select.entrada {
        font-size: 16px;
        height: 44px;
    }

    .rodape {
        flex-direction: column;
        gap: 4px;
        padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    }

    /* ---------- Mercado enxuto ---------- */
    /* destaques: faixa que rola na horizontal e sangra até a borda da tela */
    #destaques-mercado {
        margin: 0 -16px 16px;
    }

    .destaques {
        display: flex;
        gap: 10px;
        margin-bottom: 0;
        padding: 0 16px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-padding: 0 16px;
        scrollbar-width: none;
    }

    .destaques::-webkit-scrollbar {
        display: none;
    }

    .destaque {
        flex: 0 0 80%;
        min-height: 0;
        padding: 12px 14px 6px;
        scroll-snap-align: start;
    }

    .destaque-titulo {
        margin-bottom: 4px;
        font-size: var(--t-xs);
        color: var(--texto-2);
    }

    .destaque-linha {
        padding: 4px 6px;
        gap: 8px;
        font-size: var(--t-xs);
    }

    .destaque-numeros {
        gap: 6px;
    }

    .barra-tabela {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
        margin-bottom: 10px;
    }

    .barra-tabela .segmentado {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .barra-tabela .segmentado::-webkit-scrollbar {
        display: none;
    }

    .segmentado button {
        white-space: nowrap;
    }

    .barra-tabela label.ord-mobile {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: var(--t-sm);
        color: var(--texto-3);
    }

    .barra-tabela label.ord-mobile select {
        flex: 1;
        height: 40px;
        color: var(--texto-2);
    }

    .barra-info {
        display: none;
    }

    .painel-tabela {
        padding: 2px 0;
        overflow: visible;
    }

    /* cada moeda é uma linha: estrela, posição, moeda e, à direita, preço em
       cima e variação 24h embaixo */
    .tabela-mercado,
    .tabela-portfolio,
    .tabela-lanc {
        min-width: 0;
        table-layout: auto;
    }

    .tabela-mercado,
    .tabela-mercado tbody,
    .tabela-portfolio,
    .tabela-portfolio tbody,
    .tabela-lanc,
    .tabela-lanc tbody {
        display: block;
    }

    .tabela-mercado thead,
    .tabela-portfolio thead,
    .tabela-lanc thead {
        display: none;
    }

    .tabela-mercado td,
    .tabela-portfolio td,
    .tabela-lanc td {
        display: block;
        padding: 0;
        border: none;
        text-align: left;
    }

    .tabela-mercado tbody tr {
        display: grid;
        grid-template-columns: 22px 20px minmax(0, 1fr) auto;
        grid-template-areas: "fav rank moeda preco" "fav rank moeda var";
        align-items: center;
        column-gap: 8px;
        row-gap: 0;
        padding: 9px 12px;
        border-bottom: 1px solid var(--borda);
    }

    .tabela-mercado tbody tr:last-child {
        border-bottom: none;
    }

    .tabela-mercado td:nth-child(1) { grid-area: fav; }
    .tabela-mercado td:nth-child(2) { grid-area: rank; text-align: center; font-size: var(--t-xs); }
    .tabela-mercado td:nth-child(3) { grid-area: moeda; min-width: 0; }
    .tabela-mercado td:nth-child(4) { grid-area: preco; text-align: right; font-weight: 700; font-size: var(--t-sm); }
    .tabela-mercado td:nth-child(6) { grid-area: var; justify-self: end; }

    .tabela-mercado td:nth-child(5),
    .tabela-mercado td:nth-child(7),
    .tabela-mercado td:nth-child(8),
    .tabela-mercado td:nth-child(9),
    .tabela-mercado td:nth-child(10) {
        display: none;
    }

    .tabela-mercado td.tabela-vazia {
        grid-column: 1 / -1;
        grid-area: auto;
        text-align: center;
    }

    .tabela-mercado .col-fav {
        width: auto;
        padding: 0;
    }

    .tabela-mercado .celula-moeda,
    .tabela-portfolio .celula-moeda {
        min-width: 0;
    }

    .tabela-mercado .celula-moeda > div,
    .tabela-portfolio .celula-moeda > div {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.25;
    }

    .tabela-mercado .celula-moeda strong,
    .tabela-portfolio .celula-moeda strong {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .tabela-mercado .celula-moeda span,
    .tabela-portfolio .celula-moeda span {
        font-size: var(--t-xs);
    }

    /* variação 24h logo abaixo do preço, só na cor (sem caixa), pra linha ficar baixa */
    .tabela-mercado td:nth-child(6) .var {
        font-size: var(--t-xs);
    }

    .tabela-mercado .estrela {
        width: 22px;
        height: 22px;
    }

    /* ---------- página da moeda ---------- */
    .moeda-topo {
        gap: 12px;
        margin-bottom: 16px;
    }

    .moeda-topo .moeda-logo,
    .moeda-topo .moeda-icone {
        width: 40px;
        height: 40px;
    }

    .moeda-nome h1 {
        font-size: var(--t-xl);
    }

    .moeda-preco {
        order: 4;
        width: 100%;
        margin-left: 0;
        text-align: left;
    }

    .moeda-preco-valor {
        font-size: 26px;
    }

    .moeda-topo .conexao {
        margin-left: auto;
    }

    .grafico {
        height: 280px;
    }

    .grafico-pf {
        height: 240px;
    }

    .grafico-barra {
        flex-direction: column;
        align-items: stretch;
    }

    .grafico-barra .segmentado {
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
    }

    .estatisticas {
        gap: 8px;
    }

    .cartao {
        padding: 12px 14px;
    }

    .conversor .campo {
        min-width: 100%;
    }

    .conversor-igual {
        display: none;
    }

    /* ---------- portfólio ---------- */
    .cabecalho-acoes {
        width: 100%;
    }

    .cabecalho-acoes .conexao {
        flex-basis: 100%;
    }

    .cabecalho-acoes .botao {
        flex: 1;
    }

    .saldo {
        font-size: 30px;
    }

    .rosca-area {
        justify-content: center;
        gap: 20px;
    }

    #pf-rosca-leg {
        min-width: 100%;
    }

    .rosca-valor {
        width: auto;
    }

    /* cada moeda: nome e quantidade à esquerda, saldo e lucro à direita */
    .tabela-portfolio tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "moeda saldo" "moeda lucro";
        align-items: center;
        row-gap: 2px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--borda);
    }

    .tabela-portfolio tbody tr:last-child {
        border-bottom: none;
    }

    .tabela-portfolio td:nth-child(1) { grid-area: moeda; min-width: 0; }
    .tabela-portfolio td:nth-child(7) { grid-area: saldo; text-align: right; }
    .tabela-portfolio td:nth-child(8) { grid-area: lucro; text-align: right; }

    .tabela-portfolio td:nth-child(2),
    .tabela-portfolio td:nth-child(3),
    .tabela-portfolio td:nth-child(4),
    .tabela-portfolio td:nth-child(5),
    .tabela-portfolio td:nth-child(6),
    .tabela-portfolio td:nth-child(9) {
        display: none;
    }

    .tabela-portfolio .lucro-pct {
        display: inline;
        margin-left: 6px;
    }

    /* ---------- lançamentos: cada um vira um cartão ---------- */
    .tabela-lanc tbody tr {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "tipo data" "moeda moeda" "qtd total" "realizado realizado" "acoes acoes";
        align-items: center;
        gap: 8px 12px;
        padding: 14px;
        border-bottom: 1px solid var(--borda);
    }

    .tabela-lanc tbody tr:last-child {
        border-bottom: none;
    }

    .tabela-lanc td:nth-child(1) { grid-area: data; justify-self: end; color: var(--texto-2); font-size: var(--t-sm); }
    .tabela-lanc td:nth-child(2) { grid-area: tipo; justify-self: start; }
    .tabela-lanc td.col-moeda-lanc { display: block; grid-area: moeda; min-width: 0; }
    .tabela-lanc td:nth-child(4) { grid-area: qtd; color: var(--texto-2); font-size: var(--t-sm); }
    .tabela-lanc td:nth-child(7) { grid-area: total; text-align: right; font-weight: 700; }
    .tabela-lanc td:nth-child(8) { grid-area: realizado; font-size: var(--t-sm); }

    .tabela-lanc td:nth-child(5),
    .tabela-lanc td:nth-child(6),
    .tabela-lanc td:nth-child(8):not(:has(.var)) {
        display: none;
    }

    .tabela-lanc td:nth-child(8)::before {
        content: "Lucro realizado ";
        color: var(--texto-3);
    }

    .tabela-lanc td.col-acoes {
        display: flex;
        grid-area: acoes;
        justify-content: flex-end;
        gap: 8px;
        padding-top: 4px;
    }

    .tabela-lanc .col-acoes .botao {
        flex: 1;
        height: 38px;
        border-color: var(--borda-forte);
    }

    .lanc-resumo {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    /* ---------- gaveta de lançamento em tela cheia ---------- */
    .gaveta {
        width: 100vw;
        border-left: none;
    }

    .gaveta-topo {
        padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    }

    .gaveta-corpo {
        padding: 16px;
    }

    .gaveta .segmentado button {
        padding: 6px 8px;
        font-size: 13px;
    }

    .gaveta-pe {
        padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    }

    .gaveta-pe .botao {
        flex: 1;
        height: 48px;
    }

    .avisos,
    body:has(#gaveta.aberta) .avisos {
        left: 16px;
        right: 16px;
        bottom: calc(16px + env(safe-area-inset-bottom));
    }

    body:has(#gaveta.aberta) .avisos {
        bottom: calc(84px + env(safe-area-inset-bottom));
    }
}

/* =================================================================
   AJUSTES DO RELATÓRIO DE TESTES  [ETAPA 5.1 / 4.1 · 29/09/2026]
   ================================================================= */
.destaques-pontos,
.so-celular,
.ico-graf {
    display: none;
}

/* números nunca quebram no meio: "R$ 15,08 tri" fica numa linha só */
.destaque-numeros strong,
.destaque-preco {
    white-space: nowrap;
}

.destaque-nome {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.destaque-linha > * {
    min-width: 0;
}

.destaque-preco {
    text-align: right;
}

.destaque-numeros div {
    align-items: baseline;
}

.destaque-numeros span {
    min-width: 0;
}

.rodape-link {
    text-decoration: underline;
    text-underline-offset: 2px;
}

.rodape-link:hover {
    color: var(--texto);
}

/* "sem vendas ainda": legenda, não número */
.indicador-valor .sem-dado-legenda {
    font-size: var(--t-sm);
    font-weight: 500;
}

@media (max-width: 768px) {
    .so-computador {
        display: none;
    }

    .so-celular {
        display: inline;
    }

    /* bolinhas dos cartões de destaque */
    .destaques-pontos {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 10px;
    }

    .destaques-ponto {
        appearance: none;
        width: 8px;
        height: 8px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: var(--superficie-3);
        transition: background-color 160ms ease, width 160ms ease;
        cursor: pointer;
    }

    .destaques-ponto.ativo {
        width: 20px;
        border-radius: 4px;
        background: var(--marca);
    }

    /* moeda: períodos e tipo do gráfico numa linha só (tipo vira ícones) */
    .grafico-barra:has([data-tipo-grafico]) {
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
    }

    .grafico-barra:has([data-tipo-grafico]) .segmentado {
        flex-shrink: 0;
    }

    .grafico-barra:has([data-tipo-grafico]) .segmentado button {
        padding: 6px 9px;
    }

    .grafico-barra .rot-longo {
        display: none;
    }

    .grafico-barra .ico-graf {
        display: block;
        width: 16px;
        height: 16px;
    }

    .grafico-barra [data-tipo-grafico] {
        padding: 6px 10px;
    }

    .rosca-total {
        font-size: 22px;
    }
}

/* =================================================================
   TELAS DE IDENTIFICAÇÃO  [ETAPA 6]
   Desktop: painel da marca à esquerda + formulário à direita.
   Mobile: só o formulário, com logotipo pequeno no topo.
   ================================================================= */

.tela-entrada {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 420px 1fr;
    z-index: 1000;
    overflow: hidden;
}

/* ── painel esquerdo: marca ───────────────────────────────────────*/
.tela-marca {
    background: var(--superficie);
    border-right: 1px solid var(--borda);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 48px 40px;
    position: relative;
    overflow: hidden;
}

/* anel decorativo de fundo */
.tela-marca::before {
    content: '';
    position: absolute;
    width: 520px;
    height: 520px;
    border-radius: 50%;
    border: 1px solid rgba(233, 185, 73, 0.08);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.tela-marca::after {
    content: '';
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    border: 1px solid rgba(233, 185, 73, 0.12);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

.tela-marca-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    position: relative;
    z-index: 1;
}

.tela-marca-logo svg {
    width: 72px;
    height: 72px;
    filter: drop-shadow(0 0 24px rgba(233, 185, 73, 0.35));
}

.tela-marca-nome {
    font-family: 'Unbounded', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--marca);
    letter-spacing: -0.02em;
}

.tela-marca-tagline {
    font-size: 15px;
    color: var(--texto-3);
    text-align: center;
    position: relative;
    z-index: 1;
    line-height: 1.5;
    max-width: 260px;
}

.tela-marca-rodape {
    position: absolute;
    bottom: 24px;
    font-size: 12px;
    color: var(--texto-3);
    letter-spacing: 0.02em;
}

/* ── painel direito: formulário ──────────────────────────────────*/
.tela-form {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-y: auto;
    padding: 48px 40px;
}

.tela-caixa {
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.tela-titulo {
    font-size: 20px;
    font-weight: 700;
    color: var(--texto);
    margin: 0 0 2px;
}

.tela-subtitulo {
    font-size: 13px;
    color: var(--texto-2);
    margin: 0;
    line-height: 1.5;
}

/* ── campos de formulário da tela de entrada ─────────────────────*/
.tela-form .entrada {
    height: 40px;
    font-size: 14px;
}

.campo-grupo {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.campo-label {
    font-size: 13px;
    font-weight: 500;
    color: var(--texto-2);
}

.campo-nota {
    font-size: 12px;
    font-weight: 400;
    color: var(--texto-3);
}

.erro-campo {
    font-size: 12px;
    color: var(--queda);
    margin-top: 2px;
}

.tela-texto {
    font-size: 14px;
    color: var(--texto-2);
    margin: 0;
    line-height: 1.5;
}

.tela-aviso {
    font-size: 12px;
    color: var(--texto-2);
    background: rgba(233, 185, 73, 0.07);
    border: 1px solid rgba(233, 185, 73, 0.22);
    border-radius: 10px;
    padding: 10px 12px;
    margin: 0;
    line-height: 1.5;
}

.tela-link {
    background: none;
    border: none;
    color: var(--marca);
    font-size: 13px;
    cursor: pointer;
    padding: 2px 0;
    text-align: left;
    font-family: inherit;
}

.tela-link:hover { text-decoration: underline; }

.tela-link-sair {
    font-size: 12px;
    color: var(--texto-3);
}

.tela-link-sair:hover { color: var(--queda); }

.tela-voltar {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: var(--texto-3);
    font-size: 13px;
    margin-top: 4px;
    align-self: flex-start;
}

.tela-pin-resultado {
    font-size: 14px;
    color: var(--texto);
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
    padding: 14px 16px;
}

.tela-pin-resultado strong {
    display: block;
    font-family: 'Unbounded', sans-serif;
    font-size: 22px;
    color: var(--marca);
    letter-spacing: 0.18em;
    margin-top: 6px;
}

/* ── lista de perfis ─────────────────────────────────────────────*/
.perfis-lista {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.perfil-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 18px 14px;
    background: var(--superficie);
    border: 2px solid var(--borda);
    border-radius: 16px;
    cursor: pointer;
    flex: 1;
    min-width: 100px;
    max-width: 140px;
    transition: border-color 0.15s, background 0.15s;
}

.perfil-card:hover { background: var(--superficie-2); }

.perfil-card.ativo {
    border-color: var(--marca);
    background: var(--superficie-2);
}

.perfil-card-nome {
    font-size: 13px;
    font-weight: 600;
    color: var(--texto);
    text-align: center;
    word-break: break-word;
}

.perfil-novo { border-style: dashed; }

.perfil-novo .avatar-novo {
    width: 52px;
    height: 52px;
    background: var(--superficie-2);
    border: 2px dashed var(--borda);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--texto-3);
}

/* ── área de PIN ao selecionar perfil ────────────────────────────*/
.pin-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 14px;
}

.pin-area-quem {
    font-size: 14px;
    color: var(--texto-2);
    margin: 0;
}

.pin-area-quem strong {
    color: var(--texto);
}

/* ── caixas OTP ──────────────────────────────────────────────────*/
.otp-grupo {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.otp-digito {
    width: 42px;
    height: 50px;
    background: var(--bg);
    border: 2px solid var(--borda);
    border-radius: 10px;
    color: var(--texto);
    font-family: 'Unbounded', sans-serif;
    font-size: 18px;
    text-align: center;
    caret-color: var(--marca);
    transition: border-color 0.15s, box-shadow 0.15s;
    padding: 0;
    -webkit-appearance: none;
    appearance: none;
}

.otp-digito:focus {
    outline: none;
    border-color: var(--marca);
    box-shadow: 0 0 0 3px rgba(233, 185, 73, 0.18);
}

.otp-digito.preenchido {
    border-color: var(--superficie-3);
}

/* ── avatar circular ─────────────────────────────────────────────*/
.avatar {
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
}

/* ── avatar no topo  [ETAPA 6.2 · 30/09/2026] ──────────────────────
   Virou <button>, e um <button> sem reset herda a cara nativa do
   navegador (fundo cinza-claro, borda) — era a caixa branca em volta do
   avatar. appearance:none tira o visual de controle de formulário;
   background/border explícitos tiram o resto. */
.usuario-topo {
    appearance: none;
    background: none;
    background-color: transparent;
    border: none;
    outline: none;
    padding: 4px;
    margin-left: 4px;
    border-radius: 999px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-family: inherit;
    transition: background-color 120ms ease;

.usuario-topo:hover {
    background-color: var(--superficie-2);
}

.usuario-topo-nome {
    font-size: 13px;
    font-weight: 600;
    color: var(--texto-2);
    white-space: nowrap;
}

/* "Sair" dentro do botão do avatar: alvo de toque maior que o texto */
.usuario-topo .tela-link-sair {
    padding: 4px 2px;
}

/* ── avatar no topo mobile (nome dentro do menu aberto) ────────────*/
.usuario-mobile-nome {
    font-size: 14px;
    font-weight: 600;
    color: var(--texto);
}

/* ── mobile: colapsar o painel da marca ──────────────────────────*/
@media (max-width: 768px) {
    .tela-entrada {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow-y: auto;
    }

    .tela-marca {
        border-right: none;
        border-bottom: 1px solid var(--borda);
        flex-direction: row;
        justify-content: flex-start;
        padding: 18px 20px;
        gap: 12px;
    }

    .tela-marca::before,
    .tela-marca::after { display: none; }

    .tela-marca-logo {
        flex-direction: row;
        gap: 10px;
    }

    .tela-marca-logo svg { width: 32px; height: 32px; filter: none; }
    .tela-marca-nome { font-size: 20px; }
    .tela-marca-tagline { display: none; }
    .tela-marca-rodape { display: none; }

    .tela-form {
        padding: 28px 20px;
        justify-content: flex-start;
    }

    .tela-caixa { max-width: 100%; }

    .otp-digito { width: 40px; height: 48px; font-size: 16px; }
    .otp-grupo { gap: 6px; }

    .perfil-card { min-width: 80px; padding: 14px 10px; }
}

<body>

<div id="app"></div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<div id="gaveta"></div>

<script>
(function () {
'use strict';

/* =================================================================
   CONFIGURAÇÃO
   ================================================================= */
var APP = {
    nome: 'Koin',
    versao: '0.1.0',        // 1.0.0 quando fechar a Etapa 7 (PWA)
    ano: 2026,
    autor: 'BitCoderSoft',
};

var BINANCE = 'https://data-api.binance.vision';   // dados públicos, sem chave


/* =================================================================
   ARMAZENAMENTO  [HERANÇA Dash Finance · STORE v1]
   localStorage quando dá; no preview do claude.ai (onde ele é bloqueado)
   cai pra memória, e usa window.storage se existir. Todo acesso passa
   por `armazem`, nunca por localStorage direto.
   ================================================================= */
var PREFIXO = 'KOIN_';
var espelho = {};
var modoArmazenamento = 'memoria';

try {
    localStorage.setItem(PREFIXO + 'teste', '1');
    localStorage.removeItem(PREFIXO + 'teste');
    modoArmazenamento = 'local';
} catch (e) {
    if (window.storage && typeof window.storage.get === 'function') modoArmazenamento = 'claude';
}

var armazem = {
    get: function (k) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') return localStorage.getItem(k);
        return Object.prototype.hasOwnProperty.call(espelho, k) ? espelho[k] : null;
    },
    set: function (k, v) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') { localStorage.setItem(k, v); return; }
        espelho[k] = String(v);
        if (modoArmazenamento === 'claude') {
            Promise.resolve().then(function () { return window.storage.set(k, String(v), false); }).catch(function () {});
        }
    },
    remove: function (k) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') { localStorage.removeItem(k); return; }
        delete espelho[k];
    },
    json: function (k, padrao) {
        try {
            var raw = this.get(k);
            return raw ? JSON.parse(raw) : padrao;
        } catch (e) {
            return padrao;
        }
    },
};

// no preview, puxa as preferências salvas antes do primeiro desenho
function carregarArmazenamento() {
    if (modoArmazenamento !== 'claude') return Promise.resolve();
    var chaves = ['PREFS', 'BANCO'];
    return Promise.all(chaves.map(function (c) {
        return window.storage.get(PREFIXO + c, false)
            .then(function (r) { if (r && r.value != null) espelho[PREFIXO + c] = r.value; })
            .catch(function () {});
    }));
}


/* =================================================================
   ESTADO CENTRAL  [ETAPA 0]
   A diferença principal pro Dash Finance: lá cada mudança redesenhava
   a página inteira. Aqui as telas são desenhadas UMA vez e os pedaços
   que mudam (preço, moeda de exibição) se atualizam no lugar, ouvindo
   o estado. Isso é o que permite preço ao vivo a cada segundo.

   estado.definir('moeda', 'USD')  -> avisa quem ouve 'moeda'
   estado.ouvir('moeda', fn)       -> fn(novoValor, antigo); devolve
                                      uma função pra parar de ouvir
   Ouvintes de página são removidos sozinhos ao trocar de rota.
   ================================================================= */
var estado = (function () {
    var dados = {};
    var ouvintes = {};
    var daPagina = [];

    return {
        ler: function (k) { return dados[k]; },
        definir: function (k, v) {
            var antigo = dados[k];
            dados[k] = v;
            (ouvintes[k] || []).slice().forEach(function (fn) { fn(v, antigo); });
        },
        ouvir: function (k, fn, daPaginaAtual) {
            (ouvintes[k] = ouvintes[k] || []).push(fn);
            var parar = function () {
                ouvintes[k] = (ouvintes[k] || []).filter(function (f) { return f !== fn; });
            };
            if (daPaginaAtual) daPagina.push(parar);
            return parar;
        },
        limparPagina: function () {
            daPagina.forEach(function (p) { p(); });
            daPagina = [];
        },
    };
})();

// preferências: carregadas em iniciarApp() depois de estabelecer a sessão
var prefs = { moeda: 'BRL' };

function salvarPrefs() {
    var chave = sessaoAtual() ? 'PREFS_' + sessaoAtual() : 'PREFS';
    armazem.set(chave, JSON.stringify(prefs));
}


/* =================================================================
   FORMATAÇÃO  [HERANÇA Dash Finance · FMT v1 + fmtPreco]
   ================================================================= */
function agruparMilhar(inteiro) {
    return inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function formatarBR(n, casas) {
    n = Number(n) || 0;
    var s = Math.abs(n).toFixed(casas);
    var partes = s.split('.');
    partes[0] = agruparMilhar(partes[0]);
    return (n < 0 && Number(s) !== 0 ? '-' : '') + partes.join(',');
}

// preço com casas adaptativas: 612.345,67 · 0,8712 · 0,00001234
function formatarPreco(n) {
    n = Number(n) || 0;
    var abs = Math.abs(n);
    if (abs >= 1 || abs === 0) return formatarBR(n, 2);
    var casas = Math.min(10, Math.max(2, 3 - Math.floor(Math.log10(abs))));
    var s = n.toFixed(casas).replace(/0+$/, '');
    if ((s.split('.')[1] || '').length < 2) s = n.toFixed(2);
    return s.replace('.', ',');
}

function formatarPct(n) {
    n = Number(n) || 0;
    return (n > 0 ? '+' : '') + formatarBR(n, 2) + '%';
}

// valores grandes: 1,23 tri · 845,6 bi · 12,3 mi
function formatarCompacto(n) {
    var abs = Math.abs(n);
    if (abs >= 1e12) return formatarBR(n / 1e12, 2) + ' tri';
    if (abs >= 1e9) return formatarBR(n / 1e9, 2) + ' bi';
    if (abs >= 1e6) return formatarBR(n / 1e6, 2) + ' mi';
    if (abs >= 1e3) return formatarBR(n / 1e3, 1) + ' mil';
    return formatarBR(n, 2);
}

function escapar(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}


/* =================================================================
   MOEDA DE EXIBIÇÃO  [ETAPA 0]
   Tudo é guardado em REAIS. Na hora de mostrar:
     BRL -> R$ 1.234,56
     USD -> US$ 228,61      (R$ ÷ USDTBRL da Binance)
     BTC -> ₿ 0,00201523    (R$ ÷ BTCBRL da Binance)
   As taxas vêm juntas numa chamada e ficam 5 min em cache. Sem taxa
   (offline, preview bloqueando), o seletor desativa US$ e ₿ e tudo
   continua em reais.

   COMO USAR NAS TELAS: marque o elemento com data-brl="1234.56" (e,
   opcional, data-tipo="preco" pra casas adaptativas). Ele é preenchido
   sozinho e se reescreve quando a moeda muda. Nada de redesenhar a tela.
   ================================================================= */
var MOEDAS = {
    BRL: { rotulo: 'R$', nome: 'Real' },
    USD: { rotulo: 'US$', nome: 'Dólar' },
    BTC: { rotulo: '₿', nome: 'Bitcoin' },
};

var TAXAS_TTL = 5 * 60 * 1000;

// [ETAPA 5.1] sinal ANTES do símbolo, como no Brasil: "-R$ 0,09" (não "R$ -0,09").
// Vale pra R$, US$ e ₿. Valor que arredonda pra zero não leva sinal.
function formatarMoeda(brl, tipo, moeda) {
    var n = Number(brl) || 0;
    var texto = formatarMoedaSemSinal(Math.abs(n), tipo, moeda);
    return n < 0 && /[1-9]/.test(texto) ? '-' + texto : texto;
}

function formatarMoedaSemSinal(brl, tipo, moeda) {
    moeda = moeda || estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    brl = Number(brl) || 0;

    // tipo: 'preco' (casas adaptativas), 'compacto' (1,23 bi) ou vazio (2 casas)
    function no(valor) {
        if (tipo === 'preco') return formatarPreco(valor);
        if (tipo === 'compacto') return formatarCompacto(valor);
        return formatarBR(valor, 2);
    }
    if (moeda === 'USD' && taxas.USD) {
        return 'US$ ' + no(brl / taxas.USD);
    }
    if (moeda === 'BTC' && taxas.BTC) {
        var btc = brl / taxas.BTC;
        if (tipo === 'compacto' && Math.abs(btc) >= 1000) return '₿ ' + formatarCompacto(btc);
        // bitcoin: 8 casas até 1 ₿; acima disso, 4 bastam
        return '₿ ' + formatarBR(btc, Math.abs(btc) >= 1 ? 4 : 8);
    }
    return 'R$ ' + no(brl);
}

function preencherValores(raiz) {
    (raiz || document).querySelectorAll('[data-brl]').forEach(function (el) {
        el.textContent = formatarMoeda(el.getAttribute('data-brl'), el.getAttribute('data-tipo'));
    });
}

function buscarTaxas() {
    var cache = armazem.json('TAXAS', null);
    if (cache && Date.now() - cache.em < TAXAS_TTL) {
        estado.definir('taxas', cache);
        return Promise.resolve(cache);
    }
    var simbolos = encodeURIComponent(JSON.stringify(['USDTBRL', 'BTCBRL']));
    return fetch(BINANCE + '/api/v3/ticker/price?symbols=' + simbolos)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var t = { em: Date.now() };
            lista.forEach(function (p) {
                if (p.symbol === 'USDTBRL') t.USD = Number(p.price);
                if (p.symbol === 'BTCBRL') t.BTC = Number(p.price);
            });
            armazem.set('TAXAS', JSON.stringify(t));
            estado.definir('taxas', t);
            return t;
        })
        .catch(function () {
            estado.definir('taxas', cache || {});   // cache velho é melhor que nada
            return cache;
        });
}

function trocarMoeda(m) {
    if (!MOEDAS[m]) return;
    prefs.moeda = m;
    salvarPrefs();
    estado.definir('moeda', m);
}

// a moeda muda -> todos os [data-brl] da tela se reescrevem
estado.ouvir('moeda', function () { preencherValores(); atualizarSeletoresMoeda(); });
estado.ouvir('taxas', function () { preencherValores(); atualizarSeletoresMoeda(); });

function seletorMoedaHTML() {
    return '<div class="segmentado" role="group" aria-label="Moeda de exibição" data-seletor-moeda>' +
        Object.keys(MOEDAS).map(function (m) {
            return '<button type="button" data-moeda="' + m + '" title="Mostrar valores em ' + MOEDAS[m].nome + '">' + MOEDAS[m].rotulo + '</button>';
        }).join('') + '</div>';
}

// [ETAPA 6.2] botão único do celular (ver atualizarChipMoeda)
function chipMoedaMobileHTML() {
    var atual = estado.ler('moeda') || 'BRL';
    return '<button type="button" id="moeda-chip" class="botao-icone moeda-chip" data-moeda-ciclo aria-label="Trocar moeda de exibição">' +
        MOEDAS[atual].rotulo + '</button>';
}

function atualizarSeletoresMoeda() {
    var atual = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    document.querySelectorAll('[data-seletor-moeda] button').forEach(function (b) {
        var m = b.getAttribute('data-moeda');
        b.setAttribute('aria-pressed', m === atual ? 'true' : 'false');
        // sem taxa, não dá pra converter: desativa e explica
        b.disabled = m !== 'BRL' && !taxas[m];
        if (b.disabled) b.title = 'Sem cotação de ' + MOEDAS[m].nome + ' agora (sem conexão com a Binance).';
    });
    atualizarChipMoeda(atual, taxas); // [ETAPA 6.2]
}

// [ETAPA 6.2 · 30/09/2026] CHIP DE MOEDA DO CELULAR
// O seletor de 3 botões (R$ / US$ / ₿) tem uns 125px — de sobra no
// computador, mas foi uma das duas causas do sanduíche sumir em tela
// estreita (a outra era o avatar, ver atualizarInfoUsuario). No topo do
// celular ele vira UM botão só (~38px, do tamanho dos outros ícones),
// mostrando a moeda atual; tocar cicla pra próxima disponível (pula a que
// estiver sem cotação). O seletor de 3 botões continua igual em Ajustes.
function ordemMoedasDisponiveis(taxas) {
    return Object.keys(MOEDAS).filter(function (m) { return m === 'BRL' || taxas[m]; });
}

function proximaMoeda(atual, taxas) {

var menosMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// número desliza do valor antigo até o novo (~600ms)
function animarNumero(el, de, para, formatador, duracao) {
    if (menosMovimento || de === para) { el.textContent = formatador(para); return; }
    duracao = duracao || 600;
    var inicio = null;
    if (el._animacao) cancelAnimationFrame(el._animacao);
    function passo(t) {
        if (!inicio) inicio = t;
        var p = Math.min((t - inicio) / duracao, 1);
        var suave = 1 - Math.pow(1 - p, 3);          // desacelera no fim
        el.textContent = formatador(de + (para - de) * suave);
        if (p < 1) el._animacao = requestAnimationFrame(passo);
    }
    el._animacao = requestAnimationFrame(passo);
}

// pisca verde/vermelho quando o preço muda (estilo Binance)
function piscar(el, subiu) {
    el.classList.remove('pisca-alta', 'pisca-queda');
    void el.offsetWidth;                            // reinicia a animação
    el.classList.add(subiu ? 'pisca-alta' : 'pisca-queda');
}

function avisar(texto, tipo) {
    var caixa = document.getElementById('avisos');
    var el = document.createElement('div');
    el.className = 'aviso ' + (tipo || '');
    el.textContent = texto;
    caixa.appendChild(el);
    setTimeout(function () {
        el.style.transition = 'opacity 200ms ease';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 220);
    }, 3200);
}
