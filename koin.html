// DE ONDE VEM CADA DADO
//   Posições e lucros: motor de lançamentos (carteiraAtual).
//   Preço e variação 24h ao vivo: Binance (REST na abertura e WebSocket, com
//   o amortecedor de 5s). Moeda sem par na Binance usa o preço do pacote
//   diário e entra "sem cotação ao vivo".
//   Histórico do gráfico: klines diárias da Binance (par USDT x USDTBRL do
//   mesmo dia), uma chamada por moeda que a carteira já teve.
// Moeda que a Binance não negocia (ou que saiu do top 100) fica de fora da
// cotação e, no gráfico, entra pelo custo. A tela avisa.

// alocação: 5 cores categóricas na ordem validada (pares vizinhos, inclusive
// fechando o anel, passam na checagem de daltonismo no fundo escuro) + cinza
// para "Outras". Ficam de fora o verde e o vermelho, reservados pra alta e queda.
var ALOCACAO_CORES = ['#3987e5', '#d95926', '#9085e9', '#c98500', '#d55181'];
var ALOCACAO_OUTRAS = '#6B7791';
var PF_PERIODOS = { '1M': 30, '3M': 90, '6M': 180, '1A': 365, 'Tudo': 0 };

var portfolioPg = null;

function sairDoPortfolio() {
    if (!portfolioPg) return;
    var pg = portfolioPg;
    portfolioPg = null;
    if (pg.canal) pg.canal.parar();
    if (pg.amortecedor) pg.amortecedor.parar();
    if (pg.chart) { try { pg.chart.remove(); } catch (e) {} }
}

// canal do WebSocket da Binance, com reconexão de espera crescente
function abrirCanalAoVivo(streams, aoTick) {
    var canal = { ws: null, tentativas: 0, timer: null, parado: false };
    function abrir() {
        estado.definir('conexao', 'conectando');
        var ws;
        try { ws = new WebSocket(BINANCE_WS + streams.join('/')); } catch (e) { estado.definir('conexao', 'off'); return; }
        canal.ws = ws;
        ws.onopen = function () { canal.tentativas = 0; estado.definir('conexao', 'ao-vivo'); };
        ws.onmessage = function (ev) {
            var msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            var d = msg && msg.data;
            if (d && d.s) aoTick(d.s, Number(d.c), Number(d.o));
        };
        ws.onclose = function () {
            if (canal.parado || canal.ws !== ws) return;
            canal.ws = null;
            estado.definir('conexao', 'off');
            var espera = Math.min(60000, 2000 * Math.pow(2, canal.tentativas++));
            canal.timer = setTimeout(function () { if (!canal.parado) abrir(); }, espera);
        };
        ws.onerror = function () { /* onclose cuida */ };
    }
    abrir();
    return {
        parar: function () {
            canal.parado = true;
            clearTimeout(canal.timer);
            if (canal.ws) { var ws = canal.ws; canal.ws = null; try { ws.close(); } catch (e) {} }
        },
    };
}

// ordem em que a moeda entrou na carteira: a cor da alocação segue a moeda,
// não o tamanho dela (moeda que cresce não troca de cor)
function ordemDeEntrada() {
    var ordem = {};
    var n = 0;
    ordenarTransacoes(lerBanco().transacoes).forEach(function (t) {
        pernasDaTransacao(t).forEach(function (p) { if (ordem[p.moedaId] === undefined) ordem[p.moedaId] = n++; });
    });
    return ordem;
}

function calcularPortfolio(pg) {
    var linhas = pg.linhas.map(function (l) {
        var p = l.pos;
        var saldo = l.preco !== null ? p.quantidade * l.preco : null;
        var base = saldo !== null ? saldo : p.custoTotal;          // sem cotação entra pelo custo
        var antes = saldo !== null && l.var24h !== null ? saldo / (1 + l.var24h / 100) : base;
        return {
            l: l,
            saldo: saldo,
            base: base,
            antes: antes,
            pm: p.qtdComCusto > QTD_EPSILON ? p.custoTotal / p.qtdComCusto : null,
            lucro: base - p.custoTotal,
            rent: saldo !== null && p.custoTotal > 0 ? (saldo - p.custoTotal) / p.custoTotal * 100 : null,
        };
    });
    var t = { saldo: 0, custo: 0, antes: 0, semCotacao: 0 };
    linhas.forEach(function (x) {
        t.saldo += x.base;
        t.custo += x.l.pos.custoTotal;
        t.antes += x.antes;
        if (x.saldo === null) t.semCotacao++;
    });
    linhas.forEach(function (x) { x.pct = t.saldo > 0 ? x.base / t.saldo * 100 : 0; });
    return {
        linhas: linhas,
        saldo: t.saldo,
        custo: t.custo,
        lucroNR: t.saldo - t.custo,
        lucroNRpct: t.custo > 0 ? (t.saldo - t.custo) / t.custo * 100 : null,
        var24h: t.saldo - t.antes,
        var24hPct: t.antes > 0 ? (t.saldo / t.antes - 1) * 100 : null,
        semCotacao: t.semCotacao,
        realizado: pg.realizado,
    };
}

// fatias da rosca: as 5 maiores com cor própria e o resto em "Outras"
function montarFatias(r) {
    var ordem = ordemDeEntrada();
    var porTamanho = r.linhas.filter(function (x) { return x.base > 0; })
        .sort(function (a, b) { return b.base - a.base; });
    var principais = porTamanho.length > ALOCACAO_CORES.length ? porTamanho.slice(0, ALOCACAO_CORES.length) : porTamanho;
    var resto = porTamanho.slice(principais.length);
    var porEntrada = principais.slice().sort(function (a, b) { return ordem[a.l.id] - ordem[b.l.id]; });
    var cor = {};
    porEntrada.forEach(function (x, i) { cor[x.l.id] = ALOCACAO_CORES[i]; });
    var fatias = principais.map(function (x) { return { ids: [x.l.id], nome: x.l.info.simbolo, cor: cor[x.l.id] }; });
    if (resto.length) fatias.push({ ids: resto.map(function (x) { return x.l.id; }), nome: 'Outras', cor: ALOCACAO_OUTRAS });
    return fatias;
}

function baseDaFatia(r, f) {
    return r.linhas.filter(function (x) { return f.ids.indexOf(x.l.id) !== -1; })
        .reduce(function (s, x) { return s + x.base; }, 0);
}

var ROSCA_R = 70;
var ROSCA_C = 2 * Math.PI * ROSCA_R;

// [ETAPA 4.1] 2px de respiro entre fatias; com uma fatia só, anel inteiro (sem fenda)
function respiroRosca(qtdFatias) {
    return qtdFatias > 1 ? 2 : 0;
}

function roscaHTML(r, fatias) {
    var acumulado = 0;
    var segmentos = fatias.map(function (f, i) {
        var frac = r.saldo > 0 ? baseDaFatia(r, f) / r.saldo : 0;
        var comp = Math.max(frac * ROSCA_C - respiroRosca(fatias.length), 0);
        var seg = '<circle class="rosca-fatia" data-fatia="' + i + '" cx="90" cy="90" r="' + ROSCA_R + '" fill="none" stroke="' + f.cor + '" stroke-width="22" ' +
            'stroke-dasharray="' + comp.toFixed(2) + ' ' + (ROSCA_C - comp).toFixed(2) + '" stroke-dashoffset="' + (-acumulado).toFixed(2) + '" transform="rotate(-90 90 90)">' +
            '<title>' + escapar(f.nome) + ': ' + formatarBR(frac * 100, 1) + '%</title></circle>';
        acumulado += frac * ROSCA_C;
        return seg;
    }).join('');
    return '<svg class="rosca" viewBox="0 0 180 180" role="img" aria-label="Alocação da carteira por moeda">' +
        '<circle cx="90" cy="90" r="' + ROSCA_R + '" fill="none" stroke="var(--superficie-2)" stroke-width="22"/>' +
        segmentos + '<text x="90" y="86" text-anchor="middle" class="rosca-total">' + r.linhas.length + '</text>' +
        '<text x="90" y="104" text-anchor="middle" class="rosca-rotulo">' + (r.linhas.length === 1 ? 'moeda' : 'moedas') + '</text></svg>';
}

            '<span class="rosca-nome">' + escapar(f.nome) + '</span>' +
            '<span class="rosca-pct">' + formatarBR(r.saldo > 0 ? base / r.saldo * 100 : 0, 1) + '%</span>' +

// ---------- preços ----------
function precoInicialDaLinha(l, tickers, usdtbrl) {
    var d = l.par ? tickers[l.par] : null;
    if (d && usdtbrl) {
        l.preco = l.par === 'USDTBRL' ? Number(d.lastPrice) : Number(d.lastPrice) * usdtbrl;
        l.var24h = Number(d.priceChangePercent);
        l.aoVivo = true;
        return;
    }
    var m = mercado.porId[l.id];          // pacote diário: pode ter horas
    l.preco = m && m.preco > 0 ? m.preco : null;
    l.var24h = m && m.var24h != null ? m.var24h : null;
    l.aoVivo = false;
}

function carregarPrecosPortfolio(pg) {
    var pares = [];
    pg.linhas.forEach(function (l) { if (l.par && pares.indexOf(l.par) === -1) pares.push(l.par); });
    if (!pares.length) { pg.linhas.forEach(function (l) { precoInicialDaLinha(l, {}, null); }); return Promise.resolve(); }
    var simbolos = pares.slice();
    if (simbolos.indexOf('USDTBRL') === -1) simbolos.push('USDTBRL');
    return fetch(BINANCE + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(simbolos)))
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var por = {};
            lista.forEach(function (d) { por[d.symbol] = d; });
            pg.usdtbrl = por.USDTBRL ? Number(por.USDTBRL.lastPrice) : null;
            pg.linhas.forEach(function (l) { precoInicialDaLinha(l, por, pg.usdtbrl); });
        })
        .catch(function () { pg.linhas.forEach(function (l) { precoInicialDaLinha(l, {}, null); }); });
}

function aplicarTickPortfolio(simbolo, fechamento, abertura) {
    var pg = portfolioPg;
    if (!pg) return;
    pg.linhas.forEach(function (l) {
        if (l.par !== simbolo) return;
        var taxa = simbolo === 'USDTBRL' ? 1 : pg.usdtbrl;
        if (!taxa) return;
        l.preco = fechamento * taxa;
        if (abertura > 0) l.var24h = (fechamento / abertura - 1) * 100;
        l.aoVivo = true;
    });
    if (pg.agendado) return;
    pg.agendado = true;      // o lote inteiro (várias moedas) redesenha uma vez só
    setTimeout(function () { pg.agendado = false; if (portfolioPg === pg) atualizarPortfolioTela(); }, 0);
}

// ---------- atualização na tela ----------
function escreverBRL(id, valor, tipo) {
    var el = document.getElementById(id);
    if (!el) return null;
    el.setAttribute('data-brl', valor);
    if (tipo) el.setAttribute('data-tipo', tipo);
    el.textContent = formatarMoeda(valor, tipo);
    return el;
}

function classeGanho(el, valor) {
    if (!el) return;
    el.classList.toggle('ganho', valor > 0);
    el.classList.toggle('perda', valor < 0);
}

function atualizarPortfolioTela() {
    var pg = portfolioPg;
    if (!pg || !document.getElementById('pf-saldo')) return;
    var r = calcularPortfolio(pg);
    pg.ultimo = r;

    // saldo grande: desliza até o valor novo
    var saldoEl = document.getElementById('pf-saldo');
    var de = Number(saldoEl.getAttribute('data-brl'));
    saldoEl.setAttribute('data-brl', r.saldo);
    if (pg.primeiraLeitura || !isFinite(de)) saldoEl.textContent = formatarMoeda(r.saldo);
    else animarNumero(saldoEl, de, r.saldo, function (v) { return formatarMoeda(v); }, 450);

    var v24 = document.getElementById('pf-var');
    if (v24) {
        v24.innerHTML = r.var24hPct === null ? '<span class="sem-dado">—</span>' :
            '<span class="var ' + (r.var24h >= 0 ? 'alta' : 'queda') + '" data-brl="' + r.var24h + '">' + formatarMoeda(r.var24h) + '</span> ' + varHTML(r.var24hPct, true);
    }

    escreverBRL('pf-custo', r.custo);
    var lucro = escreverBRL('pf-lucro', r.lucroNR);
    classeGanho(lucro, r.lucroNR);
    var notaL = document.getElementById('pf-lucro-nota');
    if (notaL) notaL.textContent = !r.linhas.length ? 'sem moedas em carteira' : (r.lucroNRpct === null ? 'custo zero' : formatarPct(r.lucroNRpct) + ' sobre o custo');
    var real = escreverBRL('pf-realizado', r.realizado.total);
    classeGanho(real, r.realizado.total);
    var notaR = document.getElementById('pf-realizado-nota');
    if (notaR) notaR.textContent = r.realizado.vendas ? r.realizado.vendas + (r.realizado.vendas === 1 ? ' venda' : ' vendas') : 'sem vendas ainda';
    var res = escreverBRL('pf-resultado', r.lucroNR + r.realizado.total);
    classeGanho(res, r.lucroNR + r.realizado.total);
    var notaT = document.getElementById('pf-resultado-nota');
    if (notaT) notaT.textContent = 'não realizado mais realizado';

    // tabela: só as células que mudam, com pisca no preço
    r.linhas.forEach(function (x) {
        var tr = document.querySelector('#tabela-portfolio tr[data-moeda-id="' + x.l.id + '"]');
        if (!tr) return;
        var preco = tr.querySelector('[data-cel="preco"]');
        if (preco && x.l.preco !== null) {
            var antes = Number(preco.getAttribute('data-brl'));
            if (Math.abs(x.l.preco - antes) / (antes || 1) > 1e-7) {
                preco.setAttribute('data-brl', x.l.preco);
                if (!pg.primeiraLeitura) piscar(preco, x.l.preco > antes);
                animarNumero(preco, antes, x.l.preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
            }
        }
        tr.querySelector('[data-cel="var24h"]').innerHTML = pctCelula(x.l.var24h);
        if (x.saldo !== null) tr.querySelector('[data-cel="saldo"]').innerHTML = '<span data-brl="' + x.saldo + '">' + formatarMoeda(x.saldo) + '</span>';
        tr.querySelector('[data-cel="lucro"]').innerHTML = lucroCelulaHTML(x);
        tr.querySelector('[data-cel="pct"]').textContent = formatarBR(x.pct, 1) + '%';
        preencherValores(tr);
    });

    // rosca e legenda
    var acumulado = 0;
    pg.fatias.forEach(function (f, i) {
        var base = baseDaFatia(r, f);
        var frac = r.saldo > 0 ? base / r.saldo : 0;
        var comp = Math.max(frac * ROSCA_C - respiroRosca(pg.fatias.length), 0);
        var seg = document.querySelector('.rosca-fatia[data-fatia="' + i + '"]');
        if (seg) {
            seg.setAttribute('stroke-dasharray', comp.toFixed(2) + ' ' + (ROSCA_C - comp).toFixed(2));
            seg.setAttribute('stroke-dashoffset', (-acumulado).toFixed(2));
        }
        acumulado += frac * ROSCA_C;
        var leg = document.querySelector('[data-fatia-leg="' + i + '"]');
        if (leg) {
            leg.querySelector('.rosca-pct').textContent = formatarBR(frac * 100, 1) + '%';
            var val = leg.querySelector('.rosca-valor');
            val.setAttribute('data-brl', base);
            val.textContent = formatarMoeda(base);
        }
    });

    atualizarUltimoPontoPortfolio(r);
    pg.primeiraLeitura = false;
}

// ---------- gráfico de evolução ----------
function buscarKlinesDiarias(simbolo, desdeMs) {
    var url = BINANCE + '/api/v3/klines?symbol=' + simbolo + '&interval=1d&startTime=' + desdeMs + '&limit=1000';
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('klines ' + r.status); return r.json(); });
}

// { 'AAAA-MM-DD': fechamento } em reais, por moeda
function buscarHistoricosPortfolio(pg, transacoes) {
    var primeiro = ordenarTransacoes(transacoes)[0].data;
    var limite = new Date(); limite.setUTCDate(limite.getUTCDate() - 998);
    var desde = new Date(primeiro + 'T00:00:00Z');
    if (desde < limite) desde = limite;
    desde.setUTCDate(desde.getUTCDate() - 1);
    var desdeMs = desde.getTime();

    var ids = [];
    transacoes.forEach(function (t) {
        pernasDaTransacao(t).forEach(function (p) { if (ids.indexOf(p.moedaId) === -1) ids.push(p.moedaId); });
    });
    return obterPrecosBinance().then(function (binance) {
        var pares = {};
        ids.forEach(function (id) {
            var m = mercado.porId[id];
            var par = m ? parBinanceDe(m, binance) : null;
            if (par) pares[id] = par;
        });
        var simbolos = [];
        Object.keys(pares).forEach(function (id) { if (simbolos.indexOf(pares[id]) === -1) simbolos.push(pares[id]); });
        if (simbolos.indexOf('USDTBRL') === -1) simbolos.push('USDTBRL');
        return Promise.all(simbolos.map(function (s) {
            return buscarKlinesDiarias(s, desdeMs).then(function (k) { return [s, k]; });
        })).then(function (resp) {
            var porPar = {};
            resp.forEach(function (x) {
                var mapa = {};
                x[1].forEach(function (c) { mapa[new Date(c[0]).toISOString().slice(0, 10)] = Number(c[4]); });
                porPar[x[0]] = mapa;
            });
            var dolar = porPar.USDTBRL || {};
            var dias = Object.keys(dolar).sort();
            var precos = {};
            Object.keys(pares).forEach(function (id) {
                var mapa = porPar[pares[id]];
                var saida = {};
                if (pares[id] === 'USDTBRL') {
                    saida = mapa;
                } else {
                    var taxa = null;
                    Object.keys(mapa).sort().forEach(function (dia) {
                        if (dolar[dia] !== undefined) taxa = dolar[dia];
                        if (taxa !== null) saida[dia] = mapa[dia] * taxa;
                    });
                }
                precos[id] = saida;
            });
            return precos;
        });
    });
}

function pontosDoPeriodo(pg) {
    var todos = pg.evolucao.pontos;
    var dias = PF_PERIODOS[pg.periodo];
    if (!dias) return todos;
    return todos.slice(Math.max(todos.length - dias, 0));
}

function escalarPonto(v) {
    return v * fatorExibicao();
}

function desenharEvolucao(ajustar) {
    var pg = portfolioPg;
    if (!pg || !pg.chart || !pg.evolucao) return;
    var pontos = pontosDoPeriodo(pg);
    pg.serieValor.setData(pontos.map(function (p) { return { time: p.time, value: escalarPonto(p.valor) }; }));
    pg.serieCusto.setData(pontos.map(function (p) { return { time: p.time, value: escalarPonto(p.custo) }; }));
    if (ajustar) pg.chart.timeScale().fitContent();
}

function atualizarUltimoPontoPortfolio(r) {
    var pg = portfolioPg;
    if (!pg || !pg.serieValor || !pg.evolucao || !pg.evolucao.pontos.length) return;
    var ultimo = pg.evolucao.pontos[pg.evolucao.pontos.length - 1];
    ultimo.valor = r.saldo;
    ultimo.custo = r.custo;
    pg.serieValor.update({ time: ultimo.time, value: escalarPonto(ultimo.valor) });
    pg.serieCusto.update({ time: ultimo.time, value: escalarPonto(ultimo.custo) });
}

// [ETAPA 4.1] a escala enquadra as DUAS linhas (patrimônio e custo). Antes só
// a do patrimônio contava e o custo podia ficar fora do gráfico. Também impõe
// uma faixa mínima (2% do valor): com carteira pequena, uma variação de
// centavos não pode parecer uma queda enorme.
function autoscalePortfolio(original) {
    var pg = portfolioPg;
    if (!pg || !pg.evolucao) return original();
    var f = fatorExibicao();
    var min = Infinity, max = -Infinity;
    pontosDoPeriodo(pg).forEach(function (p) {
        [p.valor * f, p.custo * f].forEach(function (v) {
            if (v < min) min = v;
            if (v > max) max = v;
        });
    });
    if (!isFinite(min)) return original();
    var faixaMinima = Math.abs(max) * 0.02;
    if (max - min < faixaMinima) {
        var meio = (max + min) / 2;
        min = meio - faixaMinima / 2;
        max = meio + faixaMinima / 2;
    }
    return { priceRange: { minValue: min, maxValue: max }, margins: { above: 0.12, below: 0.08 } };
}

function criarGraficoPortfolio() {
    var pg = portfolioPg;
    var LW = window.LightweightCharts;
    var chart = LW.createChart(document.getElementById('pf-grafico'), {
        autoSize: true,
        layout: { attributionLogo: false, background: { type: 'solid', color: 'transparent' }, textColor: corCss('--texto-2'), fontFamily: 'Manrope, system-ui, sans-serif', fontSize: ehTelaPequena() ? 10 : 12 },
        grid: { vertLines: { color: corCss('--borda') }, horzLines: { color: corCss('--borda') } },
        rightPriceScale: { borderColor: corCss('--borda'), scaleMargins: { top: 0.12, bottom: 0.08 } },
        timeScale: { borderColor: corCss('--borda') },
        crosshair: {
            mode: LW.CrosshairMode.Normal,
            vertLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
            horzLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
        },
        localization: { priceFormatter: formatarEixo },
    });
    pg.chart = chart;
    var formato = { type: 'custom', formatter: formatarEixo, minMove: 1e-10 };
    pg.serieCusto = chart.addLineSeries({ color: corCss('--texto-3'), lineWidth: 2, lineStyle: LW.LineStyle.Dashed, priceFormat: formato, lastValueVisible: false, priceLineVisible: false, autoscaleInfoProvider: autoscalePortfolio });
    pg.serieValor = chart.addLineSeries({ color: '#3987e5', lineWidth: 2, priceFormat: formato, lastValueVisible: true, priceLineVisible: true, autoscaleInfoProvider: autoscalePortfolio });
    chart.subscribeCrosshairMove(function (param) {
        var leg = document.getElementById('pf-grafico-legenda');
        if (!leg || !portfolioPg) return;
        var v = param && param.seriesData && param.seriesData.get(pg.serieValor);
        var c = param && param.seriesData && param.seriesData.get(pg.serieCusto);
        if (!param || !param.time || !v) { leg.innerHTML = ''; return; }
        var quando = new Date(param.time + 'T00:00:00Z').toLocaleDateString('pt-BR', { timeZone: 'UTC', day: '2-digit', month: 'short', year: 'numeric' });
        leg.innerHTML = quando + ' · Patrimônio <strong>' + formatarExibido(v.value) + '</strong>' +
            (c ? ' · Custo <strong>' + formatarExibido(c.value) + '</strong>' : '');
    });
}

function carregarEvolucao() {
    var pg = portfolioPg;
    var transacoes = lerBanco().transacoes;
    if (!transacoes.length) return;
    var msg = document.getElementById('pf-grafico-msg');
    buscarHistoricosPortfolio(pg, transacoes).then(function (precos) {
        if (portfolioPg !== pg) return;
        var hoje = new Date().toISOString().slice(0, 10);
        pg.evolucao = reconstruirEvolucao(transacoes, precos, hoje);
        return carregarLightweight().then(function () {
            if (portfolioPg !== pg) return;
            criarGraficoPortfolio();
            desenharEvolucao(true);
            if (pg.ultimo) atualizarUltimoPontoPortfolio(pg.ultimo);
            if (msg) msg.hidden = true;
            var nota = document.getElementById('pf-grafico-nota');
            if (nota && pg.evolucao.aCusto.length) {
                nota.hidden = false;
                nota.textContent = 'Sem histórico de preço na Binance, entram pelo custo: ' +
                    pg.evolucao.aCusto.map(function (id) { return infoMoeda(id).simbolo; }).join(', ') + '.';
            }
        });
    }).catch(function () {
        if (portfolioPg !== pg || !msg) return;
        msg.hidden = false;
        msg.textContent = 'Não consegui carregar o histórico de preços agora. Recarregue a página para tentar de novo.';
    });
}

ROTAS['/portfolio'].montar = function () {
    var raiz = document.getElementById('pf-conteudo');
    var banco = lerBanco();
    if (!banco.transacoes.length) { raiz.innerHTML = portfolioVazioHTML(); return; }

    var carteira = carteiraAtual();
    var realizado = { total: 0, vendas: 0 };
    Object.keys(carteira.realizado).forEach(function (k) { realizado.total += carteira.realizado[k]; realizado.vendas++; });

    var pronto = mercado.lista.length ? Promise.resolve() : carregarMercado().catch(function () {});
    pronto.then(function () {
        if (rotaAtual !== '/portfolio' || !document.getElementById('pf-conteudo')) return;
        var pg = portfolioPg = { linhas: [], realizado: realizado, periodo: 'Tudo', primeiraLeitura: true, usdtbrl: null };

        return obterPrecosBinance().catch(function () { return {}; }).then(function (binance) {
            Object.keys(carteira.posicoes).forEach(function (id) {
                var p = carteira.posicoes[id];
                if (p.quantidade <= QTD_EPSILON) return;
                var m = mercado.porId[id];
                pg.linhas.push({ id: id, info: infoMoeda(id), pos: p, par: m ? parBinanceDe(m, binance) : null, preco: null, var24h: null, aoVivo: false });
            });
            return carregarPrecosPortfolio(pg);
        }).then(function () {
            if (portfolioPg !== pg) return;
            var r = calcularPortfolio(pg);
            r.linhas.sort(function (a, b) { return b.base - a.base; });
            pg.linhas = r.linhas.map(function (x) { return x.l; });
            pg.fatias = montarFatias(r);
            raiz.innerHTML = portfolioHTML(pg, r, pg.fatias);
            preencherValores(raiz);
            // [ETAPA 4.1] tudo vendido: nada pra conectar, sem indicador
            if (!pg.linhas.length) { var indicador = document.getElementById('conexao'); if (indicador) indicador.remove(); }
            estado.ouvir('conexao', atualizarStatusConexao, true);
            atualizarStatusConexao(estado.ler('conexao') || 'conectando');
            atualizarPortfolioTela();

            estado.ouvir('moeda', function () {
                preencherValores();
                desenharEvolucao(false);
                if (pg.ultimo) atualizarPortfolioTela();
            }, true);
            estado.ouvir('taxas', function () { desenharEvolucao(false); }, true);

            var pares = [];
            pg.linhas.forEach(function (l) { if (l.par && pares.indexOf(l.par) === -1) pares.push(l.par); });
            if (pares.length) {
                var streams = pares.map(function (p) { return p.toLowerCase() + '@miniTicker'; });
                if (pares.indexOf('USDTBRL') === -1) streams.push('usdtbrl@miniTicker');
                pg.amortecedor = criarAmortecedor(function (simbolo, t) { aplicarTickPortfolio(simbolo, t.c, t.o); });
                pg.canal = abrirCanalAoVivo(streams, function (simbolo, c, o) {
                    if (simbolo === 'USDTBRL') pg.usdtbrl = c;
                    pg.amortecedor.guardar(simbolo, { c: c, o: o });
                });
            } else {
                estado.definir('conexao', 'off');
            }
            carregarEvolucao();
        });
    });
};

/* =================================================================
   CELULAR  [ETAPA 5 · 29/09/2026]
   Navegação por menu sanduíche que abre por cima da tela (sem barra
   inferior, por enquanto), busca que abre numa segunda linha do topo, ordem
   do Mercado por seletor e toque na linha da moeda. O layout em si mora no
   bloco CELULAR do CSS (abaixo de 768px, como no Dash Finance).
   ================================================================= */
function ehTelaPequena() {
    try { return window.matchMedia('(max-width: 768px)').matches; } catch (e) { return false; }
}

function fecharMenuMobile() {
    var menu = document.getElementById('menu-mobile');
    if (!menu || !menu.classList.contains('aberto')) return;
    menu.classList.remove('aberto');
    menu.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
}

function fecharBuscaMobile() {
    var topo = document.querySelector('.topo');
    if (topo) topo.classList.remove('busca-aberta');
}

document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-menu-abrir]')) {
        var menu = document.getElementById('menu-mobile');
        fecharBuscaMobile();
        menu.classList.add('aberto');
        menu.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
    }
    if (ev.target.closest('[data-menu-fechar]')) { fecharMenuMobile(); return; }

    var chipMoeda = ev.target.closest('[data-moeda-ciclo]');
    if (chipMoeda) {
        var taxasAtuais = estado.ler('taxas') || {};
        trocarMoeda(proximaMoeda(estado.ler('moeda'), taxasAtuais));
        return;
    }

    // [ETAPA 6.2] avatar do topo: no celular é o segundo jeito de abrir o
    // menu (pedido original do Junior: "acesso pelo ícone do usuário"). Só
    // dispara se o toque não foi no "Sair" (que só existe visível no
    // computador, com sua própria ação).
    var avatarTopo = ev.target.closest('[data-usuario-topo]');
    if (avatarTopo && !ev.target.closest('[data-sair]') && ehTelaPequena()) {
        var menuAv = document.getElementById('menu-mobile');
        fecharBuscaMobile();
        menuAv.classList.add('aberto');
        menuAv.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
    }

    if (ev.target.closest('[data-busca-toggle]')) {
        var topo = document.querySelector('.topo');
        var abrir = !topo.classList.contains('busca-aberta');
        topo.classList.toggle('busca-aberta', abrir);
        if (abrir) document.getElementById('busca-global').focus();
        return;
    }

    // toque na linha inteira leva pra moeda (a estrela e o link têm ação própria)
    if (!ehTelaPequena() || ev.target.closest('a, button')) return;
    var linha = ev.target.closest('.tabela-mercado tbody tr[data-moeda-id], .tabela-portfolio tbody tr[data-moeda-id]');
    if (linha) navegar('/moeda/' + linha.getAttribute('data-moeda-id'));
});

document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { fecharMenuMobile(); fecharBuscaMobile(); }
});

// [ETAPA 5.1] bolinhas dos cartões de destaque: acende a do cartão que está à
// vista (IntersectionObserver) e o toque numa bolinha leva ao cartão
var observadorDestaques = null;

function ligarPaginadorDestaques() {
    var faixa = document.querySelector('#destaques-mercado .destaques');
    if (!faixa || !('IntersectionObserver' in window)) return;
    var cartoes = Array.prototype.slice.call(faixa.querySelectorAll('.destaque'));
    var pontos = document.querySelectorAll('[data-destaque-ir]');
    if (observadorDestaques) observadorDestaques.disconnect();
    observadorDestaques = new IntersectionObserver(function (itens) {
        itens.forEach(function (it) {
            if (!it.isIntersecting) return;
            var i = cartoes.indexOf(it.target);
            pontos.forEach(function (p, k) { p.classList.toggle('ativo', k === i); });
        });
    }, { root: faixa, threshold: 0.6 });
    cartoes.forEach(function (c) { observadorDestaques.observe(c); });
}

document.addEventListener('click', function (ev) {
    var ponto = ev.target.closest('[data-destaque-ir]');
    if (!ponto) return;
    var faixa = document.querySelector('#destaques-mercado .destaques');
    var cartao = faixa && faixa.querySelectorAll('.destaque')[Number(ponto.getAttribute('data-destaque-ir'))];
    if (!cartao) return;
    faixa.scrollTo({ left: faixa.scrollLeft + cartao.getBoundingClientRect().left - faixa.getBoundingClientRect().left - 16, behavior: 'smooth' });
});

document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'ord-mobile') return;
    var p = ev.target.value.split(':');
    mercado.ordem = { campo: p[0], desc: p[1] === '1' };
    desenharTabela(false);
});


/* =================================================================
   INÍCIO  [ETAPA 6: verificar sessão antes de iniciar o app]
   ================================================================= */
function iniciarApp() {
    var chavePrefs = sessaoAtual() ? 'PREFS_' + sessaoAtual() : 'PREFS';
    prefs = armazem.json(chavePrefs, { moeda: 'BRL' });
    estado.definir('taxas', armazem.json('TAXAS', {}) || {});
    estado.definir('moeda', MOEDAS[prefs.moeda] ? prefs.moeda : 'BRL');
    estado.definir('conexao', 'conectando');
    rotaAtual = lerRotaDoEndereco() || ROTA_INICIAL;
    desenhar();
    atualizarInfoUsuario();
    buscarTaxas();
    atualizarPulso();
    setInterval(atualizarPulso, 30000);
    setInterval(buscarTaxas, TAXAS_TTL);
}

carregarArmazenamento().then(function () {
    var usuarios = lerUsuarios();
    var id = sessaoAtual();
    var valido = id && usuarios.some(function (u) { return u.id === id; });
    if (valido) {
        iniciarApp();
    } else {
        mostrarTelaDeEntrada(usuarios);
    }
});

})();
</script>
