<!DOCTYPE html>
<!--
  Koin · gestor de portfólio cripto (nome provisório)
  BitCoderSoft · single-file (HTML + CSS + JS), sem etapa de build

  ==================================================================
  GUIA DE MANUTENÇÃO
  ==================================================================
  Toda mudança leva uma tag no comentário do código ([ETAPA 0], [ETAPA 1]...).
  Busque pela tag pra achar tudo o que uma etapa mexeu.

  Plano (combinado em 29/09/2026):
    0. Fundação      design system, casca, roteador, estado, armazenamento
                     (0.1: navegação no topo com menus suspensos, sem lateral)
    1. Mercado       tabela de moedas, busca, favoritos, preços ao vivo
    2. Moeda         página de detalhe com gráfico interativo
    3. Motor         compra, venda, entrada, saída, conversão + validação
    4. Portfólio     resumo, evolução real, alocação, tabela
    5. Extras        balanceamento, objetivos, alertas, backup
    6. Responsivo    barra inferior, telas de app
    7. PWA           manifest, service worker, instalação

  Decisões de base:
    - Tema ESCURO primeiro. O claro já tem os tokens mapeados (comentados
      em :root[data-tema="claro"]), ativa numa etapa futura.
    - Moeda de exibição: Real (padrão), Dólar ou Bitcoin. Todo valor do
      app é guardado e calculado em REAIS; a conversão acontece só na hora
      de mostrar (ver formatarMoeda e o atributo data-brl).
    - Sem login: os dados ficam no dispositivo de quem usa. Backup em
      arquivo cobre a troca de aparelho (Etapa 5).
    - Herança do Dash Finance: armazenamento com fallback pro preview do
      claude.ai, navegação sem href, formulários sem submit nativo,
      formatação pt-BR. Tudo reaproveitado e marcado como [HERANÇA].

  [ETAPA 0 · 29/09/2026] fundação entregue.
  [ETAPA 1 · 29/09/2026] mercado: CoinGecko (100 maiores, 5 min de cache,
                          chave opcional) + Binance WebSocket ao vivo,
                          destaques, abas, ordenação, favoritos, busca.
  [ETAPA 1.1 · 29/09/2026] CoinGecko exige chave (403 sem ela): chave Demo
                          embutida + regra de no máximo 1 chamada por dia.
  [ETAPA 1.2 · 29/09/2026] largura máxima 1240 -> 1400px e colunas fixas na
                          tabela do Mercado (sem rolagem, nome perto do preço).
  [ETAPA 2 · 29/09/2026] página da moeda: gráfico interativo (Lightweight
                          Charts), estatísticas, conversor e regra de 5s
                          na troca do preço nos painéis.
  [ETAPA 2.1 · 29/09/2026] Ajustes sem campo de chave da CoinGecko (só a embutida).
-->
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0D111C">
<title>Koin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">

<style>
/* =================================================================
   TOKENS  [ETAPA 0]
   Tinta azul em vez de preto puro, latão como cor da marca (moeda é
   metal), verde e vermelho só pra alta e queda.
   ================================================================= */
:root {
    --bg: #0D111C;
    --superficie: #131A29;
    --superficie-2: #1A2334;
    --superficie-3: #212C41;
    --borda: #232E44;
    --borda-forte: #2F3C57;

    --texto: #E7ECF5;
    --texto-2: #A3AEC4;
    --texto-3: #6B7791;

    --marca: #E9B949;
    --marca-escura: #B98A24;
    --marca-tinta: #1F1706;
    --marca-suave: rgba(233, 185, 73, 0.12);

    --alta: #22C38E;
    --alta-suave: rgba(34, 195, 142, 0.13);
    --queda: #F2555A;
    --queda-suave: rgba(242, 85, 90, 0.13);
    --info: #6E9BF5;

    --fonte: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --fonte-marca: 'Unbounded', 'Manrope', system-ui, sans-serif;

    /* escala tipográfica (razão ~1,2) */
    --t-xs: 12px;
    --t-sm: 13px;
    --t-md: 15px;
    --t-lg: 18px;
    --t-xl: 22px;
    --t-2xl: 28px;
    --t-3xl: 40px;

    /* raios por hierarquia: controle pequeno, cartão médio, painel grande */
    --r-controle: 8px;
    --r-cartao: 14px;
    --r-painel: 18px;

    --topo: 64px;

    --sombra-flutuante: 0 18px 40px rgba(3, 6, 14, 0.55);
    --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
}

/* Tema claro: mapeado, AINDA NÃO LIGADO (sem seletor no app).
   Quando entrar, é só descomentar e oferecer o botão em Ajustes.
:root[data-tema="claro"] {
    --bg: #F4F6FA;
    --superficie: #FFFFFF;
    --superficie-2: #F1F4F9;
    --superficie-3: #E7ECF4;
    --borda: #E1E6EF;
    --borda-forte: #CBD3E1;
    --texto: #111827;
    --texto-2: #4B5568;
    --texto-3: #7C879B;
    --marca: #B98A24;
    --marca-tinta: #FFFFFF;
    --alta: #0E9F6E;
    --queda: #DC3B42;
}
*/

*,
*::before,
*::after {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--texto);
    font-family: var(--fonte);
    font-size: var(--t-md);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "tnum" 1, "lnum" 1;   /* números com largura fixa: preço não dança */
}

h1, h2, h3, h4, p {
    margin: 0;
}

button {
    font-family: inherit;
}

a {
    color: inherit;
    text-decoration: none;
}

a[data-rota] {
    cursor: pointer;
}

:focus-visible {
    outline: 2px solid var(--marca);
    outline-offset: 2px;
}

::selection {
    background: var(--marca-suave);
}


/* =================================================================
   CASCA: navegação no topo  [ETAPA 0.1 · 29/09/2026]
   Pedido do Junior: nada de barra lateral (virou assinatura visual de
   projeto feito com IA). A navegação fica numa barra horizontal, como no
   CoinMarketCap; o que for agrupado abre um menu suspenso com seções e
   uma linha de descrição por item. Crescer = novo grupo, não nova coluna.
   ================================================================= */
.casca {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

.topo {
    position: sticky;
    top: 0;
    z-index: 30;
    background: rgba(13, 17, 28, 0.88);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--borda);
}

/* mesma largura e alinhamento do conteúdo das páginas */
.topo-interno {
    max-width: 1400px;
    margin: 0 auto;
    height: var(--topo);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 28px;
}

.marca {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

/* a moeda da marca: disco de latão com o recorte do K */
.marca-moeda {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
}

.marca-nome {
    font-family: var(--fonte-marca);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.02em;
}

.nav {
    display: flex;
    align-items: stretch;
    align-self: stretch;
    gap: 4px;
}

.nav-link,
.nav-grupo-botao {
    appearance: none;
    background: none;
    border: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    color: var(--texto-2);
    font-size: var(--t-sm);
    font-weight: 700;
    cursor: pointer;
    position: relative;
    transition: color 120ms ease;
}

.nav-link:hover,
.nav-grupo-botao:hover,
.nav-grupo.aberto .nav-grupo-botao {
    color: var(--texto);
}

/* item ativo: fio de latão colado na borda de baixo do topo */
.nav-link.ativo,
.nav-grupo-botao.ativo {
    color: var(--texto);
}

.nav-link.ativo::after,
.nav-grupo-botao.ativo::after {
    content: "";
    position: absolute;
    left: 12px;
    right: 12px;
    bottom: -1px;
    height: 2px;
    border-radius: 2px 2px 0 0;
    background: var(--marca);
}

.nav-grupo-botao .chevron {
    width: 14px;
    height: 14px;
    transition: transform 160ms ease;
}

.nav-grupo.aberto .chevron {
    transform: rotate(180deg);
}

.nav-grupo {
    position: relative;
    display: flex;
}

/* menu suspenso (estilo CoinMarketCap: seções com título e itens com
   ícone em círculo + nome + uma linha dizendo o que tem ali) */
.menu-suspenso {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    min-width: 300px;
    padding: 10px;
    background: var(--superficie-2);
    border: 1px solid var(--borda-forte);
    border-radius: var(--r-cartao);
    box-shadow: var(--sombra-flutuante);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px);
    transition: opacity 140ms ease, transform 140ms ease, visibility 140ms;
}

.menu-suspenso.direita {
    left: auto;
    right: 0;
}

.nav-grupo.aberto .menu-suspenso {
    opacity: 1;
    visibility: visible;
    transform: none;
}

.menu-secao + .menu-secao {
    margin-top: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--borda);
}

.menu-secao-titulo {
    font-size: var(--t-xs);
    color: var(--texto-3);
    padding: 6px 10px 4px;
}

.menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 10px;
    border-radius: 10px;
    transition: background-color 120ms ease;
}

.menu-item:hover,
.menu-item:focus-visible {
    background: var(--superficie-3);
}

.menu-item-icone {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--marca-suave);
    color: var(--marca);
}

.menu-item-icone svg {
    width: 17px;
    height: 17px;
}

.menu-item-texto strong {
    display: block;
    font-size: var(--t-sm);
    font-weight: 700;
    color: var(--texto);
}

.menu-item-texto span {
    display: block;
    font-size: var(--t-xs);
    color: var(--texto-2);
    line-height: 1.4;
}

.menu-item.ativo .menu-item-icone {
    background: var(--marca);
    color: var(--marca-tinta);
}

.topo-direita {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

/* botão redondo do menu de conta (engrenagem) */
.botao-icone {
    appearance: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--borda);
    background: var(--superficie);
    color: var(--texto-2);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease;
}

.botao-icone:hover,
.nav-grupo.aberto .botao-icone,
.botao-icone.ativo {
    color: var(--texto);
    border-color: var(--borda-forte);
}

.botao-icone svg {
    width: 18px;
    height: 18px;
}

main#miolo {
    flex: 1;
}

/* rodapé: versão, autoria e o aviso de privacidade */
.rodape {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    padding: 20px 28px 28px;
    display: flex;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-top: 1px solid var(--borda);
    font-size: var(--t-xs);
    color: var(--texto-3);
}

.rodape strong {
    color: var(--texto-2);
    font-weight: 600;
}

/* pulso do mercado: BTC ao vivo no topo */
.pulso {
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--borda);
    border-radius: 999px;
    font-size: var(--t-sm);
    color: var(--texto-2);
}

.pulso[hidden] {
    display: none;
}

.pulso-ponto {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--alta);
    box-shadow: 0 0 0 0 var(--alta-suave);
    animation: pulsar 2.4s ease-out infinite;
}

@keyframes pulsar {
    0%   { box-shadow: 0 0 0 0 rgba(34, 195, 142, 0.45); }
    70%  { box-shadow: 0 0 0 7px rgba(34, 195, 142, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 195, 142, 0); }
}

.pulso strong {
    color: var(--texto);
    font-weight: 700;
}


/* ---------- seletor segmentado (moeda de exibição, abas) ---------- */
.segmentado {
    display: inline-flex;
    padding: 3px;
    gap: 2px;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
}

.segmentado button {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--texto-2);
    font-size: var(--t-sm);
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: background-color 140ms ease, color 140ms ease;
}

.segmentado button:hover {
    color: var(--texto);
}

.segmentado button[aria-pressed="true"] {
    background: var(--superficie-3);
    color: var(--texto);
}

.segmentado button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}


/* ---------- página ---------- */
.pagina {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 28px 28px 48px;
}

.pagina-cabecalho {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 24px;
}

.pagina-cabecalho h1 {
    font-size: var(--t-2xl);
    font-weight: 800;
    letter-spacing: -0.02em;
}

.pagina-cabecalho p {
    color: var(--texto-2);
    margin-top: 4px;
    max-width: 62ch;
}


/* =================================================================
   COMPONENTES
   ================================================================= */
.painel {
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: var(--r-painel);
    padding: 22px 24px;
}

.pagina > .painel + .painel {
    margin-top: 16px;
}

.painel-titulo {
    font-size: var(--t-md);
    font-weight: 700;
    margin-bottom: 4px;
}

.painel-sub {
    font-size: var(--t-sm);
    color: var(--texto-2);
    margin-bottom: 16px;
}

.cartao {
    background: var(--superficie-2);
    border-radius: var(--r-cartao);
    padding: 16px 18px;
}

/* botões */
.botao {
    appearance: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    height: 40px;
    padding: 0 16px;
    border-radius: var(--r-controle);
    border: 1px solid transparent;
    font-size: var(--t-sm);
    font-weight: 700;
    cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease, transform 80ms ease;
}

.botao:active {
    transform: translateY(1px);
}

.botao-marca {
    background: var(--marca);
    color: var(--marca-tinta);
}

.botao-marca:hover {
    background: #F2C861;
}

.botao-neutro {
    background: var(--superficie-2);
    border-color: var(--borda-forte);
    color: var(--texto);
}

.botao-neutro:hover {
    background: var(--superficie-3);
}

.botao-fantasma {
    background: transparent;
    color: var(--texto-2);
}

.botao-fantasma:hover {
    color: var(--texto);
    background: var(--superficie);
}

.botao svg {
    width: 16px;
    height: 16px;
}

/* variação (alta/queda) */
.var {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-weight: 700;
    font-size: var(--t-sm);
}

.var.alta { color: var(--alta); }
.var.queda { color: var(--queda); }
.var.neutra { color: var(--texto-3); }

.var-pilula {
    padding: 3px 8px;
    border-radius: 6px;
}

.var-pilula.alta { background: var(--alta-suave); }
.var-pilula.queda { background: var(--queda-suave); }

.var svg {
    width: 10px;
    height: 10px;
}

/* campos */
.campo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.campo label {
    font-size: var(--t-sm);
    font-weight: 600;
    color: var(--texto-2);
}

.entrada {
    height: 42px;
    padding: 0 14px;
    background: var(--bg);
    border: 1px solid var(--borda-forte);
    border-radius: var(--r-controle);
    color: var(--texto);
    font-family: inherit;
    font-size: var(--t-md);
    transition: border-color 120ms ease, box-shadow 120ms ease;
}

.entrada::placeholder {
    color: var(--texto-3);
}

.entrada:focus {
    outline: none;
    border-color: var(--marca);
    box-shadow: 0 0 0 3px var(--marca-suave);
}

.busca {
    position: relative;
}

.busca svg {
    position: absolute;
    left: 12px;
    top: 50%;
    width: 16px;
    height: 16px;
    transform: translateY(-50%);
    color: var(--texto-3);
    pointer-events: none;
}

.busca .entrada {
    padding-left: 38px;
    width: 240px;
    height: 38px;
    background: var(--superficie);
}

/* ícone de moeda (logo real chega na Etapa 1; por ora, iniciais) */
.moeda-icone {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: var(--bg);
    flex-shrink: 0;
}

/* tabela de mercado */
.tabela {
    width: 100%;
    border-collapse: collapse;
    font-size: var(--t-sm);
}

.tabela th {
    text-align: right;
    font-size: var(--t-xs);
    font-weight: 600;
    color: var(--texto-3);
    padding: 10px 14px;
    border-bottom: 1px solid var(--borda);
    white-space: nowrap;
}

.tabela td {
    text-align: right;
    padding: 14px;
    border-bottom: 1px solid var(--borda);
    white-space: nowrap;
}

.tabela th:first-child,
.tabela td:first-child,
.tabela th:nth-child(2),
.tabela td:nth-child(2) {
    text-align: left;
}

.tabela tbody tr {
    transition: background-color 120ms ease;
}

.tabela tbody tr:hover {
    background: var(--superficie-2);
}

.tabela tbody tr:last-child td {
    border-bottom: none;
}

.celula-moeda {
    display: flex;
    align-items: center;
    gap: 10px;
}

.celula-moeda strong {
    font-weight: 700;
}

.celula-moeda span {
    color: var(--texto-3);
    font-size: var(--t-xs);
}

.rank {
    color: var(--texto-3);
    width: 32px;
}

/* PISCA DE PREÇO (estilo Binance): o fundo acende e apaga */
.pisca-alta {
    animation: piscaAlta 900ms var(--ease);
}

.pisca-queda {
    animation: piscaQueda 900ms var(--ease);
}

@keyframes piscaAlta {
    0%   { background-color: rgba(34, 195, 142, 0.28); color: var(--alta); }
    100% { background-color: transparent; }
}

@keyframes piscaQueda {
    0%   { background-color: rgba(242, 85, 90, 0.28); color: var(--queda); }
    100% { background-color: transparent; }
}

.preco-vivo {
    border-radius: 5px;
    padding: 2px 6px;
    margin: -2px -6px;
}

/* esqueleto de carregamento */
.esqueleto {
    display: block;
    height: 12px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--superficie-2) 0%, var(--superficie-3) 45%, var(--superficie-2) 90%);
    background-size: 220% 100%;
    animation: brilho 1.4s linear infinite;
}

@keyframes brilho {
    from { background-position: 120% 0; }
    to   { background-position: -120% 0; }
}

/* saldo em destaque: o único lugar com a fonte da marca */
.saldo {
    font-family: var(--fonte-marca);
    font-weight: 500;
    font-size: var(--t-3xl);
    letter-spacing: -0.03em;
    line-height: 1.1;
}

.saldo-rotulo {
    color: var(--texto-2);
    font-size: var(--t-sm);
    margin-bottom: 8px;
}

/* aviso de etapa futura */
.em-breve {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 18px;
    border: 1px dashed var(--borda-forte);
    border-radius: var(--r-cartao);
    color: var(--texto-2);
    font-size: var(--t-sm);
}

.em-breve strong {
    color: var(--texto);
}

<script>
(function () {

/* =================================================================
   CONFIGURAÇÃO
   ================================================================= */
var APP = {
    nome: 'Koin',
    versao: '0.1.0',        // 1.0.0 quando fechar a Etapa 7 (PWA)
    ano: 2026,
    autor: 'BitCoderSoft',
};

var BINANCE = 'https://data-api.binance.vision';   // dados públicos, sem chave


/* =================================================================
   ARMAZENAMENTO  [HERANÇA Dash Finance · STORE v1]
   localStorage quando dá; no preview do claude.ai (onde ele é bloqueado)
   cai pra memória, e usa window.storage se existir. Todo acesso passa
   por `armazem`, nunca por localStorage direto.
   ================================================================= */
var PREFIXO = 'KOIN_';
var espelho = {};
var modoArmazenamento = 'memoria';

try {
    localStorage.setItem(PREFIXO + 'teste', '1');
    localStorage.removeItem(PREFIXO + 'teste');
    modoArmazenamento = 'local';
} catch (e) {
    if (window.storage && typeof window.storage.get === 'function') modoArmazenamento = 'claude';
}

var armazem = {
    get: function (k) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') return localStorage.getItem(k);
        return Object.prototype.hasOwnProperty.call(espelho, k) ? espelho[k] : null;
    },
    set: function (k, v) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') { localStorage.setItem(k, v); return; }
        espelho[k] = String(v);
        if (modoArmazenamento === 'claude') {
            Promise.resolve().then(function () { return window.storage.set(k, String(v), false); }).catch(function () {});
        }
    },
    remove: function (k) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') { localStorage.removeItem(k); return; }
        delete espelho[k];
    },
    json: function (k, padrao) {
        try {
            var raw = this.get(k);
            return raw ? JSON.parse(raw) : padrao;
        } catch (e) {
            return padrao;
        }
    },
};

// no preview, puxa as preferências salvas antes do primeiro desenho
function carregarArmazenamento() {
    if (modoArmazenamento !== 'claude') return Promise.resolve();
    var chaves = ['PREFS'];
    return Promise.all(chaves.map(function (c) {
        return window.storage.get(PREFIXO + c, false)
            .then(function (r) { if (r && r.value != null) espelho[PREFIXO + c] = r.value; })
            .catch(function () {});
    }));
}


/* =================================================================
   ESTADO CENTRAL  [ETAPA 0]
   A diferença principal pro Dash Finance: lá cada mudança redesenhava
   a página inteira. Aqui as telas são desenhadas UMA vez e os pedaços
   que mudam (preço, moeda de exibição) se atualizam no lugar, ouvindo
   o estado. Isso é o que permite preço ao vivo a cada segundo.

   estado.definir('moeda', 'USD')  -> avisa quem ouve 'moeda'
   estado.ouvir('moeda', fn)       -> fn(novoValor, antigo); devolve
                                      uma função pra parar de ouvir
   Ouvintes de página são removidos sozinhos ao trocar de rota.
   ================================================================= */
var estado = (function () {
    var dados = {};
    var ouvintes = {};
    var daPagina = [];

    return {
        ler: function (k) { return dados[k]; },
        definir: function (k, v) {
            var antigo = dados[k];
            dados[k] = v;
            (ouvintes[k] || []).slice().forEach(function (fn) { fn(v, antigo); });
        },
        ouvir: function (k, fn, daPaginaAtual) {
            (ouvintes[k] = ouvintes[k] || []).push(fn);
            var parar = function () {
                ouvintes[k] = (ouvintes[k] || []).filter(function (f) { return f !== fn; });
            };
            if (daPaginaAtual) daPagina.push(parar);
            return parar;
        },
        limparPagina: function () {
            daPagina.forEach(function (p) { p(); });
            daPagina = [];
        },
    };
})();

// preferências persistidas

function salvarPrefs() {

/* =================================================================
   FORMATAÇÃO  [HERANÇA Dash Finance · FMT v1 + fmtPreco]
   ================================================================= */
function agruparMilhar(inteiro) {
    return inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function formatarBR(n, casas) {
    n = Number(n) || 0;
    var s = Math.abs(n).toFixed(casas);
    var partes = s.split('.');
    partes[0] = agruparMilhar(partes[0]);
    return (n < 0 && Number(s) !== 0 ? '-' : '') + partes.join(',');
}

// preço com casas adaptativas: 612.345,67 · 0,8712 · 0,00001234
function formatarPreco(n) {
    n = Number(n) || 0;
    var abs = Math.abs(n);
    if (abs >= 1 || abs === 0) return formatarBR(n, 2);
    var casas = Math.min(10, Math.max(2, 3 - Math.floor(Math.log10(abs))));
    var s = n.toFixed(casas).replace(/0+$/, '');
    if ((s.split('.')[1] || '').length < 2) s = n.toFixed(2);
    return s.replace('.', ',');
}

function formatarPct(n) {
    n = Number(n) || 0;
    return (n > 0 ? '+' : '') + formatarBR(n, 2) + '%';
}

// valores grandes: 1,23 tri · 845,6 bi · 12,3 mi
function formatarCompacto(n) {
    var abs = Math.abs(n);
    if (abs >= 1e12) return formatarBR(n / 1e12, 2) + ' tri';
    if (abs >= 1e9) return formatarBR(n / 1e9, 2) + ' bi';
    if (abs >= 1e6) return formatarBR(n / 1e6, 2) + ' mi';
    if (abs >= 1e3) return formatarBR(n / 1e3, 1) + ' mil';
    return formatarBR(n, 2);

    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')

   MOEDA DE EXIBIÇÃO  [ETAPA 0]
   Tudo é guardado em REAIS. Na hora de mostrar:
     BRL -> R$ 1.234,56
     USD -> US$ 228,61      (R$ ÷ USDTBRL da Binance)
     BTC -> ₿ 0,00201523    (R$ ÷ BTCBRL da Binance)
   As taxas vêm juntas numa chamada e ficam 5 min em cache. Sem taxa
   (offline, preview bloqueando), o seletor desativa US$ e ₿ e tudo
   continua em reais.

   COMO USAR NAS TELAS: marque o elemento com data-brl="1234.56" (e,

var MOEDAS = {
    BRL: { rotulo: 'R$', nome: 'Real' },

        if (tipo === 'compacto') return formatarCompacto(valor);

    if (moeda === 'BTC' && taxas.BTC) {
        var btc = brl / taxas.BTC;
        if (tipo === 'compacto' && Math.abs(btc) >= 1000) return '₿ ' + formatarCompacto(btc);

var menosMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// número desliza do valor antigo até o novo (~600ms)
function animarNumero(el, de, para, formatador, duracao) {
    if (menosMovimento || de === para) { el.textContent = formatador(para); return; }
    duracao = duracao || 600;
    var inicio = null;
    if (el._animacao) cancelAnimationFrame(el._animacao);
    function passo(t) {
        if (!inicio) inicio = t;
        var p = Math.min((t - inicio) / duracao, 1);
        var suave = 1 - Math.pow(1 - p, 3);          // desacelera no fim
        el.textContent = formatador(de + (para - de) * suave);
        if (p < 1) el._animacao = requestAnimationFrame(passo);
    }
    el._animacao = requestAnimationFrame(passo);
}

// pisca verde/vermelho quando o preço muda (estilo Binance)
function piscar(el, subiu) {
    el.classList.remove('pisca-alta', 'pisca-queda');
    void el.offsetWidth;                            // reinicia a animação
    el.classList.add(subiu ? 'pisca-alta' : 'pisca-queda');
}

function avisar(texto, tipo) {
    var caixa = document.getElementById('avisos');
    var el = document.createElement('div');
    el.className = 'aviso ' + (tipo || '');
    el.textContent = texto;
    caixa.appendChild(el);
    setTimeout(function () {
        el.style.transition = 'opacity 200ms ease';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 220);
    }, 3200);
}

// abre/fecha menus suspensos: clique no botão, passar o mouse (com
// pequena folga pra não fechar no caminho até o menu), Esc e clique fora
function fecharMenus(excecao) {
    document.querySelectorAll('[data-grupo].aberto').forEach(function (g) {
        if (g === excecao) return;
        g.classList.remove('aberto');
        var b = g.querySelector('[data-grupo-botao]');
        if (b) b.setAttribute('aria-expanded', 'false');
    });
}

function abrirMenu(grupo) {
    fecharMenus(grupo);
    grupo.classList.add('aberto');
    grupo.querySelector('[data-grupo-botao]').setAttribute('aria-expanded', 'true');
}

document.addEventListener('click', function (ev) {
    var botao = ev.target.closest('[data-grupo-botao]');
    if (botao) {
        var g = botao.closest('[data-grupo]');
        // com mouse, passar por cima já abriu: o clique só confirma (se
        // alternasse, o clique logo depois do hover fecharia o menu).
        // No toque, o clique alterna.
        if (ponteiroFino || !g.classList.contains('aberto')) abrirMenu(g);
        else fecharMenus();
        return;
    }
    if (!ev.target.closest('.menu-suspenso')) fecharMenus();
});

document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') fecharMenus();
});

if (ponteiroFino) {
    var timerFechar = null;
    document.addEventListener('mouseover', function (ev) {
        var g = ev.target.closest && ev.target.closest('[data-grupo]');
        if (g) {
            clearTimeout(timerFechar);
            if (!g.classList.contains('aberto')) abrirMenu(g);
        }
    });
    document.addEventListener('mouseout', function (ev) {
        var g = ev.target.closest && ev.target.closest('[data-grupo]');
        if (!g) return;
        if (ev.relatedTarget && g.contains(ev.relatedTarget)) return;
        clearTimeout(timerFechar);
        timerFechar = setTimeout(function () { fecharMenus(); }, 180);
    });
}

function desenhar() {
    var app = document.getElementById('app');
    if (!app.querySelector('.casca')) {
        app.innerHTML = cascaHTML();
        atualizarSeletoresMoeda();
    }
    var resolvida = resolverRota(rotaAtual);
    if (!resolvida) { rotaAtual = ROTA_INICIAL; resolvida = resolverRota(rotaAtual); }
    var r = ROTAS[resolvida.base];
    r.param = resolvida.param;

    estado.limparPagina();   // ouvintes da página anterior saem
    fecharMenus();
    if (resolvida.base !== '/mercado') desconectarAoVivo();   // [ETAPA 1] socket só no mercado
    sairDaMoeda();                                            // [ETAPA 2] gráfico, socket e timers da moeda

    var rotaMenu = resolvida.base === '/moeda' ? '/mercado' : resolvida.base;
    document.querySelectorAll('[data-nav]').forEach(function (a) {
        var ativo = a.getAttribute('data-nav') === rotaMenu;
        a.classList.toggle('ativo', ativo);
        if (ativo) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    // o botão do grupo acende quando a página atual está dentro dele
    document.querySelectorAll('[data-grupo-rotas]').forEach(function (b) {
        b.classList.toggle('ativo', b.getAttribute('data-grupo-rotas').split(' ').indexOf(rotaMenu) !== -1);
    });
    document.title = r.titulo + ' · ' + APP.nome;

    var miolo = document.getElementById('miolo');
    miolo.innerHTML = r.render(r);
    preencherValores(miolo);
    if (typeof r.montar === 'function') r.montar(miolo);
    window.scrollTo(0, 0);
}

// DE ONDE VEM CADA DADO
//   CoinGecko /coins/markets (1 chamada, 100 moedas, já em reais):
//     ranking, nome, logo, preço, variação 1h/24h/7d, volume, valor de
//     mercado e o minigráfico de 7 dias. EXIGE chave (sem ela a API devolve
//     403). Usa a chave Demo embutida (CG_CHAVE_PADRAO).
//     [ETAPA 1.1] No máximo 1 chamada por dia (ver CG_CHAVE_PADRAO).
//     A chave vai como parâmetro na URL e não no cabeçalho: cabeçalho
//     customizado obriga o navegador a uma checagem prévia (CORS) que já
//     nos barrou na bolsai, no Dash Finance.
//   Binance WebSocket (tempo real, a cada ~1s):
//     preço e variação 24h das moedas que a Binance negocia contra USDT,
//     convertidos pra reais pelo USDTBRL do mesmo canal.
//
// CASAR COINGECKO COM BINANCE: pelo símbolo (btc -> BTCUSDT). Símbolo não é
// único no mundo cripto (duas moedas diferentes podem usar o mesmo), então
// só liga o "ao vivo" se o preço da Binance estiver a até 10% do preço da
// CoinGecko na largada. Mesma ideia que resolveu o caso do ENA.
//
// SEM COINGECKO (limite, fora do ar, bloqueio): cai pro modo simplificado,
// com uma lista fixa das principais moedas e dados só da Binance. Sem
// valor de mercado, logo e minigráfico, mas com preço ao vivo.
//
// ATUALIZAÇÃO NO LUGAR: a tabela é montada uma vez (e de novo só ao trocar
// aba, busca ou ordem). O WebSocket mexe só nas células de preço e 24h
// da linha certa, com pisca e número deslizando.

var COINGECKO = 'https://api.coingecko.com/api/v3';
var BINANCE_WS = 'wss://data-stream.binance.vision/stream?streams=';

// [ETAPA 1.1] REGRA DA COINGECKO: no máximo 1 chamada por dia.
// O app vive dos dados da Binance (preço, variação 24h e volume ao vivo).
// A CoinGecko só entra pro que a Binance não entrega (ranking, logo, valor
// de mercado, variação 1h/7d e minigráfico), e só na primeira abertura do
// dia. Nas demais, usa o pacote guardado. Se a chamada falhar, espera
// CG_ESPERA_FALHA antes de tentar de novo, pra não martelar a API.
// Chave Demo do autor embutida. O usuário não informa chave própria.
var CG_CHAVE_PADRAO = 'CG-1HzJE9XM9LdMbZAEzFZbohoH';
var CG_ESPERA_FALHA = 30 * 60 * 1000;
var CG_PACOTE_VERSAO = 2;      // sobe quando o pacote ganha campos novos

// dia local no formato AAAA-MM-DD ("primeira chamada do dia" segue o relógio de quem usa)
function diaDeHoje(quando) {
    var d = quando ? new Date(quando) : new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
var DIVERGENCIA_MAX = 0.10;

// [ETAPA 2] REGRA: o preço que aparece nos painéis muda no máximo a cada 5s.
// O WebSocket da Binance segue mandando ~1 tick por segundo, mas o app só
// guarda o último de cada moeda e aplica na tela neste intervalo. Vale pra
// tabela do Mercado e pra página da moeda (o pulso do BTC no topo segue a
// cada 30s, por consulta própria).
var PRECO_INTERVALO_MS = 5000;
var PRECO_PRIMEIRO_MS = 800;    // 1º lote sai rápido: o preço do pacote diário pode estar velho

// guarda o último valor de cada chave e entrega em lote a cada `ms`
function criarAmortecedor(aplicar) {
    var pendentes = {};
    var primeiro = null;
    var intervalo = null;
    var iniciado = false;
    function fluxo() {
        var lote = pendentes;
        pendentes = {};
        Object.keys(lote).forEach(function (k) { aplicar(k, lote[k]); });
    }
    return {
        guardar: function (chave, valor) {
            pendentes[chave] = valor;
            // o relógio de 5s só começa quando chega o 1º tick
            if (iniciado) return;
            iniciado = true;
            primeiro = setTimeout(function () {
                fluxo();
                intervalo = setInterval(fluxo, PRECO_INTERVALO_MS);
            }, PRECO_PRIMEIRO_MS);
        },
        parar: function () { clearTimeout(primeiro); clearInterval(intervalo); pendentes = {}; },
    };
}

// modo simplificado: principais moedas negociadas na Binance
var LISTA_RESERVA = [
    ['BTC', 'Bitcoin'], ['ETH', 'Ethereum'], ['USDT', 'Tether'], ['BNB', 'BNB'], ['SOL', 'Solana'],
    ['XRP', 'XRP'], ['USDC', 'USD Coin'], ['DOGE', 'Dogecoin'], ['ADA', 'Cardano'], ['TRX', 'TRON'],
    ['AVAX', 'Avalanche'], ['LINK', 'Chainlink'], ['TON', 'Toncoin'], ['SHIB', 'Shiba Inu'], ['DOT', 'Polkadot'],
    ['BCH', 'Bitcoin Cash'], ['LTC', 'Litecoin'], ['NEAR', 'NEAR Protocol'], ['UNI', 'Uniswap'], ['SUI', 'Sui'],
    ['PEPE', 'Pepe'], ['APT', 'Aptos'], ['XLM', 'Stellar'], ['ETC', 'Ethereum Classic'], ['ATOM', 'Cosmos'],
    ['ARB', 'Arbitrum'], ['OP', 'Optimism'], ['INJ', 'Injective'], ['AAVE', 'Aave'], ['ENA', 'Ethena'],

// ---------- coleta ----------
function normalizarCoinGecko(c) {
    return {
        id: c.id,
        simbolo: String(c.symbol || '').toUpperCase(),
        nome: c.name,
        logo: c.image,
        rank: c.market_cap_rank,

        var1h: c.price_change_percentage_1h_in_currency,
        var24h: c.price_change_percentage_24h_in_currency != null ? c.price_change_percentage_24h_in_currency : c.price_change_percentage_24h,
        var7d: c.price_change_percentage_7d_in_currency,
        volume: c.total_volume,
        valorMercado: c.market_cap,
        sparkline: c.sparkline_in_7d && c.sparkline_in_7d.price ? c.sparkline_in_7d.price : null,

        max24h: c.high_24h,

        ofertaTotal: c.total_supply,
        ofertaMaxima: c.max_supply,
        ath: c.ath,
        athData: c.ath_date,
        atl: c.atl,
        atlData: c.atl_date,
        aoVivo: false,
    };
}

function buscarMercadoCoinGecko() {
    var cache = armazem.json('MERCADO', null);
    var completo = cache && cache.modo === 'completo';

    // [ETAPA 1.1] já chamou hoje? então não chama de novo.
    // [ETAPA 2] pacote de antes da Etapa 2 não tem as estatísticas: renova uma vez.
    if (completo && cache.v === CG_PACOTE_VERSAO && diaDeHoje(cache.em) === diaDeHoje()) {
        return Promise.resolve(cache);
    }

    // [ETAPA 1.1] última tentativa falhou há pouco? usa o que tem
    var falha = Number(armazem.get('MERCADO_FALHA')) || 0;
    if (falha && Date.now() - falha < CG_ESPERA_FALHA) {
        if (completo) {
            cache.velho = true;
            return Promise.resolve(cache);
        }
        return Promise.reject(new Error('em espera'));
    }

    var url = COINGECKO + '/coins/markets?vs_currency=brl&order=market_cap_desc&per_page=100&page=1' +
        '&sparkline=true&price_change_percentage=1h,24h,7d';
    url += '&x_cg_demo_api_key=' + encodeURIComponent(CG_CHAVE_PADRAO);

    return fetch(url)
        .then(function (r) {
            if (r.status === 429) throw new Error('limite');
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
        })
        .then(function (dados) {
            var pacote = { em: Date.now(), v: CG_PACOTE_VERSAO, modo: 'completo', lista: dados.map(normalizarCoinGecko) };
            try {
                armazem.set('MERCADO', JSON.stringify(pacote));
                armazem.remove('MERCADO_FALHA');
            } catch (e) { /* cache é opcional */ }
            return pacote;
        })
        .catch(function (erro) {
            try { armazem.set('MERCADO_FALHA', String(Date.now())); } catch (e) {}
            // cache de outro dia ainda serve melhor que o modo simplificado
            if (completo) {
                cache.velho = true;
                return cache;
            }
            throw erro;
        });
}

function buscarMercadoReserva() {
    var simbolos = LISTA_RESERVA.filter(function (m) { return m[0] !== 'USDT'; })
        .map(function (m) { return m[0] + 'USDT'; }).concat(['USDTBRL']);
    var url = BINANCE + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(simbolos));
    return fetch(url)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (dados) {
            var por = {};
            dados.forEach(function (d) { por[d.symbol] = d; });
            var taxa = por.USDTBRL ? Number(por.USDTBRL.lastPrice) : null;
            if (!taxa) throw new Error('sem USDTBRL');
            var lista = [];
            LISTA_RESERVA.forEach(function (m, i) {
                var d = m[0] === 'USDT' ? por.USDTBRL : por[m[0] + 'USDT'];
                if (!d) return;
                var preco = m[0] === 'USDT' ? Number(d.lastPrice) : Number(d.lastPrice) * taxa;
                lista.push({
                    id: m[0].toLowerCase(), simbolo: m[0], nome: m[1], logo: null, rank: i + 1,
                    preco: preco, var1h: null, var24h: Number(d.priceChangePercent), var7d: null,
                    volume: Number(d.quoteVolume) * (m[0] === 'USDT' ? 1 : taxa), valorMercado: null,
                    sparkline: null, aoVivo: false,
                });
            });
            return { em: Date.now(), modo: 'simplificado', lista: lista };
        });
}

function carregarMercado() {
    return buscarMercadoCoinGecko()
        .catch(function () { return buscarMercadoReserva(); })
        .then(function (pacote) {
            mercado.lista = pacote.lista;
            mercado.modo = pacote.modo;
            mercado.atualizadoEm = pacote.em;
            mercado.velho = !!pacote.velho;
            mercado.porId = {};
            mercado.lista.forEach(function (m) { mercado.porId[m.id] = m; });
            return pacote;
        });
}

// ---------- tempo real ----------
// preços de todos os pares da Binance (1 chamada, cache de 1h)
function obterPrecosBinance() {
    var cache = armazem.json('BINANCE_PRECOS', null);
    if (cache && Date.now() - cache.em < 60 * 60 * 1000) return Promise.resolve(cache.precos);
    return fetch(BINANCE + '/api/v3/ticker/price')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var precos = {};
            lista.forEach(function (p) { precos[p.symbol] = Number(p.price); });
            try { armazem.set('BINANCE_PRECOS', JSON.stringify({ em: Date.now(), precos: precos })); } catch (e) {}
            return precos;
        });
}

// par da Binance que corresponde à moeda da CoinGecko, ou null.
// Mesmo símbolo pode ser moeda diferente (caso do ENA), então compara o
// preço. [ETAPA 2] Com a CoinGecko 1x por dia, o preço do pacote pode ter
// horas: a tolerância sobe conforme a idade (10% até 1h; 40% depois).
// Símbolo repetido de verdade costuma diferir por ordens de grandeza.
function parBinanceDe(m, precos) {
    if (m.simbolo === 'USDT') return precos.USDTBRL ? 'USDTBRL' : null;
    var par = m.simbolo + 'USDT';
    var taxa = precos.USDTBRL;
    if (!precos[par] || !taxa) return null;
    var idade = mercado.atualizadoEm ? Date.now() - mercado.atualizadoEm : 0;
    var tolerancia = idade > 60 * 60 * 1000 ? 0.40 : DIVERGENCIA_MAX;
    if (m.preco > 0 && Math.abs(precos[par] * taxa / m.preco - 1) > tolerancia) return null;
    return par;
}

function conectarAoVivo() {
    desconectarAoVivo();
    // quais moedas têm par USDT na Binance? (lista de preços, 1h de cache)
    var pronto = obterPrecosBinance();

    pronto.then(function (precos) {
        var taxa = precos.USDTBRL;
        if (!taxa) throw new Error('sem USDTBRL');
        mercado.usdtbrl = taxa;
        mercado.wsMapa = {};
        mercado.lista.forEach(function (m) {
            if (m.simbolo === 'USDT') { mercado.wsMapa.USDTBRL_MOEDA = m.id; m.aoVivo = true; return; }
            var par = parBinanceDe(m, precos);
            if (!par) return;
            mercado.wsMapa[par] = m.id;
            m.aoVivo = true;
        });
        var streams = Object.keys(mercado.wsMapa).filter(function (k) { return k !== 'USDTBRL_MOEDA'; })
            .map(function (k) { return k.toLowerCase() + '@miniTicker'; });
        streams.push('usdtbrl@miniTicker');
        abrirSocket(streams);
        marcarLinhasAoVivo();
    }).catch(function () {
        estado.definir('conexao', 'off');
    });
}

function abrirSocket(streams) {
    estado.definir('conexao', 'conectando');
    var ws;
    try {
        ws = new WebSocket(BINANCE_WS + streams.join('/'));
    } catch (e) {
        estado.definir('conexao', 'off');
        return;
    }
    mercado.ws = ws;
    // [ETAPA 2] ticks vão pro amortecedor; a tela muda a cada PRECO_INTERVALO_MS
    if (!mercado.amortecedor) {
        mercado.amortecedor = criarAmortecedor(function (simbolo, t) { aplicarTick(simbolo, t.c, t.o); });
    }
    ws.onopen = function () {
        mercado.wsTentativas = 0;
        estado.definir('conexao', 'ao-vivo');
    };
    ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        var d = msg && msg.data;
        if (!d || !d.s) return;
        receberTick(d.s, Number(d.c), Number(d.o));
    };
    ws.onclose = function () {
        if (mercado.ws !== ws) return;          // fechado de propósito
        mercado.ws = null;
        estado.definir('conexao', 'off');
        // reconecta com espera crescente (2s, 4s, 8s... até 60s)
        var espera = Math.min(60000, 2000 * Math.pow(2, mercado.wsTentativas++));
        mercado.timerReconexao = setTimeout(function () {
            if (rotaAtual === '/mercado') abrirSocket(streams);
        }, espera);
    };
    ws.onerror = function () { /* onclose cuida */ };
}

function desconectarAoVivo() {
    clearTimeout(mercado.timerReconexao);
    if (mercado.amortecedor) {
        mercado.amortecedor.parar();
        mercado.amortecedor = null;
    }
    if (mercado.ws) {
        var ws = mercado.ws;
        mercado.ws = null;
        try { ws.close(); } catch (e) {}
    }
}

function receberTick(simbolo, fechamento, abertura) {
    // a taxa de conversão entra na hora (não mexe na tela); o resto espera o lote
    if (simbolo === 'USDTBRL') mercado.usdtbrl = fechamento;
    if (mercado.amortecedor) mercado.amortecedor.guardar(simbolo, { c: fechamento, o: abertura });
}

function aplicarTick(simbolo, fechamento, abertura) {
    var id, preco;
    if (simbolo === 'USDTBRL') {
        id = mercado.wsMapa.USDTBRL_MOEDA;
        preco = fechamento;
    } else {
        id = mercado.wsMapa[simbolo];
        if (!id || !mercado.usdtbrl) return;
        preco = fechamento * mercado.usdtbrl;
    }
    var m = id && mercado.porId[id];
    if (!m || !(preco > 0)) return;

    var anterior = m.preco;
    m.preco = preco;
    if (abertura > 0) m.var24h = (fechamento / abertura - 1) * 100;

    var linha = document.querySelector('[data-moeda-id="' + id + '"]');
    if (!linha) return;
    var celPreco = linha.querySelector('[data-cel="preco"]');
    var celVar = linha.querySelector('[data-cel="var24h"]');
    if (celPreco && Math.abs(preco - anterior) / anterior > 1e-7) {
        celPreco.setAttribute('data-brl', preco);
        piscar(celPreco, preco > anterior);
        animarNumero(celPreco, anterior, preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
    }
    if (celVar) celVar.innerHTML = varHTML(m.var24h);
}

function marcarLinhasAoVivo() {
    mercado.lista.forEach(function (m) {
        var linha = document.querySelector('[data-moeda-id="' + m.id + '"]');
        if (linha) linha.classList.toggle('ao-vivo', m.aoVivo);

}

function sparklineSVG(pontos, pct) {
    if (!pontos || pontos.length < 2) return '<span class="sem-dado">—</span>';
    // 168 pontos (1 por hora) viram ~42: o traço fica limpo e leve
    var passo = Math.max(1, Math.floor(pontos.length / 42));
    var amostra = pontos.filter(function (_, i) { return i % passo === 0; });
    amostra.push(pontos[pontos.length - 1]);
    var min = Math.min.apply(null, amostra), max = Math.max.apply(null, amostra);
    var w = 120, h = 36, faixa = max - min || 1;
    var d = amostra.map(function (v, i) {
        var x = (i / (amostra.length - 1)) * w;
        var y = h - 3 - ((v - min) / faixa) * (h - 6);
        return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
    var cor = pct == null ? 'var(--texto-3)' : pct >= 0 ? 'var(--alta)' : 'var(--queda)';
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/></svg>';
}

    if (m.logo) {

function moedasFiltradas() {
    var lista = mercado.lista.slice();
    var fav = favoritos();
    if (mercado.aba === 'favoritas') lista = lista.filter(function (m) { return fav.indexOf(m.id) !== -1; });
    if (mercado.busca) {
        var q = mercado.busca.toLowerCase();
        lista = lista.filter(function (m) { return m.nome.toLowerCase().indexOf(q) !== -1 || m.simbolo.toLowerCase().indexOf(q) !== -1; });
    }
    if (mercado.aba === 'altas') {
        lista = lista.filter(function (m) { return m.var24h > 0; }).sort(function (a, b) { return b.var24h - a.var24h; });
        return lista;
    }
    if (mercado.aba === 'quedas') {
        lista = lista.filter(function (m) { return m.var24h < 0; }).sort(function (a, b) { return a.var24h - b.var24h; });
        return lista;
    }
    var o = mercado.ordem;
    lista.sort(function (a, b) {
        var va = a[o.campo], vb = b[o.campo];
        if (va == null) return 1;
        if (vb == null) return -1;
        return o.desc ? vb - va : va - vb;
    });
    return lista;
}

    if (estrela) {
        ev.stopPropagation();
        var marcou = alternarFavorito(estrela.getAttribute('data-favorito'));
        estrela.classList.toggle('marcada', marcou);
        estrela.setAttribute('aria-pressed', marcou);
        if (mercado.aba === 'favoritas') desenharTabela(false);
        return;
    }
    var aba = ev.target.closest('[data-aba]');
    if (aba) {
        mercado.aba = aba.getAttribute('data-aba');
        document.querySelectorAll('[data-aba]').forEach(function (b) {
            b.setAttribute('aria-pressed', b === aba ? 'true' : 'false');
        });
        desenharTabela(false);
        return;
    }
    var ord = ev.target.closest('[data-ordenar]');
    if (ord) {
        var campo = ord.getAttribute('data-ordenar');
        if (mercado.ordem.campo === campo) mercado.ordem.desc = !mercado.ordem.desc;
        else mercado.ordem = { campo: campo, desc: campo !== 'rank' };
        desenharTabela(false);

// DE ONDE VEM CADA DADO
//   Pacote diário da CoinGecko (o mesmo do Mercado, zero chamada extra):
//     nome, logo, ranking, valor de mercado, ofertas, máxima e mínima
//     históricas.
//   Binance:
//     - gráfico: /api/v3/klines do par USDT, convertido pra reais pelas
//       klines do USDTBRL no mesmo instante (mesma ideia do Dash Finance);
//     - máxima, mínima e volume de 24h: /api/v3/ticker/24hr (renova a cada 60s);
//     - preço e variação 24h ao vivo: WebSocket, com o amortecedor de 5s.
//   Moeda sem par na Binance: mostra os dados do pacote diário e avisa que
//   o gráfico não está disponível (a regra de 1 chamada por dia da CoinGecko
//   impede buscar o histórico de lá).

var LW_URL = 'https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js';
var LW_SRI = 'sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK';

// período -> tamanho da vela e quantas velas buscar (segundos por vela em `seg`)
var PERIODOS = {
    '1D': { intervalo: '5m',  seg: 300,   limite: 288 },
    '7D': { intervalo: '30m', seg: 1800,  limite: 336 },
    '1M': { intervalo: '4h',  seg: 14400, limite: 180 },
    '3M': { intervalo: '1d',  seg: 86400, limite: 90 },
    '1A': { intervalo: '1d',  seg: 86400, limite: 365 },
};
var GRAFICO_CACHE_MS = 2 * 60 * 1000;

var moedaPg = null;          // estado da página aberta (null fora dela)
var moedaPgToken = 0;        // descarta respostas de páginas/períodos que já saíram
var lwPromessa = null;
var graficoCache = {};

// fator pra mostrar em reais, dólar ou bitcoin (o gráfico guarda tudo em reais)
function fatorExibicao() {
    var taxas = estado.ler('taxas') || {};
    var m = estado.ler('moeda');
    if (m === 'USD' && taxas.USD) return 1 / taxas.USD;
    if (m === 'BTC' && taxas.BTC) return 1 / taxas.BTC;
    return 1;
}

// valor já convertido -> texto com o símbolo da moeda de exibição
function formatarExibido(v) {
    var m = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    if (m === 'BTC' && taxas.BTC) return '₿ ' + formatarBR(v, Math.abs(v) >= 1 ? 4 : 8);
    if (m === 'USD' && taxas.USD) return 'US$ ' + formatarPreco(v);
    return 'R$ ' + formatarPreco(v);
}

function carregarLightweight() {
    if (window.LightweightCharts) return Promise.resolve();
    if (lwPromessa) return lwPromessa;
    lwPromessa = new Promise(function (ok, falha) {
        var el = document.createElement('script');
        el.src = LW_URL;
        el.integrity = LW_SRI;
        el.crossOrigin = 'anonymous';
        el.onload = ok;
        el.onerror = function () { lwPromessa = null; falha(new Error('biblioteca do gráfico')); };
        document.head.appendChild(el);
    });
    return lwPromessa;
}

function buscarKlines(simbolo, p) {
    var url = BINANCE + '/api/v3/klines?symbol=' + simbolo + '&interval=' + p.intervalo + '&limit=' + p.limite;
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('klines ' + r.status); return r.json(); });
}

// velas em reais: preço em USDT x USDTBRL do mesmo instante
function buscarSerie(par, periodo) {
    var chave = par + '|' + periodo;
    var c = graficoCache[chave];
    if (c && Date.now() - c.em < GRAFICO_CACHE_MS) return Promise.resolve(c.dados);

    var p = PERIODOS[periodo];
    var pedidos = [buscarKlines(par, p)];
    if (par !== 'USDTBRL') pedidos.push(buscarKlines('USDTBRL', p));
    return Promise.all(pedidos).then(function (res) {
        var taxaEm = {};
        if (res[1]) res[1].forEach(function (k) { taxaEm[k[0]] = Number(k[4]); });
        var ultima = res[1] && res[1].length ? Number(res[1][0][4]) : 1;
        var desvio = new Date().getTimezoneOffset() * 60;     // eixo em horário local
        var dados = res[0].map(function (k) {
            var tx = 1;
            if (res[1]) {
                if (taxaEm[k[0]]) ultima = taxaEm[k[0]];
                tx = ultima;
            }
            return {
                time: Math.floor(k[0] / 1000) - desvio,
                open: Number(k[1]) * tx,
                high: Number(k[2]) * tx,
                low: Number(k[3]) * tx,
                close: Number(k[4]) * tx,
            };
        });
        graficoCache[chave] = { em: Date.now(), dados: dados };
        return dados;
    });
}

// ---------- gráfico ----------
function corCss(nome) {
    return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
}

function criarGrafico() {
    var el = document.getElementById('grafico');
    var LW = window.LightweightCharts;
    var chart = LW.createChart(el, {
        autoSize: true,
        layout: { background: { type: 'solid', color: 'transparent' }, textColor: corCss('--texto-2'), fontFamily: 'Manrope, system-ui, sans-serif', fontSize: 12 },
        grid: { vertLines: { color: corCss('--borda') }, horzLines: { color: corCss('--borda') } },
        rightPriceScale: { borderColor: corCss('--borda'), scaleMargins: { top: 0.12, bottom: 0.08 } },
        timeScale: { borderColor: corCss('--borda'), timeVisible: true, secondsVisible: false },
        crosshair: {
            mode: LW.CrosshairMode.Normal,
            vertLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
            horzLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
        },
        localization: { priceFormatter: formatarExibido },
    });
    moedaPg.chart = chart;
    chart.subscribeCrosshairMove(function (param) {
        var leg = document.getElementById('grafico-legenda');
        if (!leg || !moedaPg || !moedaPg.serie) return;
        var d = param && param.seriesData && param.seriesData.get(moedaPg.serie);
        if (!param || !param.time || !d) { leg.innerHTML = ''; return; }
        var quando = new Date(param.time * 1000).toLocaleString('pt-BR', {
            timeZone: 'UTC', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
        });
        if (d.value != null) {
            leg.innerHTML = quando + ' · <strong>' + formatarExibido(d.value) + '</strong>';
        } else {
            leg.innerHTML = quando + ' · A <strong>' + formatarExibido(d.open) + '</strong> · M <strong>' + formatarExibido(d.high) +
                '</strong> · m <strong>' + formatarExibido(d.low) + '</strong> · F <strong>' + formatarExibido(d.close) + '</strong>';
        }
    });
}

function paraSerie(v) {
    var f = fatorExibicao();
    if (moedaPg.tipo === 'linha') return { time: v.time, value: v.close * f };
    return { time: v.time, open: v.open * f, high: v.high * f, low: v.low * f, close: v.close * f };
}

// (re)desenha a série com os dados atuais: troca de tipo, período ou moeda
function desenharSerie(ajustar) {
    var pg = moedaPg;
    if (!pg || !pg.chart || !pg.dados) return;
    var LW = window.LightweightCharts;
    if (pg.serie) { pg.chart.removeSeries(pg.serie); pg.serie = null; }
    var formato = { type: 'custom', formatter: formatarExibido, minMove: 1e-10 };
    var alta = corCss('--alta'), queda = corCss('--queda');
    if (pg.tipo === 'linha') {
        var subiu = pg.dados.length < 2 || pg.dados[pg.dados.length - 1].close >= pg.dados[0].close;
        pg.serie = pg.chart.addLineSeries({ color: subiu ? alta : queda, lineWidth: 2, priceFormat: formato, lastValueVisible: true, priceLineVisible: true });
    } else {
        pg.serie = pg.chart.addCandlestickSeries({
            upColor: alta, downColor: queda, borderUpColor: alta, borderDownColor: queda, wickUpColor: alta, wickDownColor: queda,
            priceFormat: formato,
        });
    }
    pg.serie.setData(pg.dados.map(paraSerie));
    if (ajustar) pg.chart.timeScale().fitContent();
}

function mostrarMensagemGrafico(texto) {
    var el = document.getElementById('grafico-msg');
    if (!el) return;
    el.hidden = !texto;

}

function carregarPeriodo() {
    var pg = moedaPg;
    if (!pg) return;
    if (!pg.par) {
        mostrarMensagemGrafico('O gráfico não está disponível para esta moeda: ela não tem par negociado na Binance.');
        return;
    }
    var token = ++moedaPgToken;
    mostrarMensagemGrafico('Carregando gráfico…');
    buscarSerie(pg.par, pg.periodo).then(function (dados) {
        if (token !== moedaPgToken || moedaPg !== pg) return;
        pg.dados = dados.map(function (v) { return Object.assign({}, v); });   // cópia: o ao vivo mexe na última vela
        mostrarMensagemGrafico('');
        desenharSerie(true);
    }).catch(function () {
        if (token !== moedaPgToken || moedaPg !== pg) return;
        mostrarMensagemGrafico('Não consegui carregar o gráfico agora. Troque o período pra tentar de novo.');
    });
}

// ---------- ao vivo (com amortecedor de 5s) ----------
function abrirSocketMoeda() {
    var pg = moedaPg;
    if (!pg || !pg.par) { estado.definir('conexao', 'off'); return; }
    estado.definir('conexao', 'conectando');
    var streams = pg.par === 'USDTBRL' ? ['usdtbrl@miniTicker'] : [pg.par.toLowerCase() + '@miniTicker', 'usdtbrl@miniTicker'];
    var ws;
    try { ws = new WebSocket(BINANCE_WS + streams.join('/')); } catch (e) { estado.definir('conexao', 'off'); return; }
    pg.ws = ws;
    if (!pg.amortecedor) {
        pg.amortecedor = criarAmortecedor(function (chave, t) { aplicarPrecoMoeda(chave, t.c, t.o); });
    }
    ws.onopen = function () { pg.tentativas = 0; estado.definir('conexao', 'ao-vivo'); };
    ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        var d = msg && msg.data;
        if (!d || !d.s) return;
        if (d.s === 'USDTBRL') pg.usdtbrl = Number(d.c);
        pg.amortecedor.guardar(d.s, { c: Number(d.c), o: Number(d.o) });
    };
    ws.onclose = function () {
        if (moedaPg !== pg || pg.ws !== ws) return;     // saiu da página de propósito
        pg.ws = null;
        estado.definir('conexao', 'off');
        var espera = Math.min(60000, 2000 * Math.pow(2, pg.tentativas++));
        pg.timerReconexao = setTimeout(function () { if (moedaPg === pg) abrirSocketMoeda(); }, espera);
    };
    ws.onerror = function () { /* onclose cuida */ };
}

function aplicarPrecoMoeda(simbolo, fechamento, abertura) {
    var pg = moedaPg;
    if (!pg || simbolo !== pg.par) return;      // o lote do USDTBRL só serve de taxa
    var preco = simbolo === 'USDTBRL' ? fechamento : fechamento * (pg.usdtbrl || (estado.ler('taxas') || {}).USD || 0);
    if (!(preco > 0)) return;

    var anterior = pg.m.preco;
    pg.m.preco = preco;
    if (abertura > 0) pg.m.var24h = (fechamento / abertura - 1) * 100;

    var el = document.getElementById('moeda-preco');
    if (el && Math.abs(preco - anterior) / anterior > 1e-7) {
        el.setAttribute('data-brl', preco);
        piscar(el, preco > anterior);
        animarNumero(el, anterior, preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
    }
    var v = document.getElementById('moeda-var');
    if (v) v.innerHTML = pctCelula(pg.m.var24h);

    atualizarDistanciaMaxima();
    recalcularConversor();
    atualizarUltimaVela(preco);
}

// a última vela acompanha o preço; passou do intervalo, abre uma nova
function atualizarUltimaVela(preco) {
    var pg = moedaPg;
    if (!pg || !pg.serie || !pg.dados || !pg.dados.length) return;
    var seg = PERIODOS[pg.periodo].seg;
    var desvio = new Date().getTimezoneOffset() * 60;
    var abertura = Math.floor(Date.now() / 1000 / seg) * seg - desvio;
    var u = pg.dados[pg.dados.length - 1];
    if (abertura > u.time) {
        u = { time: abertura, open: u.close, high: Math.max(u.close, preco), low: Math.min(u.close, preco), close: preco };
        pg.dados.push(u);
    } else {
        u.close = preco;
        if (preco > u.high) u.high = preco;
        if (preco < u.low) u.low = preco;
    }
    pg.serie.update(paraSerie(u));
}

function atualizarDistanciaMaxima() {
    var pg = moedaPg;
    var el = document.getElementById('est-ath');
    if (!pg || !el) return;
    if (!(pg.m.ath > 0)) { el.textContent = '—'; return; }
    el.innerHTML = varHTML((pg.m.preco / pg.m.ath - 1) * 100);

// ---------- conversor ----------
// aceita 1.234,56 e 1234.56; devolve NaN se não for número
function lerNumero(texto) {
    var t = String(texto || '').trim().replace(/\s/g, '');
    if (!t) return NaN;
    if (t.indexOf(',') !== -1) t = t.replace(/\./g, '').replace(',', '.');
    else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
    return /^\d*\.?\d+$|^\d+\.$/.test(t) ? Number(t) : NaN;
}

function textoNumero(n, casas) {
    return formatarBR(n, casas).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
}

function recalcularConversor(origem) {
    var pg = moedaPg;
    var q = document.getElementById('conv-qtd');
    var v = document.getElementById('conv-valor');
    if (!pg || !q || !v) return;
    var precoExibido = pg.m.preco * fatorExibicao();
    origem = origem || pg.convOrigem || 'qtd';
    if (origem === 'qtd') {
        var qtd = lerNumero(q.value);
        v.value = isNaN(qtd) ? '' : textoNumero(qtd * precoExibido, estado.ler('moeda') === 'BTC' && fatorExibicao() !== 1 ? 8 : 2);
    } else {
        var val = lerNumero(v.value);
        q.value = isNaN(val) || !precoExibido ? '' : textoNumero(val / precoExibido, 8);
    }
}

// ---------- ciclo de vida ----------
function sairDaMoeda() {
    if (!moedaPg) return;
    var pg = moedaPg;
    moedaPg = null;
    moedaPgToken++;
    clearTimeout(pg.timerReconexao);
    clearInterval(pg.timer24h);
    if (pg.amortecedor) pg.amortecedor.parar();
    if (pg.ws) { var ws = pg.ws; pg.ws = null; try { ws.close(); } catch (e) {} }
    if (pg.chart) { try { pg.chart.remove(); } catch (e) {} }
}

    prefs = armazem.json('PREFS', prefs);
    estado.definir('taxas', armazem.json('TAXAS', {}) || {});
    estado.definir('moeda', MOEDAS[prefs.moeda] ? prefs.moeda : 'BRL');
    estado.definir('conexao', 'conectando');

    rotaAtual = lerRotaDoEndereco() || ROTA_INICIAL;
    desenhar();

    buscarTaxas();
    atualizarPulso();
    setInterval(atualizarPulso, 30000);
    setInterval(buscarTaxas, TAXAS_TTL);
});

})();
</script>
