// [ETAPA 5.1] bolinhas dos cartões de destaque: acende a do cartão que está à
// vista (IntersectionObserver) e o toque numa bolinha leva ao cartão
var observadorDestaques = null;

function ligarPaginadorDestaques() {
    var faixa = document.querySelector('#destaques-mercado .destaques');
    if (!faixa || !('IntersectionObserver' in window)) return;
    var cartoes = Array.prototype.slice.call(faixa.querySelectorAll('.destaque'));
    var pontos = document.querySelectorAll('[data-destaque-ir]');
    if (observadorDestaques) observadorDestaques.disconnect();
    observadorDestaques = new IntersectionObserver(function (itens) {
        itens.forEach(function (it) {
            if (!it.isIntersecting) return;
            var i = cartoes.indexOf(it.target);
            pontos.forEach(function (p, k) { p.classList.toggle('ativo', k === i); });
        });
    }, { root: faixa, threshold: 0.6 });
    cartoes.forEach(function (c) { observadorDestaques.observe(c); });
}

document.addEventListener('click', function (ev) {
    var ponto = ev.target.closest('[data-destaque-ir]');
    if (!ponto) return;
    var faixa = document.querySelector('#destaques-mercado .destaques');
    var cartao = faixa && faixa.querySelectorAll('.destaque')[Number(ponto.getAttribute('data-destaque-ir'))];
    if (!cartao) return;
    faixa.scrollTo({ left: faixa.scrollLeft + cartao.getBoundingClientRect().left - faixa.getBoundingClientRect().left - 16, behavior: 'smooth' });
});

document.addEventListener('change', function (ev) {
    if (ev.target.id !== 'ord-mobile') return;
    var p = ev.target.value.split(':');

/* =================================================================
   BACKUP  [ETAPA 7]
   Exportar/importar JSON versionado (v1 = portfólio único).
   Formato: { versao, app, exportadoEm, usuario, banco, prefs }
   Compatibilidade futura: código de importação verifica `versao`
   antes de processar; v2 (multi-portfólio) importa v1 como portfólio
   único chamado "Principal". Ver memory/project_backup-versioning-plan.md
   ================================================================= */

function chaveSnapshot() {
    var id = sessaoAtual();
    return id ? 'BACKUP_SNAPSHOT_' + id : 'BACKUP_SNAPSHOT';
}

function exportarBackup() {
    var banco = lerBanco();
    var dados = {
        versao: 2,
        app: 'koin',
        exportadoEm: new Date().toISOString(),
        usuario: { nomeUsuario: _usuarioLogado ? nomeDoUsuario(_usuarioLogado) : '' },
        banco: banco,
        targets: _targets,              // [ETAPA 10.1] mapa moeda_id → peso_alvo
        balModo: estado.ler('balModo') || 'pct',
        prefs: {
            moeda: prefs.moeda,
            favoritos: prefs.favoritos || []
        }
    };
    var json = JSON.stringify(dados, null, 2);
    var blob = new Blob([json], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'koin-backup-' + hojeISO() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    avisar('Backup exportado.', 'sucesso');
}

function validarBackup(dados) {
    if (!dados || dados.app !== 'koin') return 'Arquivo não é um backup do Koin.';
    if (typeof dados.versao !== 'number') return 'Backup sem versão. Arquivo pode estar corrompido.';
    if (dados.versao !== 1 && dados.versao !== 2) return 'Versão ' + dados.versao + ' não suportada nesta versão do Koin.';
    if (!dados.banco || !Array.isArray(dados.banco.transacoes)) return 'Arquivo corrompido: dados de transações ausentes.';
    return null;
}

function previaBackup(dados) {
    var b = dados.banco;
    var total = b.transacoes.length;
    var nMoedas = Object.keys(b.moedas || {}).length;
    var datas = b.transacoes.map(function (t) { return t.data; }).filter(Boolean).sort();
    var periodo = datas.length
        ? formatarDataBR(datas[0]) + ' a ' + formatarDataBR(datas[datas.length - 1])
        : 'sem lançamentos';
    return {
        resumo: total + ' lançamento(s) · ' + nMoedas + ' moeda(s) · ' + periodo,
        usuario: dados.usuario && dados.usuario.nomeUsuario ? dados.usuario.nomeUsuario : '—'
    };
}

// [ETAPA 10.1] restaura targets do backup se presentes
function _restaurarTargetsBackup(user, dados) {
    if (!dados.targets || !Object.keys(dados.targets).length) return Promise.resolve();
    var modo = dados.balModo || 'pct';
    var rows = Object.keys(dados.targets).map(function (moedaId) {
        return {
            user_id: user.id,
            moeda_id: moedaId,
            peso_alvo: dados.targets[moedaId],
            modo: modo,
            updated_at: new Date().toISOString()
        };
    });
    return supabaseClient.from('portfolio_targets').delete().eq('user_id', user.id)
        .then(function () {
            return rows.length
                ? supabaseClient.from('portfolio_targets').upsert(rows, { onConflict: 'user_id,moeda_id' })
                : Promise.resolve();
        })
        .then(function () {
            _targets = dados.targets;
            if (dados.balModo) estado.definir('balModo', dados.balModo);
            try { armazem.set(chaveTargets(), JSON.stringify(_targets)); } catch (e) {}
        });
}

// [ETAPA 9.2] limpa transações do Supabase e insere uma nova lista
function _substituirTransacoesSupabase(user, novosBanco) {
    return supabaseClient.from('transacoes').delete().eq('user_id', user.id).then(function (r) {
        if (r.error) throw new Error('Erro ao limpar lançamentos: ' + r.error.message);
        var moedasRows = Object.values(novosBanco.moedas || {}).map(function (m) {
            return { id: m.id, user_id: user.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo || null };
        });
        var pMoedas = moedasRows.length
            ? supabaseClient.from('moedas_conhecidas').upsert(moedasRows, { onConflict: 'id,user_id' })
            : Promise.resolve({ error: null });
        return pMoedas.then(function (rm) {
            if (rm.error) throw new Error('Erro ao salvar moedas: ' + rm.error.message);
            var rows = (novosBanco.transacoes || []).map(function (t) {
                var row = transacaoParaRow(t);
                row.user_id = user.id;
                if (t.criadoEm) row.criado_em = new Date(t.criadoEm).toISOString();
                return row;
            });
            if (!rows.length) return Promise.resolve({ error: null });
            return supabaseClient.from('transacoes').insert(rows);
        });
    });
}

function confirmarImportacao(dados) {  // [ETAPA 9.2]
    supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) { avisar('Sessão encerrada. Faça login de novo.', 'erro'); return; }
        armazem.set(chaveSnapshot(), JSON.stringify({ transacoes: lerBanco().transacoes, moedas: lerBanco().moedas }));
        avisar('Importando backup…');
        _substituirTransacoesSupabase(user, dados.banco).then(function (r) {
            if (r && r.error) throw new Error(r.error.message);
            return carregarBanco();
        }).then(function () {
            if (dados.prefs) {
                if (dados.prefs.moeda && MOEDAS[dados.prefs.moeda]) prefs.moeda = dados.prefs.moeda;
                if (Array.isArray(dados.prefs.favoritos)) prefs.favoritos = dados.prefs.favoritos;
                salvarPrefs();
                estado.definir('moeda', prefs.moeda);
            }
            avisar('Backup importado com sucesso.', 'sucesso');
            desenhar();
        }).catch(function (e) { avisar('Erro ao importar: ' + (e.message || e), 'erro'); });
    });
}

function desfazerImportacao() {  // [ETAPA 9.2]
    var snap = armazem.json(chaveSnapshot(), null);
    if (!snap) { avisar('Nenhuma importação para desfazer.', 'erro'); return; }
    supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) { avisar('Sessão encerrada. Faça login de novo.', 'erro'); return; }
        avisar('Restaurando lançamentos anteriores…');
        _substituirTransacoesSupabase(user, snap).then(function (r) {
            if (r && r.error) throw new Error(r.error.message);
            return carregarBanco();
        }).then(function () {
            armazem.remove(chaveSnapshot());
            avisar('Importação desfeita. Dados anteriores restaurados.', 'sucesso');
            desenhar();
        }).catch(function (e) { avisar('Erro ao desfazer: ' + (e.message || e), 'erro'); });
    });
}

// wires o input de arquivo na página Ajustes
ROTAS['/ajustes'].montar = function () {
    var input = document.getElementById('backup-input');
    if (!input) return;
    input.addEventListener('change', function () {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (e) {
            var dados;
            try { dados = JSON.parse(e.target.result); } catch (_) {
                avisar('Arquivo inválido: não é um JSON legível.', 'erro');
                return;
            }
            var erro = validarBackup(dados);
            if (erro) { avisar(erro, 'erro'); return; }
            var prev = previaBackup(dados);
            var previa = document.getElementById('backup-previa');
            if (previa) {
                previa.hidden = false;
                previa.innerHTML =
                    '<strong>Arquivo válido</strong>' +
                    '<span>Exportado por: ' + escapar(prev.usuario) + '</span><br>' +
                    '<span>' + escapar(prev.resumo) + '</span>' +
                    '<p class="backup-previa-aviso">Os dados atuais serão substituídos. Você poderá desfazer logo depois.</p>' +
                    '<div class="backup-confirma">' +
                    '<button type="button" class="botao botao-marca" data-backup-confirmar>Confirmar importação</button>' +
                    '<button type="button" class="botao botao-fantasma" data-backup-cancelar>Cancelar</button>' +
                    '</div>';
                previa._dadosPendentes = dados;
            }
            input.value = '';
        };
        reader.readAsText(file);
    });
};

document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-backup-exportar]')) { exportarBackup(); return; }
    if (ev.target.closest('[data-backup-importar]')) {
        var inp = document.getElementById('backup-input');
        if (inp) inp.click();
        return;
    }
    if (ev.target.closest('[data-backup-confirmar]')) {
        var previa = document.getElementById('backup-previa');
        if (previa && previa._dadosPendentes) confirmarImportacao(previa._dadosPendentes);
        return;
    }
    if (ev.target.closest('[data-backup-cancelar]')) {
        var previa2 = document.getElementById('backup-previa');
        if (previa2) { previa2.hidden = true; previa2.innerHTML = ''; previa2._dadosPendentes = null; }
        return;
    }
    if (ev.target.closest('[data-backup-desfazer]')) { desfazerImportacao(); return; }
});

/* =================================================================
   INÍCIO  [ETAPA 6: verificar sessão antes de iniciar o app]
   ================================================================= */
function iniciarApp() {
    var chavePrefs = sessaoAtual() ? 'PREFS_' + sessaoAtual() : 'PREFS';
    prefs = armazem.json(chavePrefs, { moeda: 'BRL' });
    estado.definir('taxas', armazem.json('TAXAS', {}) || {});
    estado.definir('moeda', MOEDAS[prefs.moeda] ? prefs.moeda : 'BRL');
    aplicarTema(prefs.tema || 'escuro');
    estado.definir('conexao', 'conectando');
    rotaAtual = lerRotaDoEndereco() || ROTA_INICIAL;
    desenhar();               // casca rápida; páginas verão banco vazio até carregar
    atualizarInfoUsuario();
    buscarTaxas();
    atualizarPulso();
    setInterval(atualizarPulso, 30000);
    setInterval(buscarTaxas, TAXAS_TTL);
    // [ETAPA 9.2] carrega lançamentos do Supabase e redesenha com dados reais
    // [ETAPA 9.3] carregarBanco() já popula _banco do cache local
    // antes de qualquer chamada de rede, então o desenhar() acima
    // já mostra dados reais (se houver cache). A confirmação com o
    // Supabase roda em segundo plano; se trouxer diferença, redesenha
    // sozinha. Erros de rede são silenciosos — o app funciona offline.
    Promise.all([carregarBanco(), carregarTargets()]).then(function () {
        verificarMigracao();
    }).catch(function () {});
}

// [ETAPA 9] espera o armazenamento local E a primeira resposta da
// Supabase sobre a sessão (quem já chega logado, com sessão válida,
// não vê a tela de entrada piscar antes de entrar direto no app)
Promise.all([carregarArmazenamento(), _bootAuthPronto]).then(function () {
    if (_usuarioLogado) {
        iniciarApp();
    } else {
        mostrarTelaDeEntrada();
    }
});

})();
