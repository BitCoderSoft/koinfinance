<script>
(function () {
'use strict';

/* =================================================================
   CONFIGURAÇÃO
   ================================================================= */
var APP = {
    nome: 'KoinFin',
    versao: 'v0.2.0-beta',
    ano: 2026,
    autor: 'BitCoderSoft',
};

var BINANCE = 'https://data-api.binance.vision';   // dados públicos, sem chave


/* =================================================================
   ARMAZENAMENTO  [HERANÇA Dash Finance · STORE v1]
   localStorage quando dá; no preview do claude.ai (onde ele é bloqueado)
   cai pra memória, e usa window.storage se existir. Todo acesso passa
   por `armazem`, nunca por localStorage direto.
   ================================================================= */
var PREFIXO = 'KOIN_';
var espelho = {};
var modoArmazenamento = 'memoria';

try {
    localStorage.setItem(PREFIXO + 'teste', '1');
    localStorage.removeItem(PREFIXO + 'teste');
    modoArmazenamento = 'local';
} catch (e) {
    if (window.storage && typeof window.storage.get === 'function') modoArmazenamento = 'claude';
}

var armazem = {
    get: function (k) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') return localStorage.getItem(k);
        return Object.prototype.hasOwnProperty.call(espelho, k) ? espelho[k] : null;
    },
    set: function (k, v) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') { localStorage.setItem(k, v); return; }
        espelho[k] = String(v);
        if (modoArmazenamento === 'claude') {
            Promise.resolve().then(function () { return window.storage.set(k, String(v), false); }).catch(function () {});
        }
    },
    remove: function (k) {
        k = PREFIXO + k;
        if (modoArmazenamento === 'local') { localStorage.removeItem(k); return; }
        delete espelho[k];
    },
    json: function (k, padrao) {
        try {
            var raw = this.get(k);
            return raw ? JSON.parse(raw) : padrao;
        } catch (e) {
            return padrao;
        }
    },
};

// no preview, puxa as preferências salvas antes do primeiro desenho
function carregarArmazenamento() {
    if (modoArmazenamento !== 'claude') return Promise.resolve();
    var chaves = ['PREFS', 'BANCO'];
    return Promise.all(chaves.map(function (c) {
        return window.storage.get(PREFIXO + c, false)
            .then(function (r) { if (r && r.value != null) espelho[PREFIXO + c] = r.value; })
            .catch(function () {});
    }));
}


/* =================================================================
   ESTADO CENTRAL  [ETAPA 0]
   A diferença principal pro Dash Finance: lá cada mudança redesenhava
   a página inteira. Aqui as telas são desenhadas UMA vez e os pedaços
   que mudam (preço, moeda de exibição) se atualizam no lugar, ouvindo
   o estado. Isso é o que permite preço ao vivo a cada segundo.

   estado.definir('moeda', 'USD')  -> avisa quem ouve 'moeda'
   estado.ouvir('moeda', fn)       -> fn(novoValor, antigo); devolve
                                      uma função pra parar de ouvir
   Ouvintes de página são removidos sozinhos ao trocar de rota.
   ================================================================= */
var estado = (function () {
    var dados = {};
    var ouvintes = {};
    var daPagina = [];

    return {
        ler: function (k) { return dados[k]; },
        definir: function (k, v) {
            var antigo = dados[k];
            dados[k] = v;
            (ouvintes[k] || []).slice().forEach(function (fn) { fn(v, antigo); });
        },
        ouvir: function (k, fn, daPaginaAtual) {
            (ouvintes[k] = ouvintes[k] || []).push(fn);
            var parar = function () {
                ouvintes[k] = (ouvintes[k] || []).filter(function (f) { return f !== fn; });
            };
            if (daPaginaAtual) daPagina.push(parar);
            return parar;
        },
        limparPagina: function () {
            daPagina.forEach(function (p) { p(); });
            daPagina = [];
        },
    };
})();

// preferências: carregadas em iniciarApp() depois de estabelecer a sessão
var prefs = { moeda: 'BRL', tema: 'escuro' };

function aplicarTema(tema) {
    var t = tema === 'claro' ? 'claro' : 'escuro';
    document.documentElement.setAttribute('data-tema', t);
    prefs.tema = t;
}

function salvarPrefs() {
    var chave = sessaoAtual() ? 'PREFS_' + sessaoAtual() : 'PREFS';
    armazem.set(chave, JSON.stringify(prefs));
}


/* =================================================================
   FORMATAÇÃO  [HERANÇA Dash Finance · FMT v1 + fmtPreco]
   ================================================================= */
function agruparMilhar(inteiro) {
    return inteiro.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}

function formatarBR(n, casas) {
    n = Number(n) || 0;
    var s = Math.abs(n).toFixed(casas);
    var partes = s.split('.');
    partes[0] = agruparMilhar(partes[0]);
    return (n < 0 && Number(s) !== 0 ? '-' : '') + partes.join(',');
}

// preço com casas adaptativas: 612.345,67 · 0,8712 · 0,00001234
function formatarPreco(n) {
    n = Number(n) || 0;
    var abs = Math.abs(n);
    if (abs >= 1 || abs === 0) return formatarBR(n, 2);
    var casas = Math.min(10, Math.max(2, 3 - Math.floor(Math.log10(abs))));
    var s = n.toFixed(casas).replace(/0+$/, '');
    if ((s.split('.')[1] || '').length < 2) s = n.toFixed(2);
    return s.replace('.', ',');
}

function formatarPct(n) {
    n = Number(n) || 0;
    return (n > 0 ? '+' : '') + formatarBR(n, 2) + '%';
}

// valores grandes: 1,23 tri · 845,6 bi · 12,3 mi
function formatarCompacto(n) {
    var abs = Math.abs(n);
    if (abs >= 1e12) return formatarBR(n / 1e12, 2) + ' tri';
    if (abs >= 1e9) return formatarBR(n / 1e9, 2) + ' bi';
    if (abs >= 1e6) return formatarBR(n / 1e6, 2) + ' mi';
    if (abs >= 1e3) return formatarBR(n / 1e3, 1) + ' mil';
    return formatarBR(n, 2);
}

function escapar(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}


/* =================================================================
   MOEDA DE EXIBIÇÃO  [ETAPA 0]
   Tudo é guardado em REAIS. Na hora de mostrar:
     BRL -> R$ 1.234,56
     USD -> US$ 228,61      (R$ ÷ USDTBRL da Binance)
     BTC -> ₿ 0,00201523    (R$ ÷ BTCBRL da Binance)
   As taxas vêm juntas numa chamada e ficam 5 min em cache. Sem taxa
   (offline, preview bloqueando), o seletor desativa US$ e ₿ e tudo
   continua em reais.

   COMO USAR NAS TELAS: marque o elemento com data-brl="1234.56" (e,
   opcional, data-tipo="preco" pra casas adaptativas). Ele é preenchido
   sozinho e se reescreve quando a moeda muda. Nada de redesenhar a tela.
   ================================================================= */
var MOEDAS = {
    BRL: { rotulo: 'R$', nome: 'Real' },
    USD: { rotulo: 'US$', nome: 'Dólar' },
    BTC: { rotulo: '₿', nome: 'Bitcoin' },
};

var TAXAS_TTL = 5 * 60 * 1000;

// [ETAPA 5.1] sinal ANTES do símbolo, como no Brasil: "-R$ 0,09" (não "R$ -0,09").
// Vale pra R$, US$ e ₿. Valor que arredonda pra zero não leva sinal.
function formatarMoeda(brl, tipo, moeda) {
    var n = Number(brl) || 0;
    var texto = formatarMoedaSemSinal(Math.abs(n), tipo, moeda);
    return n < 0 && /[1-9]/.test(texto) ? '-' + texto : texto;
}

function formatarMoedaSemSinal(brl, tipo, moeda) {
    moeda = moeda || estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    brl = Number(brl) || 0;

    // tipo: 'preco' (casas adaptativas), 'compacto' (1,23 bi) ou vazio (2 casas)
    function no(valor) {
        if (tipo === 'preco') return formatarPreco(valor);
        if (tipo === 'compacto') return formatarCompacto(valor);
        return formatarBR(valor, 2);
    }
    if (moeda === 'USD' && taxas.USD) {
        return 'US$ ' + no(brl / taxas.USD);
    }
    if (moeda === 'BTC' && taxas.BTC) {
        var btc = brl / taxas.BTC;
        if (tipo === 'compacto' && Math.abs(btc) >= 1000) return '₿ ' + formatarCompacto(btc);
        // bitcoin: 8 casas até 1 ₿; acima disso, 4 bastam
        return '₿ ' + formatarBR(btc, Math.abs(btc) >= 1 ? 4 : 8);
    }
    return 'R$ ' + no(brl);
}

function preencherValores(raiz) {
    (raiz || document).querySelectorAll('[data-brl]').forEach(function (el) {
        el.textContent = formatarMoeda(el.getAttribute('data-brl'), el.getAttribute('data-tipo'));
    });
}

function buscarTaxas() {
    var cache = armazem.json('TAXAS', null);
    if (cache && Date.now() - cache.em < TAXAS_TTL) {
        estado.definir('taxas', cache);
        return Promise.resolve(cache);
    }
    var simbolos = encodeURIComponent(JSON.stringify(['USDTBRL', 'BTCBRL']));
    return fetch(BINANCE + '/api/v3/ticker/price?symbols=' + simbolos)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var t = { em: Date.now() };
            lista.forEach(function (p) {
                if (p.symbol === 'USDTBRL') t.USD = Number(p.price);
                if (p.symbol === 'BTCBRL') t.BTC = Number(p.price);
            });
            armazem.set('TAXAS', JSON.stringify(t));
            estado.definir('taxas', t);
            return t;
        })
        .catch(function () {
            estado.definir('taxas', cache || {});   // cache velho é melhor que nada
            return cache;
        });
}

function trocarMoeda(m) {
    if (!MOEDAS[m]) return;
    prefs.moeda = m;
    salvarPrefs();
    estado.definir('moeda', m);
}

// a moeda muda -> todos os [data-brl] da tela se reescrevem
estado.ouvir('moeda', function () { preencherValores(); atualizarSeletoresMoeda(); });
estado.ouvir('taxas', function () { preencherValores(); atualizarSeletoresMoeda(); });

function seletorMoedaHTML() {
    return '<div class="segmentado" role="group" aria-label="Moeda de exibição" data-seletor-moeda>' +
        Object.keys(MOEDAS).map(function (m) {
            return '<button type="button" data-moeda="' + m + '" title="Mostrar valores em ' + MOEDAS[m].nome + '">' + MOEDAS[m].rotulo + '</button>';
        }).join('') + '</div>';
}

// [ETAPA 6.2] botão único do celular (ver atualizarChipMoeda)
function chipMoedaMobileHTML() {
    var atual = estado.ler('moeda') || 'BRL';
    return '<button type="button" id="moeda-chip" class="botao-icone moeda-chip" data-moeda-ciclo aria-label="Trocar moeda de exibição">' +
        MOEDAS[atual].rotulo + '</button>';
}

function atualizarSeletoresMoeda() {
    var atual = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    document.querySelectorAll('[data-seletor-moeda] button').forEach(function (b) {
        var m = b.getAttribute('data-moeda');
        b.setAttribute('aria-pressed', m === atual ? 'true' : 'false');
        // sem taxa, não dá pra converter: desativa e explica
        b.disabled = m !== 'BRL' && !taxas[m];
        if (b.disabled) b.title = 'Sem cotação de ' + MOEDAS[m].nome + ' agora (sem conexão com a Binance).';
    });
    atualizarChipMoeda(atual, taxas); // [ETAPA 6.2]
}

// [ETAPA 6.2 · 30/09/2026] CHIP DE MOEDA DO CELULAR
// O seletor de 3 botões (R$ / US$ / ₿) tem uns 125px — de sobra no
// computador, mas foi uma das duas causas do sanduíche sumir em tela
// estreita (a outra era o avatar, ver atualizarInfoUsuario). No topo do
// celular ele vira UM botão só (~38px, do tamanho dos outros ícones),
// mostrando a moeda atual; tocar cicla pra próxima disponível (pula a que
// estiver sem cotação). O seletor de 3 botões continua igual em Ajustes.
function ordemMoedasDisponiveis(taxas) {
    return Object.keys(MOEDAS).filter(function (m) { return m === 'BRL' || taxas[m]; });
}

function proximaMoeda(atual, taxas) {
    var disponiveis = ordemMoedasDisponiveis(taxas);
    var i = disponiveis.indexOf(atual);
    return disponiveis[(i + 1) % disponiveis.length] || 'BRL';
}

function atualizarChipMoeda(atual, taxas) {
    var chip = document.getElementById('moeda-chip');
    if (!chip) return;
    chip.textContent = MOEDAS[atual].rotulo;
    var prox = proximaMoeda(atual, taxas);
    chip.title = ordemMoedasDisponiveis(taxas).length > 1
        ? 'Mostrando em ' + MOEDAS[atual].nome + '. Toque pra ver em ' + MOEDAS[prox].nome + '.'
        : 'Mostrando em ' + MOEDAS[atual].nome + '. Sem cotação pra converter agora.';
}


/* =================================================================
   MOVIMENTO  [ETAPA 0]
   ================================================================= */
var menosMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// número desliza do valor antigo até o novo (~600ms)
function animarNumero(el, de, para, formatador, duracao) {
    if (menosMovimento || de === para) { el.textContent = formatador(para); return; }
    duracao = duracao || 600;
    var inicio = null;
    if (el._animacao) cancelAnimationFrame(el._animacao);
    function passo(t) {
        if (!inicio) inicio = t;
        var p = Math.min((t - inicio) / duracao, 1);
        var suave = 1 - Math.pow(1 - p, 3);          // desacelera no fim
        el.textContent = formatador(de + (para - de) * suave);
        if (p < 1) el._animacao = requestAnimationFrame(passo);
    }
    el._animacao = requestAnimationFrame(passo);
}

// pisca verde/vermelho quando o preço muda (estilo Binance)
function piscar(el, subiu) {
    el.classList.remove('pisca-alta', 'pisca-queda');

}

function avisar(texto, tipo) {
    var caixa = document.getElementById('avisos');
    var el = document.createElement('div');
    el.className = 'aviso ' + (tipo || '');
    el.textContent = texto;
    caixa.appendChild(el);
    setTimeout(function () {
        el.style.transition = 'opacity 200ms ease';
        el.style.opacity = '0';
        setTimeout(function () { el.remove(); }, 220);
    }, 3200);
}

var ROTA_INICIAL = '/mercado';

// abre/fecha menus suspensos: clique no botão, passar o mouse (com
// pequena folga pra não fechar no caminho até o menu), Esc e clique fora
function fecharMenus(excecao) {
    document.querySelectorAll('[data-grupo].aberto').forEach(function (g) {
        if (g === excecao) return;
        g.classList.remove('aberto');
        var b = g.querySelector('[data-grupo-botao]');
        if (b) b.setAttribute('aria-expanded', 'false');
    });
}

function abrirMenu(grupo) {
    fecharMenus(grupo);
    grupo.classList.add('aberto');
    grupo.querySelector('[data-grupo-botao]').setAttribute('aria-expanded', 'true');
}

document.addEventListener('click', function (ev) {
    var botao = ev.target.closest('[data-grupo-botao]');
    if (botao) {
        var g = botao.closest('[data-grupo]');
        // com mouse, passar por cima já abriu: o clique só confirma (se
        // alternasse, o clique logo depois do hover fecharia o menu).
        // No toque, o clique alterna.
        if (ponteiroFino || !g.classList.contains('aberto')) abrirMenu(g);
        else fecharMenus();
        return;
    }
    if (!ev.target.closest('.menu-suspenso')) fecharMenus();
});

document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') fecharMenus();
});

if (ponteiroFino) {
    var timerFechar = null;
    document.addEventListener('mouseover', function (ev) {
        var g = ev.target.closest && ev.target.closest('[data-grupo]');
        if (g) {
            clearTimeout(timerFechar);
            if (!g.classList.contains('aberto')) abrirMenu(g);
        }
    });
    document.addEventListener('mouseout', function (ev) {
        var g = ev.target.closest && ev.target.closest('[data-grupo]');
        if (!g) return;
        if (ev.relatedTarget && g.contains(ev.relatedTarget)) return;
        clearTimeout(timerFechar);
        timerFechar = setTimeout(function () { fecharMenus(); }, 180);
    });
}

// ── BALANCEAMENTO [ETAPA 10 · design inicial] ────────────────────────
// Por enquanto os targets são dados mockados pra validação visual.
// A lógica real de salvar/carregar via Supabase vem na Etapa 10.1.

// Targets mockados (0 = sem definição = mostra bolinha de alerta)
// [ETAPA 10.1] targets reais — carregados do Supabase e cacheados localmente.
// Estrutura: { moeda_id: peso_alvo (número) }
// O modo (% ou nota) é armazenado por usuário em prefs.balModo.
var _targets = {};

function chaveTargets() {
    var id = sessaoAtual();
    return id ? 'TARGETS_' + id : 'TARGETS';
}

// carrega do cache local primeiro, depois confirma com o Supabase em segundo plano
function carregarTargets() {
    var local = armazem.json(chaveTargets(), null);
    if (local && typeof local === 'object') {
        _targets = local;
    }
    return supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) return;
        return supabaseClient
            .from('portfolio_targets')
            .select('moeda_id, peso_alvo, modo')
            .eq('user_id', user.id)
            .then(function (res) {
                if (res.error) { console.warn('carregarTargets:', res.error.message); return; }
                var mapa = {};
                var modoSalvo = null;
                (res.data || []).forEach(function (row) {
                    mapa[row.moeda_id] = parseFloat(row.peso_alvo);
                    if (!modoSalvo) modoSalvo = row.modo;
                });
                _targets = mapa;
                try { armazem.set(chaveTargets(), JSON.stringify(mapa)); } catch (e) {}
                // restaura o modo que foi usado na última gravação
                if (modoSalvo && modoSalvo !== estado.ler('balModo')) {
                    estado.definir('balModo', modoSalvo);
                }
            });
    }).catch(function (e) {
        console.warn('carregarTargets offline:', e && e.message);
    });
}

// grava no Supabase e atualiza o cache local
function salvarTargets() {
    var modo = estado.ler('balModo') || 'pct';
    return supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) throw new Error('Sem sessão ativa.');
        var rows = Object.keys(_targets).map(function (moedaId) {
            return {
                user_id: user.id,
                moeda_id: moedaId,
                peso_alvo: _targets[moedaId],
                modo: modo,
                updated_at: new Date().toISOString()
            };
        });
        // upsert: insere ou atualiza cada linha
        return supabaseClient
            .from('portfolio_targets')
            .upsert(rows, { onConflict: 'user_id,moeda_id' })
            .then(function (res) {
                if (res.error) throw new Error(res.error.message);
                // remove linhas de moedas que foram zeradas (não estão mais em _targets)
                return supabaseClient
                    .from('portfolio_targets')
                    .delete()
                    .eq('user_id', user.id)
                    .not('moeda_id', 'in', '(' + Object.keys(_targets).map(function (id) { return '"' + id + '"'; }).join(',') + ')')
                    .then(function () {
                        try { armazem.set(chaveTargets(), JSON.stringify(_targets)); } catch (e) {}
                    });
            });
    });
}

// DE ONDE VEM CADA DADO
//   CoinGecko /coins/markets (1 chamada, 100 moedas, já em reais):

//     [ETAPA 1.1] No máximo 1 chamada por dia (ver Worker koin-api).
//     A chave vai como parâmetro na URL e não no cabeçalho: cabeçalho
//     customizado obriga o navegador a uma checagem prévia (CORS) que já

//     preço e variação 24h das moedas que a Binance negocia contra USDT,
//     convertidos pra reais pelo USDTBRL do mesmo canal.
//
// CASAR COINGECKO COM BINANCE: pelo símbolo (btc -> BTCUSDT). Símbolo não é
// único no mundo cripto (duas moedas diferentes podem usar o mesmo), então
// só liga o "ao vivo" se o preço da Binance estiver a até 10% do preço da
// CoinGecko na largada. Mesma ideia que resolveu o caso do ENA.
//
// SEM COINGECKO (limite, fora do ar, bloqueio): cai pro modo simplificado,
// com uma lista fixa das principais moedas e dados só da Binance. Sem
// valor de mercado, logo e minigráfico, mas com preço ao vivo.
//
// ATUALIZAÇÃO NO LUGAR: a tabela é montada uma vez (e de novo só ao trocar
// aba, busca ou ordem). O WebSocket mexe só nas células de preço e 24h
// da linha certa, com pisca e número deslizando.

// [ETAPA 9.4 · 03/10/2026] Worker do Cloudflare intermediando a CoinGecko.
// A chave fica como variável de ambiente lá, nunca neste arquivo.
var COINGECKO = 'https://teste-koin.correiaerisvaldo.workers.dev';
var BINANCE_WS = 'wss://data-stream.binance.vision/stream?streams=';

// [ETAPA 1.1] REGRA DA COINGECKO: no máximo 1 chamada por dia.
// O app vive dos dados da Binance (preço, variação 24h e volume ao vivo).
// A CoinGecko só entra pro que a Binance não entrega (ranking, logo, valor
// de mercado, variação 1h/7d e minigráfico), e só na primeira abertura do
// dia. Nas demais, usa o pacote guardado. Se a chamada falhar, espera
// CG_ESPERA_FALHA antes de tentar de novo, pra não martelar a API.
// Chave Demo do autor embutida. O usuário não informa chave própria.
// [ETAPA 9.4] chave removida do cliente — vive no Worker do Cloudflare
var CG_ESPERA_FALHA = 30 * 60 * 1000;
var CG_PACOTE_VERSAO = 2;      // sobe quando o pacote ganha campos novos

// dia local no formato AAAA-MM-DD ("primeira chamada do dia" segue o relógio de quem usa)
function diaDeHoje(quando) {
    var d = quando ? new Date(quando) : new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
var DIVERGENCIA_MAX = 0.10;

// [ETAPA 2] REGRA: o preço que aparece nos painéis muda no máximo a cada 5s.
// O WebSocket da Binance segue mandando ~1 tick por segundo, mas o app só
// guarda o último de cada moeda e aplica na tela neste intervalo. Vale pra
// tabela do Mercado e pra página da moeda (o pulso do BTC no topo segue a
// cada 30s, por consulta própria).
var PRECO_INTERVALO_MS = 5000;
var PRECO_PRIMEIRO_MS = 800;    // 1º lote sai rápido: o preço do pacote diário pode estar velho

// guarda o último valor de cada chave e entrega em lote a cada `ms`
function criarAmortecedor(aplicar) {
    var pendentes = {};
    var primeiro = null;
    var intervalo = null;
    var iniciado = false;
    function fluxo() {
        var lote = pendentes;
        pendentes = {};
        Object.keys(lote).forEach(function (k) { aplicar(k, lote[k]); });
    }
    return {
        guardar: function (chave, valor) {
            pendentes[chave] = valor;
            // o relógio de 5s só começa quando chega o 1º tick
            if (iniciado) return;
            iniciado = true;
            primeiro = setTimeout(function () {
                fluxo();
                intervalo = setInterval(fluxo, PRECO_INTERVALO_MS);
            }, PRECO_PRIMEIRO_MS);
        },
        parar: function () { clearTimeout(primeiro); clearInterval(intervalo); pendentes = {}; },
    };
}

function buscarMercadoCoinGecko() {
    var cache = armazem.json('MERCADO', null);
    var completo = cache && cache.modo === 'completo';

    // [ETAPA 1.1] já chamou hoje? então não chama de novo.
    // [ETAPA 2] pacote de antes da Etapa 2 não tem as estatísticas: renova uma vez.
    if (completo && cache.v === CG_PACOTE_VERSAO && diaDeHoje(cache.em) === diaDeHoje()) {
        return Promise.resolve(cache);
    }

    // [ETAPA 1.1] última tentativa falhou há pouco? usa o que tem
    var falha = Number(armazem.get('MERCADO_FALHA')) || 0;
    if (falha && Date.now() - falha < CG_ESPERA_FALHA) {
        if (completo) {
            cache.velho = true;
            return Promise.resolve(cache);
        }
        return Promise.reject(new Error('em espera'));
    }

    var url = COINGECKO + '/mercado';
    // [ETAPA 9.4] chave adicionada pelo Worker, não pelo cliente

    return fetch(url)
        .then(function (r) {
            if (r.status === 429) throw new Error('limite');
            if (!r.ok) throw new Error('http ' + r.status);
            return r.json();
        })
        .then(function (dados) {
            var pacote = { em: Date.now(), v: CG_PACOTE_VERSAO, modo: 'completo', lista: dados.map(normalizarCoinGecko) };
            try {
                armazem.set('MERCADO', JSON.stringify(pacote));
                armazem.remove('MERCADO_FALHA');
            } catch (e) { /* cache é opcional */ }
            return pacote;
        })
        .catch(function (erro) {
            try { armazem.set('MERCADO_FALHA', String(Date.now())); } catch (e) {}
            // cache de outro dia ainda serve melhor que o modo simplificado
            if (completo) {
                cache.velho = true;
                return cache;
            }
            throw erro;
        });
}

    var url = BINANCE + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(simbolos));
    return fetch(url)
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (dados) {
            var por = {};
            dados.forEach(function (d) { por[d.symbol] = d; });
            var taxa = por.USDTBRL ? Number(por.USDTBRL.lastPrice) : null;
            if (!taxa) throw new Error('sem USDTBRL');
            var lista = [];
            LISTA_RESERVA.forEach(function (m, i) {
                var d = m[0] === 'USDT' ? por.USDTBRL : por[m[0] + 'USDT'];
                if (!d) return;
                var preco = m[0] === 'USDT' ? Number(d.lastPrice) : Number(d.lastPrice) * taxa;
                lista.push({
                    id: m[0].toLowerCase(), simbolo: m[0], nome: m[1], logo: null, rank: i + 1,
                    preco: preco, var1h: null, var24h: Number(d.priceChangePercent), var7d: null,
                    volume: Number(d.quoteVolume) * (m[0] === 'USDT' ? 1 : taxa), valorMercado: null,
                    sparkline: null, aoVivo: false,
                });
            });
            return { em: Date.now(), modo: 'simplificado', lista: lista };
        });
}

function carregarMercado() {
    return buscarMercadoCoinGecko()
        .catch(function () { return buscarMercadoReserva(); })
        .then(function (pacote) {
            mercado.lista = pacote.lista;
            mercado.modo = pacote.modo;
            mercado.atualizadoEm = pacote.em;
            mercado.velho = !!pacote.velho;
            mercado.porId = {};
            mercado.lista.forEach(function (m) { mercado.porId[m.id] = m; });
            return pacote;
        });
}

// ---------- tempo real ----------
// preços de todos os pares da Binance (1 chamada, cache de 1h)
function obterPrecosBinance() {
    var cache = armazem.json('BINANCE_PRECOS', null);
    if (cache && Date.now() - cache.em < 60 * 60 * 1000) return Promise.resolve(cache.precos);
    return fetch(BINANCE + '/api/v3/ticker/price')
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var precos = {};
            lista.forEach(function (p) { precos[p.symbol] = Number(p.price); });
            try { armazem.set('BINANCE_PRECOS', JSON.stringify({ em: Date.now(), precos: precos })); } catch (e) {}
            return precos;
        });
}

// par da Binance que corresponde à moeda da CoinGecko, ou null.
// Mesmo símbolo pode ser moeda diferente (caso do ENA), então compara o
// preço. [ETAPA 2] Com a CoinGecko 1x por dia, o preço do pacote pode ter
// horas: a tolerância sobe conforme a idade (10% até 1h; 40% depois).
// Símbolo repetido de verdade costuma diferir por ordens de grandeza.
function parBinanceDe(m, precos) {
    if (m.simbolo === 'USDT') return precos.USDTBRL ? 'USDTBRL' : null;
    var par = m.simbolo + 'USDT';
    var taxa = precos.USDTBRL;
    if (!precos[par] || !taxa) return null;
    var idade = mercado.atualizadoEm ? Date.now() - mercado.atualizadoEm : 0;
    var tolerancia = idade > 60 * 60 * 1000 ? 0.40 : DIVERGENCIA_MAX;
    if (m.preco > 0 && Math.abs(precos[par] * taxa / m.preco - 1) > tolerancia) return null;
    return par;
}

function conectarAoVivo() {
    desconectarAoVivo();
    // quais moedas têm par USDT na Binance? (lista de preços, 1h de cache)
    var pronto = obterPrecosBinance();

    pronto.then(function (precos) {
        var taxa = precos.USDTBRL;
        if (!taxa) throw new Error('sem USDTBRL');
        mercado.usdtbrl = taxa;
        mercado.wsMapa = {};
        mercado.lista.forEach(function (m) {
            if (m.simbolo === 'USDT') { mercado.wsMapa.USDTBRL_MOEDA = m.id; m.aoVivo = true; return; }
            var par = parBinanceDe(m, precos);
            if (!par) return;
            mercado.wsMapa[par] = m.id;
            m.aoVivo = true;
        });
        var streams = Object.keys(mercado.wsMapa).filter(function (k) { return k !== 'USDTBRL_MOEDA'; })
            .map(function (k) { return k.toLowerCase() + '@miniTicker'; });
        streams.push('usdtbrl@miniTicker');
        abrirSocket(streams);
        marcarLinhasAoVivo();
    }).catch(function () {
        estado.definir('conexao', 'off');
    });
}

function abrirSocket(streams) {
    estado.definir('conexao', 'conectando');
    var ws;
    try {
        ws = new WebSocket(BINANCE_WS + streams.join('/'));
    } catch (e) {
        estado.definir('conexao', 'off');
        return;
    }
    mercado.ws = ws;
    // [ETAPA 2] ticks vão pro amortecedor; a tela muda a cada PRECO_INTERVALO_MS
    if (!mercado.amortecedor) {
        mercado.amortecedor = criarAmortecedor(function (simbolo, t) { aplicarTick(simbolo, t.c, t.o); });
    }
    ws.onopen = function () {
        mercado.wsTentativas = 0;
        estado.definir('conexao', 'ao-vivo');
    };
    ws.onmessage = function (ev) {
        var msg;
        try { msg = JSON.parse(ev.data); } catch (e) { return; }
        var d = msg && msg.data;
        if (!d || !d.s) return;
        receberTick(d.s, Number(d.c), Number(d.o));
    };
    ws.onclose = function () {
        if (mercado.ws !== ws) return;          // fechado de propósito
        mercado.ws = null;
        estado.definir('conexao', 'off');
        // reconecta com espera crescente (2s, 4s, 8s... até 60s)
        var espera = Math.min(60000, 2000 * Math.pow(2, mercado.wsTentativas++));
        mercado.timerReconexao = setTimeout(function () {
            if (rotaAtual === '/mercado') abrirSocket(streams);
        }, espera);
    };
    ws.onerror = function () { /* onclose cuida */ };
}

function desconectarAoVivo() {
    clearTimeout(mercado.timerReconexao);
    if (mercado.amortecedor) {
        mercado.amortecedor.parar();
        mercado.amortecedor = null;
    }
    if (mercado.ws) {
        var ws = mercado.ws;
        mercado.ws = null;
        try { ws.close(); } catch (e) {}
    }
}

function receberTick(simbolo, fechamento, abertura) {
    // a taxa de conversão entra na hora (não mexe na tela); o resto espera o lote
    if (simbolo === 'USDTBRL') mercado.usdtbrl = fechamento;
    if (mercado.amortecedor) mercado.amortecedor.guardar(simbolo, { c: fechamento, o: abertura });
}

function aplicarTick(simbolo, fechamento, abertura) {
    var id, preco;
    if (simbolo === 'USDTBRL') {
        id = mercado.wsMapa.USDTBRL_MOEDA;
        preco = fechamento;
    } else {
        id = mercado.wsMapa[simbolo];
        if (!id || !mercado.usdtbrl) return;
        preco = fechamento * mercado.usdtbrl;
    }
    var m = id && mercado.porId[id];
    if (!m || !(preco > 0)) return;

    var anterior = m.preco;
    m.preco = preco;
    if (abertura > 0) m.var24h = (fechamento / abertura - 1) * 100;

    var linha = document.querySelector('[data-moeda-id="' + id + '"]');
    if (!linha) return;
    var celPreco = linha.querySelector('[data-cel="preco"]');
    var celVar = linha.querySelector('[data-cel="var24h"]');
    if (celPreco && Math.abs(preco - anterior) / anterior > 1e-7) {
        celPreco.setAttribute('data-brl', preco);
        piscar(celPreco, preco > anterior);
        animarNumero(celPreco, anterior, preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
    }
    if (celVar) celVar.innerHTML = varHTML(m.var24h);
}

function marcarLinhasAoVivo() {
    mercado.lista.forEach(function (m) {
        var linha = document.querySelector('[data-moeda-id="' + m.id + '"]');
        if (linha) linha.classList.toggle('ao-vivo', m.aoVivo);
    });
}

// ---------- desenho ----------
function sparklineSVG(pontos, pct) {
    if (!pontos || pontos.length < 2) return '<span class="sem-dado">—</span>';
    // 168 pontos (1 por hora) viram ~42: o traço fica limpo e leve
    var passo = Math.max(1, Math.floor(pontos.length / 42));
    var amostra = pontos.filter(function (_, i) { return i % passo === 0; });
    amostra.push(pontos[pontos.length - 1]);
    var min = Math.min.apply(null, amostra), max = Math.max.apply(null, amostra);
    var w = 120, h = 36, faixa = max - min || 1;
    var d = amostra.map(function (v, i) {
        var x = (i / (amostra.length - 1)) * w;
        var y = h - 3 - ((v - min) / faixa) * (h - 6);
        return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
    }).join(' ');
    var cor = pct == null ? 'var(--texto-3)' : pct >= 0 ? 'var(--alta)' : 'var(--queda)';
    return '<svg class="sparkline" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
        '<path d="' + d + '" fill="none" stroke="' + cor + '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" pathLength="1"/></svg>';
}

function logoHTML(m) {
    if (m.logo) {

function moedasFiltradas() {
    var lista = mercado.lista.slice();
    var fav = favoritos();
    if (mercado.aba === 'favoritas') lista = lista.filter(function (m) { return fav.indexOf(m.id) !== -1; });
    if (mercado.busca) {
        var q = mercado.busca.toLowerCase();
        lista = lista.filter(function (m) { return m.nome.toLowerCase().indexOf(q) !== -1 || m.simbolo.toLowerCase().indexOf(q) !== -1; });
    }
    if (mercado.aba === 'altas') {
        lista = lista.filter(function (m) { return m.var24h > 0; }).sort(function (a, b) { return b.var24h - a.var24h; });
        return lista;
    }
    if (mercado.aba === 'quedas') {
        lista = lista.filter(function (m) { return m.var24h < 0; }).sort(function (a, b) { return a.var24h - b.var24h; });
        return lista;
    }
    var o = mercado.ordem;
    lista.sort(function (a, b) {
        var va = a[o.campo], vb = b[o.campo];
        if (va == null) return 1;
        if (vb == null) return -1;
        return o.desc ? vb - va : va - vb;
    });
    return lista;
}

// [ETAPA 8 · 02/10/2026] LUPA DO MERCADO, FORA DAS 100 MAIORES
// Só dispara quando a tabela das 100 já ficou vazia pra essa busca — não
// tem sentido gastar uma chamada externa se a resposta já está ali embaixo.
// Mesmo motor de busca da gaveta (buscarMoedaExterna). Preço e variação de
// 24h vêm da Binance numa chamada só (igual o portfólio já faz), só pros
// resultados que tiverem par — sem isso, "decidir se compra ou não" citado
// pelo Junior ficaria sem a parte mais importante: o preço.
var buscaMercadoTimer = null;

function atualizarBuscaExterna() {
    var caixa = document.getElementById('busca-externa-mercado');
    if (!caixa) return;
    var termo = mercado.busca.trim();
    clearTimeout(buscaMercadoTimer);

    if (!termo || termo.length < 2 || moedasFiltradas().length > 0) {
        caixa.innerHTML = '';
        return;
    }

    buscaMercadoTimer = setTimeout(function () {
        if (mercado.busca.trim() !== termo) return;  // já digitou outra coisa
        caixa.innerHTML = '<div class="painel busca-externa"><p class="painel-sub">Procurando "' + escapar(termo) + '" fora das 100 maiores…</p></div>';

        buscarMoedaExterna(termo).then(function (lista) {
            if (mercado.busca.trim() !== termo) return;
            if (!lista.length) {
                caixa.innerHTML = '<div class="painel busca-externa"><p class="painel-sub">Não achei nenhuma moeda com esse nome, nem fora das 100 maiores.</p></div>';
                return;
            }
            obterPrecosBinance().catch(function () { return {}; }).then(function (precos) {
                var taxa = precos.USDTBRL;
                var pares = [];
                lista.forEach(function (m) {
                    var par = m.simbolo + 'USDT';
                    if (taxa && precos[par] > 0) {
                        m.parBinance = par;
                        if (pares.indexOf(par) === -1) pares.push(par);
                    }
                });
                if (!pares.length) { desenharBuscaExterna(caixa, termo, lista, {}); return; }
                var simbolos = pares.concat(['USDTBRL']);
                fetch(BINANCE + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(simbolos)))
                    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
                    .then(function (dados) {
                        var por = {};
                        dados.forEach(function (d) { por[d.symbol] = d; });
                        desenharBuscaExterna(caixa, termo, lista, por);
                    })
                    .catch(function () { desenharBuscaExterna(caixa, termo, lista, {}); });
            });
        });
    }, 400);
}

function desenharBuscaExterna(caixa, termo, lista, tickers24h) {
    if (mercado.busca.trim() !== termo) return;  // a resposta demorou e a pessoa já saiu da busca
    var taxa = tickers24h.USDTBRL ? Number(tickers24h.USDTBRL.lastPrice) : null;
    var linhas = lista.map(function (m) {
        var d = m.parBinance ? tickers24h[m.parBinance] : null;
        var preco = '<span class="sem-dado">sem cotação</span>';
        var variacao = '<span></span>';
        if (d && taxa) {
            preco = '<span class="destaque-preco" data-brl="' + (Number(d.lastPrice) * taxa) + '" data-tipo="preco"></span>';
            variacao = varHTML(Number(d.priceChangePercent));
        }
        return '<li><a role="link" tabindex="0" class="destaque-linha" data-rota="/moeda/' + escapar(m.id) + '">' +
            logoHTML(m) + '<span class="destaque-nome">' + escapar(m.nome) + ' <span class="sem-dado">' + escapar(m.simbolo) + '</span></span>' +
            preco + variacao + '</a></li>';
    }).join('');
    caixa.innerHTML = '<div class="painel busca-externa"><p class="painel-titulo">Fora das 100 maiores</p>' +
        '<p class="painel-sub">Sem ranking nem gráfico de 7 dias, mas com preço ao vivo quando a Binance tiver o par.</p>' +
        '<ul class="busca-externa-lista">' + linhas + '</ul></div>';
    preencherValores(caixa);
}

//   Pacote diário da CoinGecko (o mesmo do Mercado, zero chamada extra):

//   Binance:

//       klines do USDTBRL no mesmo instante (mesma ideia do Dash Finance);
//     - máxima, mínima e volume de 24h: /api/v3/ticker/24hr (renova a cada 60s);
//     - preço e variação 24h ao vivo: WebSocket, com o amortecedor de 5s.
//   Moeda sem par na Binance: mostra os dados do pacote diário e avisa que
//   o gráfico não está disponível (a regra de 1 chamada por dia da CoinGecko
//   impede buscar o histórico de lá).

var LW_URL = 'https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js';
var LW_SRI = 'sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK';

// período -> tamanho da vela e quantas velas buscar (segundos por vela em `seg`)
var PERIODOS = {
    '1D': { intervalo: '5m',  seg: 300,   limite: 288 },
    '7D': { intervalo: '30m', seg: 1800,  limite: 336 },
    '1M': { intervalo: '4h',  seg: 14400, limite: 180 },
    '3M': { intervalo: '1d',  seg: 86400, limite: 90 },
    '1A': { intervalo: '1d',  seg: 86400, limite: 365 },
};
var GRAFICO_CACHE_MS = 2 * 60 * 1000;

var moedaPg = null;          // estado da página aberta (null fora dela)
var moedaPgToken = 0;        // descarta respostas de páginas/períodos que já saíram
var lwPromessa = null;
var graficoCache = {};

// fator pra mostrar em reais, dólar ou bitcoin (o gráfico guarda tudo em reais)
function fatorExibicao() {
    var taxas = estado.ler('taxas') || {};
    var m = estado.ler('moeda');
    if (m === 'USD' && taxas.USD) return 1 / taxas.USD;
    if (m === 'BTC' && taxas.BTC) return 1 / taxas.BTC;
    return 1;
}

// valor já convertido -> texto com o símbolo da moeda de exibição
function formatarExibido(v) {
    var m = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    var sinal = v < 0 ? '-' : '';
    v = Math.abs(v);
    if (m === 'BTC' && taxas.BTC) return sinal + '₿ ' + formatarBR(v, v >= 1 ? 4 : 8);
    if (m === 'USD' && taxas.USD) return sinal + 'US$ ' + formatarPreco(v);
    return sinal + 'R$ ' + formatarPreco(v);
}

// [ETAPA 5.1] escala dos gráficos: no celular, valor grande ocupa menos lugar
// (sem centavos acima de 1.000 e "447,5 mil" acima de 100 mil). O valor exato
// segue na leitura do cursor. No computador, o formato completo de sempre.
function formatarEixo(v) {
    var m = estado.ler('moeda');
    var taxas = estado.ler('taxas') || {};
    if (!ehTelaPequena() || (m === 'BTC' && taxas.BTC)) return formatarExibido(v);
    var simbolo = m === 'USD' && taxas.USD ? 'US$ ' : 'R$ ';
    var abs = Math.abs(v);
    var sinal = v < 0 ? '-' : '';
    if (abs >= 1e5) return sinal + simbolo + formatarBR(abs / 1e3, 1) + ' mil';
    if (abs >= 1e3) return sinal + simbolo + formatarBR(abs, 0);
    return formatarExibido(v);
}

function carregarLightweight() {
    if (window.LightweightCharts) return Promise.resolve();
    if (lwPromessa) return lwPromessa;
    lwPromessa = new Promise(function (ok, falha) {
        var el = document.createElement('script');
        el.src = LW_URL;
        el.integrity = LW_SRI;
        el.crossOrigin = 'anonymous';
        el.onload = ok;
        el.onerror = function () { lwPromessa = null; falha(new Error('biblioteca do gráfico')); };
        document.head.appendChild(el);
    });
    return lwPromessa;
}

function buscarKlines(simbolo, p) {
    var url = BINANCE + '/api/v3/klines?symbol=' + simbolo + '&interval=' + p.intervalo + '&limit=' + p.limite;
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('klines ' + r.status); return r.json(); });
}

// velas em reais: preço em USDT x USDTBRL do mesmo instante
function buscarSerie(par, periodo) {
    var chave = par + '|' + periodo;
    var c = graficoCache[chave];
    if (c && Date.now() - c.em < GRAFICO_CACHE_MS) return Promise.resolve(c.dados);

    var p = PERIODOS[periodo];
    var pedidos = [buscarKlines(par, p)];
    if (par !== 'USDTBRL') pedidos.push(buscarKlines('USDTBRL', p));
    return Promise.all(pedidos).then(function (res) {
        var taxaEm = {};
        if (res[1]) res[1].forEach(function (k) { taxaEm[k[0]] = Number(k[4]); });
        var ultima = res[1] && res[1].length ? Number(res[1][0][4]) : 1;
        var desvio = new Date().getTimezoneOffset() * 60;     // eixo em horário local
        var dados = res[0].map(function (k) {
            var tx = 1;
            if (res[1]) {
                if (taxaEm[k[0]]) ultima = taxaEm[k[0]];
                tx = ultima;
            }
            return {
                time: Math.floor(k[0] / 1000) - desvio,
                open: Number(k[1]) * tx,
                high: Number(k[2]) * tx,
                low: Number(k[3]) * tx,
                close: Number(k[4]) * tx,
            };
        });
        graficoCache[chave] = { em: Date.now(), dados: dados };
        return dados;
    });
}

// ---------- gráfico ----------
function corCss(nome) {
    return getComputedStyle(document.documentElement).getPropertyValue(nome).trim();
}

function criarGrafico() {
    var el = document.getElementById('grafico');
    var LW = window.LightweightCharts;
    var chart = LW.createChart(el, {

        grid: { vertLines: { color: corCss('--borda') }, horzLines: { color: corCss('--borda') } },
        rightPriceScale: { borderColor: corCss('--borda'), scaleMargins: { top: 0.12, bottom: 0.08 } },
        timeScale: { borderColor: corCss('--borda'), timeVisible: true, secondsVisible: false },
        crosshair: {
            mode: LW.CrosshairMode.Normal,
            vertLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
            horzLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
        },
        localization: { priceFormatter: formatarEixo },
    });
    moedaPg.chart = chart;
    chart.subscribeCrosshairMove(function (param) {
        var leg = document.getElementById('grafico-legenda');
        if (!leg || !moedaPg || !moedaPg.serie) return;
        var d = param && param.seriesData && param.seriesData.get(moedaPg.serie);
        if (!param || !param.time || !d) { leg.innerHTML = ''; return; }
        var quando = new Date(param.time * 1000).toLocaleString('pt-BR', {
            timeZone: 'UTC', day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit',
        });
        if (d.value != null) {
            leg.innerHTML = quando + ' · <strong>' + formatarExibido(d.value) + '</strong>';
        } else {
            leg.innerHTML = quando + ' · A <strong>' + formatarExibido(d.open) + '</strong> · M <strong>' + formatarExibido(d.high) +
                '</strong> · m <strong>' + formatarExibido(d.low) + '</strong> · F <strong>' + formatarExibido(d.close) + '</strong>';

}

function paraSerie(v) {
    var f = fatorExibicao();
    if (moedaPg.tipo === 'linha') return { time: v.time, value: v.close * f };
    return { time: v.time, open: v.open * f, high: v.high * f, low: v.low * f, close: v.close * f };
}

// (re)desenha a série com os dados atuais: troca de tipo, período ou moeda
function desenharSerie(ajustar) {
    var pg = moedaPg;
    if (!pg || !pg.chart || !pg.dados) return;
    var LW = window.LightweightCharts;
    if (pg.serie) { pg.chart.removeSeries(pg.serie); pg.serie = null; }
    var formato = { type: 'custom', formatter: formatarEixo, minMove: 1e-10 };
    var alta = corCss('--alta'), queda = corCss('--queda');
    if (pg.tipo === 'linha') {
        var subiu = pg.dados.length < 2 || pg.dados[pg.dados.length - 1].close >= pg.dados[0].close;
        pg.serie = pg.chart.addLineSeries({ color: subiu ? alta : queda, lineWidth: 2, priceFormat: formato, lastValueVisible: true, priceLineVisible: true });
    } else {
        pg.serie = pg.chart.addCandlestickSeries({
            upColor: alta, downColor: queda, borderUpColor: alta, borderDownColor: queda, wickUpColor: alta, wickDownColor: queda,
            priceFormat: formato,

    var seg = PERIODOS[pg.periodo].seg;

    var abertura = Math.floor(Date.now() / 1000 / seg) * seg - desvio;
    var u = pg.dados[pg.dados.length - 1];
    if (abertura > u.time) {
        u = { time: abertura, open: u.close, high: Math.max(u.close, preco), low: Math.min(u.close, preco), close: preco };
        pg.dados.push(u);
    } else {
        u.close = preco;

// aceita 1.234,56 e 1234.56; devolve NaN se não for número
function lerNumero(texto) {
    var t = String(texto || '').trim().replace(/\s/g, '');
    if (!t) return NaN;
    if (t.indexOf(',') !== -1) t = t.replace(/\./g, '').replace(',', '.');
    else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
    return /^\d*\.?\d+$|^\d+\.$/.test(t) ? Number(t) : NaN;
}

function textoNumero(n, casas) {
    return formatarBR(n, casas).replace(/(,\d*?)0+$/, '$1').replace(/,$/, '');
}

    var precoExibido = pg.m.preco * fatorExibicao();
    origem = origem || pg.convOrigem || 'qtd';
    if (origem === 'qtd') {
        var qtd = lerNumero(q.value);
        v.value = isNaN(qtd) ? '' : textoNumero(qtd * precoExibido, estado.ler('moeda') === 'BTC' && fatorExibicao() !== 1 ? 8 : 2);
    } else {
        var val = lerNumero(v.value);
        q.value = isNaN(val) || !precoExibido ? '' : textoNumero(val / precoExibido, 8);
    }
}

/* =================================================================
   MOTOR E LANÇAMENTOS  [ETAPA 3 · 29/09/2026]
   Portado do Dash Finance ([CRIPTO v2], [CRIPTO v2.1], [MOTOR v2]),
   só a parte de cripto. Diferenças em relação ao original:
     - sem usuário e sem login: um banco só, neste aparelho
     - a moeda é identificada pelo ID DA COINGECKO (não pelo símbolo)
     - lucro realizado (novo): valor recebido na venda menos o custo baixado
   Tudo em REAIS. Valores unitários e taxas são guardados em reais.
   ================================================================= */

// [MOTOR:início] funções puras: recebem a lista de lançamentos e devolvem
// resultado, sem ler nem gravar nada (assim dá pra testar sozinhas).

var QTD_EPSILON = 1e-9;   // tolerância de ponto flutuante em quantidades

var TIPOS = { COMPRA: 'Compra', VENDA: 'Venda', ENTRADA: 'Entrada', SAIDA: 'Saída', CONVERSAO: 'Conversão', RENDIMENTO: 'Rendimento' };  // [ETAPA 7]
var TIPOS_ORDEM = ['COMPRA', 'VENDA', 'ENTRADA', 'SAIDA', 'CONVERSAO', 'RENDIMENTO'];  // [ETAPA 7]
var TIPOS_COM_PRECO = { COMPRA: true, VENDA: true };
var TIPOS_DE_BAIXA = { VENDA: true, SAIDA: true, CONVERSAO: true };

// PERNAS: cada lançamento vira uma ou duas variações de quantidade por moeda.
//   COMPRA / ENTRADA -> +quantidade
//   VENDA  / SAIDA   -> -quantidade
//   CONVERSAO        -> -quantidade na origem e +quantidadeDestino no destino
function pernasDaTransacao(t) {
    switch (t.tipo) {
        case 'COMPRA':
        case 'ENTRADA':
        case 'RENDIMENTO':   // [ETAPA 7] custo zero, como ENTRADA
            return [{ moedaId: t.moedaId, delta: t.quantidade }];
        case 'VENDA':
        case 'SAIDA':
            return [{ moedaId: t.moedaId, delta: -t.quantidade }];
        case 'CONVERSAO':
            return [
                { moedaId: t.moedaId, delta: -t.quantidade },
                { moedaId: t.moedaDestinoId, delta: t.quantidadeDestino },
            ];
    }
    return [];
}

// ORDEM CANÔNICA: data -> prioridade no dia -> criadoEm -> id.
// No mesmo dia o que ENTRA (compra, entrada) vem antes da conversão, que vem
// antes do que SAI (venda, saída). Assim a ordem de digitação dos lançamentos
// do mesmo dia não muda o resultado. Cálculo e validação usam sempre esta.
var PRIORIDADE_NO_DIA = { COMPRA: 0, ENTRADA: 0, RENDIMENTO: 0, CONVERSAO: 1, VENDA: 2, SAIDA: 2 };  // [ETAPA 7]

function ordenarTransacoes(lista) {
    return lista.slice().sort(function (a, b) {
        if (a.data < b.data) return -1;
        if (a.data > b.data) return 1;
        var pa = PRIORIDADE_NO_DIA[a.tipo] || 0;
        var pb = PRIORIDADE_NO_DIA[b.tipo] || 0;
        if (pa !== pb) return pa - pb;
        if (a.criadoEm !== b.criadoEm) return a.criadoEm - b.criadoEm;
        return a.id - b.id;
    });
}

// O CORAÇÃO DO CÁLCULO DE CUSTO. Recebe os lançamentos JÁ ORDENADOS e devolve:
//   posicoes[moedaId] = { quantidade, custoTotal, qtdComCusto }
//   deltaCusto[idLancamento]  = quanto o lançamento mexeu no custo total
//   realizado[idLancamento]   = lucro realizado (só vendas)
// Regras:
//   COMPRA    soma quantidade e custo (qtd x preço + taxas)
//   ENTRADA   soma SÓ quantidade: custo zero, sempre (mineração, recompensa,
//             airdrop, presente). Não mexe no preço médio de compra
//   VENDA     tira quantidade e o custo proporcional pelo preço médio
//   SAIDA     igual à venda, mas sem devolver reais (taxa de rede, envio, perda)
//   CONVERSAO tira da origem pelo preço médio e ESSE MESMO custo entra no
//             destino. Nenhuma cotação participa; o custo total não muda
// PREÇO MÉDIO DE COMPRA = custoTotal / qtdComCusto. Cada posição sabe quanto
// da sua quantidade TEM custo (qtdComCusto): a entrada gratuita aumenta a
// quantidade mas não derruba o preço médio. Na baixa, a parte com custo e a
// gratuita saem na mesma proporção.
// LUCRO REALIZADO da venda = (qtd x preço - taxas) - custo baixado.
function processarCarteira(ordenadas) {
    var posicoes = {};
    var deltaCusto = {};
    var realizado = {};

    function pos(id) {
        if (!posicoes[id]) posicoes[id] = { quantidade: 0, custoTotal: 0, qtdComCusto: 0 };
        return posicoes[id];
    }

    // tira `q` da posição, custo e parte com custo na mesma fração
    function baixar(p, q) {
        var fracao = p.quantidade > 0 ? Math.min(q / p.quantidade, 1) : 0;
        var custo = p.custoTotal * fracao;
        var comCusto = p.qtdComCusto * fracao;
        p.quantidade -= q;
        p.custoTotal -= custo;
        p.qtdComCusto -= comCusto;
        // resíduo de ponto flutuante: abaixo da tolerância, zera de vez
        if (Math.abs(p.quantidade) < QTD_EPSILON) {
            custo += p.custoTotal;
            comCusto += p.qtdComCusto;
            p.quantidade = 0;
            p.custoTotal = 0;
            p.qtdComCusto = 0;
        }
        return { custo: custo, qtdComCusto: comCusto };
    }

    ordenadas.forEach(function (t) {
        var delta = 0;
        if (t.tipo === 'COMPRA') {
            var p = pos(t.moedaId);
            delta = t.quantidade * t.precoUnitario + (t.taxas || 0);
            p.quantidade += t.quantidade;
            p.custoTotal += delta;
            p.qtdComCusto += t.quantidade;
        } else if (t.tipo === 'ENTRADA' || t.tipo === 'RENDIMENTO') {   // [ETAPA 7]
            pos(t.moedaId).quantidade += t.quantidade;
        } else if (t.tipo === 'VENDA' || t.tipo === 'SAIDA') {
            var saiu = baixar(pos(t.moedaId), t.quantidade);
            delta = -saiu.custo;
            if (t.tipo === 'VENDA') {
                realizado[t.id] = (t.quantidade * t.precoUnitario - (t.taxas || 0)) - saiu.custo;
            }
        } else if (t.tipo === 'CONVERSAO') {
            var origem = baixar(pos(t.moedaId), t.quantidade);
            var destino = pos(t.moedaDestinoId);
            destino.quantidade += t.quantidadeDestino;
            destino.custoTotal += origem.custo;
            var fracaoComCusto = t.quantidade > 0 ? origem.qtdComCusto / t.quantidade : 0;
            destino.qtdComCusto += t.quantidadeDestino * fracaoComCusto;
        }
        deltaCusto[t.id] = delta;
    });

    return { posicoes: posicoes, deltaCusto: deltaCusto, realizado: realizado };
}

// Primeira perna NEGATIVA da moeda que ficaria sem saldo, ou null.
// `quantidade` é o que a perna tentou tirar; `disponivel`, o que havia.
function primeiroFuroDeSaldo(ordenadas, moedaId) {
    var saldo = 0;
    for (var i = 0; i < ordenadas.length; i++) {
        var pernas = pernasDaTransacao(ordenadas[i]);
        for (var j = 0; j < pernas.length; j++) {
            var perna = pernas[j];
            if (perna.moedaId !== moedaId) continue;
            if (perna.delta < 0 && -perna.delta > saldo + QTD_EPSILON) {
                return { transacao: ordenadas[i], disponivel: Math.max(saldo, 0), quantidade: -perna.delta };
            }
            saldo += perna.delta;
        }
    }
    return null;
}

// VALIDAÇÃO NA LINHA DO TEMPO: simula a carteira COM a alteração e checa se
// alguma baixa, em qualquer data, ficaria sem saldo.
//   alteracao = { editId, novo }  pra salvar (novo = lançamento simulado)
//               { excluirId }     pra excluir
// Moeda ainda não cadastrada usa id fictício ('NOVO' / 'NOVO_DESTINO').
// Checa todas as moedas tocadas pelo lançamento original e pelo novo.
function verificarCronologia(transacoes, alteracao) {
    var idRemovido = alteracao.editId || alteracao.excluirId || null;
    var lista = transacoes.filter(function (t) { return t.id !== idRemovido; });

    var afetadas = [];
    function marcar(t) {
        pernasDaTransacao(t).forEach(function (p) {
            if (afetadas.indexOf(p.moedaId) === -1) afetadas.push(p.moedaId);
        });
    }
    if (idRemovido) {
        var original = transacoes.filter(function (t) { return t.id === idRemovido; })[0];
        if (original) marcar(original);
    }
    if (alteracao.novo) {
        lista.push(alteracao.novo);
        marcar(alteracao.novo);
    }

    var ordenadas = ordenarTransacoes(lista);
    for (var i = 0; i < afetadas.length; i++) {
        var furo = primeiroFuroDeSaldo(ordenadas, afetadas[i]);
        if (furo) {
            furo.moedaId = afetadas[i];
            furo.ehANova = furo.transacao === alteracao.novo;
            return furo;
        }
    }
    return null;
}

// ─── OTP: caixas de dígito ────────────────────────────────────────
function ligarOTP(grupoId, hiddenId) {
    var grupo = document.getElementById(grupoId);
    var hidden = document.getElementById(hiddenId);
    if (!grupo || !hidden) return;
    var inputs = grupo.querySelectorAll('.otp-digito');
    function sync() {
        var val = '';
        inputs.forEach(function (d) {
            val += d.value;
            d.classList.toggle('preenchido', d.value.length === 1);
        });
        hidden.value = val;
    }
    inputs.forEach(function (inp, i) {
        inp.addEventListener('input', function () {
            // garante só dígito
            inp.value = inp.value.replace(/\D/g, '').slice(-1);
            sync();
            if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
        });
        inp.addEventListener('keydown', function (e) {
            if (e.key === 'Backspace' && !inp.value && i > 0) {
                inputs[i - 1].value = '';
                inputs[i - 1].classList.remove('preenchido');
                inputs[i - 1].focus();
                sync();
            }
        });
        inp.addEventListener('paste', function (e) {
            e.preventDefault();
            var text = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
            inputs.forEach(function (d, j) { d.value = text[j] || ''; });
            sync();
            var last = Math.min(text.length, inputs.length) - 1;
            if (last >= 0) inputs[last].focus();
        });
        // foco no 1º ao clicar em qualquer caixa do grupo
        inp.addEventListener('focus', function () {
            var primeiroVazio = -1;
            inputs.forEach(function (d, j) { if (!d.value && primeiroVazio < 0) primeiroVazio = j; });
            if (primeiroVazio > i) inputs[primeiroVazio].focus();
        });
    });
}

function limparOTP(grupoId, hiddenId) {
    var grupo = document.getElementById(grupoId);
    if (grupo) grupo.querySelectorAll('.otp-digito').forEach(function (d) { d.value = ''; d.classList.remove('preenchido'); });
    var hidden = document.getElementById(hiddenId);
    if (hidden) hidden.value = '';
    if (grupo) { var primeiro = grupo.querySelector('.otp-digito'); if (primeiro) primeiro.focus(); }
}

// [ETAPA 9] traduz as mensagens de erro da Supabase (vêm em inglês) pro
// vocabulário que a pessoa já conhece aqui (PIN, não "password")
function traduzirErroSupabase(msg) {
    msg = String(msg || '');
    if (/Invalid login credentials/i.test(msg)) return 'E-mail ou PIN incorretos.';
    if (/Email not confirmed/i.test(msg)) return 'Esse e-mail ainda não foi confirmado.';
    if (/already registered|already exists/i.test(msg)) return 'Já existe uma conta com esse e-mail.';
    if (/Password should be at least|Password.*characters/i.test(msg)) return 'O PIN precisa ter pelo menos ' + PIN_DIGITOS + ' dígitos.';
    if (/rate limit/i.test(msg)) return 'Muitas tentativas seguidas. Espere um instante e tente de novo.';
    return 'Não consegui completar agora. Confira a conexão e tente de novo.';
}

function criarPerfil() {
    var nome  = ((document.getElementById('novo-nome') || {}).value || '').trim();
    var email = ((document.getElementById('novo-email') || {}).value || '').toLowerCase().trim();
    var pin   = (document.getElementById('novo-pin') || {}).value || '';
    var conf  = (document.getElementById('novo-pin-conf') || {}).value || '';
    _mostrarErro('erro-nome', '');
    _mostrarErro('erro-email', '');
    _mostrarErro('erro-pin', '');
    _mostrarErro('erro-pin-conf', '');
    _mostrarErro('erro-criar', '');
    var ok = true;
    if (!nome || nome.length < 2) { _mostrarErro('erro-nome', 'Digite seu nome.'); ok = false; }
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { _mostrarErro('erro-email', 'Digite um e-mail válido.'); ok = false; }
    if (ok && pin.length < PIN_DIGITOS) { _mostrarErro('erro-pin', 'Preencha todos os ' + PIN_DIGITOS + ' dígitos.'); ok = false; }
    if (ok && !/^\d+$/.test(pin)) { _mostrarErro('erro-pin', 'Use apenas dígitos numéricos.'); ok = false; }
    if (ok && conf.length < PIN_DIGITOS) { _mostrarErro('erro-pin-conf', 'Confirme todos os ' + PIN_DIGITOS + ' dígitos.'); ok = false; }
    if (ok && pin !== conf) { _mostrarErro('erro-pin-conf', 'Os PINs não coincidem.'); ok = false; }
    if (!ok) return;
    _setarOcupado('btn-criar-perfil', true, 'Criar conta');
    supabaseClient.auth.signUp({
        email: email,
        password: pin,
        options: { data: { full_name: nome } }   // é essa chave que também aparece como "Display name" no painel
    }).then(function (r) {
        if (r.error) {
            _mostrarErro('erro-criar', traduzirErroSupabase(r.error.message));
            _setarOcupado('btn-criar-perfil', false, 'Criar conta');
            return;

        if (!r.data.session) {
            // confirmação de e-mail ligada no projeto: a conta existe, mas
            // ainda não dá pra entrar sem clicar no link que chegou por e-mail
            _mostrarErro('erro-criar', 'Conta criada. Confira seu e-mail pra confirmar antes de entrar.');
            _setarOcupado('btn-criar-perfil', false, 'Criar conta');
            return;
        }
        iniciarApp();
    });
}
