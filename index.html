// Lançamento: { id, criadoEm, tipo, moedaId, quantidade, precoUnitario,
//   taxas, data, moedaDestinoId?, quantidadeDestino? }  (valores em reais)
function chaveDosBanco() {
    var id = sessaoAtual();
    return id ? 'BANCO_' + id : 'BANCO';
}

// [ETAPA 9.2] cache em memória — carregado do Supabase em carregarBanco()
var _banco = null;

// [ETAPA 9.2] lê do cache; fallback para localStorage durante migração ou offline
function lerBanco() {
    if (_banco) return _banco;
    var b = armazem.json(chaveDosBanco(), null);
    if (!b || !Array.isArray(b.transacoes)) b = { moedas: {}, transacoes: [], proximoId: 1 };
    b.moedas = b.moedas || {};
    b.proximoId = b.proximoId || 1;
    return b;
}

// [ETAPA 9.3 · 03/10/2026] atualiza o cache em memória E persiste uma
// cópia no localStorage. Ao abrir o app da próxima vez, lerBanco() já
// encontra os dados aqui, sem esperar a rede — o portfólio aparece na
// hora. O Supabase continua sendo a fonte de verdade: carregarBanco()
// confirma em segundo plano e atualiza se houver diferença.
function gravarBanco(b) {
    _banco = b;
    try { armazem.set(chaveDosBanco(), JSON.stringify({ moedas: b.moedas, transacoes: b.transacoes })); } catch (e) {}
}

// [ETAPA 9.2] converte linha do Supabase → formato interno do app
function rowParaTransacao(row) {
    var t = {
        id: row.id,
        criadoEm: row.criado_em ? new Date(row.criado_em).getTime() : 0,
        tipo: row.tipo,
        moedaId: row.moeda_id,
        quantidade: Number(row.quantidade),
        precoUnitario: Number(row.preco_unitario),
        taxas: Number(row.taxas),
        data: row.data,
    };
    if (row.descricao) t.descricao = row.descricao;
    if (row.moeda_destino_id) t.moedaDestinoId = row.moeda_destino_id;
    if (row.quantidade_destino != null) t.quantidadeDestino = Number(row.quantidade_destino);
    return t;
}

// [ETAPA 9.2] monta payload para INSERT/UPDATE no Supabase (sem id/user_id/criado_em)
function transacaoParaRow(reg) {
    var row = {
        tipo: reg.tipo,
        moeda_id: reg.moedaId,
        quantidade: reg.quantidade,
        preco_unitario: reg.precoUnitario,
        taxas: reg.taxas,
        data: reg.data,
    };
    if (reg.descricao) row.descricao = reg.descricao;
    if (reg.moedaDestinoId) row.moeda_destino_id = reg.moedaDestinoId;
    if (reg.quantidadeDestino != null) row.quantidade_destino = reg.quantidadeDestino;
    return row;
}

// [ETAPA 9.2] busca transações e moedas do Supabase e popula _banco
// [ETAPA 9.3 · 03/10/2026] MODO OFFLINE + ABERTURA INSTANTÂNEA
// Fluxo em duas etapas:
//   1) lê o cache do localStorage (síncrono, sem rede) e popula _banco
//      imediatamente — o portfólio já consegue renderizar na hora.
//   2) em paralelo confirma com o Supabase. Se os dados forem diferentes
//      (lançamento novo em outro aparelho, ou primeiro acesso sem cache),
//      atualiza _banco, persiste localmente e pede um redesenho.
//      Se não houver conexão, o app já está funcional com o passo 1.
function carregarBanco() {
    // passo 1: cache local — instantâneo
    var local = armazem.json(chaveDosBanco(), null);
    if (local && Array.isArray(local.transacoes)) {
        _banco = {
            moedas: local.moedas || {},
            transacoes: local.transacoes,
            proximoId: 1
        };
    }

    // passo 2: confirmação com o Supabase em segundo plano
    return supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) return;
        return Promise.all([
            supabaseClient.from('transacoes').select('*').eq('user_id', user.id).order('id'),
            supabaseClient.from('moedas_conhecidas').select('*').eq('user_id', user.id)
        ]).then(function (res) {
            var tRes = res[0], mRes = res[1];
            if (tRes.error) throw new Error('Erro ao carregar lançamentos: ' + tRes.error.message);
            if (mRes.error) throw new Error('Erro ao carregar moedas: ' + mRes.error.message);
            var moedas = {};
            (mRes.data || []).forEach(function (r) {
                moedas[r.id] = { id: r.id, simbolo: r.simbolo, nome: r.nome, logo: r.logo || null };
            });
            var nuvem = { moedas: moedas, transacoes: (tRes.data || []).map(rowParaTransacao), proximoId: 1 };

            // compara pelo número e pelos ids das transações — suficiente
            // pra detectar qualquer mudança sem serializar os objetos inteiros
            var idsLocal = (_banco ? _banco.transacoes : []).map(function (t) { return t.id; }).join(',');
            var idsNuvem = nuvem.transacoes.map(function (t) { return t.id; }).join(',');
            var mudou = idsLocal !== idsNuvem;

            // sempre persiste a versão da nuvem (é a fonte de verdade)
            _banco = nuvem;
            try { armazem.set(chaveDosBanco(), JSON.stringify({ moedas: nuvem.moedas, transacoes: nuvem.transacoes })); } catch (e) {}

            // redesenha só se a nuvem trouxe algo diferente do que já estava na tela
            if (mudou) desenhar();
        });
    }).catch(function (e) {
        // sem conexão: o passo 1 já garantiu que _banco tem dados. Só loga.
        console.warn('carregarBanco offline:', e && e.message);
    });
}

// [ETAPA 9.2] verifica dados locais que ainda não foram migrados para o Supabase
function verificarMigracao() {
    if (!_banco || _banco.transacoes.length > 0) return;
    var local = armazem.json(chaveDosBanco(), null);
    if (!local || !Array.isArray(local.transacoes) || !local.transacoes.length) return;
    var n = local.transacoes.length;
    var msg = 'Encontramos ' + n + ' lançamento(s) salvos neste aparelho que ainda não estão na nuvem.\nDeseja migrá-los agora?';
    if (!window.confirm(msg)) return;
    migrarDadosLocais(local);
}

// [ETAPA 9.2] migra lançamentos do localStorage para o Supabase
function migrarDadosLocais(local) {
    supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) return;
        avisar('Migrando seus lançamentos para a nuvem…');
        var moedasArr = Object.values(local.moedas || {}).map(function (m) {
            return { id: m.id, user_id: user.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo || null };
        });
        var transacoesArr = (local.transacoes || []).map(function (t) {
            var row = transacaoParaRow(t);
            row.user_id = user.id;
            if (t.criadoEm) row.criado_em = new Date(t.criadoEm).toISOString();
            return row;
        });
        var pMoedas = moedasArr.length
            ? supabaseClient.from('moedas_conhecidas').upsert(moedasArr, { onConflict: 'id,user_id' })
            : Promise.resolve({ error: null });
        pMoedas.then(function (r) {
            if (r.error) { avisar('Erro ao migrar moedas: ' + r.error.message, 'erro'); return; }
            if (!transacoesArr.length) { avisar('Migração concluída.', 'sucesso'); return; }
            supabaseClient.from('transacoes').insert(transacoesArr).then(function (r2) {
                if (r2.error) { avisar('Erro ao migrar lançamentos: ' + r2.error.message, 'erro'); return; }
                carregarBanco().then(function () {
                    avisar('Migração concluída. Seus lançamentos estão na nuvem.', 'sucesso');
                    desenhar();
                });
            });
        });
    });
}

function hojeISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function formatarDataBR(iso) {
    var p = String(iso || '').split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : String(iso || '');
}

// número -> texto de campo em pt-BR, sem milhar e sem zeros sobrando
function numeroParaCampo(n, casas) {
    return Number(n).toFixed(casas || 8).replace(/0+$/, '').replace(/\.$/, '').replace('.', ',');
}

function textoQuantidade(n) {
    return textoNumero(Number(n) || 0, 8);
}

// ---------- moedas fora do pacote diário  [ETAPA 8 · 02/10/2026] ----------
// O pacote da CoinGecko só traz as 100 maiores. Pra qualquer outra (Pendle,
// um token novo, etc.), o app busca por fora e confere preço na Binance.
// Usado em três lugares: campo de moeda da gaveta, lupa do Mercado, e na
// resolução de preço de moedas já lançadas que não estão no top 100
// (portfólio e página da própria moeda).
//
// NADA disso grava no banco só por ter sido buscado ou visto — só grava
// quando a pessoa completa um lançamento de verdade (ver salvarLancamento,
// que já faz isso pra qualquer moeda, de onde quer que ela tenha vindo).
//
// moedasExtras: cache da ABA (não persiste), id -> {id, simbolo, nome, logo}.
// Alimentado pela busca e também por banco.moedas, então uma moeda que já
// foi lançada antes é achada na hora, sem precisar buscar de novo.
var moedasExtras = {};
var buscaMoedaCache = {};   // query em minúsculo -> lista já respondida

// CoinGecko /search: metadados (id, nome, símbolo, logo). Endpoint público,
// leve, sem chave — bem diferente do /coins/markets, que é limitado a 1
// chamada por dia (ver Worker koin-api). Prioriza quem tem market_cap_rank
// (moeda "de verdade" antes de derivada/variante com nome parecido).
function buscarMoedaExterna(query) {
    var termo = String(query || '').trim();
    if (termo.length < 2) return Promise.resolve([]);
    var chave = termo.toLowerCase();
    if (buscaMoedaCache[chave]) return Promise.resolve(buscaMoedaCache[chave]);

    return fetch(COINGECKO + '/busca?q=' + encodeURIComponent(termo))
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (d) {
            var lista = (d.coins || [])
                .filter(function (c) { return !mercado.porId[c.id]; })  // já tá no top 100? sobra pra lista de sempre
                .sort(function (a, b) {
                    var ra = a.market_cap_rank, rb = b.market_cap_rank;
                    if (ra == null && rb == null) return 0;
                    if (ra == null) return 1;
                    if (rb == null) return -1;
                    return ra - rb;
                })
                .slice(0, 8)
                .map(function (c) {
                    var m = { id: c.id, simbolo: String(c.symbol || '').toUpperCase(), nome: c.name, logo: c.large || c.thumb || null };
                    moedasExtras[m.id] = m;
                    return m;
                });
            buscaMoedaCache[chave] = lista;
            return lista;
        })
        .catch(function () { return []; });
}

// metadados conhecidos de uma moeda extra, SEM rede: banco (já foi lançada
// antes) ou cache de busca desta aba. É o que torna o preço ao vivo
// persistente entre sessões — o portfólio chama isso pra toda posição que
// não está no pacote diário, sem precisar passar pela busca de novo.
function infoMoedaExtra(id) {
    return lerBanco().moedas[id] || moedasExtras[id] || null;
}

// monta um registro no mesmo formato de mercado.porId, a partir de
// metadados já em mãos + o mapa de preços da Binance (também já em mãos,
// evita repetir a chamada quando é chamada várias vezes em sequência).
// Pura, sem rede.
function construirMoedaExtra(info, precos) {
    var par = info.simbolo + 'USDT';
    var taxa = precos.USDTBRL;
    var temPar = taxa > 0 && precos[par] > 0;
    return {
        id: info.id, simbolo: info.simbolo, nome: info.nome, logo: info.logo || null,
        rank: null, preco: temPar ? precos[par] * taxa : null,
        var1h: null, var24h: null, var7d: null, volume: null, valorMercado: null, sparkline: null,
        max24h: null, min24h: null, ofertaCirculante: null, ofertaTotal: null, ofertaMaxima: null,
        ath: null, athData: null, atl: null, atlData: null,
        aoVivo: false, extra: true, parBinance: temPar ? par : null,
    };
}

// pra quando ainda não se tem o mapa de preços em mãos (abrir a página de
// uma moeda direto). Último recurso: se nem o banco nem a busca desta aba
// conhecem o id (link direto pra uma moeda nunca vista nesta sessão),
// pergunta pra CoinGecko por esse id específico antes de desistir.
function resolverMoedaExtraPagina(id) {
    var info = infoMoedaExtra(id);
    var pronto = info ? Promise.resolve(info) : fetch(COINGECKO + '/moeda/' + encodeURIComponent(id))
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (c) {
            var m = { id: c.id, simbolo: String(c.symbol || '').toUpperCase(), nome: c.name, logo: (c.image && (c.image.large || c.image.thumb)) || null };
            moedasExtras[m.id] = m;
            return m;
        })
        .catch(function () { return null; });

    return pronto.then(function (info2) {
        if (!info2) return null;
        return obterPrecosBinance().catch(function () { return {}; }).then(function (precos) {
            return construirMoedaExtra(info2, precos);
        });
    });
}

// ---------- catálogo de moedas ----------
// tudo que dá pra escolher: as 100 do pacote diário + o que já foi lançado
// + o que a busca já encontrou fora do pacote nesta aba  [ETAPA 8]
function catalogoMoedas() {
    var banco = lerBanco();
    var mapa = {};
    Object.keys(banco.moedas).forEach(function (id) { mapa[id] = banco.moedas[id]; });
    mercado.lista.forEach(function (m) {
        mapa[m.id] = { id: m.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo };
    });
    Object.keys(moedasExtras).forEach(function (id) { if (!mapa[id]) mapa[id] = moedasExtras[id]; });  // [ETAPA 8]
    return Object.keys(mapa).map(function (id) { return mapa[id]; })
        .sort(function (a, b) { return a.nome < b.nome ? -1 : 1; });
}

function infoMoeda(id) {
    var banco = lerBanco();
    if (banco.moedas[id]) return banco.moedas[id];
    var m = mercado.porId[id];
    if (m) return { id: m.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo };
    return { id: id, simbolo: String(id).toUpperCase(), nome: id, logo: null };
}

function rotuloMoeda(m) {
    return m.nome + ' (' + m.simbolo + ')';
}

// aceita o id, "Bitcoin (BTC)", só o símbolo ou só o nome
function resolverMoeda(valor) {
    var t = String(valor || '').trim().toLowerCase();
    if (!t) return null;
    var lista = catalogoMoedas();
    var achada = null;
    lista.forEach(function (m) {
        if (achada) return;
        if (m.id.toLowerCase() === t || rotuloMoeda(m).toLowerCase() === t) achada = m;
    });
    if (achada) return achada;
    var porSimbolo = lista.filter(function (m) { return m.simbolo.toLowerCase() === t; });
    if (porSimbolo.length === 1) return porSimbolo[0];
    var porNome = lista.filter(function (m) { return m.nome.toLowerCase() === t; });
    return porNome.length === 1 ? porNome[0] : null;
}

// saldo de hoje (soma das pernas), sem contar o lançamento em edição
function saldoDaMoeda(banco, moedaId, ignorarId) {
    var q = 0;
    banco.transacoes.forEach(function (t) {
        if (ignorarId && t.id === ignorarId) return;
        pernasDaTransacao(t).forEach(function (p) { if (p.moedaId === moedaId) q += p.delta; });
    });
    return q;
}

function moedasComSaldo(banco, ignorarId) {
    var ids = {};
    banco.transacoes.forEach(function (t) {
        pernasDaTransacao(t).forEach(function (p) { ids[p.moedaId] = true; });
    });
    return Object.keys(ids).filter(function (id) { return saldoDaMoeda(banco, id, ignorarId) > QTD_EPSILON; })
        .map(infoMoeda).sort(function (a, b) { return a.nome < b.nome ? -1 : 1; });
}

function carteiraAtual() {
    return processarCarteira(ordenarTransacoes(lerBanco().transacoes));
}

// ---------- validação e gravação ----------
var VERBO_DA_BAIXA = { VENDA: 'vender', SAIDA: 'retirar', CONVERSAO: 'converter' };
var NOME_DA_BAIXA = { VENDA: 'a venda', SAIDA: 'a saída', CONVERSAO: 'a conversão' };

function descreverFuro(furo) {
    var info = infoMoeda(furo.moedaId);
    return (NOME_DA_BAIXA[furo.transacao.tipo] || 'o lançamento') + ' de ' + textoQuantidade(furo.quantidade) + ' ' + info.simbolo +
        ' em ' + formatarDataBR(furo.transacao.data);
}

// d = campos como texto, do jeito que a pessoa digitou. Devolve { erros, dados }.
function validarLancamento(d, editId) {
    var banco = lerBanco();
    var erros = {};
    var dados = { tipo: d.tipo };
    var tipo = d.tipo;

    if (!TIPOS[tipo]) erros.tipo = 'Escolha a operação.';

    var moeda = resolverMoeda(d.moeda);
    if (!String(d.moeda || '').trim()) erros.moeda = 'Este campo é obrigatório.';
    else if (!moeda) erros.moeda = 'Não achei essa moeda. Escolha uma da lista.';
    dados.moeda = moeda;

    var qtd = lerNumero(d.quantidade);
    if (!String(d.quantidade || '').trim()) erros.quantidade = 'Este campo é obrigatório.';
    else if (isNaN(qtd)) erros.quantidade = 'Número inválido.';
    else if (qtd <= 0) erros.quantidade = 'A quantidade precisa ser maior que zero.';
    dados.quantidade = qtd;

    if (!d.data) erros.data = 'Este campo é obrigatório.';
    else if (!/^\d{4}-\d{2}-\d{2}$/.test(d.data)) erros.data = 'Data inválida.';
    else if (d.data > hojeISO()) erros.data = 'A data não pode ser futura.';
    dados.data = d.data;

    dados.precoUnitario = 0;
    dados.taxas = 0;
    if (TIPOS_COM_PRECO[tipo]) {
        var preco = lerNumero(d.preco);
        if (!String(d.preco || '').trim()) erros.preco = 'Este campo é obrigatório.';
        else if (isNaN(preco)) erros.preco = 'Número inválido.';
        else if (preco <= 0) erros.preco = 'O preço precisa ser maior que zero.';
        dados.precoUnitario = preco;

        if (String(d.taxas || '').trim()) {
            var taxas = lerNumero(d.taxas);
            if (isNaN(taxas)) erros.taxas = 'Número inválido.';
            else if (taxas < 0) erros.taxas = 'As taxas não podem ser negativas.';
            else dados.taxas = taxas;
        }
    }

    var destino = null;
    if (tipo === 'CONVERSAO') {
        destino = resolverMoeda(d.destino);
        if (!String(d.destino || '').trim()) erros.destino = 'Este campo é obrigatório.';
        else if (!destino) erros.destino = 'Não achei essa moeda. Escolha uma da lista.';
        else if (moeda && destino.id === moeda.id) erros.destino = 'O destino precisa ser diferente da origem.';
        dados.destino = destino;

        var qd = lerNumero(d.quantidadeDestino);
        if (!String(d.quantidadeDestino || '').trim()) erros.quantidadeDestino = 'Este campo é obrigatório.';
        else if (isNaN(qd)) erros.quantidadeDestino = 'Número inválido.';
        else if (qd <= 0) erros.quantidadeDestino = 'A quantidade precisa ser maior que zero.';
        dados.quantidadeDestino = qd;
    }

    var desc = String(d.descricao || '').trim();
    if (desc) dados.descricao = desc;  // [ETAPA 7] opcional

    // linha do tempo: só roda com os campos que ela usa já válidos
    var podeSimular = !erros.tipo && !erros.moeda && !erros.quantidade && !erros.data && !erros.destino && !erros.quantidadeDestino;
    if (podeSimular) {
        var original = editId ? banco.transacoes.filter(function (t) { return t.id === editId; })[0] : null;
        var simulada = {
            id: original ? original.id : Number.MAX_SAFE_INTEGER,
            criadoEm: original ? original.criadoEm : Number.MAX_SAFE_INTEGER,
            tipo: tipo, moedaId: moeda.id, quantidade: qtd, data: d.data,
        };
        if (tipo === 'CONVERSAO') {
            simulada.moedaDestinoId = destino.id;
            simulada.quantidadeDestino = dados.quantidadeDestino;
        }
        var furo = verificarCronologia(banco.transacoes, { editId: editId, novo: simulada });
        if (furo) {
            if (furo.ehANova) {
                erros.quantidade = 'Você não pode ' + (VERBO_DA_BAIXA[tipo] || 'tirar') + ' mais do que possui: ' +
                    textoQuantidade(furo.disponivel) + ' ' + moeda.simbolo + ' disponível em ' + formatarDataBR(d.data) + '.' +
                    (tipo === 'VENDA' ? ' O Koin não trabalha com venda a descoberto.' : '');
            } else {
                erros._geral = 'Essa alteração deixaria sem saldo ' + descreverFuro(furo) + ' (haveria só ' +
                    textoQuantidade(furo.disponivel) + ' disponível nessa data). Ajuste ou exclua esse lançamento antes.';
            }
        }
    }
    return { erros: erros, dados: dados };
}

// [ETAPA 9.2] async: escreve no Supabase e atualiza o cache
function salvarLancamento(dados, editId) {
    return supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) throw new Error('Sem sessão ativa.');
        var banco = lerBanco();

        var registro = {
            tipo: dados.tipo,
            moedaId: dados.moeda.id,
            quantidade: dados.quantidade,
            precoUnitario: TIPOS_COM_PRECO[dados.tipo] ? dados.precoUnitario : 0,
            taxas: TIPOS_COM_PRECO[dados.tipo] ? dados.taxas : 0,
            data: dados.data,
        };
        if (dados.descricao) registro.descricao = dados.descricao;
        if (dados.tipo === 'CONVERSAO') {
            registro.moedaDestinoId = dados.destino.id;
            registro.quantidadeDestino = dados.quantidadeDestino;
        }

        // upsert das moedas envolvidas em moedas_conhecidas
        var moedasUpsert = [dados.moeda];
        if (dados.tipo === 'CONVERSAO') moedasUpsert.push(dados.destino);
        var moedasRows = moedasUpsert.map(function (m) {
            banco.moedas[m.id] = banco.moedas[m.id] || { id: m.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo || null };
            return { id: m.id, user_id: user.id, simbolo: m.simbolo, nome: m.nome, logo: m.logo || null };
        });
        var pMoedas = supabaseClient.from('moedas_conhecidas').upsert(moedasRows, { onConflict: 'id,user_id' });

        var row = transacaoParaRow(registro);
        row.user_id = user.id;

        if (editId) {
            return pMoedas.then(function () {
                return supabaseClient.from('transacoes').update(row).eq('id', editId).eq('user_id', user.id);
            }).then(function (r) {
                if (r.error) throw new Error(r.error.message);
                var t = banco.transacoes.filter(function (x) { return x.id === editId; })[0];
                if (t) {
                    delete t.moedaDestinoId;
                    delete t.quantidadeDestino;
                    delete t.descricao;
                    Object.assign(t, registro);
                }
                gravarBanco(banco);
            });
        } else {
            return pMoedas.then(function () {
                return supabaseClient.from('transacoes').insert(row).select().single();
            }).then(function (r) {
                if (r.error) throw new Error(r.error.message);
                banco.transacoes.push(Object.assign({}, registro, {
                    id: r.data.id,
                    criadoEm: new Date(r.data.criado_em).getTime()
                }));
                gravarBanco(banco);
            });
        }
    });
}

// [ETAPA 9.2] async — devolve Promise<null> (ok) ou Promise<string> (motivo da recusa)
function excluirLancamento(id) {
    var banco = lerBanco();
    var furo = verificarCronologia(banco.transacoes, { excluirId: id });
    if (furo) {
        return Promise.resolve('Não dá pra excluir: ' + descreverFuro(furo) + ' ficaria sem saldo. Exclua ou ajuste esse lançamento primeiro.');
    }
    return supabaseClient.auth.getUser().then(function (sessao) {
        var user = sessao.data.user;
        if (!user) return 'Sem sessão ativa.';
        return supabaseClient.from('transacoes').delete().eq('id', id).eq('user_id', user.id).then(function (r) {
            if (r.error) return 'Erro ao excluir: ' + r.error.message;
            banco.transacoes = banco.transacoes.filter(function (t) { return t.id !== id; });
            gravarBanco(banco);
            return null;
        });
    });
}

// ---------- gaveta de lançamento ----------
// Sem <form>: o preview do claude.ai bloqueia o envio nativo. Botões com
// data-*, Enter tratado no keydown. Trocar a operação redesenha o corpo,
// levando o que já foi digitado; o que foi sugerido (data-auto) fica pra trás.
var lanc = null;   // { editId, valores, erros } com a gaveta aberta

function campoLancHTML(id, rotulo, controle, ajuda, erro) {
    return '<div class="campo"><label for="' + id + '">' + rotulo + '</label>' + controle +
        (ajuda !== null && ajuda !== undefined ? '<p class="campo-ajuda" id="' + id + '-ajuda">' + ajuda + '</p>' : '') +
        (erro ? '<p class="campo-erro">' + escapar(erro) + '</p>' : '') + '</div>';
}

function campoMoedaHTML(name, id, valor, comoLista, editId) {
    var atual = resolverMoeda(valor);
    if (comoLista) {
        var itens = moedasComSaldo(lerBanco(), editId);
        var tem = false;
        var opcoes = itens.map(function (m) {
            var sel = atual && atual.id === m.id;
            if (sel) tem = true;
            return '<option value="' + escapar(m.id) + '"' + (sel ? ' selected' : '') + '>' + escapar(rotuloMoeda(m)) +
                ' (saldo ' + textoQuantidade(saldoDaMoeda(lerBanco(), m.id, editId)) + ')</option>';
        }).join('');
        if (atual && !tem) opcoes = '<option value="' + escapar(atual.id) + '" selected>' + escapar(rotuloMoeda(atual)) + '</option>' + opcoes;
        if (!itens.length && !atual) {
            return '<select class="entrada" name="' + name + '" id="' + id + '" disabled><option value="">Nenhuma moeda com saldo</option></select>';
        }
        return '<select class="entrada" name="' + name + '" id="' + id + '"><option value=""' + (atual ? '' : ' selected') + '>Selecione a moeda</option>' + opcoes + '</select>';
    }
    var sugestoes = catalogoMoedas().map(function (m) { return '<option value="' + escapar(rotuloMoeda(m)) + '"></option>'; }).join('');
    return '<input class="entrada" type="text" name="' + name + '" id="' + id + '" list="' + id + '-lista" autocomplete="off" ' +
        'placeholder="Ex.: Bitcoin ou BTC" value="' + escapar(atual ? rotuloMoeda(atual) : (valor || '')) + '">' +
        '<datalist id="' + id + '-lista">' + sugestoes + '</datalist>';
}

function infoMoedaTexto(tipo, valor, editId) {
    var m = resolverMoeda(valor);
    if (!m) {
        if (TIPOS_DE_BAIXA[tipo]) return 'Só aparecem as moedas que você tem hoje.';
        return 'Escolha uma das 100 maiores, ou digite o nome pra buscar outras.';
    }
    var banco = lerBanco();
    var saldo = saldoDaMoeda(banco, m.id, editId);
    if (saldo <= QTD_EPSILON) return 'Sem saldo hoje.';
    var p = processarCarteira(ordenarTransacoes(banco.transacoes.filter(function (t) { return t.id !== editId; }))).posicoes[m.id];
    var txt = 'Você tem ' + textoQuantidade(saldo) + ' ' + m.simbolo + ' hoje';
    if (p && p.qtdComCusto > QTD_EPSILON) txt += ', preço médio de compra R$ ' + formatarPreco(p.custoTotal / p.qtdComCusto);
    else txt += ', custo zero';
    return txt + '.';
}

var NOTA_DA_OPERACAO = {
    ENTRADA: 'Entrada soma a quantidade com custo zero: o valor investido e o preço médio de compra não mudam, e o ganho aparece no lucro. Use para mineração, recompensa, airdrop ou presente.',
    SAIDA: 'Saída tira a quantidade junto com o custo proporcional (pelo preço médio), sem receber reais. Use para taxa de rede, envio a terceiros ou perda.',
    CONVERSAO: 'O custo que sai da moeda de origem passa inteiro para o destino. Nenhuma cotação em reais entra na conta, e o total investido não muda.',
    VENDA: 'O lucro realizado é o valor recebido (quantidade x preço, menos taxas) menos o custo da parte vendida, pelo preço médio.',
    RENDIMENTO: 'Rendimento soma a quantidade com custo zero, igual à entrada gratuita. Use para staking, DeFi, mining ou cashback de exchange.',  // [ETAPA 7]
};

function corpoLancamentoHTML(v, e, editId) {
    var tipo = TIPOS[v.tipo] ? v.tipo : 'COMPRA';
    var baixa = !!TIPOS_DE_BAIXA[tipo];
    var ehConv = tipo === 'CONVERSAO';

    var botoesTipo = TIPOS_ORDEM.map(function (k) {
        return '<button type="button" data-lanc-tipo="' + k + '" aria-pressed="' + (k === tipo) + '">' + TIPOS[k] + '</button>';
    }).join('');

    var ajudaOpsHTML = '<div class="ajuda-ops" id="ajuda-ops"><dl>' +
        '<dt>Compra</dt><dd>Você adquiriu a moeda pagando com fiat (real, dólar) ou stablecoin (USDT, USDC…). Define o custo de aquisição.</dd>' +
        '<dt>Venda</dt><dd>Você desfez a posição recebendo fiat ou stablecoin. O lucro realizado é calculado aqui.</dd>' +
        '<dt>Entrada</dt><dd>Você recebeu moeda de outra carteira — sua ou de terceiros — sem comprar. Transferência, pagamento recebido.</dd>' +
        '<dt>Saída</dt><dd>Você enviou moeda para outra carteira. Sem venda, sem lucro calculado.</dd>' +
        '<dt>Conversão</dt><dd>Você trocou uma cripto por outra diretamente (ex.: BTC por ETH). O custo da origem é transferido para o destino.</dd>' +
        '<dt>Rendimento</dt><dd>Você ganhou moeda sem comprar nem transferir: staking, DeFi, mining, cashback de exchange.</dd>' +
        '</dl></div>';

    var html = (e._geral ? '<div class="campo-erro-caixa">' + escapar(e._geral) + '</div>' : '') +
        '<div class="campo"><div style="display:flex;align-items:center;gap:6px;"><label style="margin:0;">Operação</label>' +
        '<button type="button" class="botao-ajuda-tipo" data-ajuda-tipo aria-label="O que cada operação faz" aria-expanded="false" aria-controls="ajuda-ops">?</button></div>' +
        ajudaOpsHTML +
        '<select class="entrada tipo-select-mobile" id="l-tipo-select">' +
        TIPOS_ORDEM.map(function (k) { return '<option value="' + k + '"' + (k === tipo ? ' selected' : '') + '>' + TIPOS[k] + '</option>'; }).join('') +
        '</select>' +
        '<div class="segmentado segmentado-quebra segmentado-tipo" role="group" aria-label="Operação" style="margin-top:8px;">' + botoesTipo + '</div>' +
        (e.tipo ? '<p class="campo-erro">' + escapar(e.tipo) + '</p>' : '') + '</div>';

    html += campoLancHTML('l-moeda', ehConv ? 'Moeda de origem' : 'Moeda',
        campoMoedaHTML('moeda', 'l-moeda', v.moeda, baixa, editId),
        escapar(infoMoedaTexto(tipo, v.moeda, editId)), e.moeda);

    html += campoLancHTML('l-quantidade', ehConv ? 'Quantidade que saiu' : 'Quantidade',
        '<input class="entrada" type="text" inputmode="decimal" name="quantidade" id="l-quantidade" autocomplete="off" placeholder="0" value="' + escapar(v.quantidade || '') + '"' + (v._autoQtd ? ' data-auto="1"' : '') + '>',
        null, e.quantidade);

    if (ehConv) {
        html += campoLancHTML('l-destino', 'Moeda de destino', campoMoedaHTML('destino', 'l-destino', v.destino, false, editId),
            'Pode ser uma moeda que você já tem ou uma nova.', e.destino) +
            campoLancHTML('l-quantidade-destino', 'Quantidade recebida',
                '<input class="entrada" type="text" inputmode="decimal" name="quantidadeDestino" id="l-quantidade-destino" autocomplete="off" placeholder="0" value="' + escapar(v.quantidadeDestino || '') + '">',
                'O que de fato chegou, já descontadas as taxas da conversão.', e.quantidadeDestino);
    }

    if (TIPOS_COM_PRECO[tipo]) {
        html += campoLancHTML('l-preco', 'Preço unitário (R$)',
            '<input class="entrada" type="text" inputmode="decimal" name="preco" id="l-preco" autocomplete="off" placeholder="0,00" value="' + escapar(v.preco || '') + '"' + (v._autoPreco ? ' data-auto="1"' : '') + '>',
            escapar(v._infoPreco || 'Em reais, por unidade da moeda.'), e.preco);
    }

    html += campoLancHTML('l-data', 'Data', '<input class="entrada" type="date" name="data" id="l-data" max="' + hojeISO() + '" value="' + escapar(v.data || hojeISO()) + '">', null, e.data);

    if (TIPOS_COM_PRECO[tipo]) {
        html += campoLancHTML('l-taxas', 'Taxas (R$)',
            '<input class="entrada" type="text" inputmode="decimal" name="taxas" id="l-taxas" autocomplete="off" placeholder="0,00" value="' + escapar(v.taxas || '') + '">',

function gavetaHTML() {
    var editId = lanc.editId;
    return '<div class="gaveta-fundo" data-lanc-fechar></div>' +
        '<div class="gaveta" id="gaveta-painel" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo">' +
        '<div class="gaveta-topo"><h2 id="gaveta-titulo">' + (editId ? 'Editar lançamento' : 'Novo lançamento') + '</h2>' +
        '<button type="button" class="botao-icone" data-lanc-fechar aria-label="Fechar">&times;</button></div>' +
        '<div class="gaveta-corpo" id="gaveta-corpo">' + corpoLancamentoHTML(lanc.valores, lanc.erros, editId) + '</div>' +
        '<div class="gaveta-pe"><button type="button" class="botao botao-neutro" data-lanc-fechar>Cancelar</button>' +
        '<button type="button" class="botao botao-marca" data-lanc-salvar>Salvar lançamento</button></div></div>';
}

function lerCamposLancamento() {
    var v = { tipo: lanc && lanc.valores.tipo };
    document.querySelectorAll('#gaveta [name]').forEach(function (el) { v[el.name] = el.value; });
    return v;
}

// abre a gaveta. opcoes: { editId, moedaId, tipo }
function abrirLancamento(opcoes) {
    opcoes = opcoes || {};
    var valores = { tipo: opcoes.tipo || 'COMPRA', data: hojeISO() };
    if (opcoes.editId) {
        var t = lerBanco().transacoes.filter(function (x) { return x.id === opcoes.editId; })[0];
        if (!t) return;
        valores = {
            tipo: t.tipo, moeda: t.moedaId, quantidade: numeroParaCampo(t.quantidade, 8), data: t.data,
            preco: TIPOS_COM_PRECO[t.tipo] ? numeroParaCampo(t.precoUnitario, 10) : '',
            taxas: t.taxas ? numeroParaCampo(t.taxas, 8) : '',
            destino: t.moedaDestinoId || '',
            quantidadeDestino: t.quantidadeDestino ? numeroParaCampo(t.quantidadeDestino, 8) : '',
            descricao: t.descricao || '',  // [ETAPA 7]
        };
    } else if (opcoes.moedaId) {
        valores.moeda = opcoes.moedaId;
    }
    lanc = { editId: opcoes.editId || null, valores: valores, erros: {} };

    var raiz = document.getElementById('gaveta');
    raiz.innerHTML = gavetaHTML();
    document.body.style.overflow = 'hidden';
    requestAnimationFrame(function () {
        raiz.classList.add('aberta');
        var primeiro = raiz.querySelector('input:not([type=hidden]), select');
        if (primeiro) primeiro.focus();
    });
    if (!opcoes.editId) aplicarAutopreenchimento();

    // sem o pacote diário carregado não há lista de moedas: busca e redesenha
    if (!mercado.lista.length) {
        carregarMercado().then(function () {
            if (lanc) redesenharCorpoLancamento(lerCamposLancamento());
        }).catch(function () {});
    }
}

function fecharLancamento() {
    if (!lanc) return;
    lanc = null;
    var raiz = document.getElementById('gaveta');
    raiz.classList.remove('aberta');
    document.body.style.overflow = '';
    setTimeout(function () { if (!lanc) raiz.innerHTML = ''; }, menosMovimento ? 0 : 240);
}

function redesenharCorpoLancamento(valores, erros) {
    if (!lanc) return;
    lanc.valores = valores;
    lanc.erros = erros || {};
    document.getElementById('gaveta-corpo').innerHTML = corpoLancamentoHTML(lanc.valores, lanc.erros, lanc.editId);
}

// Sugestões só em lançamento novo, nunca em edição. Tudo que é sugerido leva
// data-auto; se a pessoa digitar por cima, vira dela e não é mais sobrescrito.
function aplicarAutopreenchimento() {
    if (!lanc || lanc.editId) return;
    var v = lanc.valores;
    var moeda = resolverMoeda(v.moeda);
    var qtd = document.getElementById('l-quantidade');
    var preco = document.getElementById('l-preco');
    var infoPreco = document.getElementById('l-preco-ajuda');

    // desfaz só o que foi sugerido pela moeda anterior
    [qtd, preco].forEach(function (el) {
        if (el && el.dataset.auto === '1') { el.value = ''; delete el.dataset.auto; }
    });
    if (preco && preco.value === '' && infoPreco) infoPreco.textContent = 'Em reais, por unidade da moeda.';
    if (!moeda) return;

    if (TIPOS_DE_BAIXA[v.tipo] && qtd && qtd.value === '') {
        var saldo = saldoDaMoeda(lerBanco(), moeda.id, null);
        if (saldo > QTD_EPSILON) { qtd.value = numeroParaCampo(saldo, 8); qtd.dataset.auto = '1'; }
    }
    if (preco && preco.value === '') {
        var m = mercado.porId[moeda.id];
        if (m && m.preco > 0) {
            preco.value = numeroParaCampo(m.preco, 10);
            preco.dataset.auto = '1';
            if (infoPreco) infoPreco.textContent = 'Sugerido pelo preço atual. Confira antes de salvar.';
        }
    }
}

function moedaMudou() {
    if (!lanc) return;
    var campo = document.getElementById('l-moeda');
    lanc.valores.moeda = campo ? campo.value : '';
    var info = document.getElementById('l-moeda-ajuda');
    if (info) info.textContent = infoMoedaTexto(lanc.valores.tipo, lanc.valores.moeda, lanc.editId);
    aplicarAutopreenchimento();
}

// [ETAPA 8 · 02/10/2026] BUSCA EXTERNA NA GAVETA
// Meio segundo depois de parar de digitar, se o que tá escrito não bateu
// com nada do catálogo local (top 100 + já lançadas + já achadas nesta
// aba), pergunta pra CoinGecko. Os resultados entram no <datalist> do
// próprio campo — mesma lista suspensa de sempre, só que com mais opção.
// campoId: 'l-moeda' (origem) ou 'l-destino' (conversão).
var buscaExtraGavetaTimer = null;

function agendarBuscaExtraGaveta(campoId) {
    clearTimeout(buscaExtraGavetaTimer);
    var campo = document.getElementById(campoId);
    if (!campo) return;
    var valor = campo.value.trim();
    if (!valor || resolverMoeda(valor)) return;   // vazio, ou já achou local: nada a fazer

    buscaExtraGavetaTimer = setTimeout(function () {
        var agora = document.getElementById(campoId);
        if (!agora || agora.value.trim() !== valor) return;  // mudou de ideia enquanto esperava
        var ajuda = document.getElementById(campoId + '-ajuda');
        if (ajuda) ajuda.textContent = 'Procurando "' + valor + '" fora das 100 maiores…';

        buscarMoedaExterna(valor).then(function (lista) {
            var depois = document.getElementById(campoId);
            if (!depois || depois.value.trim() !== valor) return;  // digitou outra coisa nesse meio tempo
            var dl = document.getElementById(campoId + '-lista');
            if (dl) {
                lista.forEach(function (m) {
                    var opt = document.createElement('option');
                    opt.value = rotuloMoeda(m);
                    dl.appendChild(opt);
                });
            }
            var ajudaDepois = document.getElementById(campoId + '-ajuda');
            if (!ajudaDepois) return;
            ajudaDepois.textContent = lista.length
                ? 'Achei ' + lista.length + ' moeda' + (lista.length > 1 ? 's' : '') + ' fora das 100 maiores. Escolha uma da lista.'
                : 'Não achei nenhuma moeda com esse nome.';
        });
    }, 350);
}

function salvarPelaGaveta() {  // [ETAPA 9.2] async via Promise
    if (!lanc) return;
    var campos = lerCamposLancamento();
    var r = validarLancamento(campos, lanc.editId);
    if (Object.keys(r.erros).length) {
        redesenharCorpoLancamento(campos, r.erros);
        var primeiro = document.querySelector('#gaveta .campo-erro');
        if (primeiro) primeiro.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
    }
    var btn = document.querySelector('[data-lanc-salvar]');
    if (btn) { btn.disabled = true; btn.textContent = 'Salvando…'; }
    var edicao = !!lanc.editId;
    salvarLancamento(r.dados, lanc.editId).then(function () {
        fecharLancamento();
        // [ETAPA 10.1] avisa sobre target não definido só em lançamentos novos
        if (!edicao) {
            var moedaDoLanc = r.dados.moedaId;
            if (moedaDoLanc && _targets[moedaDoLanc] === undefined) {
                // toast com link para o balanceamento
                var caixa = document.getElementById('avisos');
                var elToast = document.createElement('div');
                elToast.className = 'aviso';
                elToast.innerHTML = 'Novo ativo adicionado. <a role="link" tabindex="0" data-rota="/balanceamento" style="color:var(--marca);font-weight:700;cursor:pointer;">Ajuste seu balanceamento.</a>';
                caixa.appendChild(elToast);
                setTimeout(function () {
                    elToast.style.transition = 'opacity 200ms ease';
                    elToast.style.opacity = '0';
                    setTimeout(function () { elToast.remove(); }, 220);
                }, 5000);
            } else {
                avisar('Lançamento registrado.', 'sucesso');
            }
        } else {
            avisar('Lançamento salvo.', 'sucesso');
        }
        desenhar();
    }).catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar lançamento'; }
        avisar('Não foi possível salvar. Tente de novo.', 'erro');
    });
}

document.addEventListener('click', function (ev) {
    // [ETAPA 7.4] filtro por tipo de operação
    var filtroBtn = ev.target.closest('[data-filtro-lanc]');
    if (filtroBtn) { atualizarFiltroLanc(filtroBtn.getAttribute('data-filtro-lanc')); return; }

    var novo = ev.target.closest('[data-lanc-novo]');
    if (novo) { abrirLancamento({ moedaId: novo.getAttribute('data-moeda') || null }); return; }

    var ed = ev.target.closest('[data-lanc-editar]');
    if (ed) { abrirLancamento({ editId: Number(ed.getAttribute('data-lanc-editar')) }); return; }

    var ex = ev.target.closest('[data-lanc-excluir]');
    if (ex) {
        if (!window.confirm('Excluir este lançamento?')) return;
        excluirLancamento(Number(ex.getAttribute('data-lanc-excluir'))).then(function (motivo) {
            if (motivo) { avisar(motivo, 'erro'); return; }
            avisar('Lançamento excluído.', 'sucesso');
            desenhar();
        }).catch(function () { avisar('Não foi possível excluir. Tente de novo.', 'erro'); });
        return;
    }

    // [ETAPA 7] gaveta em modo "ver" — abre ao clicar na linha, exceto na célula da moeda
    var ver = ev.target.closest('[data-lanc-ver]');
    if (ver && !ev.target.closest('[data-rota]')) {
        abrirDetalhe(Number(ver.getAttribute('data-lanc-ver')));
        return;
    }
    // botão "Editar" dentro da gaveta de detalhe → troca para modo edição
    var verEditar = ev.target.closest('[data-ver-editar]');
    if (verEditar) {
        var editarId = Number(verEditar.getAttribute('data-ver-editar'));
        fecharLancamento();
        abrirLancamento({ editId: editarId });
        return;
    }
    // botão "Excluir" dentro da gaveta de detalhe
    var verExcluir = ev.target.closest('[data-ver-excluir]');
    if (verExcluir) {
        if (!window.confirm('Excluir este lançamento?')) return;
        var verExcluirId = Number(verExcluir.getAttribute('data-ver-excluir'));
        fecharLancamento();
        excluirLancamento(verExcluirId).then(function (motivoVer) {
            if (motivoVer) { avisar(motivoVer, 'erro'); return; }
            avisar('Lançamento excluído.', 'sucesso');
            desenhar();
        }).catch(function () { avisar('Não foi possível excluir. Tente de novo.', 'erro'); });
        return;
    }

    if (!lanc) return;
    if (ev.target.closest('[data-lanc-fechar]')) { fecharLancamento(); return; }
    if (ev.target.closest('[data-lanc-salvar]')) { salvarPelaGaveta(); return; }
    // [ETAPA 7] botão ? — abre/fecha o painel de explicação das operações
    if (ev.target.closest('[data-ajuda-tipo]')) {
        var btn = ev.target.closest('[data-ajuda-tipo]');
        var painel = document.getElementById('ajuda-ops');
        if (painel) {
            var aberta = painel.classList.toggle('aberta');
            btn.setAttribute('aria-expanded', aberta ? 'true' : 'false');
        }
        return;
    }
    var tipo = ev.target.closest('[data-lanc-tipo]');
    if (tipo) {
        var campos = lerCamposLancamento();
        campos.tipo = tipo.getAttribute('data-lanc-tipo');
        // o campo da moeda muda de lista para texto: leva a moeda já resolvida
        var m = resolverMoeda(campos.moeda);
        if (m) campos.moeda = m.id;
        // sugestões da operação anterior não seguem
        ['quantidade', 'preco'].forEach(function (n) {
            var el = document.querySelector('#gaveta [name=' + n + ']');
            if (el && el.dataset.auto === '1') campos[n] = '';
        });
        redesenharCorpoLancamento(campos);
        aplicarAutopreenchimento();
    }
});

document.addEventListener('change', function (ev) {
    if (lanc && ev.target.id === 'l-moeda') moedaMudou();
    // [ETAPA 7] seletor de tipo no celular — mesma lógica dos botões data-lanc-tipo
    if (lanc && ev.target.id === 'l-tipo-select') {
        var campos = lerCamposLancamento();
        campos.tipo = ev.target.value;
        var m = resolverMoeda(campos.moeda);
        if (m) campos.moeda = m.id;
        ['quantidade', 'preco'].forEach(function (n) {
            var el = document.querySelector('#gaveta [name=' + n + ']');
            if (el && el.dataset.auto === '1') campos[n] = '';
        });
        redesenharCorpoLancamento(campos);
        aplicarAutopreenchimento();
    }
});

document.addEventListener('input', function (ev) {
    // [ETAPA 10] atualiza targets em tempo real enquanto o usuário digita
    var balInput = ev.target.closest('[data-bal-id]');
    if (balInput && rotaAtual === '/balanceamento') {
        var id = balInput.getAttribute('data-bal-id');
        var val = parseFloat(balInput.value.replace(',', '.'));
        if (!isNaN(val) && val >= 0) {
            _targets[id] = val;
        } else if (balInput.value === '' || balInput.value === '—') {
            delete _targets[id];
        }
        // atualiza só o rodapé de totalização sem redesenhar tudo
        var somaAgora = 0;
        Object.keys(_targets).forEach(function (k) { somaAgora += _targets[k]; });
        var totalEl = document.querySelector('.bal-total');
        if (totalEl) {
            var diff = Math.abs(somaAgora - 100);
            totalEl.className = 'bal-total ' + (diff < 0.1 ? 'ok' : 'fora');
            totalEl.textContent = diff < 0.1
                ? '✓ 100% distribuídos'
                : somaAgora < 100
                    ? formatarBR(somaAgora, 1) + '% — faltam ' + formatarBR(100 - somaAgora, 1) + '%'
                    : formatarBR(somaAgora, 1) + '% — ' + formatarBR(somaAgora - 100, 1) + '% além';
            var btnSalvar = document.querySelector('[data-bal-salvar]');
            if (btnSalvar) btnSalvar.disabled = diff >= 0.1;
        }
        return;
    }

    if (!lanc) return;
    if (ev.target.id === 'l-moeda' && ev.target.tagName === 'INPUT') { moedaMudou(); agendarBuscaExtraGaveta('l-moeda'); return; }
    if (ev.target.id === 'l-destino') { agendarBuscaExtraGaveta('l-destino'); return; }  // [ETAPA 8]
    // a pessoa digitou por cima de um valor sugerido: agora o campo é dela
    if (ev.target.dataset && ev.target.dataset.auto === '1') {
        delete ev.target.dataset.auto;
        if (ev.target.id === 'l-preco') {

// [EVOLUCAO:início] função pura, testada em Node.
// EVOLUÇÃO REAL DO PATRIMÔNIO: reconstruída dia a dia, do 1º lançamento até
// hoje. Em cada dia vale (quantidade que se tinha naquele dia) x (preço
// daquele dia), somando as moedas. Não é o custo acumulado (o custo vem
// junto, como segunda linha, pra comparar).
//   precos[moedaId]['AAAA-MM-DD'] = fechamento do dia, em reais
// Preço que falta num dia repete o último conhecido. Moeda sem nenhum preço
// (sem par na Binance, ou antes de listar) entra pelo CUSTO, e é devolvida em
// `aCusto` pra tela avisar.
function diasEntre(deISO, ateISO) {
    var dias = [];
    var d = new Date(deISO + 'T00:00:00Z');
    var fim = new Date(ateISO + 'T00:00:00Z');
    while (d <= fim) {
        dias.push(d.toISOString().slice(0, 10));
        d.setUTCDate(d.getUTCDate() + 1);
    }
    return dias;
}

function reconstruirEvolucao(transacoes, precos, hojeISO) {
    var ordenadas = ordenarTransacoes(transacoes);
    if (!ordenadas.length) return { pontos: [], aCusto: [] };

    var ultimo = {};        // último preço conhecido por moeda
    var aCusto = {};
    var aplicadas = [];
    var proxima = 0;
    var posicoes = {};
    var pontos = [];

    diasEntre(ordenadas[0].data, hojeISO).forEach(function (dia) {
        var mudou = false;
        while (proxima < ordenadas.length && ordenadas[proxima].data <= dia) {
            aplicadas.push(ordenadas[proxima++]);
            mudou = true;
        }
        if (mudou) posicoes = processarCarteira(aplicadas).posicoes;

        Object.keys(precos).forEach(function (id) {
            var v = precos[id][dia];
            if (v !== undefined && v !== null) ultimo[id] = v;
        });

        var valor = 0, custo = 0;
        Object.keys(posicoes).forEach(function (id) {
            var p = posicoes[id];
            if (p.quantidade <= QTD_EPSILON) return;
            custo += p.custoTotal;
            if (ultimo[id] !== undefined) {
                valor += p.quantidade * ultimo[id];
            } else {
                valor += p.custoTotal;
                aCusto[id] = true;
            }
        });
        pontos.push({ time: dia, valor: valor, custo: custo });
    });

    return { pontos: pontos, aCusto: Object.keys(aCusto) };
}
// [EVOLUCAO:fim]

// DE ONDE VEM CADA DADO
//   Posições e lucros: motor de lançamentos (carteiraAtual).
//   Preço e variação 24h ao vivo: Binance (REST na abertura e WebSocket, com
//   o amortecedor de 5s). Moeda sem par na Binance usa o preço do pacote
//   diário e entra "sem cotação ao vivo".
//   Histórico do gráfico: klines diárias da Binance (par USDT x USDTBRL do
//   mesmo dia), uma chamada por moeda que a carteira já teve.
// Moeda que a Binance não negocia (ou que saiu do top 100) fica de fora da
// cotação e, no gráfico, entra pelo custo. A tela avisa.

// alocação: 5 cores categóricas na ordem validada (pares vizinhos, inclusive
// fechando o anel, passam na checagem de daltonismo no fundo escuro) + cinza
// para "Outras". Ficam de fora o verde e o vermelho, reservados pra alta e queda.
var ALOCACAO_CORES = ['#3987e5', '#d95926', '#9085e9', '#c98500', '#d55181'];
var ALOCACAO_OUTRAS = '#6B7791';
var PF_PERIODOS = { '1M': 30, '3M': 90, '6M': 180, '1A': 365, 'Tudo': 0 };

var portfolioPg = null;

function sairDoPortfolio() {
    if (!portfolioPg) return;
    var pg = portfolioPg;
    portfolioPg = null;
    if (pg.canal) pg.canal.parar();
    if (pg.amortecedor) pg.amortecedor.parar();
    if (pg.chart) { try { pg.chart.remove(); } catch (e) {} }
}

// canal do WebSocket da Binance, com reconexão de espera crescente
function abrirCanalAoVivo(streams, aoTick) {
    var canal = { ws: null, tentativas: 0, timer: null, parado: false };
    function abrir() {
        estado.definir('conexao', 'conectando');
        var ws;
        try { ws = new WebSocket(BINANCE_WS + streams.join('/')); } catch (e) { estado.definir('conexao', 'off'); return; }
        canal.ws = ws;
        ws.onopen = function () { canal.tentativas = 0; estado.definir('conexao', 'ao-vivo'); };
        ws.onmessage = function (ev) {
            var msg;
            try { msg = JSON.parse(ev.data); } catch (e) { return; }
            var d = msg && msg.data;
            if (d && d.s) aoTick(d.s, Number(d.c), Number(d.o));
        };
        ws.onclose = function () {
            if (canal.parado || canal.ws !== ws) return;
            canal.ws = null;
            estado.definir('conexao', 'off');
            var espera = Math.min(60000, 2000 * Math.pow(2, canal.tentativas++));
            canal.timer = setTimeout(function () { if (!canal.parado) abrir(); }, espera);
        };
        ws.onerror = function () { /* onclose cuida */ };
    }
    abrir();
    return {
        parar: function () {
            canal.parado = true;
            clearTimeout(canal.timer);
            if (canal.ws) { var ws = canal.ws; canal.ws = null; try { ws.close(); } catch (e) {} }
        },
    };
}

// ordem em que a moeda entrou na carteira: a cor da alocação segue a moeda,
// não o tamanho dela (moeda que cresce não troca de cor)
function ordemDeEntrada() {
    var ordem = {};
    var n = 0;
    ordenarTransacoes(lerBanco().transacoes).forEach(function (t) {
        pernasDaTransacao(t).forEach(function (p) { if (ordem[p.moedaId] === undefined) ordem[p.moedaId] = n++; });
    });
    return ordem;
}

function calcularPortfolio(pg) {
    var linhas = pg.linhas.map(function (l) {
        var p = l.pos;
        var saldo = l.preco !== null ? p.quantidade * l.preco : null;
        var base = saldo !== null ? saldo : p.custoTotal;          // sem cotação entra pelo custo
        var antes = saldo !== null && l.var24h !== null ? saldo / (1 + l.var24h / 100) : base;
        return {
            l: l,
            saldo: saldo,
            base: base,
            antes: antes,
            pm: p.qtdComCusto > QTD_EPSILON ? p.custoTotal / p.qtdComCusto : null,
            lucro: base - p.custoTotal,
            rent: saldo !== null && p.custoTotal > 0 ? (saldo - p.custoTotal) / p.custoTotal * 100 : null,
        };
    });
    var t = { saldo: 0, custo: 0, antes: 0, semCotacao: 0 };
    linhas.forEach(function (x) {
        t.saldo += x.base;
        t.custo += x.l.pos.custoTotal;
        t.antes += x.antes;
        if (x.saldo === null) t.semCotacao++;
    });
    linhas.forEach(function (x) { x.pct = t.saldo > 0 ? x.base / t.saldo * 100 : 0; });
    return {
        linhas: linhas,
        saldo: t.saldo,
        custo: t.custo,
        lucroNR: t.saldo - t.custo,
        lucroNRpct: t.custo > 0 ? (t.saldo - t.custo) / t.custo * 100 : null,
        var24h: t.saldo - t.antes,
        var24hPct: t.antes > 0 ? (t.saldo / t.antes - 1) * 100 : null,
        semCotacao: t.semCotacao,
        realizado: pg.realizado,
    };
}

// fatias da rosca: as 5 maiores com cor própria e o resto em "Outras"
function montarFatias(r) {
    var ordem = ordemDeEntrada();
    var porTamanho = r.linhas.filter(function (x) { return x.base > 0; })
        .sort(function (a, b) { return b.base - a.base; });
    var principais = porTamanho.length > ALOCACAO_CORES.length ? porTamanho.slice(0, ALOCACAO_CORES.length) : porTamanho;
    var resto = porTamanho.slice(principais.length);
    var porEntrada = principais.slice().sort(function (a, b) { return ordem[a.l.id] - ordem[b.l.id]; });
    var cor = {};
    porEntrada.forEach(function (x, i) { cor[x.l.id] = ALOCACAO_CORES[i]; });
    var fatias = principais.map(function (x) { return { ids: [x.l.id], nome: x.l.info.simbolo, cor: cor[x.l.id] }; });
    if (resto.length) fatias.push({ ids: resto.map(function (x) { return x.l.id; }), nome: 'Outras', cor: ALOCACAO_OUTRAS });
    return fatias;
}

function baseDaFatia(r, f) {
    return r.linhas.filter(function (x) { return f.ids.indexOf(x.l.id) !== -1; })
        .reduce(function (s, x) { return s + x.base; }, 0);
}

var ROSCA_R = 70;
var ROSCA_C = 2 * Math.PI * ROSCA_R;

// [ETAPA 4.1] 2px de respiro entre fatias; com uma fatia só, anel inteiro (sem fenda)
function respiroRosca(qtdFatias) {
    return qtdFatias > 1 ? 2 : 0;
}

function roscaHTML(r, fatias) {
    var acumulado = 0;
    var segmentos = fatias.map(function (f, i) {
        var frac = r.saldo > 0 ? baseDaFatia(r, f) / r.saldo : 0;
        var comp = Math.max(frac * ROSCA_C - respiroRosca(fatias.length), 0);
        var seg = '<circle class="rosca-fatia" data-fatia="' + i + '" cx="90" cy="90" r="' + ROSCA_R + '" fill="none" stroke="' + f.cor + '" stroke-width="22" ' +
            'stroke-dasharray="' + comp.toFixed(2) + ' ' + (ROSCA_C - comp).toFixed(2) + '" stroke-dashoffset="' + (-acumulado).toFixed(2) + '" transform="rotate(-90 90 90)">' +
            '<title>' + escapar(f.nome) + ': ' + formatarBR(frac * 100, 1) + '%</title></circle>';
        acumulado += frac * ROSCA_C;
        return seg;
    }).join('');
    return '<svg class="rosca" viewBox="0 0 180 180" role="img" aria-label="Alocação da carteira por moeda">' +
        '<circle cx="90" cy="90" r="' + ROSCA_R + '" fill="none" stroke="var(--superficie-2)" stroke-width="22"/>' +
        segmentos + '<text x="90" y="86" text-anchor="middle" class="rosca-total">' + r.linhas.length + '</text>' +
        '<text x="90" y="104" text-anchor="middle" class="rosca-rotulo">' + (r.linhas.length === 1 ? 'moeda' : 'moedas') + '</text></svg>';
}

function legendaAlocacaoHTML(r, fatias) {
    return '<ul class="rosca-legenda">' + fatias.map(function (f, i) {
        var base = baseDaFatia(r, f);
        return '<li data-fatia-leg="' + i + '"><span class="rosca-cor" style="background: ' + f.cor + ';"></span>' +
            '<span class="rosca-nome">' + escapar(f.nome) + '</span>' +
            '<span class="rosca-pct">' + formatarBR(r.saldo > 0 ? base / r.saldo * 100 : 0, 1) + '%</span>' +
            '<span class="rosca-valor" data-brl="' + base + '"></span></li>';
    }).join('') + '</ul>';
}

function linhaPortfolioHTML(x) {
    var l = x.l;
    var p = l.pos;
    var semCusto = p.quantidade - p.qtdComCusto;
    return '<tr data-moeda-id="' + escapar(l.id) + '">' +
        '<td>' + moedaCelulaHTML(l.id) + '</td>' +
        '<td>' + (l.preco !== null ? '<span class="preco-vivo" data-cel="preco" data-brl="' + l.preco + '" data-tipo="preco"></span>' : '<span class="sem-dado" title="Sem cotação ao vivo">—</span>') + '</td>' +
        '<td data-cel="var24h">' + pctCelula(l.var24h) + '</td>' +
        '<td>' + textoQuantidade(p.quantidade) +
        (semCusto > QTD_EPSILON && x.pm !== null ? '<span class="qtd-sem-custo">' + textoQuantidade(semCusto) + ' sem custo</span>' : '') + '</td>' +
        '<td>' + (x.pm !== null ? '<span data-brl="' + x.pm + '" data-tipo="preco"></span>' : '<span class="sem-dado">custo zero</span>') + '</td>' +
        '<td><span data-brl="' + p.custoTotal + '"></span></td>' +
        '<td class="td-forte" data-cel="saldo">' + (x.saldo !== null ? '<span data-brl="' + x.saldo + '"></span>' : '<span class="sem-dado">—</span>') + '</td>' +
        '<td data-cel="lucro">' + lucroCelulaHTML(x) + '</td>' +
        '<td data-cel="pct">' + pctCelulaPortfolio(x.pct, x.l.id) + '</td></tr>';
}

function pctCelulaPortfolio(pct, moedaId) {
    var target = _targets[moedaId];
    if (target === undefined) {
        return '<span>' + formatarBR(pct, 1) + '%</span>';
    }
    var modo = estado.ler('balModo') || 'pct';
    // se modo for nota, converte pra % antes de exibir
    var pctAlvo = target;
    if (modo === 'nota') {
        var somaNotas = 0;
        Object.keys(_targets).forEach(function (k) { somaNotas += _targets[k]; });
        pctAlvo = somaNotas > 0 ? target / somaNotas * 100 : 0;
    }
    var desvio = pct - pctAlvo;
    var cls = Math.abs(desvio) < 1 ? '' : desvio > 0 ? 'acima' : 'abaixo';
    var seta = desvio > 0 ? '↑' : '↓';
    return '<span>' + formatarBR(pct, 1) + '%</span>' +
        '<span class="pct-alvo' + (cls ? ' ' + cls : '') + '">' +
        'alvo ' + formatarBR(pctAlvo, 1) + '%' +
        (Math.abs(desvio) >= 1 ? ' ' + seta : '') +
        '</span>';
}

function lucroCelulaHTML(x) {
    if (x.saldo === null) return '<span class="sem-dado">—</span>';
    if (x.l.pos.custoTotal <= 0) return '<span class="var alta">custo zero</span>';
    return '<span class="var ' + (x.lucro >= 0 ? 'alta' : 'queda') + '" data-brl="' + x.lucro + '"></span>' +
        '<span class="lucro-pct ' + (x.lucro >= 0 ? 'alta' : 'queda') + '">' + formatarPct(x.rent) + '</span>';
}

// ---------- preços ----------
function precoInicialDaLinha(l, tickers, usdtbrl) {
    var d = l.par ? tickers[l.par] : null;
    if (d && usdtbrl) {
        l.preco = l.par === 'USDTBRL' ? Number(d.lastPrice) : Number(d.lastPrice) * usdtbrl;
        l.var24h = Number(d.priceChangePercent);
        l.aoVivo = true;
        return;
    }
    var m = mercado.porId[l.id];          // pacote diário: pode ter horas
    l.preco = m && m.preco > 0 ? m.preco : null;
    l.var24h = m && m.var24h != null ? m.var24h : null;
    l.aoVivo = false;
}

function carregarPrecosPortfolio(pg) {
    var pares = [];
    pg.linhas.forEach(function (l) { if (l.par && pares.indexOf(l.par) === -1) pares.push(l.par); });
    if (!pares.length) { pg.linhas.forEach(function (l) { precoInicialDaLinha(l, {}, null); }); return Promise.resolve(); }
    var simbolos = pares.slice();
    if (simbolos.indexOf('USDTBRL') === -1) simbolos.push('USDTBRL');
    return fetch(BINANCE + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(simbolos)))
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function (lista) {
            var por = {};
            lista.forEach(function (d) { por[d.symbol] = d; });
            pg.usdtbrl = por.USDTBRL ? Number(por.USDTBRL.lastPrice) : null;
            pg.linhas.forEach(function (l) { precoInicialDaLinha(l, por, pg.usdtbrl); });
        })
        .catch(function () { pg.linhas.forEach(function (l) { precoInicialDaLinha(l, {}, null); }); });
}

function aplicarTickPortfolio(simbolo, fechamento, abertura) {
    var pg = portfolioPg;
    if (!pg) return;
    pg.linhas.forEach(function (l) {
        if (l.par !== simbolo) return;
        var taxa = simbolo === 'USDTBRL' ? 1 : pg.usdtbrl;
        if (!taxa) return;
        l.preco = fechamento * taxa;
        if (abertura > 0) l.var24h = (fechamento / abertura - 1) * 100;
        l.aoVivo = true;
    });
    if (pg.agendado) return;
    pg.agendado = true;      // o lote inteiro (várias moedas) redesenha uma vez só
    setTimeout(function () { pg.agendado = false; if (portfolioPg === pg) atualizarPortfolioTela(); }, 0);
}

// ---------- atualização na tela ----------
function escreverBRL(id, valor, tipo) {
    var el = document.getElementById(id);
    if (!el) return null;
    el.setAttribute('data-brl', valor);
    if (tipo) el.setAttribute('data-tipo', tipo);
    el.textContent = formatarMoeda(valor, tipo);
    return el;
}

function classeGanho(el, valor) {
    if (!el) return;
    el.classList.toggle('ganho', valor > 0);
    el.classList.toggle('perda', valor < 0);
}

function atualizarPortfolioTela() {
    var pg = portfolioPg;
    if (!pg || !document.getElementById('pf-saldo')) return;
    var r = calcularPortfolio(pg);
    pg.ultimo = r;

    // saldo grande: desliza até o valor novo
    var saldoEl = document.getElementById('pf-saldo');
    var de = Number(saldoEl.getAttribute('data-brl'));
    saldoEl.setAttribute('data-brl', r.saldo);
    if (pg.primeiraLeitura || !isFinite(de)) saldoEl.textContent = formatarMoeda(r.saldo);
    else animarNumero(saldoEl, de, r.saldo, function (v) { return formatarMoeda(v); }, 450);

    var v24 = document.getElementById('pf-var');
    if (v24) {
        v24.innerHTML = r.var24hPct === null ? '<span class="sem-dado">—</span>' :
            '<span class="var ' + (r.var24h >= 0 ? 'alta' : 'queda') + '" data-brl="' + r.var24h + '">' + formatarMoeda(r.var24h) + '</span> ' + varHTML(r.var24hPct, true);
    }

    escreverBRL('pf-custo', r.custo);
    var lucro = escreverBRL('pf-lucro', r.lucroNR);
    classeGanho(lucro, r.lucroNR);
    var notaL = document.getElementById('pf-lucro-nota');
    if (notaL) notaL.textContent = !r.linhas.length ? 'sem moedas em carteira' : (r.lucroNRpct === null ? 'custo zero' : formatarPct(r.lucroNRpct) + ' sobre o custo');
    var real = escreverBRL('pf-realizado', r.realizado.total);
    classeGanho(real, r.realizado.total);
    var notaR = document.getElementById('pf-realizado-nota');
    if (notaR) notaR.textContent = r.realizado.vendas ? r.realizado.vendas + (r.realizado.vendas === 1 ? ' venda' : ' vendas') : 'sem vendas ainda';
    var res = escreverBRL('pf-resultado', r.lucroNR + r.realizado.total);
    classeGanho(res, r.lucroNR + r.realizado.total);
    var notaT = document.getElementById('pf-resultado-nota');
    if (notaT) notaT.textContent = 'não realizado mais realizado';

    // tabela: só as células que mudam, com pisca no preço
    r.linhas.forEach(function (x) {
        var tr = document.querySelector('#tabela-portfolio tr[data-moeda-id="' + x.l.id + '"]');
        if (!tr) return;
        var preco = tr.querySelector('[data-cel="preco"]');
        if (preco && x.l.preco !== null) {
            var antes = Number(preco.getAttribute('data-brl'));
            if (Math.abs(x.l.preco - antes) / (antes || 1) > 1e-7) {
                preco.setAttribute('data-brl', x.l.preco);
                if (!pg.primeiraLeitura) piscar(preco, x.l.preco > antes);
                animarNumero(preco, antes, x.l.preco, function (v) { return formatarMoeda(v, 'preco'); }, 450);
            }
        }
        tr.querySelector('[data-cel="var24h"]').innerHTML = pctCelula(x.l.var24h);
        if (x.saldo !== null) tr.querySelector('[data-cel="saldo"]').innerHTML = '<span data-brl="' + x.saldo + '">' + formatarMoeda(x.saldo) + '</span>';
        tr.querySelector('[data-cel="lucro"]').innerHTML = lucroCelulaHTML(x);
        tr.querySelector('[data-cel="pct"]').innerHTML = pctCelulaPortfolio(x.pct, x.l.id);
        preencherValores(tr);
    });

    // rosca e legenda
    var acumulado = 0;
    pg.fatias.forEach(function (f, i) {
        var base = baseDaFatia(r, f);
        var frac = r.saldo > 0 ? base / r.saldo : 0;
        var comp = Math.max(frac * ROSCA_C - respiroRosca(pg.fatias.length), 0);
        var seg = document.querySelector('.rosca-fatia[data-fatia="' + i + '"]');
        if (seg) {
            seg.setAttribute('stroke-dasharray', comp.toFixed(2) + ' ' + (ROSCA_C - comp).toFixed(2));
            seg.setAttribute('stroke-dashoffset', (-acumulado).toFixed(2));
        }
        acumulado += frac * ROSCA_C;
        var leg = document.querySelector('[data-fatia-leg="' + i + '"]');
        if (leg) {
            leg.querySelector('.rosca-pct').textContent = formatarBR(frac * 100, 1) + '%';
            var val = leg.querySelector('.rosca-valor');
            val.setAttribute('data-brl', base);
            val.textContent = formatarMoeda(base);
        }
    });

    atualizarUltimoPontoPortfolio(r);
    pg.primeiraLeitura = false;
}

// ---------- gráfico de evolução ----------
function buscarKlinesDiarias(simbolo, desdeMs) {
    var url = BINANCE + '/api/v3/klines?symbol=' + simbolo + '&interval=1d&startTime=' + desdeMs + '&limit=1000';
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('klines ' + r.status); return r.json(); });
}

// { 'AAAA-MM-DD': fechamento } em reais, por moeda
function buscarHistoricosPortfolio(pg, transacoes) {
    var primeiro = ordenarTransacoes(transacoes)[0].data;
    var limite = new Date(); limite.setUTCDate(limite.getUTCDate() - 998);
    var desde = new Date(primeiro + 'T00:00:00Z');
    if (desde < limite) desde = limite;
    desde.setUTCDate(desde.getUTCDate() - 1);
    var desdeMs = desde.getTime();

    var ids = [];
    transacoes.forEach(function (t) {
        pernasDaTransacao(t).forEach(function (p) { if (ids.indexOf(p.moedaId) === -1) ids.push(p.moedaId); });
    });
    return obterPrecosBinance().then(function (binance) {
        var pares = {};
        ids.forEach(function (id) {
            var m = mercado.porId[id];
            var par = m ? parBinanceDe(m, binance) : null;
            if (par) pares[id] = par;
        });
        var simbolos = [];
        Object.keys(pares).forEach(function (id) { if (simbolos.indexOf(pares[id]) === -1) simbolos.push(pares[id]); });
        if (simbolos.indexOf('USDTBRL') === -1) simbolos.push('USDTBRL');
        return Promise.all(simbolos.map(function (s) {
            return buscarKlinesDiarias(s, desdeMs).then(function (k) { return [s, k]; });
        })).then(function (resp) {
            var porPar = {};
            resp.forEach(function (x) {
                var mapa = {};
                x[1].forEach(function (c) { mapa[new Date(c[0]).toISOString().slice(0, 10)] = Number(c[4]); });
                porPar[x[0]] = mapa;
            });
            var dolar = porPar.USDTBRL || {};
            var dias = Object.keys(dolar).sort();
            var precos = {};
            Object.keys(pares).forEach(function (id) {
                var mapa = porPar[pares[id]];
                var saida = {};
                if (pares[id] === 'USDTBRL') {
                    saida = mapa;
                } else {
                    var taxa = null;
                    Object.keys(mapa).sort().forEach(function (dia) {
                        if (dolar[dia] !== undefined) taxa = dolar[dia];
                        if (taxa !== null) saida[dia] = mapa[dia] * taxa;
                    });
                }
                precos[id] = saida;
            });
            return precos;
        });
    });
}

function pontosDoPeriodo(pg) {
    var todos = pg.evolucao.pontos;
    var dias = PF_PERIODOS[pg.periodo];
    if (!dias) return todos;
    return todos.slice(Math.max(todos.length - dias, 0));
}

function escalarPonto(v) {
    return v * fatorExibicao();
}

function desenharEvolucao(ajustar) {
    var pg = portfolioPg;
    if (!pg || !pg.chart || !pg.evolucao) return;
    var pontos = pontosDoPeriodo(pg);
    pg.serieValor.setData(pontos.map(function (p) { return { time: p.time, value: escalarPonto(p.valor) }; }));
    pg.serieCusto.setData(pontos.map(function (p) { return { time: p.time, value: escalarPonto(p.custo) }; }));
    if (ajustar) pg.chart.timeScale().fitContent();
}

function atualizarUltimoPontoPortfolio(r) {
    var pg = portfolioPg;
    if (!pg || !pg.serieValor || !pg.evolucao || !pg.evolucao.pontos.length) return;
    var ultimo = pg.evolucao.pontos[pg.evolucao.pontos.length - 1];
    ultimo.valor = r.saldo;
    ultimo.custo = r.custo;
    pg.serieValor.update({ time: ultimo.time, value: escalarPonto(ultimo.valor) });
    pg.serieCusto.update({ time: ultimo.time, value: escalarPonto(ultimo.custo) });
}

// [ETAPA 4.1] a escala enquadra as DUAS linhas (patrimônio e custo). Antes só
// a do patrimônio contava e o custo podia ficar fora do gráfico. Também impõe
// uma faixa mínima (2% do valor): com carteira pequena, uma variação de
// centavos não pode parecer uma queda enorme.
function autoscalePortfolio(original) {
    var pg = portfolioPg;
    if (!pg || !pg.evolucao) return original();
    var f = fatorExibicao();
    var min = Infinity, max = -Infinity;
    pontosDoPeriodo(pg).forEach(function (p) {
        [p.valor * f, p.custo * f].forEach(function (v) {
            if (v < min) min = v;
            if (v > max) max = v;
        });
    });
    if (!isFinite(min)) return original();
    var faixaMinima = Math.abs(max) * 0.02;
    if (max - min < faixaMinima) {
        var meio = (max + min) / 2;
        min = meio - faixaMinima / 2;
        max = meio + faixaMinima / 2;
    }
    return { priceRange: { minValue: min, maxValue: max }, margins: { above: 0.12, below: 0.08 } };
}

function criarGraficoPortfolio() {
    var pg = portfolioPg;

        grid: { vertLines: { color: corCss('--borda') }, horzLines: { color: corCss('--borda') } },
        rightPriceScale: { borderColor: corCss('--borda'), scaleMargins: { top: 0.12, bottom: 0.08 } },
        timeScale: { borderColor: corCss('--borda') },
        crosshair: {
            mode: LW.CrosshairMode.Normal,
            vertLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
            horzLine: { color: corCss('--texto-3'), labelBackgroundColor: corCss('--superficie-3') },
        },
        localization: { priceFormatter: formatarEixo },
    });
    pg.chart = chart;
    var formato = { type: 'custom', formatter: formatarEixo, minMove: 1e-10 };
    pg.serieCusto = chart.addLineSeries({ color: corCss('--texto-3'), lineWidth: 2, lineStyle: LW.LineStyle.Dashed, priceFormat: formato, lastValueVisible: false, priceLineVisible: false, autoscaleInfoProvider: autoscalePortfolio });
    pg.serieValor = chart.addLineSeries({ color: '#3987e5', lineWidth: 2, priceFormat: formato, lastValueVisible: true, priceLineVisible: true, autoscaleInfoProvider: autoscalePortfolio });
    chart.subscribeCrosshairMove(function (param) {

        leg.innerHTML = quando + ' · Patrimônio <strong>' + formatarExibido(v.value) + '</strong>' +
            (c ? ' · Custo <strong>' + formatarExibido(c.value) + '</strong>' : '');
    });
}

/* =================================================================
   CELULAR  [ETAPA 5 · 29/09/2026]
   Navegação por menu sanduíche que abre por cima da tela (sem barra
   inferior, por enquanto), busca que abre numa segunda linha do topo, ordem
   do Mercado por seletor e toque na linha da moeda. O layout em si mora no

   ================================================================= */
function ehTelaPequena() {
    try { return window.matchMedia('(max-width: 768px)').matches; } catch (e) { return false; }
}

function fecharMenuMobile() {
    var menu = document.getElementById('menu-mobile');
    if (!menu || !menu.classList.contains('aberto')) return;
    menu.classList.remove('aberto');
    menu.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
}

function fecharBuscaMobile() {
    var topo = document.querySelector('.topo');
    if (topo) topo.classList.remove('busca-aberta');
}

document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-menu-abrir]')) {
        var menu = document.getElementById('menu-mobile');
        fecharBuscaMobile();
        menu.classList.add('aberto');
        menu.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
    }
    if (ev.target.closest('[data-menu-fechar]')) { fecharMenuMobile(); return; }

    var chipMoeda = ev.target.closest('[data-moeda-ciclo]');
    if (chipMoeda) {
        var taxasAtuais = estado.ler('taxas') || {};
        trocarMoeda(proximaMoeda(estado.ler('moeda'), taxasAtuais));
        return;
    }

    // [ETAPA 6.2] avatar do topo: no celular é o segundo jeito de abrir o
    // menu (pedido original do Junior: "acesso pelo ícone do usuário"). Só
    // dispara se o toque não foi no "Sair" (que só existe visível no
    // computador, com sua própria ação).
    var avatarTopo = ev.target.closest('[data-usuario-topo]');
    if (avatarTopo && !ev.target.closest('[data-sair]') && ehTelaPequena()) {
        var menuAv = document.getElementById('menu-mobile');
        fecharBuscaMobile();
        menuAv.classList.add('aberto');
        menuAv.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
        return;
    }

    // acordeão de orientação
    var acordToggle = ev.target.closest('[data-acord-toggle]');
    if (acordToggle) {
        var idx = acordToggle.getAttribute('data-acord-toggle');
        var item = document.querySelector('[data-acord-item="' + idx + '"]');
        if (!item) return;
        var aberto = item.classList.contains('aberto');
        // fecha todos
        document.querySelectorAll('.acord-item.aberto').forEach(function (el) {
            el.classList.remove('aberto');
            var btn = el.querySelector('.acord-gatilho');
            if (btn) btn.setAttribute('aria-expanded', 'false');
        });
        // abre o clicado (se estava fechado)
        if (!aberto) {
            item.classList.add('aberto');
            acordToggle.setAttribute('aria-expanded', 'true');
        }
        return;
    }

    // [ETAPA 10] troca de modo % / notas no balanceamento
    var balModo = ev.target.closest('[data-bal-modo]');
    if (balModo && rotaAtual === '/balanceamento') {
        estado.definir('balModo', balModo.getAttribute('data-bal-modo'));
        desenhar();
        return;
    }

    // copiar alocação atual como ponto de partida
    if (ev.target.closest('[data-bal-copiar]') && rotaAtual === '/balanceamento') {
        var cartTmp = carteiraAtual().posicoes;
        var idsTmp = Object.keys(cartTmp).filter(function (id) { return cartTmp[id].quantidade > QTD_EPSILON; });
        var modo2 = estado.ler('balModo') || 'pct';
        // calcula saldo total pra % atual
        var stmp = 0;
        idsTmp.forEach(function (id) {
            var m2 = mercado.porId[id];
            stmp += m2 ? cartTmp[id].quantidade * m2.preco : cartTmp[id].custoTotal;
        });
        _targets = {};
        if (modo2 === 'pct') {
            idsTmp.forEach(function (id) {
                var m2 = mercado.porId[id];
                var s2 = m2 ? cartTmp[id].quantidade * m2.preco : cartTmp[id].custoTotal;
                _targets[id] = stmp > 0 ? Math.round(s2 / stmp * 1000) / 10 : 0;
            });
        } else {
            // notas: distribui nota 5 pra todas (ponto de partida neutro)
            idsTmp.forEach(function (id) { _targets[id] = 5; });
        }
        desenhar();
        return;
    }

    // equalizar
    if (ev.target.closest('[data-bal-equalizar]') && rotaAtual === '/balanceamento') {
        var cartTmp2 = carteiraAtual().posicoes;
        var idsTmp2 = Object.keys(cartTmp2).filter(function (id) { return cartTmp2[id].quantidade > QTD_EPSILON; });
        var modo3 = estado.ler('balModo') || 'pct';
        _targets = {};
        if (modo3 === 'pct') {
            var igual = idsTmp2.length > 0 ? Math.round(10000 / idsTmp2.length) / 100 : 0;
            idsTmp2.forEach(function (id) { _targets[id] = igual; });
        } else {
            idsTmp2.forEach(function (id) { _targets[id] = 5; });
        }
        desenhar();
        return;
    }

    // zerar
    if (ev.target.closest('[data-bal-zerar]') && rotaAtual === '/balanceamento') {
        _targets = {};
        desenhar();
        return;
    }

    // salvar (só visual por enquanto — etapa 10.1 liga ao Supabase)
    if (ev.target.closest('[data-bal-salvar]') && rotaAtual === '/balanceamento') {
        var btnSalvarBal = ev.target.closest('[data-bal-salvar]');
        if (btnSalvarBal) { btnSalvarBal.disabled = true; btnSalvarBal.textContent = 'Salvando…'; }
        salvarTargets().then(function () {
            if (btnSalvarBal) { btnSalvarBal.disabled = false; btnSalvarBal.textContent = 'Salvar targets'; }
            avisar('Targets salvos.', 'sucesso');
        }).catch(function (e) {
            if (btnSalvarBal) { btnSalvarBal.disabled = false; btnSalvarBal.textContent = 'Salvar targets'; }
            avisar('Não foi possível salvar os targets. Tente de novo.', 'erro');
            console.error('salvarTargets:', e && e.message);
        });
        return;
    }

    var temaBotao = ev.target.closest('[data-tema-valor]');
    if (temaBotao) {
        var novoTema = temaBotao.getAttribute('data-tema-valor');
        aplicarTema(novoTema);
        salvarPrefs();
        // atualiza aria-pressed nos botões
        document.querySelectorAll('[data-tema-valor]').forEach(function (b) {
            b.setAttribute('aria-pressed', b.getAttribute('data-tema-valor') === novoTema ? 'true' : 'false');
        });
        return;
    }

    if (ev.target.closest('[data-busca-toggle]')) {
        var topo = document.querySelector('.topo');
        var abrir = !topo.classList.contains('busca-aberta');
        topo.classList.toggle('busca-aberta', abrir);
        if (abrir) document.getElementById('busca-global').focus();
        return;
    }

    // toque na linha inteira leva pra moeda (a estrela e o link têm ação própria)
    if (!ehTelaPequena() || ev.target.closest('a, button')) return;
    var linha = ev.target.closest('.tabela-mercado tbody tr[data-moeda-id], .tabela-portfolio tbody tr[data-moeda-id]');
    if (linha) navegar('/moeda/' + linha.getAttribute('data-moeda-id'));
});
